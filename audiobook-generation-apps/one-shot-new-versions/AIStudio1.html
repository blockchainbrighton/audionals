<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceForge - Professional Audiobook Generator</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-input: #2c2c2c;
            --accent: #7c4dff;
            --accent-hover: #651fff;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border: #333;
            --success: #00c853;
            --warning: #ffd600;
            --danger: #d50000;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            height: 60px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        h1 { font-size: 1.2rem; margin: 0; display: flex; align-items: center; gap: 10px; }
        .badge { font-size: 0.7rem; background: var(--accent); padding: 2px 6px; border-radius: 4px; }

        .settings-bar { display: flex; gap: 10px; align-items: center; }
        
        input, select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 4px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: #444; cursor: not-allowed; }
        button.secondary { background-color: transparent; border: 1px solid var(--border); }
        button.danger { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); }

        /* --- Main Layout --- */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left: Editor */
        .panel-left {
            width: 40%;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .panel-header {
            padding: 10px 20px;
            background: var(--bg-panel);
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: var(--bg-dark);
            color: var(--text-main);
            border: none;
            padding: 20px;
            resize: none;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            outline: none;
        }

        /* Right: Studio Timeline */
        .panel-right {
            width: 60%;
            display: flex;
            flex-direction: column;
            background: #181818;
        }

        .timeline-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .chapter-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .chapter-header {
            padding: 10px 15px;
            background: #252525;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .chapter-title { font-weight: bold; }
        
        .chapter-status { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            display: flex; 
            align-items: center; 
            gap: 10px;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; }
        .status-dot.pending { background: #555; }
        .status-dot.processing { background: var(--warning); animation: pulse 1s infinite; }
        .status-dot.done { background: var(--success); }
        .status-dot.error { background: var(--danger); }

        .chunk-list {
            padding: 10px;
            display: none; /* Hidden by default */
            border-top: 1px solid var(--border);
        }
        .chapter-card.expanded .chunk-list { display: block; }

        .chunk-item {
            font-size: 0.8rem;
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
        }
        .chunk-item:last-child { border-bottom: none; }

        /* Footer / Console */
        footer {
            height: 160px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
        }

        .console-log {
            flex: 1;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            overflow-y: auto;
            border-right: 1px solid var(--border);
        }

        .log-entry { margin-bottom: 4px; }
        .log-info { color: #81d4fa; }
        .log-success { color: #a5d6a7; }
        .log-error { color: #ef9a9a; }

        .controls {
            width: 300px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cost-estimator {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        /* Utility */
        .hidden { display: none !important; }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Progress Bar */
        .progress-container {
            height: 4px;
            background: #333;
            width: 100%;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }

    </style>
</head>
<body>

<header>
    <h1>VoiceForge <span class="badge">Studio</span></h1>
    <div class="settings-bar">
        <select id="voiceSelect">
            <option value="21m00Tcm4TlvDq8ikWAM">Voice: Rachel (ElevenLabs)</option>
            <option value="AZnzlk1XvdvUeBnXmlld">Voice: Domi (ElevenLabs)</option>
            <option value="EXAVITQu4vr4xnSDxMaL">Voice: Bella (ElevenLabs)</option>
        </select>
        <input type="password" id="apiKey" placeholder="ElevenLabs API Key" style="width: 200px;">

<main>
    <div class="panel-left">
        <div class="panel-header">
            <span>Manuscript</span>
            <button id="btnParse" class="secondary">1. Parse Manuscript</button>
        </div>
        <textarea id="manuscriptInput" placeholder="Paste your text here using Markdown...

# Chapter 1: The Beginning

    </div>

    <div class="panel-right">

                </label>

            </div>
        </div>
        <div id="timelineContainer" class="timeline-scroll">

                Parse a manuscript to see the production timeline here.

        </div>
    </div>
</main>

<footer>
    <div class="console-log" id="consoleLog">
        <div class="log-entry">System ready. Please enter API key and Manuscript.</div>
    </div>
    <div class="controls">
        <div class="cost-estimator" id="costDisplay">Est. Cost: 0 Characters</div>
        <button id="btnDownloadBook" disabled>3. Download Full Book (WAV)</button>
        <button id="btnClear" class="danger">Clear Project</button>
    </div>
</footer>

<script>
/**
 * VoiceForge - Core Logic
 */

// --- Constants & Config ---
const CONFIG = {
    chunkSize: 4000, // Safe buffer for 5000 limit
    dbName: 'VoiceForgeDB',
    storeName: 'audio_chunks'
};

// --- State Management ---
const State = {
    chapters: [],
    apiKey: localStorage.getItem('elevenlabs_key') || '',
    voiceId: '21m00Tcm4TlvDq8ikWAM',
    isProcessing: false,
    demoMode: false
};

// --- IndexedDB Wrapper for Audio Storage ---
const AudioStore = {
    db: null,
    async init() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(CONFIG.dbName, 1);
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(CONFIG.storeName)) {
                    db.createObjectStore(CONFIG.storeName); // Key is chunkId
                }
            };
            request.onsuccess = (event) => {
                this.db = event.target.result;
                resolve();
            };
            request.onerror = (e) => reject(e);
        });
    },
    async saveChunk(id, arrayBuffer) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction([CONFIG.storeName], 'readwrite');
            const store = tx.objectStore(CONFIG.storeName);
            store.put(arrayBuffer, id);
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e);
        });
    },
    async getChunk(id) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction([CONFIG.storeName], 'readonly');
            const store = tx.objectStore(CONFIG.storeName);
            const req = store.get(id);
            req.onsuccess = () => resolve(req.result);
            req.onerror = (e) => reject(e);
        });
    },
    async clear() {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction([CONFIG.storeName], 'readwrite');
            tx.objectStore(CONFIG.storeName).clear();
            tx.oncomplete = () => resolve();
        });
    }
};

// --- Audio Engine (Web Audio API) ---
const AudioEngine = {
    ctx: new (window.AudioContext || window.webkitAudioContext)(),
    
    async decode(arrayBuffer) {
        // We need to copy the buffer because decodeAudioData detaches it
        const copiedBuffer = arrayBuffer.slice(0); 
        return await this.ctx.decodeAudioData(copiedBuffer);
    },

    // Merge multiple AudioBuffers into one, with optional silence between
    mergeBuffers(buffers, gapSeconds = 1.0) {
        if (!buffers.length) return null;

        const sampleRate = buffers[0].sampleRate;
        const gapSamples = Math.floor(gapSeconds * sampleRate);
        
        // Calculate total length
        let totalLength = 0;
        buffers.forEach((buf, index) => {
            totalLength += buf.length;
            if (index < buffers.length - 1) totalLength += gapSamples;
        });

        // Create new buffer
        const result = this.ctx.createBuffer(1, totalLength, sampleRate); // Mono for audiobooks usually fine, or check channels
        const data = result.getChannelData(0); // Assuming mono for simplicity

        let offset = 0;
        buffers.forEach((buf, index) => {
            // Simple mixdown to mono if source is stereo
            const inputData = buf.getChannelData(0); 
            data.set(inputData, offset);
            offset += buf.length;
            if (index < buffers.length - 1) offset += gapSamples;
        });

        return result;
    },

    // Convert AudioBuffer to WAV Blob
    bufferToWav(abuffer) {
        const numOfChan = abuffer.numberOfChannels;
        const length = abuffer.length * numOfChan * 2 + 44;
        const buffer = new ArrayBuffer(length);
        const view = new DataView(buffer);
        const channels = [];
        let i;
        let sample;
        let offset = 0;
        let pos = 0;

        // write WAVE header
        setUint32(0x46464952);                         // "RIFF"
        setUint32(length - 8);                         // file length - 8
        setUint32(0x45564157);                         // "WAVE"

        setUint32(0x20746d66);                         // "fmt " chunk
        setUint32(16);                                 // length = 16
        setUint16(1);                                  // PCM (uncompressed)
        setUint16(numOfChan);
        setUint32(abuffer.sampleRate);
        setUint32(abuffer.sampleRate * 2 * numOfChan); // avg. bytes/sec
        setUint16(numOfChan * 2);                      // block-align
        setUint16(16);                                 // 16-bit (hardcoded in this loop)

        setUint32(0x61746164);                         // "data" - chunk
        setUint32(length - pos - 4);                   // chunk length

        // write interleaved data
        for(i = 0; i < abuffer.numberOfChannels; i++)
            channels.push(abuffer.getChannelData(i));

        while(pos < abuffer.length) {
            for(i = 0; i < numOfChan; i++) {             // interleave channels
                sample = Math.max(-1, Math.min(1, channels[i][pos])); // clamp
                sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0; // scale to 16-bit signed int
                view.setInt16(44 + offset, sample, true);          // write 16-bit sample
                offset += 2;
            }
            pos++;
        }

        return new Blob([buffer], { type: "audio/wav" });

        function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
    }
};

// --- DOM Elements ---
const dom = {
    apiKey: document.getElementById('apiKey'),
    voiceSelect: document.getElementById('voiceSelect'),
    btnSaveKey: document.getElementById('btnSettingsSave'),
    manuscript: document.getElementById('manuscriptInput'),
    btnParse: document.getElementById('btnParse'),
    timeline: document.getElementById('timelineContainer'),
    console: document.getElementById('consoleLog'),
    btnGenerate: document.getElementById('btnGenerate'),
    costDisplay: document.getElementById('costDisplay'),
    btnDownload: document.getElementById('btnDownloadBook'),
    btnClear: document.getElementById('btnClear'),
    chkDemo: document.getElementById('chkDemoMode'),
    progressBar: document.getElementById('globalProgress')
};

// --- Logging System ---
function log(msg, type = 'info') {
    const div = document.createElement('div');
    div.className = `log-entry log-${type}`;
    const time = new Date().toLocaleTimeString();
    div.textContent = `[${time}] ${msg}`;
    dom.console.appendChild(div);
    dom.console.scrollTop = dom.console.scrollHeight;
}

// --- Logic Implementation ---

// 1. Initial Setup
window.addEventListener('DOMContentLoaded', async () => {
    await AudioStore.init();
    if(State.apiKey) {
        dom.apiKey.value = State.apiKey;
        log("API Key loaded from memory.");
    }
});

dom.btnSaveKey.addEventListener('click', () => {
    State.apiKey = dom.apiKey.value.trim();
    localStorage.setItem('elevenlabs_key', State.apiKey);
    log("API Key saved!", "success");
});

dom.voiceSelect.addEventListener('change', (e) => {
    State.voiceId = e.target.value;
});

dom.chkDemo.addEventListener('change', (e) => {
    State.demoMode = e.target.checked;
    log(`Demo Mode: ${State.demoMode ? 'ON (Max 200 chars/chapter)' : 'OFF'}`);
    renderTimeline(); // Re-calc costs
});

// 2. Parser Logic
dom.btnParse.addEventListener('click', () => {
    const text = dom.manuscript.value;
    if(!text.trim()) return log("Manuscript is empty.", "error");

    // Regex to split by Markdown Headings (# or ##)
    // Matches start of line, one or more #, whitespace, then title
    const regex = /(^|\n)(#{1,2})\s*(.+)/g;
    
    let chapters = [];
    let lastIndex = 0;
    let match;

    // We need to capture the text BETWEEN matches
    let matches = [...text.matchAll(regex)];
    
    if (matches.length === 0) {
        // No chapters found, treat whole text as one chapter
        chapters.push({ title: "Prologue / Full Text", content: text.trim() });
    } else {
        matches.forEach((m, i) => {
            const title = m[3].trim();
            const startPos = m.index + m[0].length;
            const endPos = (i < matches.length - 1) ? matches[i+1].index : text.length;
            const content = text.substring(startPos, endPos).trim();
            
            if(content) {
                chapters.push({ title, content });
            }
        });
    }

    // Process Chunks
    State.chapters = chapters.map((ch, idx) => {
        return {
            id: `ch_${idx}`,
            title: ch.title,
            chunks: createChunks(ch.content),
            status: 'pending', // pending, processing, done, error
            audioBlob: null
        };
    });

    log(`Parsed ${State.chapters.length} chapters.`);
    renderTimeline();
});

function createChunks(text) {
    // Smart chunking based on sentence terminators
    const chunks = [];
    const sentences = text.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g) || [text];
    
    let currentChunk = "";
    
    sentences.forEach(sentence => {
        if((currentChunk.length + sentence.length) < CONFIG.chunkSize) {
            currentChunk += sentence;
        } else {
            chunks.push({ text: currentChunk.trim(), status: 'pending', id: crypto.randomUUID() });
            currentChunk = sentence;
        }
    });
    if(currentChunk.trim()) {
        chunks.push({ text: currentChunk.trim(), status: 'pending', id: crypto.randomUUID() });
    }
    return chunks;
}

// 3. UI Rendering
function renderTimeline() {
    dom.timeline.innerHTML = '';
    let totalChars = 0;

    State.chapters.forEach((ch, idx) => {
        const div = document.createElement('div');
        div.className = `chapter-card ${ch.status === 'processing' ? 'expanded' : ''}`;
        
        let charCount = 0;
        ch.chunks.forEach(c => charCount += c.text.length);
        
        // Demo mode calc
        if(State.demoMode) charCount = Math.min(charCount, 200 * ch.chunks.length); // Rough approx
        totalChars += charCount;

        let statusClass = ch.status;
        
        div.innerHTML = `
            <div class="chapter-header" onclick="this.parentElement.classList.toggle('expanded')">
                <span class="chapter-title">${idx+1}. ${ch.title}</span>
                <div class="chapter-status">
                    <span>${ch.chunks.length} Segments</span>
                    <span class="status-dot ${statusClass}"></span>
                    ${ch.status === 'done' ? '<button class="small-play">▶ Play</button>' : ''}
                </div>
            </div>
            <div class="chunk-list">
                ${ch.chunks.map((c, ci) => `
                    <div class="chunk-item">
                        <span style="width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${c.text.substring(0,60)}...</span>
                        <span style="color: ${c.status === 'done' ? 'var(--success)' : '#666'}">${c.status}</span>
                    </div>
                `).join('')}
            </div>
        `;
        
        // Add Play Listener
        if(ch.status === 'done') {
            const playBtn = div.querySelector('.small-play');
            playBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playChapter(idx);
            });
        }

        dom.timeline.appendChild(div);
    });

    dom.costDisplay.textContent = `Est. Cost: ~${totalChars} chars`;
}

// 4. Generation Logic
dom.btnGenerate.addEventListener('click', async () => {
    if(!State.apiKey) return log("Please enter API Key first", "error");
    if(!State.chapters.length) return log("No chapters to generate", "error");
    
    State.isProcessing = true;
    dom.btnGenerate.disabled = true;
    dom.btnDownload.disabled = true;

    log("Starting generation pipeline...");

    try {
        let totalChunks = 0;
        State.chapters.forEach(c => totalChunks += c.chunks.length);
        let completedChunks = 0;

        for (let i = 0; i < State.chapters.length; i++) {
            const ch = State.chapters[i];
            ch.status = 'processing';
            renderTimeline();

            const audioBuffers = [];

            for (let j = 0; j < ch.chunks.length; j++) {
                const chunk = ch.chunks[j];
                
                // Skip if already done (resumability)
                const existing = await AudioStore.getChunk(chunk.id);
                if (existing) {
                    chunk.status = 'done';
                    audioBuffers.push(await AudioEngine.decode(existing));
                    log(`Chunk loaded from cache: Ch ${i+1}-${j+1}`);
                    completedChunks++;
                    continue;
                }

                chunk.status = 'processing';
                renderTimeline();

                // Prepare Text
                let textToSpeak = chunk.text;
                if(State.demoMode) textToSpeak = textToSpeak.substring(0, 200);

                // API Call
                log(`Generating: Ch ${i+1}, Segment ${j+1}/${ch.chunks.length}...`);
                try {
                    const audioData = await fetchTTS(textToSpeak);
                    await AudioStore.saveChunk(chunk.id, audioData); // Persist
                    audioBuffers.push(await AudioEngine.decode(audioData));
                    chunk.status = 'done';
                    completedChunks++;
                } catch (err) {
                    chunk.status = 'error';
                    log(`Error on Ch ${i+1}-${j+1}: ${err.message}`, "error");
                    // Stop on error or continue? Let's stop to save cost
                    throw err; 
                }
                
                // Update Progress
                const percent = (completedChunks / totalChunks) * 100;
                dom.progressBar.style.width = `${percent}%`;
            }

            // Merge Chapter Audio
            if (audioBuffers.length > 0) {
                log(`Merging Chapter ${i+1}...`);
                const mergedBuffer = AudioEngine.mergeBuffers(audioBuffers, 0.5); // 0.5s pause between chunks
                // Save Chapter Blob to memory (or DB if we wanted chapter persistence)
                // For this app, we generate the blob on the fly for download to save DB complication
                // but for "Play" button, we need it in memory.
                
                // Note: We don't store the merged chapter in DB to save space, we rebuild it from chunks
                ch.status = 'done';
            }
            renderTimeline();
        }

        log("All chapters generated successfully!", "success");
        dom.btnDownload.disabled = false;

    } catch (e) {
        log(`Process failed: ${e.message}`, "error");
    } finally {
        State.isProcessing = false;
        dom.btnGenerate.disabled = false;
    }
});

// --- TTS API Wrapper ---
async function fetchTTS(text) {
    const modelId = "eleven_turbo_v2_5"; // Faster, cheaper
    const url = `https://api.elevenlabs.io/v1/text-to-speech/${State.voiceId}`;
    
    const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Accept': 'audio/mpeg',
            'xi-api-key': State.apiKey,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            text: text,
            model_id: modelId,
            voice_settings: {
                stability: 0.5,
                similarity_boost: 0.75
            }
        })
    });

    if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.detail?.message || "API Request Failed");
    }

    return await response.arrayBuffer();
}

// 5. Audio Playback & Export
async function playChapter(index) {
    const ch = State.chapters[index];
    if(ch.status !== 'done') return;

    log(`Preparing playback for Chapter ${index+1}...`);
    
    // Re-assemble from DB
    const buffers = [];
    for(const chunk of ch.chunks) {
        const ab = await AudioStore.getChunk(chunk.id);
        if(ab) buffers.push(await AudioEngine.decode(ab));
    }

    if(buffers.length === 0) return log("No audio data found.", "error");

    const merged = AudioEngine.mergeBuffers(buffers);
    
    // Create source
    const source = AudioEngine.ctx.createBufferSource();
    source.buffer = merged;
    source.connect(AudioEngine.ctx.destination);
    source.start();
    log(`Playing Chapter ${index+1}`);
}

dom.btnDownload.addEventListener('click', async () => {
    log("Compiling full book... this may take a moment.");
    
    // 1. Gather ALL buffers
    const allBuffers = [];
    
    for (const ch of State.chapters) {
        // Collect chunk buffers for this chapter
        const chapterBuffers = [];
        for (const chunk of ch.chunks) {
            const ab = await AudioStore.getChunk(chunk.id);
            if(ab) chapterBuffers.push(await AudioEngine.decode(ab));
        }
        
        if (chapterBuffers.length > 0) {
            // Merge chapter first (to ensure internal pauses)
            const chapterMerged = AudioEngine.mergeBuffers(chapterBuffers, 0.4); 
            allBuffers.push(chapterMerged);
        }
    }

    if(allBuffers.length === 0) return;

    // 2. Merge all Chapters with 2s gap
    const finalBuffer = AudioEngine.mergeBuffers(allBuffers, 2.0);

    // 3. Export WAV
    const wavBlob = AudioEngine.bufferToWav(finalBuffer);
    
    // 4. Trigger Download
    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "Audiobook_Full.wav";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    log("Download started!", "success");
});

dom.btnClear.addEventListener('click', async () => {
    if(confirm("Are you sure? This will delete all generated audio files.")) {
        await AudioStore.clear();
        State.chapters = [];
        dom.timeline.innerHTML = '';
        dom.manuscript.value = '';
        log("Project cleared.", "warning");
    }
});

</script>
