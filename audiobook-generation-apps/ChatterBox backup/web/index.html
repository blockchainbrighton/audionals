<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatterBox Local UI</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">Local Text To Speech</p>
      <h1>ChatterBox Studio</h1>
      <p class="subtext">Paste text, pick a voice prompt, tune settings, and generate WAV output locally.</p>
      <p id="healthText" class="health">Checking backend...</p>
    </header>

    <section class="panel">
      <label for="textInput">Text</label>
      <textarea id="textInput" rows="8" placeholder="Paste your script here..."></textarea>

      <div class="field-row">
        <div class="field">
          <label for="voiceSelect">Voice Prompt</label>
          <select id="voiceSelect"></select>
        </div>
        <button id="refreshVoicesBtn" type="button" class="secondary">Refresh Voices</button>
      </div>
      <p class="hint">Drop voice prompt files in <code>voices/</code> and click refresh.</p>
    </section>

    <section class="panel">
      <h2>Generation Settings</h2>
      <div class="slider-grid">
        <div class="slider-field">
          <label for="exaggeration">Exaggeration <span id="exaggerationValue">0.50</span></label>
          <input id="exaggeration" type="range" min="0.25" max="2" step="0.01" value="0.5">
        </div>
        <div class="slider-field">
          <label for="cfg_weight">CFG Weight <span id="cfg_weightValue">0.50</span></label>
          <input id="cfg_weight" type="range" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="slider-field">
          <label for="temperature">Temperature <span id="temperatureValue">0.80</span></label>
          <input id="temperature" type="range" min="0.05" max="5" step="0.01" value="0.8">
        </div>
        <div class="slider-field">
          <label for="repetition_penalty">Repetition Penalty <span id="repetition_penaltyValue">1.20</span></label>
          <input id="repetition_penalty" type="range" min="1" max="3" step="0.01" value="1.2">
        </div>
        <div class="slider-field">
          <label for="min_p">Min P <span id="min_pValue">0.05</span></label>
          <input id="min_p" type="range" min="0" max="1" step="0.01" value="0.05">
        </div>
        <div class="slider-field">
          <label for="top_p">Top P <span id="top_pValue">1.00</span></label>
          <input id="top_p" type="range" min="0.01" max="1" step="0.01" value="1">
        </div>
      </div>
    </section>

    <section class="panel">
      <button id="generateBtn" class="primary" type="button">Generate Audio</button>
      <p id="statusText" class="status">Idle</p>
      <div id="progressCard" class="progress-card hidden">
        <div class="progress-top">
          <p id="progressStage" class="progress-stage">Queued</p>
          <p id="progressPercent" class="progress-percent">0%</p>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="progress-metrics">
          <div class="metric">
            <span class="metric-label">Chunks</span>
            <span id="metricChunks" class="metric-value">0 / 0</span>
          </div>
          <div class="metric">
            <span class="metric-label">Elapsed</span>
            <span id="metricElapsed" class="metric-value">0.0s</span>
          </div>
          <div class="metric">
            <span class="metric-label">ETA</span>
            <span id="metricEta" class="metric-value">--</span>
          </div>
          <div class="metric">
            <span class="metric-label">Speed</span>
            <span id="metricSpeed" class="metric-value">0.0 ch/s</span>
          </div>
        </div>
      </div>
      <div id="resultCard" class="result hidden">
        <audio id="audioPlayer" controls preload="metadata"></audio>
        <a id="downloadLink" href="#" download>Download WAV</a>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
