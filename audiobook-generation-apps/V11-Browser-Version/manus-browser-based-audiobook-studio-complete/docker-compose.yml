version: '3.8'\n\nservices:\n  frontend:\n    build:\n      context: ./frontend\n      dockerfile: Dockerfile\n    container_name: audiobook-frontend\n    ports:\n      - \"5173:5173\"\n    environment:\n      - NODE_ENV=production\n      - VITE_API_URL=http://localhost:3000\n      - VITE_WS_URL=ws://localhost:3000\n    depends_on:\n      backend:\n        condition: service_healthy\n    networks:\n      - audiobook-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:5173\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 40s\n\n  backend:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile\n    container_name: audiobook-backend\n    ports:\n      - \"3000:3000\"\n    environment:\n      - NODE_ENV=production\n      - PORT=3000\n      - TTS_SERVICE_URL=http://tts-engine:5000\n      - TTS_SERVICE_TIMEOUT=120000\n      - TTS_FALLBACK_ENABLED=true\n      - DATABASE_URL=sqlite:///./data/audiobook_studio.db\n      - REDIS_URL=redis://redis:6379\n      - JOB_QUEUE_CONCURRENCY=4\n      - AUTH_TOKEN=${AUTH_TOKEN:-your-secure-token-here}\n      - CORS_ORIGIN=http://localhost:5173\n      - STORAGE_PATH=/app/data/uploads\n      - MAX_UPLOAD_SIZE=1GB\n    volumes:\n      - ./backend/data:/app/data\n      - ./backend/logs:/app/logs\n    depends_on:\n      redis:\n        condition: service_healthy\n      tts-engine:\n        condition: service_healthy\n    networks:\n      - audiobook-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3000/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 30s\n    deploy:\n      resources:\n        limits:\n          cpus: '2'\n          memory: 2G\n        reservations:\n          cpus: '1'\n          memory: 1G\n\n  tts-engine:\n    build:\n      context: ./tts-engine\n      dockerfile: Dockerfile\n    container_name: audiobook-tts-engine\n    ports:\n      - \"5000:5000\"\n    environment:\n      - TTS_MODEL=tts_models/en/ljspeech/glow-tts\n      - TTS_DEVICE=auto\n      - TTS_GPU_MEMORY_FRACTION=0.8\n      - TTS_CPU_THREADS=4\n      - TTS_ENABLE_CACHE=true\n      - TTS_CACHE_DIR=/app/models\n      - FASTAPI_HOST=0.0.0.0\n      - FASTAPI_PORT=5000\n      - FASTAPI_WORKERS=2\n      - AUDIO_SAMPLE_RATE=22050\n      - BATCH_SIZE=1\n      - MAX_TEXT_LENGTH=1000\n      - GENERATION_TIMEOUT=120\n    volumes:\n      - ./tts-engine/models:/app/models\n      - ./tts-engine/logs:/app/logs\n      - /dev/shm:/dev/shm\n    networks:\n      - audiobook-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:5000/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 60s\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: 1\n              capabilities: [gpu]\n        limits:\n          cpus: '4'\n          memory: 8G\n        reservations:\n          cpus: '2'\n          memory: 4G\n\n  redis:\n    image: redis:7-alpine\n    container_name: audiobook-redis\n    ports:\n      - \"6379:6379\"\n    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --appendonly yes\n    volumes:\n      - redis-data:/data\n    networks:\n      - audiobook-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n      start_period: 10s\n    deploy:\n      resources:\n        limits:\n          cpus: '1'\n          memory: 1.5G\n        reservations:\n          cpus: '0.5'\n          memory: 1G\n\n  nginx:\n    image: nginx:alpine\n    container_name: audiobook-nginx\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    volumes:\n      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro\n      - ./nginx/conf.d:/etc/nginx/conf.d:ro\n      - nginx-cache:/var/cache/nginx\n    depends_on:\n      - frontend\n      - backend\n    networks:\n      - audiobook-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"wget\", \"--quiet\", \"--tries=1\", \"--spider\", \"http://localhost/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n\nnetworks:\n  audiobook-network:\n    driver: bridge\n\nvolumes:\n  redis-data:\n    driver: local\n  nginx-cache:\n    driver: local\n
