user nginx;\nworker_processes auto;\nerror_log /var/log/nginx/error.log warn;\npid /var/run/nginx.pid;\n\nevents {\n    worker_connections 1024;\n    use epoll;\n}\n\nhttp {\n    include /etc/nginx/mime.types;\n    default_type application/octet-stream;\n\n    log_format main '$remote_addr - $remote_user [$time_local] \"$request\" '\n                    '$status $body_bytes_sent \"$http_referer\" '\n                    '\"$http_user_agent\" \"$http_x_forwarded_for\"';\n\n    access_log /var/log/nginx/access.log main;\n\n    sendfile on;\n    tcp_nopush on;\n    tcp_nodelay on;\n    keepalive_timeout 65;\n    types_hash_max_size 2048;\n    client_max_body_size 1G;\n\n    gzip on;\n    gzip_vary on;\n    gzip_proxied any;\n    gzip_comp_level 6;\n    gzip_types text/plain text/css text/xml text/javascript \n               application/json application/javascript application/xml+rss \n               application/rss+xml font/truetype font/opentype \n               application/vnd.ms-fontobject image/svg+xml;\n\n    upstream backend {\n        least_conn;\n        server backend:3000 max_fails=3 fail_timeout=30s;\n        keepalive 32;\n    }\n\n    upstream frontend {\n        server frontend:5173 max_fails=3 fail_timeout=30s;\n        keepalive 32;\n    }\n\n    upstream tts_engine {\n        server tts-engine:5000 max_fails=3 fail_timeout=30s;\n        keepalive 32;\n    }\n\n    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;\n    limit_req_zone $binary_remote_addr zone=tts_limit:10m rate=2r/s;\n    limit_conn_zone $binary_remote_addr zone=addr:10m;\n\n    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m \n                     max_size=1g inactive=60m use_temp_path=off;\n    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m \n                     max_size=500m inactive=30d use_temp_path=off;\n\n    server {\n        listen 80 default_server;\n        listen [::]:80 default_server;\n        server_name _;\n\n        location /health {\n            access_log off;\n            return 200 \"healthy\\n\";\n            add_header Content-Type text/plain;\n        }\n\n        location / {\n            return 301 https://$host$request_uri;\n        }\n    }\n\n    server {\n        listen 443 ssl http2 default_server;\n        listen [::]:443 ssl http2 default_server;\n        server_name _;\n\n        ssl_certificate /etc/nginx/ssl/cert.pem;\n        ssl_certificate_key /etc/nginx/ssl/key.pem;\n        ssl_protocols TLSv1.2 TLSv1.3;\n        ssl_ciphers HIGH:!aNULL:!MD5;\n        ssl_prefer_server_ciphers on;\n        ssl_session_cache shared:SSL:10m;\n        ssl_session_timeout 10m;\n\n        add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;\n        add_header X-Frame-Options \"SAMEORIGIN\" always;\n        add_header X-Content-Type-Options \"nosniff\" always;\n        add_header X-XSS-Protection \"1; mode=block\" always;\n\n        location / {\n            proxy_pass http://frontend;\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_cache_bypass $http_upgrade;\n\n            location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {\n                proxy_cache static_cache;\n                proxy_cache_valid 200 30d;\n                add_header Cache-Control \"public, max-age=2592000\";\n                add_header X-Cache-Status $upstream_cache_status;\n            }\n        }\n\n        location /api/ {\n            limit_req zone=api_limit burst=20 nodelay;\n            limit_conn addr 10;\n\n            proxy_pass http://backend;\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n\n            proxy_connect_timeout 60s;\n            proxy_send_timeout 300s;\n            proxy_read_timeout 300s;\n\n            proxy_cache api_cache;\n            proxy_cache_valid 200 5m;\n            proxy_cache_methods GET HEAD;\n            proxy_cache_key \"$scheme$request_method$host$request_uri\";\n            add_header X-Cache-Status $upstream_cache_status;\n\n            proxy_cache_bypass $http_authorization;\n            proxy_no_cache $http_authorization;\n        }\n\n        location /socket.io/ {\n            proxy_pass http://backend;\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"Upgrade\";\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n\n            proxy_read_timeout 86400;\n            proxy_send_timeout 86400;\n            proxy_connect_timeout 7d;\n            proxy_buffering off;\n        }\n\n        location /tts/ {\n            limit_req zone=tts_limit burst=5 nodelay;\n\n            proxy_pass http://tts_engine/;\n            proxy_http_version 1.1;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n\n            proxy_connect_timeout 10s;\n            proxy_send_timeout 300s;\n            proxy_read_timeout 300s;\n\n            proxy_cache_bypass 1;\n            proxy_no_cache 1;\n        }\n\n        location /health {\n            access_log off;\n            return 200 \"healthy\\n\";\n            add_header Content-Type text/plain;\n        }\n\n        location ~ /\\. {\n            deny all;\n            access_log off;\n            log_not_found off;\n        }\n    }\n}\n
