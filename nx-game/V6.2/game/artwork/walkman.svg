<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Retro neon contraband cassette player (HUD blueprint)">

  <defs>
    <filter id="glow7" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan7" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="1.6" fill="#00ff6a" opacity="0.05"/>
    </pattern>
    <clipPath id="winClip7"><rect x="96" y="156" width="320" height="176" rx="14"/></clipPath>
  </defs>

  <style>
    :root { --n:#00ff6a; --d:#050608; }
    .bg { fill: var(--d); }
    .shell { fill:#090b0f; stroke:var(--n); stroke-width:3; filter:url(#glow7); }
    .win { fill:#06080a; stroke:var(--n); stroke-width:2.4; }
    .scan { fill:url(#scan7); opacity:.35; }
    .hud { fill:none; stroke:var(--n); stroke-width:1.4; opacity:.6; }
    .hud2 { fill:none; stroke:var(--n); stroke-width:1; opacity:.45; }
    .text { fill:var(--n); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; opacity:.85; }
    .spoolRing { fill:none; stroke:var(--n); stroke-width:2.5; opacity:.9; }
    .spoolInnerRing { fill:none; stroke:var(--n); stroke-width:1.4; opacity:.55; }
    .spokes line { stroke:var(--n); stroke-width:2; stroke-linecap:round; opacity:.85; }
    .hub { fill:#040607; stroke:var(--n); stroke-width:1.5; }
    .hubDot { fill:var(--n); }
    .sweep { stroke-dasharray: 2 8; animation: sweep 2.2s linear infinite; }
    .pulse { animation: pulse 3.1s ease-in-out infinite; }
    @keyframes sweep { to { stroke-dashoffset:-220; } }
    @keyframes pulse { 0%,100% { opacity:.92; } 50% { opacity:1; } }
  </style>

  <rect class="bg" width="512" height="512"/>
  <g class="pulse">
    <rect class="shell" x="74" y="94" width="364" height="332" rx="30"/>

    <path class="hud2" d="M110 128h292" opacity=".35"/>
    <text class="text" x="112" y="124">OBJ: HUMAN AUDIO RELIC // STATUS: CONTRABAND</text>

    <rect class="win" x="96" y="156" width="320" height="176" rx="14"/>
    <g clip-path="url(#winClip7)">
      <rect class="scan" x="96" y="156" width="320" height="176" rx="14"/>
      <path class="hud sweep" d="M110 168h292"/>
      <path class="hud sweep" d="M110 322h292" style="animation-duration:2.9s"/>
      <path class="hud2" d="M256 156v176" opacity=".12"/>
      <path class="hud2" d="M96 244h320" opacity=".12"/>
    </g>

    
    <g class="spool">
      <circle cx="188" cy="244" r="42" class="spoolRing"/>
      <circle cx="188" cy="244" r="32" class="spoolInnerRing"/>
      <g class="spoolSpin" id="L7Spin">
        <animateTransform attributeName="transform" type="rotate"
          from="0 188 244" to="360 188 244" dur="2.35s" repeatCount="indefinite"/>
        <g class="spokes">
          <line x1="188.00" y1="244.00" x2="218.00" y2="244.00"/>
<line x1="188.00" y1="244.00" x2="203.00" y2="269.98"/>
<line x1="188.00" y1="244.00" x2="173.00" y2="269.98"/>
<line x1="188.00" y1="244.00" x2="158.00" y2="244.00"/>
<line x1="188.00" y1="244.00" x2="173.00" y2="218.02"/>
<line x1="188.00" y1="244.00" x2="203.00" y2="218.02"/>
          <line x1="188.00" y1="244.00" x2="210.00" y2="244.00"/>
<line x1="188.00" y1="244.00" x2="177.00" y2="263.05"/>
<line x1="188.00" y1="244.00" x2="177.00" y2="224.95"/>
        </g>
      </g>
      <circle cx="188" cy="244" r="9" class="hub"/>
      <circle cx="188" cy="244" r="2.6" class="hubDot"/>
    </g>

    
    <g class="spool">
      <circle cx="324" cy="244" r="42" class="spoolRing"/>
      <circle cx="324" cy="244" r="32" class="spoolInnerRing"/>
      <g class="spoolSpin" id="R7Spin">
        <animateTransform attributeName="transform" type="rotate"
          from="0 324 244" to="360 324 244" dur="2.95s" repeatCount="indefinite"/>
        <g class="spokes">
          <line x1="324.00" y1="244.00" x2="354.00" y2="244.00"/>
<line x1="324.00" y1="244.00" x2="339.00" y2="269.98"/>
<line x1="324.00" y1="244.00" x2="309.00" y2="269.98"/>
<line x1="324.00" y1="244.00" x2="294.00" y2="244.00"/>
<line x1="324.00" y1="244.00" x2="309.00" y2="218.02"/>
<line x1="324.00" y1="244.00" x2="339.00" y2="218.02"/>
          <line x1="324.00" y1="244.00" x2="346.00" y2="244.00"/>
<line x1="324.00" y1="244.00" x2="313.00" y2="263.05"/>
<line x1="324.00" y1="244.00" x2="313.00" y2="224.95"/>
        </g>
      </g>
      <circle cx="324" cy="244" r="9" class="hub"/>
      <circle cx="324" cy="244" r="2.6" class="hubDot"/>
    </g>


    <!-- HUD brackets -->
    <path class="hud" d="M86 150v-24h24 M426 150v-24h-24 M86 410v24h24 M426 410v24h-24" opacity=".55"/>
    <path class="hud" d="M116 350h280" opacity=".55"/>
    <path class="hud2" d="M140 362h80v34h-80z M236 362h80v34h-80z M332 362h64v34h-64z" opacity=".7"/>

    <text class="text" x="146" y="382">CH_A</text>
    <text class="text" x="242" y="382">CH_B</text>
    <text class="text" x="338" y="382">SAFE</text>
  </g>
</svg>
