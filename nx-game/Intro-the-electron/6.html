<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Jitter Singularity</title>
    <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize); resize();

    function draw(t) {
        // Faster cycle for a more "agitated" feel
        let cycle = (Math.sin(t * 0.0008) + 1) / 2;
        
        // Motion blur trail
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, w, h);

        let intensity = Math.pow(cycle, 2);
        let maxRadius = (Math.min(w, h) * 0.35);
        
        // We draw the "same" electron in multiple states of "vibration"
        // As cycle increases, we draw it more times in more places
        let instances = 1 + Math.floor(intensity * 40);

        for (let i = 0; i < instances; i++) {
            // High frequency "Quantum" noise
            let freq = t * 0.05;
            let angle = Math.random() * Math.PI * 2;
            let dist = Math.random() * maxRadius * intensity;

            // The "Fractal" logic: The electron's position is a function of 
            // its own vibration speed
            let x = w/2 + Math.cos(angle) * dist;
            let y = h/2 + Math.sin(angle) * dist;

            // Brightness increases as it fills the space
            let alpha = 0.1 + (0.9 * (1 - intensity)); 
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            
            ctx.beginPath();
            // The electron "shrinks" as it replicates to maintain total mass/energy feel
            let size = 4 * (1 - (intensity * 0.7));
            ctx.arc(x, y, size, 0, 7);
            ctx.fill();

            // Connect them with faint "energy" filaments
            if (intensity > 0.5 && Math.random() > 0.8) {
                ctx.strokeStyle = `rgba(100, 200, 255, ${intensity * 0.2})`;
                ctx.beginPath();
                ctx.moveTo(w/2, h/2);
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        }

        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
</script>
</body>
</html>
