<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>The Fractal Flinch</title>
    <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize); resize();

    function drawFractal(x, y, len, angle, depth, p) {
        if (depth <= 0) return;

        let x2 = x + Math.cos(angle) * len * p;
        let y2 = y + Math.sin(angle) * len * p;

        ctx.strokeStyle = `rgba(200, 240, 255, ${0.1 + (1/depth)})`;
        ctx.lineWidth = depth * 0.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        // As p (the cycle) increases, it branches more violently
        if (p > 0.2) {
            drawFractal(x2, y2, len * 0.7, angle + 0.5 + p, depth - 1, p);
            drawFractal(x2, y2, len * 0.7, angle - 0.5 - p, depth - 1, p);
        }
    }

    function animate(t) {
        let p = (Math.sin(t * 0.0005) + 1) / 2;
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, w, h);

        let branches = 4;
        let depth = Math.floor(p * 8) + 1;
        
        for (let i = 0; i < branches; i++) {
            let a = (i / branches) * Math.PI * 2 + (t * 0.001);
            drawFractal(w/2, h/2, Math.min(w, h) * 0.3, a, depth, p);
        }

        // The "Holy Loneliness" dot stays constant at the center
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(w/2, h/2, 3, 0, 7); ctx.fill();

        requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
</script>
</body>
</html>
