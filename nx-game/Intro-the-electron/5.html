<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>The Kinetic Loom</title>
    <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize); resize();

    function draw(t) {
        // Create a cycle that goes from 0 to 1 and back
        let cycle = (Math.sin(t * 0.0005) + 1) / 2; 
        
        // We clear with a very slight trail to show "speed"
        ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
        ctx.fillRect(0, 0, w, h);

        const radius = (Math.min(w, h) * 0.4) * Math.pow(cycle, 0.5);
        const segments = 1 + (cycle * 500); // How much of the "path" is visible at once
        const speed = t * 0.005;

        ctx.beginPath();
        ctx.strokeStyle = `hsla(${180 + cycle * 100}, 100%, 70%, ${0.1 + cycle * 0.9})`;
        ctx.lineWidth = 1 + (1 - cycle) * 2;

        for (let i = 0; i < segments; i++) {
            // Spherical Spiral Math
            let progress = i / 100;
            let theta = progress * Math.PI * 10;
            let phi = (progress * Math.PI) / (1.1 - cycle); // This "tightens" the weave

            let x = w/2 + radius * Math.sin(phi) * Math.cos(theta + speed);
            let y = h/2 + radius * Math.cos(phi);
            
            // This is the "tail" of the electron
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // The "Leading" Electron (The actual particle)
        let headPhi = (segments / 100 * Math.PI) / (1.1 - cycle);
        let headTheta = (segments / 100 * Math.PI * 10);
        let hX = w/2 + radius * Math.sin(headPhi) * Math.cos(headTheta + speed);
        let hY = h/2 + radius * Math.cos(headPhi);

        ctx.fillStyle = "white";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "white";
        ctx.beginPath();
        ctx.arc(hX, hY, 3, 0, 7);
        ctx.fill();
        ctx.shadowBlur = 0;

        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
</script>
</body>
</html>
