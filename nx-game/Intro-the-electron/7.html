<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Soliloquy of the One</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #label { 
            position: absolute; top: 20px; left: 20px; color: white; 
            font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
            opacity: 0.7; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="label">Initializing the Dance...</div>
    <canvas id="canvas"></canvas>

<script>
window.onload = function() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const label = document.getElementById('label');

    let width, height;
    const resize = () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', resize);
    resize();

    // TIMING (Milliseconds)
    const CHAPTER_DURATION = 12000; 

    function draw(t) {
        const chapterIdx = Math.floor((t / CHAPTER_DURATION) % 3);
        const progress = (t % CHAPTER_DURATION) / CHAPTER_DURATION;
        const centerX = width / 2;
        const centerY = height / 2;

        // 1. THE SILK WEAVER (Interpretation: "Stitching the Fabric")
        if (chapterIdx === 0) {
            label.innerText = "Chapter I: The Silk Weaver";
            // Very slow fade creates a "thread" that persists
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);

            const speed = 0.005;
            const radius = Math.min(width, height) * 0.35 * Math.sin(progress * Math.PI);
            
            // The "Needle" path
            const x = Math.sin(t * speed * 0.7) * Math.cos(t * speed * 0.3) * radius;
            const y = Math.cos(t * speed * 0.5) * Math.sin(t * speed * 0.2) * radius;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.shadowBlur = 15;
            ctx.shadowColor = "white";
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();

            // The "In-Between" - phantom threads
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 * Math.sin(progress * Math.PI)})`;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(0, 0);
            ctx.stroke();
            ctx.restore();
        }

        // 2. THE QUANTUM FLINCH (Interpretation: "Flash-Worlds")
        else if (chapterIdx === 1) {
            label.innerText = "Chapter II: The Quantum Flinch";
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // A "flinch" happens every few seconds
            const flinchIntensity = Math.pow(Math.sin(t * 0.002), 10);
            const count = 1 + Math.floor(flinchIntensity * 100);
            const radius = Math.min(width, height) * 0.3;

            for (let i = 0; i < count; i++) {
                const angle = (t * 0.001) + (i * Math.PI * 2 / count);
                const jitter = flinchIntensity * 100 * (Math.random() - 0.5);
                
                const x = Math.cos(angle) * radius + jitter;
                const y = Math.sin(angle) * radius + jitter;

                ctx.fillStyle = flinchIntensity > 0.5 ? `hsla(${t%360}, 70%, 70%, 0.8)` : "white";
                ctx.beginPath();
                ctx.arc(centerX + x, centerY + y, 1.5, 0, Math.PI * 2);
                ctx.fill();

                if (flinchIntensity > 0.8) {
                    ctx.strokeStyle = "rgba(255,255,255,0.05)";
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(centerX + x, centerY + y);
                    ctx.stroke();
                }
            }
        }

        // 3. THE DOUBLE NOW (Interpretation: "Déjà Vu / Being There Twice")
        else {
            label.innerText = "Chapter III: The Double Now";
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            const radius = Math.min(width, height) * 0.3;
            const time = t * 0.001;

            // Two versions of the same electron path
            const x1 = centerX + Math.cos(time) * radius;
            const y1 = centerY + Math.sin(time * 0.8) * radius;

            const x2 = centerX + Math.cos(time * 1.02) * radius; // Slightly different
            const y2 = centerY + Math.sin(time * 0.78) * radius;

            const dist = Math.hypot(x1 - x2, y1 - y2);
            const overlap = dist < 60;

            // Draw Paths
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI*2); ctx.stroke();

            // Electron 1
            ctx.shadowBlur = 10; ctx.shadowColor = "white";
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI*2); ctx.fill();

            // Electron 2 (The Phantom)
            ctx.fillStyle = "rgba(0, 255, 255, 0.4)";
            ctx.beginPath(); ctx.arc(x2, y2, 4, 0, Math.PI*2); ctx.fill();

            if (overlap) {
                // The "Biological Short Circuit"
                ctx.shadowBlur = 30;
                ctx.shadowColor = "cyan";
                ctx.strokeStyle = "white";
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = "white";
                ctx.fillText("RESONANCE: PRESENT TWICE", x1 + 10, y1 - 10);
            }
        }

        requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
};
</script>
</body>
</html>
