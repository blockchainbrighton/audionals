<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>The Silk Sheet</title>
    <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize); resize();

    function draw(t) {
        // Progression from 0 to 1
        let p = (Math.sin(t * 0.0005) + 1) / 2;
        
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, w, h);

        let radius = (Math.min(w, h) * 0.45) * p;
        // At peak, we draw 2000 iterations per frame to simulate "Everywhere"
        let density = 1 + (Math.pow(p, 4) * 2000); 
        
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 + (1-p)*0.9})`;
        ctx.lineWidth = 0.5;

        for (let i = 0; i < density; i++) {
            let step = i + (t * 0.1);
            // Golden Ratio Spiral for perfect distribution
            let phi = Math.acos(1 - 2 * (i / density));
            let theta = Math.PI * (1 + Math.sqrt(5)) * i;

            let x = w/2 + radius * Math.sin(phi) * Math.cos(theta);
            let y = h/2 + radius * Math.cos(phi);

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // The "Singularity" (The Holy Loneliness)
        ctx.fillStyle = "white";
        ctx.shadowBlur = 10; ctx.shadowColor = "white";
        ctx.beginPath();
        ctx.arc(w/2, h/2, 2, 0, 7);
        ctx.fill();

        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
</script>
</body>
</html>
