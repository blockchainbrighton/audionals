<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrate-AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Icon Components (Replaced lucide-react imports for standalone usage) ---
        const IconBase = ({ children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>{children}</svg>
        );
        
        const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3"/></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
        const Mic = (props) => <IconBase {...props}><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="23"/><line x1="8" x2="16" y1="23" y2="23"/></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>;
        const BarChart3 = (props) => <IconBase {...props}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></IconBase>;
        const ChevronDown = (props) => <IconBase {...props}><path d="m6 9 6 6 6-6"/></IconBase>;
        const ChevronUp = (props) => <IconBase {...props}><path d="m18 15-6-6-6 6"/></IconBase>;
        const Mail = (props) => <IconBase {...props}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></IconBase>;
        const Menu = (props) => <IconBase {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;


        // --- Main Components ---

        const FAQItem = ({ question, answer }) => {
            const [isOpen, setIsOpen] = useState(false);

            return (
                <div className="border-b border-gray-200 py-4">
                    <button 
                        className="flex justify-between items-center w-full text-left focus:outline-none"
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        <span className="text-lg font-medium text-slate-800">{question}</span>
                        {isOpen ? (
                            <ChevronUp className="w-5 h-5 text-blue-600" />
                        ) : (
                            <ChevronDown className="w-5 h-5 text-gray-400" />
                        )}
                    </button>
                    {isOpen && (
                        <div className="mt-2 text-gray-600 leading-relaxed animate-fadeIn">
                            {answer}
                        </div>
                    )}
                </div>
            );
        };

        const StepCard = ({ number, title, text }) => (
            <div className="relative flex flex-col items-center text-center p-6">
                <div className="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-lg mb-4 shadow-lg z-10">
                    {number}
                </div>
                <h3 className="text-lg font-bold text-slate-900 mb-2">{title}</h3>
                <p className="text-sm text-slate-600">{text}</p>
            </div>
        );

        function App() {
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
                setIsMenuOpen(false);
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900">
                    {/* Navigation */}
                    <nav className="bg-white border-b border-slate-200 fixed w-full z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16">
                                <div className="flex items-center">
                                    <div className="flex-shrink-0 flex items-center gap-2">
                                        <div className="bg-blue-600 p-1.5 rounded-lg">
                                            <Mic className="h-5 w-5 text-white" />
                                        </div>
                                        <span className="font-serif font-bold text-xl text-slate-900">Narrate-AI</span>
                                    </div>
                                </div>
                                
                                {/* Desktop Menu */}
                                <div className="hidden md:flex items-center space-x-8">
                                    <button onClick={() => scrollToSection('how-it-works')} className="text-slate-600 hover:text-blue-600 focus:outline-none transition-colors">How It Works</button>
                                    <button onClick={() => scrollToSection('pricing')} className="text-slate-600 hover:text-blue-600 focus:outline-none transition-colors">Pricing</button>
                                    <button onClick={() => scrollToSection('faq')} className="text-slate-600 hover:text-blue-600 focus:outline-none transition-colors">FAQ</button>
                                    <button className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium transition-colors">
                                        Get Free Sample
                                    </button>
                                </div>

                                {/* Mobile Menu Button */}
                                <div className="flex items-center md:hidden">
                                    <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="text-slate-600 focus:outline-none">
                                        {isMenuOpen ? <X className="h-6 w-6" /> : <Menu className="h-6 w-6" />}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Menu */}
                        {isMenuOpen && (
                            <div className="md:hidden bg-white border-b border-slate-200">
                                <div className="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                                    <button onClick={() => scrollToSection('how-it-works')} className="block w-full text-left px-3 py-2 text-slate-600 focus:outline-none hover:bg-slate-50">How It Works</button>
                                    <button onClick={() => scrollToSection('pricing')} className="block w-full text-left px-3 py-2 text-slate-600 focus:outline-none hover:bg-slate-50">Pricing</button>
                                    <button onClick={() => scrollToSection('faq')} className="block w-full text-left px-3 py-2 text-slate-600 focus:outline-none hover:bg-slate-50">FAQ</button>
                                </div>
                            </div>
                        )}
                    </nav>

                    {/* Hero Section */}
                    <section className="pt-32 pb-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto text-center">
                        <h1 className="text-4xl md:text-6xl font-serif font-bold text-slate-900 tracking-tight mb-6">
                            Turn Your Books Into Audiobooks <br className="hidden md:block" />
                            <span className="text-blue-600">From $25 Per Title</span>
                        </h1>
                        <p className="text-xl text-slate-600 max-w-2xl mx-auto mb-10">
                            AI-narrated audiobooks for independent publishers. Fast. Affordable. Scalable. 
                            Publisher-owned assets with no platform lock-in.
                        </p>
                        <div className="flex flex-col sm:flex-row justify-center gap-4">
                            <button className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-lg text-lg font-bold shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
                                <Play className="w-5 h-5 fill-current" />
                                Get a Free Sample Chapter
                            </button>
                            <button className="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-8 py-4 rounded-lg text-lg font-semibold transition-colors">
                                Convert One Book for $25
                            </button>
                        </div>
                    </section>

                    {/* Trust Strip */}
                    <section className="bg-slate-900 text-white py-8">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-center text-sm md:text-base font-medium opacity-90">
                                <div className="flex items-center justify-center gap-2">
                                    <CheckCircle className="w-5 h-5 text-blue-400" /> Works with Backlists
                                </div>
                                <div className="flex items-center justify-center gap-2">
                                    <CheckCircle className="w-5 h-5 text-blue-400" /> Single or Dual Voice
                                </div>
                                <div className="flex items-center justify-center gap-2">
                                    <CheckCircle className="w-5 h-5 text-blue-400" /> Premium & Cloned Voices
                                </div>
                                <div className="flex items-center justify-center gap-2">
                                    <CheckCircle className="w-5 h-5 text-blue-400" /> Spotify & Audible Ready
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* The Problem / Solution */}
                    <section className="py-20 bg-white">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="grid md:grid-cols-2 gap-12 items-center">
                                <div>
                                    <h2 className="text-3xl font-serif font-bold mb-6">Audiobooks are usually expensive. Especially for Indies.</h2>
                                    <p className="text-slate-600 mb-6 text-lg">
                                        Traditional production costs <strong>$2,000–$6,000+ per book</strong> and takes months. This makes your backlist financially unviable for audio.
                                    </p>
                                    <p className="text-slate-600 mb-6 text-lg">
                                        Many publishers want audiobooks—but can only afford a handful of front-list titles.
                                    </p>
                                    <div className="bg-red-50 border-l-4 border-red-500 p-4">
                                        <p className="text-red-700 font-medium">The Result: 90% of your catalogue stays silent.</p>
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-8 rounded-2xl border border-slate-100">
                                    <h3 className="text-2xl font-bold mb-6 text-blue-900">The Narrate-AI Difference</h3>
                                    <ul className="space-y-4">
                                        <li className="flex items-start gap-3">
                                            <div className="bg-green-100 p-1 rounded text-green-600 mt-1"><CheckCircle className="w-4 h-4" /></div>
                                            <div>
                                                <span className="font-bold block text-slate-800">From $25 per book</span>
                                                <span className="text-sm text-slate-500">vs $3,000+ for studio</span>
                                            </div>
                                        </li>
                                        <li className="flex items-start gap-3">
                                            <div className="bg-green-100 p-1 rounded text-green-600 mt-1"><Clock className="w-4 h-4" /></div>
                                            <div>
                                                <span className="font-bold block text-slate-800">Hours or Days</span>
                                                <span className="text-sm text-slate-500">vs Weeks or Months</span>
                                            </div>
                                        </li>
                                        <li className="flex items-start gap-3">
                                            <div className="bg-green-100 p-1 rounded text-green-600 mt-1"><BarChart3 className="w-4 h-4" /></div>
                                            <div>
                                                <span className="font-bold block text-slate-800">Low Risk Scalability</span>
                                                <span className="text-sm text-slate-500">Test genres and backlists without the capital risk</span>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* How It Works */}
                    <section id="how-it-works" className="py-20 bg-slate-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center mb-16">
                                <h2 className="text-3xl font-serif font-bold text-slate-900">How It Works</h2>
                                <p className="mt-4 text-slate-600">From manuscript to marketplace in four steps.</p>
                            </div>

                            <div className="relative">
                                {/* Connecting Line (Desktop) */}
                                <div className="hidden md:block absolute top-12 left-0 w-full h-0.5 bg-slate-200 -z-0 transform translate-y-4"></div>
                                
                                <div className="grid md:grid-cols-4 gap-8 relative z-10">
                                    <StepCard 
                                        number="1"
                                        title="Upload"
                                        text="Send us your EPUB, DOCX, or manuscript. We parse chapters automatically."
                                    />
                                    <StepCard 
                                        number="2"
                                        title="Select Voices"
                                        text="Choose Single or Dual voice. Select from Local, Premium, or Cloned tiers."
                                    />
                                    <StepCard 
                                        number="3"
                                        title="Generate"
                                        text="We generate audio chapter-by-chapter. Review and regenerate sections if needed."
                                    />
                                    <StepCard 
                                        number="4"
                                        title="Publish"
                                        text="Export standard files for Audible, Spotify, YouTube, or direct sales."
                                    />
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Pricing */}
                    <section id="pricing" className="py-20 bg-blue-900 text-white">
                        <div className="max-w-4xl mx-auto px-4 text-center">
                            <h2 className="text-3xl font-serif font-bold mb-6">Simple, Publisher-Friendly Pricing</h2>
                            <div className="bg-white text-slate-900 rounded-2xl p-8 md:p-12 shadow-2xl max-w-2xl mx-auto">
                                <div className="text-sm font-bold text-blue-600 tracking-wide uppercase mb-2">Starting At</div>
                                <div className="text-6xl font-extrabold text-slate-900 mb-6">$25 <span className="text-2xl text-slate-500 font-normal">/ title</span></div>
                                
                                <p className="text-slate-600 mb-8">
                                    Perfect for backlist conversion, pilot releases, series testing, and AI-labelled editions.
                                </p>

                                <div className="grid md:grid-cols-2 gap-4 text-left mb-8">
                                    <div className="flex items-center gap-2"><CheckCircle className="w-5 h-5 text-green-500" /> You own the audio files</div>
                                    <div className="flex items-center gap-2"><CheckCircle className="w-5 h-5 text-green-500" /> No platform lock-in</div>
                                    <div className="flex items-center gap-2"><CheckCircle className="w-5 h-5 text-green-500" /> No exclusivity</div>
                                    <div className="flex items-center gap-2"><CheckCircle className="w-5 h-5 text-green-500" /> Clear AI disclosures</div>
                                </div>

                                <button className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg transition-colors">
                                    Try One Book for $25
                                </button>
                                <p className="text-xs text-slate-400 mt-4">Custom pricing available for batch conversions & voice cloning.</p>
                            </div>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section id="faq" className="py-20 bg-white">
                        <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
                            <h2 className="text-3xl font-serif font-bold text-center mb-12">Publisher FAQ</h2>
                            <div className="space-y-2">
                                <FAQItem 
                                    question="Is this allowed on Audible / Spotify?"
                                    answer="Yes. AI-narrated audiobooks are permitted provided platform guidelines are followed. We help publishers label and format correctly to meet these standards."
                                />
                                <FAQItem 
                                    question="Do we own the audio files?"
                                    answer="Yes. 100%. You receive full-quality audio files with no exclusivity or usage restrictions. We are just the generation tool."
                                />
                                <FAQItem 
                                    question="How good does it sound?"
                                    answer="Quality depends on the voice tier selected. We offer Budget TTS for low-risk titles, Premium voices comparable to mid-range narration, and Cloned voices for consistency. Most publishers start with a free sample chapter to decide."
                                />
                                <FAQItem 
                                    question="Is this replacing human narrators?"
                                    answer="No. It’s a complement, not a replacement. Publishers use Narrate-AI for backlists, testing, and low-margin titles, then invest in studio narration where it makes sense financially."
                                />
                                <FAQItem 
                                    question="Can we do fiction with dialogue?"
                                    answer="Yes. Dual-voice narration is supported. We can assign a specific narrator voice for the prose and a different voice for dialogue."
                                />
                                <FAQItem 
                                    question="What file formats do you accept?"
                                    answer="We accept EPUB, DOCX, and clean manuscript text files."
                                />
                                <FAQItem 
                                    question="Can we do batches?"
                                    answer="Yes. Batch backlist conversion is one of our main use cases. Contact us for bulk pricing."
                                />
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-slate-50 border-t border-slate-200 py-12">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                            <div className="flex items-center justify-center gap-2 mb-6">
                                <div className="bg-blue-600 p-1.5 rounded-lg">
                                    <Mic className="h-5 w-5 text-white" />
                                </div>
                                <span className="font-serif font-bold text-xl text-slate-900">Narrate-AI</span>
                            </div>
                            <p className="text-slate-500 mb-8">
                                Helping independent publishers bring their stories to audio.
                            </p>
                            <div className="flex justify-center gap-6 mb-8">
                                <a href="#" className="text-slate-400 hover:text-blue-600"><Mail className="w-6 h-6" /></a>
                            </div>
                            <p className="text-sm text-slate-400">
                                © {new Date().getFullYear()} Narrate-AI. All rights reserved.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
