<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GlueBusComp</title>
</head>
<body style="margin:0; padding:20px; background:#0f1316; color:#e5f0ff; font-family:monospace;">
    <div id="app-container"></div>
    <script type="module">
        import { Controls } from '../../../../System/shared/controls.js';

        const CONFIG = {
            name: 'GLUE BUS COMP',
            modules: [
                {
                    name: 'Threshold / Ratio',
                    controls: [
                        { type: 'knob', id: 'thresh', label: 'Thresh (dB)', param: 1, min: -50, max: 0, step: 0.5, val: -18 },
                        { type: 'knob', id: 'ratio', label: 'Ratio', param: 2, min: 2, max: 10, step: 0.1, val: 4 }
                    ]
                },
                {
                    name: 'Timing',
                    controls: [
                        { type: 'knob', id: 'attack', label: 'Attack (s)', param: 3, min: 0.001, max: 0.05, step: 0.001, val: 0.01 },
                        { type: 'knob', id: 'release', label: 'Release (s)', param: 4, min: 0.05, max: 0.8, step: 0.01, val: 0.2 }
                    ]
                },
                {
                    name: 'Blend / Makeup',
                    controls: [
                        { type: 'knob', id: 'mix', label: 'Mix', param: 5, min: 0, max: 1, step: 0.01, val: 0.5 },
                        { type: 'knob', id: 'makeup', label: 'Makeup (dB)', param: 6, min: 0, max: 12, step: 0.5, val: 3 }
                    ]
                },
                {
                    name: 'Sidechain',
                    controls: [
                        { type: 'knob', id: 'sc_hpf', label: 'HPF (Hz)', param: 7, min: 20, max: 200, curve: 'log', val: 80 }
                    ]
                }
            ]
        };

        const controls = new Controls({
            onChange: (id, val) => {
                const el = document.getElementById(id);
                if (el && el.dataset.param) {
                    window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
                }
            }
        });

        controls.buildUI('app-container', CONFIG);
    </script>
</body>
</html>
