<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Celestial Pad</title>
    <style>
        body { margin: 0; padding: 20px; background: #111; color: #ddd; display: flex; justify-content: center; min-height: 100vh; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { Controls } from '../../System/shared/controls.js';
        import { Keyboard } from '../../System/shared/keyboard.js';
        import { MidiManager } from '../../System/shared/midi.js';

        const CONFIG = {
            name: "CELESTIAL PAD",
            modules: [
                {
                    name: "Texture",
                    controls: [
                        { type: 'knob', id: 'cut', label: 'Color', param: 1, min: 200, max: 8000, curve: 'log', val: 2000 },
                        { type: 'knob', id: 'pwm', label: 'Motion', param: 3, min: 0.1, max: 5.0, val: 0.5 },
                        { type: 'knob', id: 'width', label: 'Width', param: 4, min: 1.0, max: 1.05, val: 1.01 }
                    ]
                },
                {
                    name: "Envelope",
                    controls: [
                        { type: 'fader', id: 'att', label: 'Attack', param: 8, min: 0.01, max: 3.0, val: 1.0 },
                        { type: 'fader', id: 'rel', label: 'Release', param: 9, min: 0.1, max: 5.0, val: 2.0 }
                    ]
                },
                {
                    name: "Space",
                    controls: [
                        { type: 'knob', id: 'chorus', label: 'Chorus', param: 5, min: 0, max: 1, val: 0.5 },
                        { type: 'knob', id: 'verb', label: 'Reverb', param: 6, min: 0, max: 0.8, val: 0.3 },
                        { type: 'knob', id: 'vol', label: 'Vol', param: 7, min: 0, max: 1, val: 0.5 }
                    ]
                }
            ]
        };

        const controls = new Controls({
             onChange: (id, val) => {
                 const el = document.getElementById(id);
                 if(el && el.dataset.param) window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
             }
        });

        const uiRefs = controls.buildUI('app-container', CONFIG);
        
        const kb = new Keyboard('piano', {
            startNote: 36, numKeys: 25, responsive: true,
            onNoteOn: (midi, freq) => {
                window.parent.postMessage({ type: 'BVST_PARAM', id: 128, value: midi }, '*'); 
            },
            onNoteOff: (midi) => {
                window.parent.postMessage({ type: 'BVST_PARAM', id: 129, value: midi }, '*');
            }
        });
        
        const midi = new MidiManager({
            deviceSelectorId: 'midi-in',
            statusElementId: 'midi-led',
            onNoteOn: (n) => kb._handleNoteOn(n),
            onNoteOff: (n) => kb._handleNoteOff(n)
        });

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'BVST_READY') {
                document.querySelectorAll('[data-param]').forEach(el => {
                     const p = parseInt(el.dataset.param);
                     const v = parseFloat(el.dataset.val);
                     window.parent.postMessage({ type: 'BVST_PARAM', id: p, value: v }, '*');
                });
            }
        });
    </script>
</body>
</html>
