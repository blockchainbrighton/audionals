<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GainPanScope</title>
</head>
<body style="margin:0; padding:20px; background:#101010; color:#f0f0f0; font-family:monospace;">
    <div id="app-container"></div>
    <script type="module">
        import { Controls } from '../../../../System/shared/controls.js';

        const CONFIG = {
            name: 'GAIN / PAN / SCOPE',
            modules: [
                {
                    name: 'Level',
                    controls: [
                        { type: 'knob', id: 'gain', label: 'Gain (dB)', param: 1, min: -24, max: 24, step: 0.5, val: 0 }
                    ]
                },
                {
                    name: 'Pan / Tilt',
                    controls: [
                        { type: 'knob', id: 'pan', label: 'Tilt', param: 2, min: -1, max: 1, step: 0.02, val: 0 },
                        { type: 'switch', id: 'mono', label: 'Mono', param: 3, min: 0, max: 1, val: 1 },
                        { type: 'switch', id: 'guard', label: 'Clip Guard', param: 4, min: 0, max: 1, val: 1 }
                    ]
                }
            ]
        };

        const controls = new Controls({
            onChange: (id, val) => {
                const el = document.getElementById(id);
                if (el && el.dataset.param) {
                    window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
                }
            }
        });

        controls.buildUI('app-container', CONFIG);
    </script>
</body>
</html>
