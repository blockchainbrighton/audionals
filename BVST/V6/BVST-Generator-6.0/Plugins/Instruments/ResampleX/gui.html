<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background: #220033; color: white; }
        #sampler-ui-temp { width: 100%; } 
        #controls { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="gui-container">
        <div id="sampler-ui-temp"></div>
        <div id="controls"></div>
    </div>

    <script type="module">
        import { Controls } from '../../../System/shared/controls.js';
        import { Keyboard } from '../../../System/shared/keyboard.js';
        import { SamplerUI } from '../../../System/shared/sampler.js';

        try {
            const sampler = new SamplerUI({
                onSampleLoad: (data) => {
                    window.parent.postMessage({ type: 'BVST_LOAD_SAMPLE_FROM_GUI', samples: data }, '*');
                },
                onPreviewTrigger: (active) => {
                    window.parent.postMessage({ type: 'BVST_PARAM', id: active ? 128 : 130, value: 60 }, '*');
                },
                onSeek: (pct) => {
                    window.parent.postMessage({ type: 'BVST_PARAM', id: 30, value: pct }, '*');
                }
            });
            
            sampler.buildUI('sampler-ui-temp');

            const config = {
                name: "ResampleX",
                modules: [
                    {
                        name: "Lo-Fi",
                        controls: [
                            { id: 'bits', type: 'knob', param: 4, min: 2.0, max: 16.0, val: 16.0, label: 'Bits', step: 1 },
                            { id: 'redux', type: 'knob', param: 5, min: 1.0, max: 50.0, val: 1.0, label: 'Redux' },
                            { id: 'drive', type: 'knob', param: 22, min: 0.0, max: 1.0, val: 0.0, label: 'Drive' },
                        ]
                    },
                    {
                        name: "Playback",
                        controls: [
                            { id: 'speed', type: 'knob', param: 0, min: 0.1, max: 4.0, val: 1.0, label: 'Speed' },
                            { id: 'loop_start', type: 'knob', param: 1, min: 0.0, max: 1.0, val: 0.0, label: 'Start', step: 0.01 },
                            { id: 'loop_end', type: 'knob', param: 2, min: 0.0, max: 1.0, val: 1.0, label: 'End', step: 0.01 },
                            { id: 'loop_enable', type: 'switch', param: 3, val: 0, label: 'Loop' },
                        ]
                    },
                    {
                        name: "Filter",
                        controls: [
                            { id: 'cut', type: 'knob', param: 10, min: 20, max: 20000, val: 20000, label: 'Cutoff', curve: 'log' },
                            { id: 'res', type: 'knob', param: 11, min: 0.1, max: 10.0, val: 1.0, label: 'Res' },
                            { id: 'mode', type: 'select', param: 12, options: ['LP', 'HP', 'BP'], val: 0, label: 'Mode' }
                        ]
                    },
                    {
                        name: "Env/Dly",
                        controls: [
                            { id: 'att', type: 'knob', param: 20, min: 0.01, max: 2.0, val: 0.01, label: 'Att' },
                            { id: 'rel', type: 'knob', param: 21, min: 0.01, max: 5.0, val: 0.5, label: 'Rel' },
                            { id: 'dly', type: 'knob', param: 23, min: 0.0, max: 0.8, val: 0.0, label: 'Delay' }
                        ]
                    }
                ]
            };

            const controls = new Controls({
                onChange: (id, val) => {
                    const el = document.getElementById(id);
                    const paramId = parseInt(el.dataset.param);
                    window.parent.postMessage({ type: 'BVST_PARAM', id: paramId, value: val }, '*');
                    
                    if (id === 'speed') sampler.updateParam('playSpeed', val);
                    else if (id === 'loop_start') sampler.updateParam('loopStart', val);
                    else if (id === 'loop_end') sampler.updateParam('loopEnd', val);
                    else if (id === 'loop_enable') sampler.updateParam('loopEnabled', val > 0.5);
                }
            });

            controls.buildUI('controls', config);

            const appRoot = document.getElementById('bvst-app-root');
            const samplerNode = document.getElementById('sampler-ui-temp').firstElementChild; 

            if(appRoot && samplerNode) {
                const topBar = appRoot.querySelector('.bvst-top-bar');
                const grid = appRoot.querySelector('.bvst-controls-grid');
                if (topBar && grid) {
                    appRoot.insertBefore(samplerNode, grid);
                } else if (topBar) {
                    appRoot.appendChild(samplerNode);
                } else {
                    appRoot.prepend(samplerNode);
                }
                const tempContainer = document.getElementById('sampler-ui-temp');
                if(tempContainer) tempContainer.remove();
            }

            const kb = new Keyboard('piano', {
                onNoteOn: (n) => {
                    window.parent.postMessage({ type: 'BVST_PARAM', id: 128, value: n }, '*');
                    sampler.updateParam('note', n);
                    sampler.trigger();
                },
                onNoteOff: (n) => {
                    window.parent.postMessage({ type: 'BVST_PARAM', id: 129, value: n }, '*');
                    sampler.release();
                }
            });

        } catch (e) {
            console.error("GUI Error:", e);
        }
    </script>
</body>
</html>
