<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background: #220033; color: white; }
        #gui-container { width: 100%; height: 500px; position: relative; }
        canvas { width: 100%; height: 150px; background: #111; border-bottom: 1px solid #007a82; display: block; }
        
        #waveform-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 150px; pointer-events: none;
        }
        .marker {
            position: absolute; top: 0; height: 100%; width: 2px; background: #fff;
        }
        #start-marker { background: #0f0; }
        #end-marker { background: #f00; }
    </style>
</head>
<body>


    <div id="gui-container">
        <!-- Waveform Area -->
        <div style="position: relative; height: 150px;">
            <canvas id="waveform"></canvas>
            <div id="waveform-overlay">
                <div id="start-marker" class="marker" style="left: 0%;"></div>
                <div id="end-marker" class="marker" style="left: 100%;"></div>
            </div>
            <div style="position: absolute; top: 5px; left: 10px; color: #0f0; font-family: monospace; font-size: 10px;">
                DROP AUDIO HERE OR PASTE URL BELOW
            </div>
        </div>

        <!-- URL Loader -->
        <div style="background: #000; padding: 5px; display: flex; border-bottom: 1px solid #333;">
            <input type="text" id="urlInput" placeholder="https://example.com/sample.mp3" 
                   style="flex: 1; background: #222; border: 1px solid #444; color: #ddd; padding: 4px;">
            <button id="loadBtn" style="background: #007a82; color: #fff; border: none; padding: 0 10px; cursor: pointer;">LOAD</button>
        </div>

        <!-- Controls -->
        <div id="controls"></div>
    </div>

    <script type="module">
        console.log("DEBUG GUI: Script Started");

        import { Controls } from '../../../../System/shared/controls.js';
        import { Keyboard } from '../../../../System/shared/keyboard.js';

        try {
            // --- CONFIG ---
            const config = {
                name: "CosmoSampler",
                modules: [
                    {
                        name: "Playback",
                        controls: [
                            { id: 'speed', type: 'knob', param: 0, min: 0.1, max: 4.0, val: 1.0, label: 'Speed' },
                            { id: 'drive', type: 'knob', param: 22, min: 0.0, max: 1.0, val: 0.0, label: 'Drive' },
                            { id: 'btn_play', type: 'button', param: 999, text: 'PLAY', label: 'Preview' }
                        ]
                    },
                    {
                        name: "Looping",
                        controls: [
                            { id: 'loop_start', type: 'knob', param: 1, min: 0.0, max: 1.0, val: 0.0, label: 'Start', step: 0.01 },
                            { id: 'loop_end', type: 'knob', param: 2, min: 0.0, max: 1.0, val: 1.0, label: 'End', step: 0.01 },
                            { id: 'loop_enable', type: 'switch', param: 3, val: 0, label: 'Loop' },
                        ]
                    },
                    {
                        name: "Filter",
                        controls: [
                            { id: 'cut', type: 'knob', param: 10, min: 20, max: 20000, val: 20000, label: 'Cutoff', curve: 'log' },
                            { id: 'res', type: 'knob', param: 11, min: 0.1, max: 10.0, val: 1.0, label: 'Res' },
                            { id: 'mode', type: 'select', param: 12, options: ['LP', 'HP', 'BP'], val: 0, label: 'Mode' }
                        ]
                    },
                    {
                        name: "Envelope",
                        controls: [
                            { id: 'att', type: 'knob', param: 20, min: 0.01, max: 2.0, val: 0.01, label: 'Attack' },
                            { id: 'rel', type: 'knob', param: 21, min: 0.01, max: 5.0, val: 0.5, label: 'Release' },
                            { id: 'dly', type: 'knob', param: 23, min: 0.0, max: 0.8, val: 0.0, label: 'Delay' }
                        ]
                    }
                ]
            };

            // --- INIT UI ---
            console.log("DEBUG GUI: Building Controls...");
            const controls = new Controls({
                onChange: (id, val) => {
                    // Update Local State
                    if (id === 'speed') playSpeed = val;
                    else if (id === 'loop_start') { loopStart = val; drawWaveform(sampleData, isPlaying ? -1 : -1); }
                    else if (id === 'loop_end') { loopEnd = val; drawWaveform(sampleData, isPlaying ? -1 : -1); }
                    else if (id === 'loop_enable') loopEnabled = val > 0;

                    // Handle Preview Button Special Case
                    if (id === 'btn_play') {
                        handlePlayButton(val);
                        return;
                    }

                    const el = document.getElementById(id);
                    const paramId = parseInt(el.dataset.param);
                    window.parent.postMessage({ type: 'BVST_PARAM', id: paramId, value: val }, '*');
                    
                    // Update Markers locally (Legacy - but kept for consistency if markers exist in DOM)
                    const sm = document.getElementById('start-marker');
                    const em = document.getElementById('end-marker');
                    if (sm && id === 'loop_start') sm.style.left = (val * 100) + '%';
                    if (em && id === 'loop_end') em.style.left = (val * 100) + '%';
                }
            });

            controls.buildUI('controls', config);
            console.log("DEBUG GUI: Controls Built");

            // Move controls below canvas/url bar
            const builtUI = document.getElementById('bvst-app-root');
            if(builtUI) {
                const topBar = builtUI.querySelector('.bvst-top-bar');
                const customHeader = document.createElement('div');
                customHeader.appendChild(document.querySelector('div[style*="height: 150px"]')); // Waveform container
                customHeader.appendChild(document.querySelector('div[style*="background: #000"]')); // URL Bar
                
                builtUI.insertBefore(customHeader, builtUI.querySelector('.bvst-controls-grid'));
            }

            // Keyboard
            const kb = new Keyboard('piano', {
                onNoteOn: (n) => window.parent.postMessage({ type: 'BVST_PARAM', id: 128, value: n }, '*'),
                onNoteOff: (n) => window.parent.postMessage({ type: 'BVST_PARAM', id: 129, value: n }, '*')
            });
        } catch (e) {
            console.error("DEBUG GUI: CRITICAL ERROR IN SETUP:", e);
            alert("GUI Setup Error: " + e.message);
        }

        // --- STATE ---
        let sampleData = new Float32Array(0);
        let isPlaying = false;
        let playStartTime = 0;
        let animationFrameId;
        let loopStart = 0.0;
        let loopEnd = 1.0;
        let loopEnabled = false;
        let playSpeed = 1.0;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)(); // Persist context for timing

        // --- WAVEFORM VISUALIZATION & INTERACTION ---
        const cvs = document.getElementById('waveform');
        const ctx = cvs.getContext('2d');

        function triggerPreview(active) {
            if (active) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                // Start Playback
                window.parent.postMessage({ type: 'BVST_PARAM', id: 128, value: 60 }, '*');
                
                isPlaying = true;
                playStartTime = audioCtx.currentTime;
                startTransport();
            } else {
                // Stop Playback
                window.parent.postMessage({ type: 'BVST_PARAM', id: 129, value: 60 }, '*');
                
                isPlaying = false;
                stopTransport();
                drawWaveform(sampleData, -1); // Clear playhead
            }
        }

        // Waveform Click Interaction (Gate Mode)
        cvs.addEventListener('mousedown', () => triggerPreview(true));
        cvs.addEventListener('mouseup', () => triggerPreview(false));
        cvs.addEventListener('mouseleave', () => {
            if (isPlaying) triggerPreview(false);
        });
        
        cvs.addEventListener('touchstart', (e) => { e.preventDefault(); triggerPreview(true); });
        cvs.addEventListener('touchend', (e) => { e.preventDefault(); triggerPreview(false); });

        // Play Button Interaction (One-Shot / Loop Toggle)
        function handlePlayButton(val) {
            // Toggle Logic handled by button state in UI, but we need to manage the engine
            if (val > 0) {
                // Button Pressed -> Start
                if (isPlaying) {
                    // If already playing, restart? Or ignore?
                    // Let's restart for "One Shot" feel
                    triggerPreview(false);
                    setTimeout(() => triggerPreview(true), 10);
                } else {
                    triggerPreview(true);
                }
            } else {
                // Button Released
                // If Loop is ON, do NOT stop.
                // If Loop is OFF, do NOT stop immediately (let it play out one-shot style logic handled in transport)
                
                // Actually, standard Play button behavior:
                // Click (Toggle ON) -> Play
                // Click (Toggle OFF) -> Stop
                
                // But the user asked for "Play button should be a oneshot... and plays in a continued loop if loop is on".
                // And "make play when clicking the waveform only play during mouse down".
                
                // If the UI button is momentary (pop up on release), then we need to latch the logic here.
                // BUT, `controls.js` button is momentary by default.
                // We'll assume the user keeps the button logic as-is (momentary triggers).
                
                // Special logic: If triggered via button, we DON'T stop on release.
                // We let the Transport loop handle the stop condition.
            }
        }

        // Transport Animation Loop
        function startTransport() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            function loop() {
                if (!isPlaying) return;

                const now = audioCtx.currentTime;
                const elapsed = (now - playStartTime) * playSpeed; // Seconds into playback
                const duration = sampleData.length / 44100; // Approx duration (assuming 44.1k for viz)
                
                if (duration === 0) return;

                let normalizedPos = 0;

                if (loopEnabled) {
                    // Loop Logic for Viz
                    const startSec = loopStart * duration;
                    const endSec = loopEnd * duration;
                    const loopLen = endSec - startSec;
                    
                    if (loopLen > 0) {
                        const loopProgress = (elapsed % loopLen);
                        const currentSec = startSec + loopProgress;
                        normalizedPos = currentSec / duration;
                    }
                } else {
                    // One-Shot Logic
                    // Start at loop_start (usually 0, but user might want to play from start point?)
                    // User said: "plays the full selected section". This implies starting at Loop Start?
                    // Or starting at 0? Usually one-shot plays the *selection*.
                    
                    const startSec = loopStart * duration;
                    const endSec = loopEnd * duration;
                    const currentSec = startSec + elapsed;
                    
                    normalizedPos = currentSec / duration;

                    // Auto-Stop if end reached
                    if (currentSec >= endSec) {
                        triggerPreview(false);
                        // Reset UI Button if possible? 
                        // (Can't easily reach into controls instance without ref, but visual feedback stops)
                        return; 
                    }
                }

                drawWaveform(sampleData, normalizedPos);
                animationFrameId = requestAnimationFrame(loop);
            }
            loop();
        }

        function stopTransport() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        function drawWaveform(samples, playHeadPos = -1) {
            const width = cvs.width = cvs.clientWidth;
            const height = cvs.height = cvs.clientHeight;
            
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);
            
            // 1. Draw Waveform
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#00f0ff';
            ctx.beginPath();
            
            const step = Math.ceil(samples.length / width);
            const amp = height / 2;
            
            for (let i = 0; i < width; i++) {
                let min = 1.0;
                let max = -1.0;
                
                for (let j = 0; j < step; j++) {
                    if ((i * step) + j < samples.length) {
                        const datum = samples[(i * step) + j];
                        if (datum < min) min = datum;
                        if (datum > max) max = datum;
                    }
                }
                
                ctx.moveTo(i, amp + min * amp);
                ctx.lineTo(i, amp + max * amp);
            }
            ctx.stroke();

            // 2. Draw Dimmed Overlay (Trimmed Sections)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; // Semi-transparent black
            
            // Left Trim
            const leftX = Math.floor(loopStart * width);
            if (leftX > 0) {
                ctx.fillRect(0, 0, leftX, height);
            }
            
            // Right Trim
            const rightX = Math.ceil(loopEnd * width);
            if (rightX < width) {
                ctx.fillRect(rightX, 0, width - rightX, height);
            }

            // 3. Draw Playhead
            if (playHeadPos >= 0 && playHeadPos <= 1) {
                const x = playHeadPos * width;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
        }

        // Listen for Sample Data from Host
        window.addEventListener('message', (e) => {
            if (e.data.type === 'BVST_SAMPLE_DATA') {
                sampleData = e.data.samples;
                drawWaveform(sampleData);
            }
            else if (e.data.type === 'BVST_READY') {
                // Initial Draw (Empty)
                drawWaveform(new Float32Array(0));
            }
        });
        
        // Initialize controls with state tracking
        // We need to hijack the onChange to update our local state
        // ... (Logic inserted below) ...

        // --- URL LOADING ---
        document.getElementById('loadBtn').addEventListener('click', async () => {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();
            console.log("DEBUG GUI: Load Button Clicked. URL:", url);
            
            if (!url) {
                alert("Please enter a URL");
                return;
            }
            
            const btn = document.getElementById('loadBtn');
            const originalText = btn.innerText;
            btn.innerText = "...";
            
            try {
                // 1. Fetch
                console.log("DEBUG GUI: Fetching...");
                const response = await fetch(url);
                console.log("DEBUG GUI: Response Status:", response.status);
                
                if (!response.ok) throw new Error(`Fetch failed: ${response.status} ${response.statusText}`);
                
                const arrayBuffer = await response.arrayBuffer();
                console.log("DEBUG GUI: Fetch complete, bytes:", arrayBuffer.byteLength);
                
                if (arrayBuffer.byteLength === 0) throw new Error("Fetched empty file.");

                // 2. Decode
                console.log("DEBUG GUI: Decoding...");
                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
                console.log("DEBUG GUI: Decoded:", audioBuffer);
                
                const data = audioBuffer.getChannelData(0);
                
                // 3. Visualize
                drawWaveform(data);
                
                // 4. Send to Host
                console.log("DEBUG GUI: Sending to Host...");
                window.parent.postMessage({
                    type: 'BVST_LOAD_SAMPLE_FROM_GUI',
                    samples: data
                }, '*');
                
                btn.innerText = "OK";
                setTimeout(() => btn.innerText = originalText, 1000);
                
            } catch (e) {
                console.error("DEBUG GUI: URL Load Error:", e);
                btn.innerText = "ERR";
                alert("Failed to load URL: " + e.message);
                setTimeout(() => btn.innerText = originalText, 2000);
            }
        });

        // --- DRAG AND DROP (IFRAME LOCAL) ---
        // The iframe needs its own drop handler because it swallows events from the parent window.
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        document.body.addEventListener('drop', async (e) => {
            console.log("DEBUG GUI: Drop detected on iframe");
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files.length > 0) {
                const file = files[0];
                console.log(`DEBUG GUI: Processing file: ${file.name}`);
                
                if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
                        const data = audioBuffer.getChannelData(0);

                        // 1. Visualize locally
                        drawWaveform(data);

                        // 2. Send to Host
                        console.log("DEBUG GUI: Sending dropped sample to Host");
                        window.parent.postMessage({
                            type: 'BVST_LOAD_SAMPLE_FROM_GUI',
                            samples: data
                        }, '*');

                    } catch (err) {
                        console.error("DEBUG GUI: Drop Load Error:", err);
                        alert("Error loading dropped sample: " + err.message);
                    }
                }
            }
        });

        console.log("DEBUG GUI: Script Finished");
    </script>
</body>
</html>
