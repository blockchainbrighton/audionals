<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RetroKeys | BVST</title>
    <style>
        body { margin: 0; padding: 20px; background: #2b2b2b; display: flex; justify-content: center; min-height: 100vh; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { Controls } from '../../System/shared/controls.js';
        import { Keyboard } from '../../System/shared/keyboard.js';
        import { MidiManager } from '../../System/shared/midi.js';

        const CONFIG = {
            name: "RETRO KEYS",
            modules: [
                {
                    name: "Tone",
                    controls: [
                        { type: 'knob', id: 'fm', label: 'Tine (FM)', param: 1, min: 0, max: 500, val: 100 },
                        { type: 'knob', id: 'tone', label: 'Dark/Bright', param: 4, min: 200, max: 8000, curve: 'log', val: 2000 },
                        { type: 'knob', id: 'decay', label: 'Decay', param: 5, min: 0.1, max: 3.0, val: 1.0 }
                    ]
                },
                {
                    name: "Tremolo",
                    controls: [
                        { type: 'knob', id: 'rate', label: 'Rate', param: 2, min: 0.5, max: 15, val: 4 },
                        { type: 'knob', id: 'depth', label: 'Depth', param: 3, min: 0, max: 0.8, val: 0 }
                    ]
                },
                {
                    name: "Master",
                    controls: [
                        { type: 'knob', id: 'verb', label: 'Reverb', param: 7, min: 0, max: 0.6, val: 0.1 },
                        { type: 'knob', id: 'vol', label: 'Volume', param: 6, min: 0, max: 1, val: 0.5 }
                    ]
                }
            ]
        };

        const controls = new Controls({
             onChange: (id, val) => {
                 const el = document.getElementById(id);
                 if(el && el.dataset.param) window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
             }
        });

        // 1. Build UI First! (This creates <div id="piano">)
        const uiRefs = controls.buildUI('app-container', CONFIG);

        // 2. Initialize Keyboard
        // The Controls.buildUI method automatically inserts a <div id="piano"></div>
        const kb = new Keyboard('piano', {
            startNote: 48, // C3
            numKeys: 25,
            responsive: true,
            onNoteOn: (midi, freq) => {
                window.parent.postMessage({ type: 'BVST_PARAM', id: 26, value: freq }, '*'); // Freq
                window.parent.postMessage({ type: 'BVST_PARAM', id: 27, value: 1.0 }, '*');  // Gate On
            },
            onNoteOff: (midi) => {
                // Simple monophonic logic: if active keys empty, gate off
                setTimeout(() => {
                   if (kb.activeKeys.length === 0) {
                       window.parent.postMessage({ type: 'BVST_PARAM', id: 27, value: 0.0 }, '*'); // Gate Off
                   } else {
                       // Retrigger highest
                       // (Optional: logic handled in MidiManager or here)
                   }
                }, 10);
            }
        });
        
        // 3. MIDI
        const midi = new MidiManager({
            deviceSelectorId: 'midi-in',
            statusElementId: 'midi-led',
            onNoteOn: (n) => kb._handleNoteOn(n),
            onNoteOff: (n) => kb._handleNoteOff(n)
        });

        // Handshake
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'BVST_READY') {
                // Send initial values
                document.querySelectorAll('[data-param]').forEach(el => {
                     const p = parseInt(el.dataset.param);
                     const v = parseFloat(el.dataset.val);
                     window.parent.postMessage({ type: 'BVST_PARAM', id: p, value: v }, '*');
                });
                // Load Init
                pSel.value = 'Init';
                pSel.dispatchEvent(new Event('change'));
            }
        });

        // --- PRESETS ---
        const PRESETS = {
            "Init": { "fm":100, "tone":2000, "decay":1.0, "rate":4, "depth":0, "verb":0.1, "vol":0.5 },
            "Classic EP": { "fm":150, "tone":3000, "decay":1.5, "rate":2, "depth":0.2, "verb":0.2, "vol":0.6 },
            "Dreamy Vibraphone": { "fm":20, "tone":800, "decay":2.5, "rate":6, "depth":0.6, "verb":0.5, "vol":0.5 },
            "Aggressive Tine": { "fm":400, "tone":8000, "decay":0.8, "rate":0.5, "depth":0.0, "verb":0.1, "vol":0.6 },
            "Wurli-ish": { "fm":80, "tone":1500, "decay":1.2, "rate":5, "depth":0.4, "verb":0.1, "vol":0.6 },
            "Dark Keys": { "fm":50, "tone":400, "decay":2.0, "rate":1, "depth":0.1, "verb":0.4, "vol":0.7 },
            "Broken Bell": { "fm":480, "tone":5000, "decay":0.4, "rate":12, "depth":0.7, "verb":0.2, "vol":0.5 }
        };

        const pSel = uiRefs.presetSelector;
        Object.keys(PRESETS).forEach(k => {
            const o = document.createElement('option'); o.value = k; o.innerText = k; pSel.appendChild(o);
        });

        pSel.addEventListener('change', (e) => {
            const p = PRESETS[e.target.value];
            if(!p) return;
            for(const [id, val] of Object.entries(p)) {
                controls.setValue(id, val);
                const el = document.getElementById(id);
                if(el) window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
            }
        });
    </script>
</body>
</html>
