<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OrbitalChorus</title>
</head>
<body style="margin:0; padding:20px; background:#0a0f14; color:#e8f7ff; font-family:monospace;">
    <div id="app-container"></div>
    <script type="module">
        import { Controls } from '../../../../System/shared/controls.js';

        const CONFIG = {
            name: 'ORBITAL CHORUS',
            modules: [
                {
                    name: 'Modulation',
                    controls: [
                        { type: 'knob', id: 'rate', label: 'Rate (Hz)', param: 1, min: 0.05, max: 5, step: 0.01, val: 0.5 },
                        { type: 'knob', id: 'depth', label: 'Depth (s)', param: 2, min: 0, max: 0.02, step: 0.001, val: 0.008 },
                        { type: 'knob', id: 'stereo', label: 'Stereo Phase', param: 5, min: 0, max: 180, step: 1, val: 90 }
                    ]
                },
                {
                    name: 'Mix / Feedback',
                    controls: [
                        { type: 'knob', id: 'mix', label: 'Mix', param: 3, min: 0, max: 1, step: 0.01, val: 0.5 },
                        { type: 'knob', id: 'fb', label: 'Feedback', param: 4, min: -0.7, max: 0.7, step: 0.01, val: 0.1 }
                    ]
                },
                {
                    name: 'Tone',
                    controls: [
                        { type: 'knob', id: 'tilt', label: 'Tilt', param: 6, min: -1, max: 1, step: 0.01, val: 0 }
                    ]
                }
            ]
        };

        const controls = new Controls({
            onChange: (id, val) => {
                const el = document.getElementById(id);
                if (el && el.dataset.param) {
                    window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
                }
            }
        });

        controls.buildUI('app-container', CONFIG);
    </script>
</body>
</html>
