<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ArpOne</title>
    <style>
        body { margin: 0; padding: 20px; background: #222; color: #eee; display: flex; justify-content: center; min-height: 100vh; font-family: monospace; }
        #arp-controls { margin-bottom: 10px; padding: 10px; background: #333; border-radius: 5px; text-align: center; border: 1px solid #444; }
        #arp-controls select { background: #111; color: #fff; border: 1px solid #555; padding: 5px; margin: 0 5px; }
        #arp-controls label { font-size: 0.8em; color: #aaa; margin-left: 10px; }
        #arp-enable { background:#444; color:white; border:1px solid #666; padding:5px 10px; margin-left: 15px; cursor: pointer; }
        #arp-enable:hover { background: #555; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';
        import { Keyboard } from '../../../System/shared/keyboard.js';
        import { MidiManager } from '../../../System/shared/midi.js';

        const CONFIG = {
            name: "ARP ONE",
            keyboard: false, // Custom keyboard logic
            modules: [
                {
                    name: "Oscillators",
                    controls: [
                        { type: 'knob', id: 'mix', label: 'Saw/Pulse', param: 1, min: 0, max: 1, val: 0.5 },
                        { type: 'knob', id: 'pw', label: 'Width', param: 2, min: 0.1, max: 0.9, val: 0.5 },
                        { type: 'knob', id: 'det', label: 'Detune', param: 3, min: 1.0, max: 1.02, val: 1.005 }
                    ]
                },
                {
                    name: "Filter/Env",
                    controls: [
                        { type: 'knob', id: 'cut', label: 'Cutoff', param: 4, min: 50, max: 8000, curve: 'log', val: 1500 },
                        { type: 'knob', id: 'res', label: 'Res', param: 5, min: 0, max: 8, val: 2 },
                        { type: 'knob', id: 'env', label: 'Env Amt', param: 6, min: 0, max: 5000, val: 2000 },
                        { type: 'knob', id: 'dec', label: 'Decay', param: 7, min: 0.05, max: 2.0, val: 0.3 }
                    ]
                },
                {
                    name: "Effects",
                    controls: [
                        { type: 'knob', id: 'd_time', label: 'D.Time', param: 9, min: 0, max: 0.8, val: 0.3 },
                        { type: 'knob', id: 'd_mix', label: 'D.Mix', param: 10, min: 0, max: 0.6, val: 0.3 },
                        { type: 'knob', id: 'vol', label: 'Volume', param: 11, min: 0, max: 1, val: 0.6 }
                    ]
                }
            ]
        };

        BVST.init(CONFIG);

        // --- INJECT ARP UI ---
        const app = document.getElementById('bvst-app-root');
        const arpDiv = document.createElement('div');
        arpDiv.innerHTML = `
            <div id="arp-controls">
                <label>ARP MODE</label>
                <select id="arp-dir">
                    <option value="up">UP</option>
                    <option value="down">DOWN</option>
                    <option value="updown">UP/DOWN</option>
                    <option value="random">RANDOM</option>
                </select>
                
                <label>RATE</label>
                <select id="arp-rate">
                    <option value="125">1/8</option>
                    <option value="62.5">1/16</option>
                    <option value="250">1/4</option>
                </select>
                
                <label>RANGE</label>
                <select id="arp-oct">
                    <option value="1">1 Oct</option>
                    <option value="2">2 Oct</option>
                    <option value="3">3 Oct</option>
                </select>
                
                <button id="arp-enable">ARP: ON</button>
            </div>
        `;
        // Insert inside app, before modules grid (after top bar)
        // Top bar is child 0. Grid is child 1.
        app.insertBefore(arpDiv, app.children[1]);
        
        // Re-inject Piano at bottom
        const kbDiv = document.createElement('div');
        kbDiv.id = 'keyboard-container';
        kbDiv.style.cssText = "background: #000; border-top: 2px solid #007a82; padding-top: 5px; min-height: 100px;";
        kbDiv.innerHTML = '<div id="piano"></div>';
        app.appendChild(kbDiv);

        // --- ARPEGGIATOR LOGIC ---
        const arpState = {
            active: true,
            notes: [],
            index: 0,
            dir: 'up',
            dirFlag: 1,
            rateMs: 125,
            octaves: 2,
            timer: null
        };

        document.getElementById('arp-dir').onchange = (e) => arpState.dir = e.target.value;
        document.getElementById('arp-rate').onchange = (e) => {
            arpState.rateMs = parseFloat(e.target.value);
            restartArp();
        };
        document.getElementById('arp-oct').onchange = (e) => arpState.octaves = parseInt(e.target.value);
        
        const btnArp = document.getElementById('arp-enable');
        btnArp.onclick = () => {
            arpState.active = !arpState.active;
            btnArp.innerText = arpState.active ? "ARP: ON" : "ARP: OFF";
            btnArp.style.color = arpState.active ? "white" : "gray";
            if(!arpState.active) stopArp();
        };

        function restartArp() {
            if(arpState.timer) clearInterval(arpState.timer);
            if(arpState.active) arpState.timer = setInterval(clockTick, arpState.rateMs);
        }

        function stopArp() {
            if(arpState.timer) clearInterval(arpState.timer);
            arpState.timer = null;
            BVST.sendParam(129, 0); 
        }

        function clockTick() {
            if(arpState.notes.length === 0) return;

            let pattern = [];
            for(let o=0; o<arpState.octaves; o++) {
                for(let n of arpState.notes) {
                    pattern.push(n + (o*12));
                }
            }
            pattern.sort((a,b) => a-b);
            
            let noteToPlay = 0;
            
            if (arpState.dir === 'random') {
                const r = Math.floor(Math.random() * pattern.length);
                noteToPlay = pattern[r];
            } else if (arpState.dir === 'up') {
                arpState.index = (arpState.index + 1) % pattern.length;
                noteToPlay = pattern[arpState.index];
            } else if (arpState.dir === 'down') {
                arpState.index--;
                if(arpState.index < 0) arpState.index = pattern.length - 1;
                noteToPlay = pattern[arpState.index];
            } else if (arpState.dir === 'updown') {
                 arpState.index += arpState.dirFlag;
                 if (arpState.index >= pattern.length) {
                     arpState.index = Math.max(0, pattern.length - 2);
                     arpState.dirFlag = -1;
                 } else if (arpState.index < 0) {
                     arpState.index = Math.min(pattern.length - 1, 1);
                     arpState.dirFlag = 1;
                 }
                 if(pattern.length === 1) arpState.index = 0;
                 else arpState.index = Math.max(0, Math.min(pattern.length-1, arpState.index));
                 noteToPlay = pattern[arpState.index];
            }

            BVST.sendParam(128, noteToPlay);
        }
        
        restartArp();

        const kb = new Keyboard('piano', {
            startNote: 36, numKeys: 25, responsive: true,
            onNoteOn: (midi) => {
                if(!arpState.notes.includes(midi)) {
                    arpState.notes.push(midi);
                    arpState.notes.sort((a,b) => a-b);
                }
                if (!arpState.active) {
                    BVST.sendParam(128, midi);
                } else if(arpState.notes.length === 1) {
                    arpState.index = -1;
                }
            },
            onNoteOff: (midi) => {
                const idx = arpState.notes.indexOf(midi);
                if(idx > -1) arpState.notes.splice(idx, 1);
                if (!arpState.active) {
                    BVST.sendParam(129, midi);
                }
            }
        });
        
        const midi = new MidiManager({
            deviceSelectorId: 'midi-in',
            statusElementId: 'midi-led',
            onNoteOn: (n) => kb._handleNoteOn(n),
            onNoteOff: (n) => kb._handleNoteOff(n)
        });
    </script>
</body>
</html>
