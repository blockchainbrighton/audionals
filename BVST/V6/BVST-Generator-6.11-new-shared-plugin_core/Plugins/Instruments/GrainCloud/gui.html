<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GrainCloud</title>
    <style>
        body { margin: 0; padding: 0; background: #220033; color: white; overflow: hidden; }
        #app-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';
        import { SamplerUI } from '../../../System/shared/sampler.js';

        const CONFIG = {
            name: "GrainCloud",
            modules: [
                {
                    name: "Cloud Control",
                    controls: [
                        { id: 'pos', type: 'knob', param: 0, min: 0.0, max: 1.0, val: 0.5, label: 'Pos' },
                        { id: 'spread', type: 'knob', param: 1, min: 0.0, max: 0.5, val: 0.1, label: 'Spread' },
                        { id: 'dens', type: 'knob', param: 2, min: 1.0, max: 80.0, val: 20.0, label: 'Dens' },
                        { id: 'size', type: 'knob', param: 3, min: 10.0, max: 500.0, val: 100.0, label: 'Size' }
                    ]
                },
                {
                    name: "Jitter / Speed",
                    controls: [
                        { id: 'jit_sz', type: 'knob', param: 4, min: 0.0, max: 200.0, val: 50.0, label: 'Jit.Size' },
                        { id: 'jit_pi', type: 'knob', param: 5, min: 0.0, max: 1.0, val: 0.0, label: 'Jit.Pch' },
                        { id: 'speed', type: 'knob', param: 6, min: 0.1, max: 2.0, val: 1.0, label: 'Speed' }
                    ]
                },
                {
                    name: "Output",
                    controls: [
                        { id: 'cut', type: 'knob', param: 10, min: 20, max: 20000, val: 20000, label: 'Cutoff', curve: 'log' },
                        { id: 'dly', type: 'knob', param: 23, min: 0.0, max: 0.5, val: 0.0, label: 'Delay' }
                    ]
                }
            ]
        };

        // 1. Init Base System
        BVST.init(CONFIG);

        // 2. Init Sampler UI
        const sampler = new SamplerUI({
            onSampleLoad: (data) => {
                // plugin_core doesn't handle sample loading directly yet, so we send manually
                window.parent.postMessage({ type: 'BVST_LOAD_SAMPLE_FROM_GUI', samples: data }, '*');
            },
            onSeek: (pct) => {
                sampler.updateParam('grainPos', pct);
                // Send param update via BVST helper
                BVST.sendParam(0, pct);
                // Also update the Knob UI
                BVST.controls.setValue('pos', pct);
            }
        });
        
        // Initial Visual State
        sampler.updateParam('grainSize', 0.1); // Based on default Spread 0.1
        sampler.updateParam('grainPos', 0.5);
        sampler.updateParam('loopEnabled', false);

        // 3. Inject Sampler UI
        // We create a temp container to let SamplerUI build itself, then move it.
        const tempDiv = document.createElement('div');
        tempDiv.id = 'sampler-temp';
        document.body.appendChild(tempDiv);
        sampler.buildUI('sampler-temp');
        
        const samplerNode = tempDiv.firstElementChild;
        const appRoot = document.getElementById('bvst-app-root');
        if(appRoot && samplerNode) {
            const topBar = appRoot.querySelector('.bvst-top-bar');
            const grid = appRoot.querySelector('.bvst-controls-grid');
            // Insert between Top Bar and Grid
            if (topBar && grid) {
                appRoot.insertBefore(samplerNode, grid);
            } else {
                appRoot.prepend(samplerNode);
            }
        }
        tempDiv.remove();

        // 4. Hook Logic
        const originalOnChange = BVST.controls.onChange;
        BVST.controls.onChange = (id, val) => {
            // Call original to ensure params are sent
            if (originalOnChange) originalOnChange(id, val);
            
            // Custom Logic
            if (id === 'pos') sampler.updateParam('grainPos', val);
            if (id === 'spread') sampler.updateParam('grainSize', val * 2.0);
        };

    </script>
</body>
</html>
