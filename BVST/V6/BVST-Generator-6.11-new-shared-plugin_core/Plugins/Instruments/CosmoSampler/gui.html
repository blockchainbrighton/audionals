<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CosmoSampler</title>
    <style>
        body { margin: 0; padding: 0; background: #220033; color: white; overflow: hidden; }
        #app-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';
        import { SamplerUI } from '../../../System/shared/sampler.js';
        import { Keyboard } from '../../../System/shared/keyboard.js';

        const CONFIG = {
            name: "CosmoSampler",
            keyboard: false, // Custom keyboard handling required
            modules: [
                {
                    name: "Playback",
                    controls: [
                        { id: 'speed', type: 'knob', param: 0, min: 0.1, max: 4.0, val: 1.0, label: 'Speed' },
                        { id: 'drive', type: 'knob', param: 22, min: 0.0, max: 1.0, val: 0.0, label: 'Drive' },
                        { id: 'btn_play', type: 'button', param: 999, text: 'PLAY', label: 'Preview' }
                    ]
                },
                {
                    name: "Looping",
                    controls: [
                        { id: 'loop_start', type: 'knob', param: 1, min: 0.0, max: 1.0, val: 0.0, label: 'Start', step: 0.01 },
                        { id: 'loop_end', type: 'knob', param: 2, min: 0.0, max: 1.0, val: 1.0, label: 'End', step: 0.01 },
                        { id: 'loop_enable', type: 'switch', param: 3, val: 0, label: 'Loop' },
                    ]
                },
                {
                    name: "Filter",
                    controls: [
                        { id: 'cut', type: 'knob', param: 10, min: 20, max: 20000, val: 20000, label: 'Cutoff', curve: 'log' },
                        { id: 'res', type: 'knob', param: 11, min: 0.1, max: 10.0, val: 1.0, label: 'Res' },
                        { id: 'mode', type: 'select', param: 12, options: ['LP', 'HP', 'BP'], val: 0, label: 'Mode' }
                    ]
                },
                {
                    name: "Envelope",
                    controls: [
                        { id: 'att', type: 'knob', param: 20, min: 0.01, max: 2.0, val: 0.01, label: 'Attack' },
                        { id: 'rel', type: 'knob', param: 21, min: 0.01, max: 5.0, val: 0.5, label: 'Release' },
                        { id: 'dly', type: 'knob', param: 23, min: 0.0, max: 0.8, val: 0.0, label: 'Delay' }
                    ]
                }
            ]
        };

        // 1. Init Base System
        BVST.init(CONFIG);

        // 2. Init Sampler UI
        const sampler = new SamplerUI({
            onSampleLoad: (data) => {
                window.parent.postMessage({ type: 'BVST_LOAD_SAMPLE_FROM_GUI', samples: data }, '*');
            },
            onPreviewTrigger: (active) => {
                const msgType = active ? 128 : 130; // 130 = Force Stop
                BVST.sendParam(msgType, 60);
            },
            onSeek: (pct) => {
                BVST.sendParam(30, pct);
            }
        });

        // 3. Inject Sampler UI
        const tempDiv = document.createElement('div');
        tempDiv.id = 'sampler-temp';
        document.body.appendChild(tempDiv);
        sampler.buildUI('sampler-temp');
        
        const samplerNode = tempDiv.firstElementChild;
        const appRoot = document.getElementById('bvst-app-root');
        if(appRoot && samplerNode) {
            const topBar = appRoot.querySelector('.bvst-top-bar');
            const grid = appRoot.querySelector('.bvst-controls-grid');
            if (topBar && grid) appRoot.insertBefore(samplerNode, grid);
            else appRoot.prepend(samplerNode);
        }
        tempDiv.remove();

        // 4. Hook Logic
        const originalOnChange = BVST.controls.onChange;
        BVST.controls.onChange = (id, val) => {
            // Special Button Case
            if (id === 'btn_play') {
                const msgType = val > 0 ? 128 : 129;
                BVST.sendParam(msgType, 60);
                if (val > 0) sampler.trigger(); else sampler.release();
                return;
            }

            if (originalOnChange) originalOnChange(id, val);
            
            // Sampler Sync
            if (id === 'speed') sampler.updateParam('playSpeed', val);
            else if (id === 'loop_start') sampler.updateParam('loopStart', val);
            else if (id === 'loop_end') sampler.updateParam('loopEnd', val);
            else if (id === 'loop_enable') sampler.updateParam('loopEnabled', val > 0.5);
        };

        // 5. Manual Keyboard Injection (Bottom)
        // BVST.init adds a placeholder #keyboard-container. We can reuse it.
        const kbContainer = document.getElementById('keyboard-container');
        if(kbContainer) {
            kbContainer.innerHTML = ''; // Clear placeholder
            const kbId = 'piano-kb';
            const kbDiv = document.createElement('div');
            kbDiv.id = kbId;
            kbContainer.appendChild(kbDiv);

            new Keyboard(kbId, {
                onNoteOn: (n) => {
                    BVST.sendParam(128, n);
                    sampler.updateParam('note', n);
                    sampler.trigger();
                },
                onNoteOff: (n) => {
                    BVST.sendParam(129, n);
                    sampler.release();
                }
            });
        }

    </script>
</body>
</html>
