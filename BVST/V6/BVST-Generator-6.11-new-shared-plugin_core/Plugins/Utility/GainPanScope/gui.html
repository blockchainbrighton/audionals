<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GainPanScope</title>
    <style>
        body { margin: 0; padding: 0; background: #101010; color: #f0f0f0; overflow: hidden; }
        #app-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';

        const CONFIG = {
            name: 'GAIN / PAN / SCOPE',
            keyboard: false, // Utility, no keyboard needed
            modules: [
                {
                    name: 'Level',
                    controls: [
                        { type: 'knob', id: 'gain', label: 'Gain (dB)', param: 1, min: -24, max: 24, step: 0.5, val: 0 }
                    ]
                },
                {
                    name: 'Pan / Tilt',
                    controls: [
                        { type: 'knob', id: 'pan', label: 'Tilt', param: 2, min: -1, max: 1, step: 0.02, val: 0 },
                        { type: 'switch', id: 'mono', label: 'Mono', param: 3, val: 1 },
                        { type: 'switch', id: 'guard', label: 'Clip Guard', param: 4, val: 1 }
                    ]
                }
            ]
        };

        BVST.init(CONFIG);
        // Clean up keyboard placeholder if present
        const kb = document.getElementById('keyboard-container');
        if(kb) kb.style.display = 'none';

    </script>
</body>
</html>
