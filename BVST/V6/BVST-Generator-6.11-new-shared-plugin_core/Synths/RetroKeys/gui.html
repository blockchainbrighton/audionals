<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RetroKeys | BVST</title>
    <style>
        body { margin: 0; padding: 20px; background: #2b2b2b; display: flex; justify-content: center; min-height: 100vh; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { BVST } from '../../System/shared/plugin_core.js';
        import { Keyboard } from '../../System/shared/keyboard.js';
        import { MidiManager } from '../../System/shared/midi.js';

        const CONFIG = {
            name: "RETRO KEYS",
            presets: {
                "Init": { "fm":100, "tone":2000, "decay":1.0, "rate":4, "depth":0, "verb":0.1, "vol":0.5 },
                "Classic EP": { "fm":150, "tone":3000, "decay":1.5, "rate":2, "depth":0.2, "verb":0.2, "vol":0.6 },
                "Dreamy Vibraphone": { "fm":20, "tone":800, "decay":2.5, "rate":6, "depth":0.6, "verb":0.5, "vol":0.5 },
                "Aggressive Tine": { "fm":400, "tone":8000, "decay":0.8, "rate":0.5, "depth":0.0, "verb":0.1, "vol":0.6 },
                "Wurli-ish": { "fm":80, "tone":1500, "decay":1.2, "rate":5, "depth":0.4, "verb":0.1, "vol":0.6 },
                "Dark Keys": { "fm":50, "tone":400, "decay":2.0, "rate":1, "depth":0.1, "verb":0.4, "vol":0.7 },
                "Broken Bell": { "fm":480, "tone":5000, "decay":0.4, "rate":12, "depth":0.7, "verb":0.2, "vol":0.5 }
            },
            keyboard: false,
            modules: [
                {
                    name: "Tone",
                    controls: [
                        { type: 'knob', id: 'fm', label: 'Tine (FM)', param: 1, min: 0, max: 500, val: 100 },
                        { type: 'knob', id: 'tone', label: 'Dark/Bright', param: 4, min: 200, max: 8000, curve: 'log', val: 2000 },
                        { type: 'knob', id: 'decay', label: 'Decay', param: 5, min: 0.1, max: 3.0, val: 1.0 }
                    ]
                },
                {
                    name: "Tremolo",
                    controls: [
                        { type: 'knob', id: 'rate', label: 'Rate', param: 2, min: 0.5, max: 15, val: 4 },
                        { type: 'knob', id: 'depth', label: 'Depth', param: 3, min: 0, max: 0.8, val: 0 }
                    ]
                },
                {
                    name: "Master",
                    controls: [
                        { type: 'knob', id: 'verb', label: 'Reverb', param: 7, min: 0, max: 0.6, val: 0.1 },
                        { type: 'knob', id: 'vol', label: 'Volume', param: 6, min: 0, max: 1, val: 0.5 }
                    ]
                }
            ]
        };

        BVST.init(CONFIG);

        // --- KEYBOARD & MIDI ---
        const app = document.getElementById('bvst-app-root');
        const kbDiv = document.createElement('div');
        kbDiv.id = 'keyboard-container';
        kbDiv.style.cssText = "background: #000; border-top: 2px solid #007a82; padding-top: 5px; min-height: 100px;";
        kbDiv.innerHTML = '<div id="piano"></div>';
        app.appendChild(kbDiv);

        const kb = new Keyboard('piano', {
            startNote: 48, numKeys: 25, responsive: true,
            onNoteOn: (midi, freq) => {
                BVST.sendParam(26, freq);
                BVST.sendParam(27, 1.0);
            },
            onNoteOff: (midi) => {
                setTimeout(() => {
                   if (kb.activeKeys.length === 0) {
                       BVST.sendParam(27, 0.0);
                   }
                }, 10);
            }
        });

        const midi = new MidiManager({
            deviceSelectorId: 'midi-in',
            statusElementId: 'midi-led',
            onNoteOn: (n) => kb._handleNoteOn(n),
            onNoteOff: (n) => kb._handleNoteOff(n)
        });
    </script>
</body>
</html>
