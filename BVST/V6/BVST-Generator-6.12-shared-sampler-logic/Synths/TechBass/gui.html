<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechBass</title>
    <style>
        body { margin: 0; padding: 20px; background: #050505; color: #0f0; display: flex; justify-content: center; min-height: 100vh; font-family: monospace; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { BVST } from '../../System/shared/plugin_core.js';

        const CONFIG = {
            name: "TECH BASS",
            keyboard: { startNote: 24, numKeys: 25 },
            modules: [
                {
                    name: "FM Core",
                    controls: [
                        { type: 'knob', id: 'amt', label: 'Grit', param: 1, min: 0, max: 1000, val: 500 },
                        { type: 'knob', id: 'ratio', label: 'Harmonic', param: 2, min: 0.5, max: 4.0, step: 0.5, val: 1.0 },
                        { type: 'knob', id: 'dec', label: 'Decay', param: 4, min: 0.1, max: 1.0, val: 0.3 }
                    ]
                },
                {
                    name: "Shaping",
                    controls: [
                        { type: 'knob', id: 'cut', label: 'Filter', param: 3, min: 50, max: 5000, curve: 'log', val: 800 },
                        { type: 'knob', id: 'drive', label: 'Distort', param: 5, min: 0, max: 1, val: 0.2 }
                    ]
                },
                {
                    name: "Dynamics",
                    controls: [
                        { type: 'knob', id: 'comp', label: 'Squash', param: 6, min: -40, max: 0, val: -10 },
                        { type: 'knob', id: 'vol', label: 'Level', param: 7, min: 0, max: 1, val: 0.6 }
                    ]
                }
            ]
        };

        BVST.init(CONFIG);
    </script>
</body>
</html>
