<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BeatMachine</title>
    <style>
        body { margin: 0; padding: 20px; background: #111; color: #ccc; font-family: monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        #transport { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; background: #222; padding: 10px; border-radius: 8px; }
        button { padding: 8px 16px; background: #444; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-family: monospace; font-weight: bold; }
        button.active { background: #0f0; color: #000; }
        button:hover { background: #555; }
        
        .grid-container { display: grid; grid-template-columns: 60px repeat(16, 1fr); gap: 4px; background: #222; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
        
        .row-label { display: flex; align-items: center; font-size: 12px; color: #888; font-weight: bold; }
        
        .step {
            width: 24px; height: 30px; background: #333; border: 1px solid #444; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }
        .step:hover { border-color: #666; }
        .step.active { background: #f90; border-color: #f90; box-shadow: 0 0 5px #f90; }
        .step.current { background: #fff; } /* Playhead cursor */
        .step.active.current { background: #ffc; }
        
        /* Different colors for rows */
        .row-0 .step.active { background: #f44; border-color: #f44; box-shadow: 0 0 5px #f44; } /* Kick */
        .row-1 .step.active { background: #4f4; border-color: #4f4; box-shadow: 0 0 5px #4f4; } /* Snare */
        .row-2 .step.active { background: #4bf; border-color: #4bf; box-shadow: 0 0 5px #4bf; } /* Hat */
        .row-3 .step.active { background: #d4f; border-color: #d4f; box-shadow: 0 0 5px #d4f; } /* Bass */
        
        #controls-area { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>

    <div id="transport">
        <button id="btn-play">PLAY</button>
        <button id="btn-stop">STOP</button>
        <div style="display: flex; flex-direction: column; gap: 2px;">
            <label style="font-size: 10px;">BPM</label>
            <input type="number" id="bpm" value="120" style="width: 50px; background: #111; color: #fff; border: 1px solid #444;">
        </div>
    </div>

    <div id="sequencer" class="grid-container">
        <!-- Generated by JS -->
    </div>
    
    <div id="controls-area"></div>

    <script type="module">
        import { Controls } from '../../System/shared/controls.js';

        // --- CONFIG ---
        const ROWS = [
            { name: "KICK", note: 36, class: "row-0" },
            { name: "SNARE", note: 38, class: "row-1" },
            { name: "HAT", note: 42, class: "row-2" },
            { name: "BASS", note: 48, class: "row-3" } // Root C2
        ];
        
        const STEPS = 16;
        // Grid Data: [Row][Step] = bool
        let gridData = Array(ROWS.length).fill().map(() => Array(STEPS).fill(false));
        
        // Bass Pitch Data: [Step] = offset (semitones)
        // For simplicity, Bass row triggers Root + Offset defined by a global knob? 
        // Or per step? 
        // Let's keep it simple: Bass triggers Root Note defined by UI knob "Bass Key"
        // To make it "Basslines", we might need a pitch seq?
        // Let's add a simple pitch sequencer row? No, too complex for UI space.
        // We will just use fixed note for now.
        
        let isPlaying = false;
        let currentStep = 0;
        let tempo = 120;
        let nextNoteTime = 0;
        let lookahead = 25.0;
        let scheduleAheadTime = 0.1;
        let timerID = null;
        
        // Web Audio Context (from parent ideally, but we need local time for scheduling)
        // Actually BVST host runs audio. We just send messages.
        // We can use a loose JS timer for UI, but timing might be jittery.
        // Better: Use standard JS setInterval lookahead scheduler relative to performance.now()
        // Sending `BVST_PARAM` is immediate.
        
        // --- UI GENERATION ---
        const seqContainer = document.getElementById('sequencer');
        
        ROWS.forEach((row, rIdx) => {
            // Label
            const label = document.createElement('div');
            label.className = 'row-label';
            label.innerText = row.name;
            seqContainer.appendChild(label);
            
            // Steps
            for(let s=0; s<STEPS; s++) {
                const step = document.createElement('div');
                step.className = `step ${row.class}`;
                step.id = `step-${rIdx}-${s}`;
                step.onclick = () => toggleStep(rIdx, s);
                seqContainer.appendChild(step);
            }
        });
        
        function toggleStep(row, step) {
            gridData[row][step] = !gridData[row][step];
            updateStepUI(row, step);
        }
        
        function updateStepUI(row, step) {
            const el = document.getElementById(`step-${row}-${step}`);
            if (gridData[row][step]) el.classList.add('active');
            else el.classList.remove('active');
        }
        
        // --- CONTROLS ---
        const CONFIG = {
            name: "", // Hidden
            modules: [
                {
                    name: "Kick",
                    controls: [
                        { type: 'knob', id: 'k_vol', label: 'Vol', param: 1, min: 0, max: 1, val: 0.8 },
                        { type: 'knob', id: 'k_tune', label: 'Tune', param: 5, min: 30, max: 80, val: 50 },
                        { type: 'knob', id: 'k_dec', label: 'Decay', param: 6, min: 0.1, max: 0.8, val: 0.4 }
                    ]
                },
                {
                    name: "Snare",
                    controls: [
                        { type: 'knob', id: 's_vol', label: 'Vol', param: 2, min: 0, max: 1, val: 0.6 },
                        { type: 'knob', id: 's_snap', label: 'Snap', param: 7, min: 0, max: 1, val: 0.5 },
                        { type: 'knob', id: 's_dec', label: 'Decay', param: 8, min: 0.05, max: 0.4, val: 0.2 }
                    ]
                },
                {
                    name: "Hat",
                    controls: [
                        { type: 'knob', id: 'h_vol', label: 'Vol', param: 3, min: 0, max: 1, val: 0.4 },
                        { type: 'knob', id: 'h_col', label: 'Color', param: 9, min: 1000, max: 10000, val: 5000 },
                        { type: 'knob', id: 'h_dec', label: 'Decay', param: 10, min: 0.02, max: 0.3, val: 0.05 }
                    ]
                },
                {
                    name: "Bass",
                    controls: [
                        { type: 'knob', id: 'b_vol', label: 'Vol', param: 4, min: 0, max: 1, val: 0.7 },
                        { type: 'knob', id: 'b_cut', label: 'Cut', param: 11, min: 100, max: 2000, curve: 'log', val: 500 },
                        { type: 'knob', id: 'b_note', label: 'Root', param: 13, min: 24, max: 60, step: 1, val: 36 } // C1
                    ]
                }
            ]
        };
        
        const controls = new Controls({
             onChange: (id, val) => {
                 const el = document.getElementById(id);
                 if(el && el.dataset.param) {
                     // Store Bass Note locally to send correct note on trigger?
                     // Actually Audio Engine Param 13 stores Bass Pitch.
                     // Triggers just send 48 (Fixed C2 trigger) or we can send specific note.
                     // Engine logic: "If trigger >= 48, use trigger note".
                     // So we need to send the note from UI when sequencer steps.
                     
                     // But we also send Param 13 to Engine so we can modulate it?
                     // Let's use Param 13 to set "Bass Root" in Engine state if we want?
                     // No, simpler: UI Sequencer sends NOTE ON (128) with value = current Bass Knob Value.
                     // BUT the knob sends Param 13.
                     // Let's stick to: Knob sends Param 13 (Bass Note Param).
                     // Engine stores Bass Note.
                     // Sequencer sends Note 48 (Generic Bass Trigger).
                     // Engine uses stored Bass Note.
                     
                     window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
                 }
             }
        });
        
        controls.buildUI('controls-area', CONFIG);
        
        // --- SCHEDULER ---
        // Simple Interval for now
        
        document.getElementById('btn-play').onclick = () => {
            if(!isPlaying) {
                isPlaying = true;
                document.getElementById('btn-play').classList.add('active');
                runSequencer();
            }
        };
        
        document.getElementById('btn-stop').onclick = () => {
            isPlaying = false;
            document.getElementById('btn-play').classList.remove('active');
            clearUI();
            currentStep = 0;
        };
        
        document.getElementById('bpm').onchange = (e) => { tempo = parseFloat(e.target.value); };
        
        function runSequencer() {
            if(!isPlaying) return;
            
            // Trigger current step
            playStep(currentStep);
            
            // Visuals
            updatePlayhead(currentStep);
            
            // Advance
            currentStep = (currentStep + 1) % STEPS;
            
            // Schedule next
            const stepTime = (60000 / tempo) / 4; // 16th notes
            setTimeout(runSequencer, stepTime);
        }
        
        function playStep(s) {
            console.log("Step:", s); // Debug log
            // Row 0: Kick
            if(gridData[0][s]) sendNote(36);
            // Row 1: Snare
            if(gridData[1][s]) sendNote(38);
            // Row 2: Hat
            if(gridData[2][s]) sendNote(42);
            // Row 3: Bass
            if(gridData[3][s]) sendNote(48); // 48 triggers bass using stored internal pitch
        }
        
        function sendNote(n) {
            console.log("Note Tx:", n); // Debug log
            window.parent.postMessage({ type: 'BVST_PARAM', id: 128, value: n }, '*');
        }
        
        function updatePlayhead(s) {
            // Remove old current
            document.querySelectorAll('.step.current').forEach(el => el.classList.remove('current'));
            // Add new
            for(let r=0; r<ROWS.length; r++) {
                document.getElementById(`step-${r}-${s}`).classList.add('current');
            }
        }
        
        function clearUI() {
             document.querySelectorAll('.step.current').forEach(el => el.classList.remove('current'));
        }

        // Init with a basic beat
        // Kick on 0, 4, 8, 12
        [0, 4, 8, 12].forEach(s => { gridData[0][s] = true; updateStepUI(0, s); });
        // Snare on 4, 12
        [4, 12].forEach(s => { gridData[1][s] = true; updateStepUI(1, s); });
        // Hat on every 2
        [2, 6, 10, 14].forEach(s => { gridData[2][s] = true; updateStepUI(2, s); });
        // Bass on 0, 3, 8, 11
        [0, 3, 8, 11].forEach(s => { gridData[3][s] = true; updateStepUI(3, s); });
        
    </script>
</body>
</html>
