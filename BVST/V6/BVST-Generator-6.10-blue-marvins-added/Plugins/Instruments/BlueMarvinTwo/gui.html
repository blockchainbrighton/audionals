<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARP 2600 "Blue Marvin" II</title>
    <style>
        :root {
            --bg-color: #3A5F85;
            --panel-border: #8FAAC2;
            --text-color: #E0E0E0;
            --slider-track: #111;
        }

        body {
            background-color: #1a1a1a;
            color: var(--text-color);
            font-family: 'Helvetica', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; user-select: none;
        }

        #synth-container {
            background-color: var(--bg-color);
            border: 8px solid #2a445e;
            border-radius: 6px; padding: 20px;
            box-shadow: 0 0 60px rgba(0,0,0,0.5);
            width: 100%; max-width: 1000px;
        }

        h1 { margin: 0 0 20px 0; font-style: italic; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 10px; }

        #panel-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        .module {
            border: 2px solid var(--panel-border);
            border-radius: 4px; padding: 10px 5px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.1) 100%);
            display: flex; flex-direction: column; align-items: center;
        }

        .module-title {
            font-size: 0.75rem; font-weight: bold; margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.3); width: 90%; text-align: center;
        }

        .control-group {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 10px; flex-grow: 1;
        }

        .slider-wrapper {
            width: 30px; height: 140px;
            display: flex; justify-content: center; align-items: center;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 140px; height: 4px;
            background: transparent;
            transform: rotate(-90deg); cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            background: #000; height: 4px; border: 1px solid #555;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px; width: 12px;
            background: #EEE; border: 1px solid #000; border-radius: 2px;
            margin-top: -11px;
            box-shadow: 1px -1px 3px rgba(0,0,0,0.6);
        }

        label { font-size: 0.6rem; text-transform: uppercase; margin-top: 5px; color: #ccc; }

        select {
            background: #222; color: white; border: 1px solid #8FAAC2;
            padding: 2px; font-size: 0.7rem; margin-bottom: 10px; width: 90%;
        }
        
        .keyboard-area { margin-top: 20px; height: 60px; background: #000; border-top: 4px solid #8FAAC2; }
    </style>
</head>
<body>

    <div id="synth-container">
        <h1>ARP 2600 <span style="font-size:0.7em; font-weight:normal; opacity:0.8;">BLUE MARVIN II</span></h1>

        <div id="panel-grid">
            <!-- VCO 1 -->
            <div class="module">
                <div class="module-title">VCO 1</div>
                <select data-param="1">
                    <option value="0">Sine</option>
                    <option value="1" selected>Saw</option>
                    <option value="2">Square</option>
                    <option value="3">Pulse</option>
                    <option value="4">Tri</option>
                </select>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="-24" max="24" step="1" value="0" data-param="2"></div>
                    <label>Coarse</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="-100" max="100" step="1" value="0" data-param="3"></div>
                    <label>Fine</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0" max="1" step="0.01" value="0.7" data-param="10"></div>
                    <label>Lvl</label>
                </div>
            </div>

            <!-- VCO 2 -->
            <div class="module">
                <div class="module-title">VCO 2</div>
                <select data-param="4">
                    <option value="0">Sine</option>
                    <option value="1">Saw</option>
                    <option value="2" selected>Square</option>
                    <option value="3">Pulse</option>
                    <option value="4">Tri</option>
                </select>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="-24" max="24" step="1" value="0" data-param="5"></div>
                    <label>Coarse</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="-100" max="100" step="1" value="5" data-param="6"></div>
                    <label>Fine</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0" max="1" step="0.01" value="0.7" data-param="11"></div>
                    <label>Lvl</label>
                </div>
            </div>

            <!-- VCO 3 -->
            <div class="module">
                <div class="module-title">VCO 3</div>
                <select data-param="7">
                    <option value="0">Sine</option>
                    <option value="1" selected>Saw</option>
                    <option value="2">Square</option>
                    <option value="3">Pulse</option>
                    <option value="4">Tri</option>
                </select>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="-36" max="12" step="1" value="-12" data-param="8"></div>
                    <label>Coarse</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="-100" max="100" step="1" value="0" data-param="9"></div>
                    <label>Fine</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0" max="1" step="0.01" value="0" data-param="12"></div>
                    <label>Lvl</label>
                </div>
            </div>

            <!-- VCF -->
            <div class="module">
                <div class="module-title">VCF</div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="20" max="12000" value="500" data-param="13"></div>
                    <label>Freq</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0" max="25" step="0.1" value="0" data-param="14"></div>
                    <label>Res</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0" max="5000" step="10" value="1500" data-param="15"></div>
                    <label>Env</label>
                </div>
            </div>

            <!-- ADSR -->
            <div class="module">
                <div class="module-title">Filter ADSR</div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0.001" max="2" step="0.01" value="0.01" data-param="16"></div>
                    <label>A</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0.01" max="2" step="0.01" value="0.4" data-param="17"></div>
                    <label>D</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0" max="1" step="0.01" value="0.2" data-param="18"></div>
                    <label>S</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0.01" max="5" step="0.01" value="0.8" data-param="19"></div>
                    <label>R</label>
                </div>
            </div>

            <!-- AR -->
            <div class="module">
                <div class="module-title">Amp AR</div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0.001" max="2" step="0.01" value="0.01" data-param="20"></div>
                    <label>A</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0.01" max="5" step="0.01" value="0.5" data-param="21"></div>
                    <label>R</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper"><input type="range" min="0" max="1" step="0.01" value="0.8" data-param="22"></div>
                    <label>Vol</label>
                </div>
            </div>
        </div>
        
        <div class="keyboard-area" id="kb-two"></div>
    </div>

    <script type="module">
        import { MidiManager } from '../../../../System/shared/midi.js';
        import { Keyboard } from '../../../../System/shared/keyboard.js';

        function send(id, val) {
            window.parent.postMessage({ type: 'BVST_PARAM', id: id, value: parseFloat(val) }, '*');
        }

        // Bind Controls
        document.querySelectorAll('input, select').forEach(el => {
            // Init
            send(parseInt(el.dataset.param), el.value);
            // Change
            el.addEventListener('input', (e) => send(parseInt(e.target.dataset.param), e.target.value));
        });

        // Keyboard
        const kb = new Keyboard('kb-two', {
            bottom: '0px', color: '#EEE',
            onNoteOn: (n) => send(128, n),
            onNoteOff: (n) => send(129, n)
        });

        // MIDI
        new MidiManager({
            onNoteOn: (n) => kb._handleNoteOn(n),
            onNoteOff: (n) => kb._handleNoteOff(n)
        });
    </script>
</body>
</html>
