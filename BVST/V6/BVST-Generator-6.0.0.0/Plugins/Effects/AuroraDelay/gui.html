<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AuroraDelay</title>
    <style>
        body { margin: 0; padding: 20px; background: #101017; color: #e0f7ff; font-family: monospace; display: flex; justify-content: center; min-height: 100vh; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { BVST } from '../../../../System/shared/plugin_core.js';

        const CONFIG = {
            name: 'AURORA DELAY',
            // Keyboard omitted (Effect plugin)
            modules: [
                {
                    name: 'Delay',
                    controls: [
                        { type: 'knob', id: 'time', label: 'Time (s)', param: 1, min: 0, max: 1, step: 0.01, val: 0.35 },
                        { type: 'knob', id: 'fb', label: 'Feedback', param: 2, min: 0, max: 0.95, step: 0.01, val: 0.35 },
                        { type: 'knob', id: 'mix', label: 'Mix', param: 3, min: 0, max: 1, step: 0.01, val: 0.5 }
                    ]
                },
                {
                    name: 'Tone / Drive',
                    controls: [
                        { type: 'knob', id: 'tone', label: 'Tone (Hz)', param: 4, min: 200, max: 12000, curve: 'log', val: 2500 },
                        { type: 'knob', id: 'drive', label: 'Drive', param: 5, min: 0, max: 1, step: 0.01, val: 0.2 }
                    ]
                },
                {
                    name: 'Width',
                    controls: [
                        { type: 'knob', id: 'width', label: 'Mod Width (s)', param: 6, min: 0, max: 0.05, step: 0.001, val: 0.01 }
                    ]
                }
            ]
        };

        BVST.init(CONFIG);
    </script>
</body>
</html>
