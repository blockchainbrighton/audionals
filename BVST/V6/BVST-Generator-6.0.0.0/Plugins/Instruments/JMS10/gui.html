<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JMS-10</title>
    <style>
        body { margin: 0; padding: 20px; background: #1a1a1a; color: #ccc; display: flex; justify-content: center; min-height: 100vh; font-family: monospace; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';

        const CONFIG = {
            name: "JMS-10",
            keyboard: { startNote: 36, numKeys: 25 },
            modules: [
                {
                    name: "VCO",
                    controls: [
                        { type: 'knob', id: 'wave', label: 'Wave', param: 1, min: 0, max: 3, step: 1, val: 1 },
                        { type: 'knob', id: 'oct', label: 'Scale', param: 2, min: -24, max: 12, step: 12, val: 0 },
                        { type: 'knob', id: 'pwm', label: 'PW', param: 3, min: 0.1, max: 0.9, val: 0.5 }
                    ]
                },
                {
                    name: "VCF",
                    controls: [
                        { type: 'knob', id: 'cut', label: 'Cutoff', param: 4, min: 50, max: 10000, curve: 'log', val: 1000 },
                        { type: 'knob', id: 'peak', label: 'Peak', param: 5, min: 0, max: 9.5, val: 2 },
                        { type: 'knob', id: 'eg_amt', label: 'EG/Ext', param: 6, min: -5000, max: 5000, val: 1000 },
                        { type: 'knob', id: 'mg_amt', label: 'MG/Ext', param: 7, min: 0, max: 2000, val: 0 }
                    ]
                },
                {
                    name: "Modulation Generator",
                    controls: [
                        { type: 'knob', id: 'mg_rate', label: 'Freq', param: 8, min: 0.1, max: 20, val: 3 },
                        { type: 'knob', id: 'mg_wave', label: 'Wave', param: 9, min: 0, max: 1, step: 1, val: 0 },
                        { type: 'knob', id: 'mg_pitch', label: 'FM', param: 10, min: 0, max: 12, val: 0 }
                    ]
                },
                {
                    name: "Envelope Generator",
                    controls: [
                        { type: 'knob', id: 'att', label: 'Attack', param: 11, min: 0.01, max: 3, val: 0.01 },
                        { type: 'knob', id: 'dec', label: 'Decay', param: 12, min: 0.01, max: 3, val: 0.4 },
                        { type: 'knob', id: 'sus', label: 'Sustain', param: 13, min: 0, max: 1, val: 0.5 },
                        { type: 'knob', id: 'rel', label: 'Release', param: 14, min: 0.01, max: 5, val: 0.5 }
                    ]
                },
                {
                    name: "Output",
                    controls: [
                        { type: 'knob', id: 'vol', label: 'Volume', param: 15, min: 0, max: 1, val: 0.6 },
                        { type: 'knob', id: 'glide', label: 'Porta', param: 16, min: 0, max: 1, val: 0.0 }
                    ]
                }
            ]
        };

        BVST.init(CONFIG);
    </script>
</body>
</html>
