<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BlueMarvinTwo</title>
    <style>
        body { margin: 0; padding: 0; background: #111; color: #fff; overflow: hidden; }
        #app-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';

        const CONFIG = {
            name: "Blue Marvin Two",
            midiMap: { note: 128, gate: 129 },
            keyboard: { startNote: 60, numKeys: 25 },
            modules: [
                {
                    name: "VCO 1",
                    controls: [
                        { type: 'select', id: 'vco1_wave', param: 1, options: ["Sine", "Saw", "Square", "Pulse", "Tri"], val: 1 },
                        { type: 'knob', id: 'vco1_coarse', label: 'Coarse', param: 2, min: -24, max: 24, val: 0, step: 1 },
                        { type: 'knob', id: 'vco1_fine', label: 'Fine', param: 3, min: -100, max: 100, val: 0, step: 1 },
                        { type: 'knob', id: 'vco1_lvl', label: 'Lvl', param: 10, min: 0, max: 1, val: 0.7, step: 0.01 }
                    ]
                },
                {
                    name: "VCO 2",
                    controls: [
                        { type: 'select', id: 'vco2_wave', param: 4, options: ["Sine", "Saw", "Square", "Pulse", "Tri"], val: 2 },
                        { type: 'knob', id: 'vco2_coarse', label: 'Coarse', param: 5, min: -24, max: 24, val: 0, step: 1 },
                        { type: 'knob', id: 'vco2_fine', label: 'Fine', param: 6, min: -100, max: 100, val: 5, step: 1 },
                        { type: 'knob', id: 'vco2_lvl', label: 'Lvl', param: 11, min: 0, max: 1, val: 0.7, step: 0.01 }
                    ]
                },
                {
                    name: "VCO 3",
                    controls: [
                        { type: 'select', id: 'vco3_wave', param: 7, options: ["Sine", "Saw", "Square", "Pulse", "Tri"], val: 1 },
                        { type: 'knob', id: 'vco3_coarse', label: 'Coarse', param: 8, min: -36, max: 12, val: -12, step: 1 },
                        { type: 'knob', id: 'vco3_fine', label: 'Fine', param: 9, min: -100, max: 100, val: 0, step: 1 },
                        { type: 'knob', id: 'vco3_lvl', label: 'Lvl', param: 12, min: 0, max: 1, val: 0, step: 0.01 }
                    ]
                },
                {
                    name: "VCF",
                    controls: [
                        { type: 'knob', id: 'vcf_freq', label: 'Freq', param: 13, min: 20, max: 12000, val: 500, step: 10 },
                        { type: 'knob', id: 'vcf_res', label: 'Res', param: 14, min: 0, max: 25, val: 0, step: 0.1 },
                        { type: 'knob', id: 'vcf_env', label: 'Env', param: 15, min: 0, max: 5000, val: 1500, step: 10 }
                    ]
                },
                {
                    name: "Filter ADSR",
                    controls: [
                        { type: 'knob', id: 'adsr_a', label: 'A', param: 16, min: 0.001, max: 2, val: 0.01, step: 0.01 },
                        { type: 'knob', id: 'adsr_d', label: 'D', param: 17, min: 0.01, max: 2, val: 0.4, step: 0.01 },
                        { type: 'knob', id: 'adsr_s', label: 'S', param: 18, min: 0, max: 1, val: 0.2, step: 0.01 },
                        { type: 'knob', id: 'adsr_r', label: 'R', param: 19, min: 0.01, max: 5, val: 0.8, step: 0.01 }
                    ]
                },
                {
                    name: "Amp AR",
                    controls: [
                        { type: 'knob', id: 'ar_a', label: 'A', param: 20, min: 0.001, max: 2, val: 0.01, step: 0.01 },
                        { type: 'knob', id: 'ar_r', label: 'R', param: 21, min: 0.01, max: 5, val: 0.5, step: 0.01 },
                        { type: 'knob', id: 'master_vol', label: 'Vol', param: 22, min: 0, max: 1, val: 0.8, step: 0.01 }
                    ]
                }
            ]
        };

        BVST.init(CONFIG);
    </script>
</body>
</html>
