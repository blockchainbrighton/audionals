<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GrainCloud</title>
    <style>
        body { margin: 0; padding: 0; background: #220033; color: white; overflow: hidden; }
        #app-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';

        const CONFIG = {
            name: "GrainCloud",
            sampler: {
                enabled: true,
                defaults: {
                    grainSize: 0.1,
                    grainPos: 0.5,
                    loopEnabled: false
                },
                // Default seek (sendParam 30) is overridden for Granular
                onSeek: (pct) => {
                    // Update Grain Pos param (0) instead of Seek param (30)
                    BVST.sendParam(0, pct);
                    // Update Sampler UI internal state
                    BVST.sampler.updateParam('grainPos', pct);
                    // Sync 'Pos' Knob
                    BVST.controls.setValue('pos', pct);
                },
                // Custom Parameter Logic (Spread -> GrainSize)
                onControlChange: (id, val, sampler) => {
                    if (id === 'pos') sampler.updateParam('grainPos', val);
                    if (id === 'spread') sampler.updateParam('grainSize', val * 2.0);
                }
            },
            modules: [
                {
                    name: "Cloud Control",
                    controls: [
                        { id: 'pos', type: 'knob', param: 0, min: 0.0, max: 1.0, val: 0.5, label: 'Pos' },
                        { id: 'spread', type: 'knob', param: 1, min: 0.0, max: 0.5, val: 0.1, label: 'Spread' },
                        { id: 'dens', type: 'knob', param: 2, min: 1.0, max: 80.0, val: 20.0, label: 'Dens' },
                        { id: 'size', type: 'knob', param: 3, min: 10.0, max: 500.0, val: 100.0, label: 'Size' }
                    ]
                },
                {
                    name: "Jitter / Speed",
                    controls: [
                        { id: 'jit_sz', type: 'knob', param: 4, min: 0.0, max: 200.0, val: 50.0, label: 'Jit.Size' },
                        { id: 'jit_pi', type: 'knob', param: 5, min: 0.0, max: 1.0, val: 0.0, label: 'Jit.Pch' },
                        { id: 'speed', type: 'knob', param: 6, min: 0.1, max: 2.0, val: 1.0, label: 'Speed' }
                    ]
                },
                {
                    name: "Output",
                    controls: [
                        { id: 'cut', type: 'knob', param: 10, min: 20, max: 20000, val: 20000, label: 'Cutoff', curve: 'log' },
                        { id: 'dly', type: 'knob', param: 23, min: 0.0, max: 0.5, val: 0.0, label: 'Delay' }
                    ]
                }
            ]
        };

        BVST.init(CONFIG);
    </script>
</body>
</html>
