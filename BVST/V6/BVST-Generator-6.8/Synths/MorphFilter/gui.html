<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MorphFilter</title>
    <style>
        body { margin: 0; padding: 20px; background: #202020; color: #eee; display: flex; justify-content: center; min-height: 100vh; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { Controls } from '../../System/shared/controls.js';
        import { Keyboard } from '../../System/shared/keyboard.js';
        import { MidiManager } from '../../System/shared/midi.js';

        const CONFIG = {
            name: "MORPH FILTER",
            modules: [
                {
                    name: "Source",
                    controls: [
                        { type: 'knob', id: 'osc', label: 'Saw', param: 6, min: 0, max: 1, val: 0.5 },
                        { type: 'knob', id: 'noise', label: 'Noise', param: 7, min: 0, max: 1, val: 0.5 }
                    ]
                },
                {
                    name: "Filter",
                    controls: [
                        // 0=LP, 1=HP, 2=BP, 3=Notch
                        { type: 'knob', id: 'mode', label: 'Mode', param: 1, min: 0, max: 3, step: 1, val: 0 }, 
                        { type: 'knob', id: 'cut', label: 'Cutoff', param: 2, min: 40, max: 10000, curve: 'log', val: 1000 },
                        { type: 'knob', id: 'res', label: 'Res', param: 3, min: 0, max: 10, val: 2 }
                    ]
                },
                {
                    name: "LFO",
                    controls: [
                        { type: 'knob', id: 'rate', label: 'Rate', param: 4, min: 0.1, max: 20, val: 1 },
                        { type: 'knob', id: 'depth', label: 'Depth', param: 5, min: 0, max: 5000, val: 1000 }
                    ]
                },
                {
                    name: "Out",
                    controls: [
                        { type: 'knob', id: 'vol', label: 'Level', param: 8, min: 0, max: 1, val: 0.5 }
                    ]
                }
            ]
        };

        const controls = new Controls({
             onChange: (id, val) => {
                 const el = document.getElementById(id);
                 if(el && el.dataset.param) window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
             }
        });

        controls.buildUI('app-container', CONFIG);
        
        // Label update for Filter Mode
        const modeLabel = document.createElement('div');
        modeLabel.id = "mode-display";
        modeLabel.style.textAlign = "center";
        modeLabel.innerText = "LP";
        document.getElementById('mode').parentNode.appendChild(modeLabel);
        
        // Intercept mode change
        const oldChange = controls.onChange;
        controls.onChange = (id, val) => {
            if(id === 'mode') {
                const m = Math.round(val);
                const labels = ["LP", "HP", "BP", "Notch"];
                document.getElementById('mode-display').innerText = labels[m] || "LP";
            }
            oldChange(id, val);
        };

        const kb = new Keyboard('piano', {
            startNote: 24, numKeys: 25, responsive: true,
            onNoteOn: (midi, freq) => {
                window.parent.postMessage({ type: 'BVST_PARAM', id: 26, value: freq }, '*'); 
                window.parent.postMessage({ type: 'BVST_PARAM', id: 27, value: 1.0 }, '*');
            },
            onNoteOff: (midi) => {
                window.parent.postMessage({ type: 'BVST_PARAM', id: 27, value: 0.0 }, '*');
            }
        });

        const midi = new MidiManager({
            deviceSelectorId: 'midi-in',
            statusElementId: 'midi-led',
            onNoteOn: (n) => kb._handleNoteOn(n),
            onNoteOff: (n) => kb._handleNoteOff(n)
        });
        
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'BVST_READY') {
                document.querySelectorAll('[data-param]').forEach(el => {
                     const p = parseInt(el.dataset.param);
                     const v = parseFloat(el.dataset.val);
                     window.parent.postMessage({ type: 'BVST_PARAM', id: p, value: v }, '*');
                });
            }
        });
    </script>
</body>
</html>
