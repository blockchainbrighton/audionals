<!DOCTYPE html>
<html>
<head>
  <title>BVST Plugin GUI</title>
  <style>
    body {
      background: #222;
      color: #eee;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 10px;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      user-select: none;
    }
    h2 { margin: 0 0 10px 0; font-size: 1.2em; color: #0f0; }
    .control-group {
      background: #333;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #444;
    }
    .param-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    label { flex: 1; font-size: 0.9em; }
    input[type=range] {
      flex: 2;
      margin: 0 10px;
      cursor: pointer;
    }
    .value-display {
      width: 50px;
      text-align: right;
      font-family: monospace;
      font-size: 0.9em;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <h2>Loading...</h2>
  </div>

  <script>
    // Communicator with Host
    function sendParam(id, value) {
      window.parent.postMessage({ type: 'BVST_PARAM', id: id, value: value }, '*');
    }

    async function init() {
      const container = document.getElementById('ui-container');
      
      try {
        const res = await fetch('manifest.json');
        const manifest = await res.json();
        
        container.innerHTML = `<h2>${manifest.name}</h2>`;
        
        // --- Synth Selector ---
        const synthList = [
            { id: 0, name: "Alien FM" },
            { id: 1, name: "Saw LPF" },
            { id: 2, name: "PWM" },
            { id: 3, name: "Noise" },
            { id: 4, name: "Additive Bell" },
            { id: 5, name: "Hard Sync" },
            { id: 6, name: "Kick Drum" },
            { id: 7, name: "Super Saw" },
            { id: 8, name: "Wobble Bass" },
            { id: 9, name: "Chiptune" },
            { id: 10, name: "Ring Mod" }
        ];

        const synthRow = document.createElement('div');
        synthRow.className = 'control-group';
        synthRow.style.marginBottom = "15px";
        
        const synthLabel = document.createElement('label');
        synthLabel.innerText = "Select Engine: ";
        synthLabel.style.marginRight = "10px";
        
        const select = document.createElement('select');
        select.style.padding = "5px";
        select.style.borderRadius = "4px";
        
        synthList.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.innerText = s.name;
            select.appendChild(opt);
        });
        
        select.addEventListener('change', (e) => {
            const id = parseInt(e.target.value);
            window.parent.postMessage({ type: 'BVST_SWITCH_SYNTH', id: id }, '*');
        });
        
        synthRow.appendChild(synthLabel);
        synthRow.appendChild(select);
        container.appendChild(synthRow);
        // ---------------------

        if (manifest.parameters && manifest.parameters.length > 0) {
          manifest.parameters.forEach(param => {
            const row = document.createElement('div');
            row.className = 'param-row';
            
            const label = document.createElement('label');
            label.innerText = param.name;
            
            const slider = document.createElement('input');
            slider.type = 'range';
            slider.min = param.min;
            slider.max = param.max;
            slider.step = param.step || (param.max - param.min) / 100;
            slider.value = param.default;
            
            const display = document.createElement('span');
            display.className = 'value-display';
            display.innerText = param.default + (param.unit ? ' ' + param.unit : '');
            
            // Event Listener
            slider.addEventListener('input', (e) => {
              const val = parseFloat(e.target.value);
              display.innerText = val + (param.unit ? ' ' + param.unit : '');
              sendParam(param.id, val);
            });
            
            // Trigger initial value
            // sendParam(param.id, param.default); // Optional: Host might already set default

            row.appendChild(label);
            row.appendChild(slider);
            row.appendChild(display);
            container.appendChild(row);
          });
        } else {
          container.innerHTML += "<p>No parameters defined.</p>";
        }

      } catch (e) {
        container.innerHTML = `<h2>Error</h2><p>${e.message}</p>`;
      }
    }

    init();
  </script>
</body>
</html>
