<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; overflow: hidden; background: #333; color: #fff; font-family: sans-serif; }
  .container { padding: 20px; border: 2px solid #666; height: 100vh; box-sizing: border-box; }
  h3 { margin-top: 0; }
  .control { margin-bottom: 15px; }
  label { display: block; font-size: 0.8em; color: #ccc; margin-bottom: 5px; }
  input[type=range] { width: 100%; }
</style>
</head>
<body>
<div class="container">
  <h3>CUSTOM SYNTH</h3>
  
  <!-- Control 0: Frequency -->
  <div class="control">
    <label>FREQUENCY</label>
    <input type="range" id="p0" min="50" max="1000" value="440">
  </div>

  <!-- Control 1: Gain -->
  <div class="control">
    <label>GAIN</label>
    <input type="range" id="p1" min="0" max="1" step="0.01" value="0.5">
  </div>

</div>
<script>
  // Helper to send parameter updates
  function sendParam(id, value) {
    window.parent.postMessage({ type: 'BVST_PARAM', id: id, value: value }, '*');
  }

  // Attach listeners
  document.getElementById('p0').addEventListener('input', e => sendParam(0, parseFloat(e.target.value)));
  document.getElementById('p1').addEventListener('input', e => sendParam(1, parseFloat(e.target.value)));
</script>
</body>
</html>
