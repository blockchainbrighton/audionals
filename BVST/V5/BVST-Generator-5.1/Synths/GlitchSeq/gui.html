<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GlitchSeq | BVST</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; color: #0f0; display: flex; justify-content: center; min-height: 100vh; font-family: monospace; }
        .bvst-app { border: 2px solid #0f0; background: #050505; }
        .bvst-top-bar { background: #000; border-bottom: 1px solid #0f0; }
        .bvst-title { color: #0f0; font-weight: bold; }
        .knob-outer { border: 1px solid #0f0; background: #000; }
        .knob-track { background: #000; }
        .knob-rotator::after { background: #0f0; }
        .knob-value { color: #0f0; }
        #seq-container { margin-top: 20px; border: 1px dashed #0f0; padding: 10px; }
        .seq-btn { border: 1px solid #080; color: #080; background: #000; }
        .seq-btn.active { background: #0f0; color: #000; }
        .seq-btn.slide.active { background: #f00; color: #fff; } /* Glitch Step */
        .led.current { background: #fff; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { Controls } from '../../System/shared/controls.js';
        import { StepSequencer } from '../../System/shared/sequencer.js';

        const CONFIG = {
            name: "GLITCH SEQ",
            modules: [
                {
                    name: "Chaos",
                    controls: [
                        { type: 'knob', id: 'crush', label: 'BitDec', param: 1, min: 0, max: 1, val: 0.5 },
                        { type: 'knob', id: 'rate', label: 'Rate', param: 2, min: 1, max: 50, val: 10 }
                    ]
                },
                {
                    name: "Master",
                    controls: [
                        { type: 'knob', id: 'vol', label: 'Vol', param: 3, min: 0, max: 1, val: 0.6 },
                        { type: 'button', id: 'btn-play', text: 'RUN' },
                        { type: 'button', id: 'btn-stop', text: 'HALT' },
                        { type: 'knob', id: 'bpm', label: 'BPM', param: 999, min: 60, max: 200, val: 130, step: 1 }
                    ]
                }
            ]
        };

        let isPlaying = false;
        let currentStep = 0;
        let nextNoteTime = 0;
        let bpm = 130;
        let timerId = null;

        const controls = new Controls({
            onChange: (id, val) => {
                if (id === 'btn-play' && val === 1) startSeq();
                if (id === 'btn-stop' && val === 1) stopSeq();
                if (id === 'bpm') bpm = val;
                
                const el = document.getElementById(id);
                if(el && el.dataset.param !== "999") window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
            }
        });

        controls.buildUI('app-container', CONFIG);

        const appRoot = document.getElementById('bvst-app-root');
        const seqDiv = document.createElement('div');
        seqDiv.id = 'seq-container';
        appRoot.appendChild(seqDiv);

        const seq = new StepSequencer('seq-container', {
            numSteps: 16,
            initialSteps: Array(16).fill().map((_, i) => ({
                active: Math.random() > 0.5, 
                note: 'C3', 
                accent: false, 
                slide: Math.random() > 0.8 // Random Glitch steps
            }))
        });

        function startSeq() {
            if(isPlaying) return;
            isPlaying = true;
            currentStep = 0;
            nextNoteTime = performance.now() / 1000;
            schedule();
        }

        function stopSeq() {
            isPlaying = false;
            cancelAnimationFrame(timerId);
            window.parent.postMessage({ type: 'BVST_PARAM', id: 23, value: 0.0 }, '*');
        }

        function schedule() {
            const secPerBeat = 60.0 / bpm;
            const stepTime = secPerBeat / 4; 
            const now = performance.now() / 1000;
            while (nextNoteTime < now + 0.1) {
                runStep(currentStep);
                currentStep = (currentStep + 1) % 16;
                nextNoteTime += stepTime;
            }
            if(isPlaying) timerId = requestAnimationFrame(schedule);
        }

        function mtof(n) {
            const notes = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
            const note = n.slice(0, -1);
            const oct = parseInt(n.slice(-1));
            const semi = notes.indexOf(note);
            const m = 12 + (oct * 12) + semi;
            return 440 * Math.pow(2, (m-69)/12);
        }

        function runStep(idx) {
            seq.highlightStep(idx);
            const s = seq.getStep(idx);
            if(s.active) {
                window.parent.postMessage({ type: 'BVST_PARAM', id: 20, value: mtof(s.note) }, '*');
                window.parent.postMessage({ type: 'BVST_PARAM', id: 22, value: s.slide ? 1.0 : 0.0 }, '*'); // Glitch Mode
                window.parent.postMessage({ type: 'BVST_PARAM', id: 23, value: 1.0 }, '*');
                
                setTimeout(() => {
                    if(isPlaying) window.parent.postMessage({ type: 'BVST_PARAM', id: 23, value: 0.0 }, '*');
                }, 100);
            }
        }

        // --- PRESETS ---
        const PRESETS = {
            "Init": { "crush":0.5, "rate":10, "vol":0.6,
                "sequence": Array(16).fill().map((_, i) => ({ active: Math.random() > 0.5, note: 'C3', accent: false, slide: Math.random() > 0.8 }))
            },
            "Robot Chatter": { "crush":0.2, "rate":30, "vol":0.7,
                "sequence": Array(16).fill().map((_, i) => ({ active: i%2===0, note: 'C3', accent: false, slide: false }))
            },
            "Rhythmic Static": { "crush":0.8, "rate":5, "vol":0.5,
                "sequence": [
                    { active: true, note: 'C3' }, { active: false }, { active: false }, { active: false },
                    { active: true, note: 'C3' }, { active: false }, { active: false }, { active: false },
                    { active: true, note: 'C3' }, { active: false }, { active: false }, { active: false },
                    { active: true, note: 'C3' }, { active: false }, { active: false }, { active: false }
                ]
            },
            "Distorted Drone": { "crush":0.0, "rate":1, "vol":0.8,
                "sequence": [
                    { active: true, note: 'C3' }, { active: true, note: 'C3' }, { active: true, note: 'C3' }, { active: true, note: 'C3' },
                    { active: true, note: 'C3' }, { active: true, note: 'C3' }, { active: true, note: 'C3' }, { active: true, note: 'C3' },
                    { active: true, note: 'C3' }, { active: true, note: 'C3' }, { active: true, note: 'C3' }, { active: true, note: 'C3' },
                    { active: true, note: 'C3' }, { active: true, note: 'C3' }, { active: true, note: 'C3' }, { active: true, note: 'C3' }
                ]
            },
            "Digital Clicks": { "crush":1.0, "rate":40, "vol":0.4,
                "sequence": Array(16).fill().map((_, i) => ({ active: Math.random() > 0.7, note: 'C3', accent: false, slide: false }))
            },
            "Broken Record": { "crush":0.9, "rate":2, "vol":0.6,
                "sequence": [
                    { active: true, note: 'C3' }, { active: true, note: 'C3', slide:true }, { active: false }, { active: false },
                    { active: true, note: 'C3' }, { active: true, note: 'C3', slide:true }, { active: false }, { active: false },
                    { active: true, note: 'C3' }, { active: true, note: 'C3', slide:true }, { active: false }, { active: false },
                    { active: true, note: 'C3' }, { active: true, note: 'C3', slide:true }, { active: false }, { active: false }
                ]
            },
            "Ambience": { "crush":0.1, "rate":0.5, "vol":0.3,
                "sequence": Array(16).fill().map((_, i) => ({ active: true, note: 'C3', accent: false, slide: false }))
            }
        };

        const pSel = controls.uiRefs.presetSelector;
        Object.keys(PRESETS).forEach(k => {
            const o = document.createElement('option'); o.value = k; o.innerText = k; pSel.appendChild(o);
        });

        pSel.addEventListener('change', (e) => {
            const p = PRESETS[e.target.value];
            if(!p) return;
            for(const [id, val] of Object.entries(p)) {
                if (id === "sequence") {
                    seq.setSequence(val); // Update sequencer steps
                } else {
                    controls.setValue(id, val);
                    const el = document.getElementById(id);
                    if(el) window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
                }
            }
        });

        // Init Preset
        pSel.value = 'Init';
        pSel.dispatchEvent(new Event('change'));
    </script>
</body>
</html>
