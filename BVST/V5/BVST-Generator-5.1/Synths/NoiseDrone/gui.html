<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NoiseDrone | BVST</title>
    <style>
        body { margin: 0; padding: 20px; background: #333; color: #ddd; display: flex; justify-content: center; min-height: 100vh; }
        /* Industrial Look */
        .bvst-app { border: 3px solid #555; background: #444; border-radius: 2px; box-shadow: inset 0 0 20px #000; }
        .bvst-top-bar { background: #222; border-bottom: 1px solid #555; }
        .bvst-title { font-family: Impact, sans-serif; letter-spacing: 2px; color: #aaa; }
        
        .knob-outer { border-radius: 2px; background: #222; border: 1px solid #111; }
        .knob-track { border-radius: 2px; background: #333; }
        .knob-rotator::after { background: #f50; width: 3px; }
        .knob-value { color: #f50; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { Controls } from '../../System/shared/controls.js';
        import { Keyboard } from '../../System/shared/keyboard.js';
        import { MidiManager } from '../../System/shared/midi.js';

        const CONFIG = {
            name: "NOISE DRONE",
            modules: [
                {
                    name: "LFO",
                    controls: [
                        { type: 'knob', id: 'rate', label: 'Rate', param: 1, min: 0.1, max: 10, val: 1 },
                        { type: 'knob', id: 'depth', label: 'Depth', param: 2, min: 0, max: 5000, val: 1000 }
                    ]
                },
                {
                    name: "FILTER",
                    controls: [
                        { type: 'knob', id: 'cut', label: 'Freq', param: 3, min: 50, max: 5000, curve: 'log', val: 1000 },
                        { type: 'knob', id: 'res', label: 'Res', param: 4, min: 0, max: 8, val: 4 }
                    ]
                },
                {
                    name: "DIRT",
                    controls: [
                        { type: 'knob', id: 'dist', label: 'Dist', param: 5, min: 0, max: 1, val: 0.2 },
                        { type: 'knob', id: 'vol', label: 'Out', param: 6, min: 0, max: 1, val: 0.5 }
                    ]
                }
            ]
        };

        const controls = new Controls({
             onChange: (id, val) => {
                 const el = document.getElementById(id);
                 if(el && el.dataset.param) window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
             }
        });

        controls.buildUI('app-container', CONFIG);
        
        // Drone needs a trigger, let's use a big button or just keyboard
        // Using keyboard allows "gating" the drone
        const kb = new Keyboard('piano', {
            startNote: 36, numKeys: 12, responsive: true,
            onNoteOn: (m) => {
                // Pitch doesn't matter for noise, just gate
                window.parent.postMessage({ type: 'BVST_PARAM', id: 27, value: 1.0 }, '*');
            },
            onNoteOff: (m) => {
                 if(kb.activeKeys.length === 0)
                    window.parent.postMessage({ type: 'BVST_PARAM', id: 27, value: 0.0 }, '*');
            }
        });
        
        new MidiManager({
            deviceSelectorId: 'midi-in', statusElementId: 'midi-led',
            onNoteOn: (n) => kb._handleNoteOn(n), onNoteOff: (n) => kb._handleNoteOff(n)
        });

        // --- PRESETS ---
        const PRESETS = {
            "Init": { "rate":1.0, "depth":1000, "cut":1000, "res":4.0, "dist":0.2, "vol":0.5 },
            "Slow Sweep": { "rate":0.2, "depth":4000, "cut":500, "res":6.0, "dist":0.1, "vol":0.6 },
            "Alarm": { "rate":8.0, "depth":2000, "cut":2000, "res":2.0, "dist":0.4, "vol":0.5 },
            "Harsh Noise": { "rate":5.0, "depth":5000, "cut":4000, "res":8.0, "dist":1.0, "vol":0.4 },
            "Rumble": { "rate":0.5, "depth":500, "cut":100, "res":1.0, "dist":0.6, "vol":0.7 },
            "Static": { "rate":10.0, "depth":100, "cut":5000, "res":0.0, "dist":0.0, "vol":0.3 },
            "Resonant Wind": { "rate":1.0, "depth":2000, "cut":800, "res":7.5, "dist":0.0, "vol":0.5 },
        };

        const pSel = controls.uiRefs.presetSelector;
        Object.keys(PRESETS).forEach(k => {
            const o = document.createElement('option'); o.value = k; o.innerText = k; pSel.appendChild(o);
        });

        pSel.addEventListener('change', (e) => {
            const p = PRESETS[e.target.value];
            if(!p) return;
            for(const [id, val] of Object.entries(p)) {
                controls.setValue(id, val);
                const el = document.getElementById(id);
                if(el) window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
            }
        });

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'BVST_READY') {
                pSel.value = 'Init';
                pSel.dispatchEvent(new Event('change'));
            }
        });
    </script>
</body>
</html>
