<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DarkPad | BVST</title>
    <style>
        body { margin: 0; padding: 20px; background: #0a0a0f; color: #aab; display: flex; justify-content: center; min-height: 100vh; }
        /* Custom overrides for DarkPad look */
        .bvst-app { border-color: #4a4a6a; box-shadow: 0 0 50px rgba(50,50,100,0.2); }
        .bvst-top-bar { background: #111; border-bottom: 1px solid #333; }
        .bvst-title { color: #6d6d9e; text-shadow: 0 0 10px #4a4a6a; }
        .knob-rotator::after { background: #7b7ba6; }
        .knob-value { color: #7b7ba6; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { Controls } from '../../System/shared/controls.js';
        import { Keyboard } from '../../System/shared/keyboard.js';
        import { MidiManager } from '../../System/shared/midi.js';

        const CONFIG = {
            name: "DARK PAD",
            modules: [
                {
                    name: "Oscillators",
                    controls: [
                        { type: 'knob', id: 'detune', label: 'Detune', param: 1, min: 0, max: 0.05, val: 0.01 }
                    ]
                },
                {
                    name: "Filter",
                    controls: [
                        { type: 'knob', id: 'cut', label: 'Cutoff', param: 2, min: 50, max: 5000, curve: 'log', val: 800 },
                        { type: 'knob', id: 'res', label: 'Resonance', param: 3, min: 0, max: 5, val: 0.5 }
                    ]
                },
                {
                    name: "Envelope",
                    controls: [
                        { type: 'slider', id: 'attack', label: 'Slow Atk', param: 4, min: 0.1, max: 5.0, val: 1.5 },
                        { type: 'slider', id: 'release', label: 'Long Rel', param: 5, min: 0.1, max: 5.0, val: 2.0 }
                    ]
                },
                {
                    name: "Space",
                    controls: [
                        { type: 'knob', id: 'delay', label: 'Echo', param: 6, min: 0, max: 0.8, val: 0.5 },
                        { type: 'knob', id: 'vol', label: 'Volume', param: 7, min: 0, max: 1, val: 0.5 }
                    ]
                }
            ]
        };

        const controls = new Controls({
             onChange: (id, val) => {
                 const el = document.getElementById(id);
                 if(el && el.dataset.param) window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
             }
        });

        // 1. Build UI
        controls.buildUI('app-container', CONFIG);
        
        // 2. Keyboard
        const kb = new Keyboard('piano', {
            startNote: 36, numKeys: 37, responsive: true,
            onNoteOn: (m) => {
                window.parent.postMessage({ type: 'BVST_PARAM', id: 26, value: 440 * Math.pow(2, (m-69)/12) }, '*');
                window.parent.postMessage({ type: 'BVST_PARAM', id: 27, value: 1.0 }, '*');
            },
            onNoteOff: (m) => {
                 if(kb.activeKeys.length === 0)
                    window.parent.postMessage({ type: 'BVST_PARAM', id: 27, value: 0.0 }, '*');
            }
        });
        
        // 3. Midi
        new MidiManager({
            deviceSelectorId: 'midi-in', statusElementId: 'midi-led',
            onNoteOn: (n) => kb._handleNoteOn(n), onNoteOff: (n) => kb._handleNoteOff(n)
        });

        // --- PRESETS ---
        const PRESETS = {
            "Init": { "detune":0.01, "cut":800, "res":0.5, "attack":1.5, "release":2.0, "delay":0.5, "vol":0.5 },
            "Deep Space": { "detune":0.03, "cut":300, "res":2.0, "attack":3.0, "release":4.0, "delay":0.7, "vol":0.6 },
            "Bright Pad": { "detune":0.005, "cut":4000, "res":0.1, "attack":0.5, "release":1.0, "delay":0.2, "vol":0.4 },
            "Wobble Pad": { "detune":0.05, "cut":600, "res":3.5, "attack":1.0, "release":1.5, "delay":0.4, "vol":0.5 },
            "Ghostly": { "detune":0.02, "cut":150, "res":4.0, "attack":4.0, "release":3.0, "delay":0.8, "vol":0.7 },
            "Organ-ish": { "detune":0.0, "cut":2000, "res":0.0, "attack":0.1, "release":0.2, "delay":0.1, "vol":0.6 },
            "Swell": { "detune":0.02, "cut":500, "res":1.0, "attack":5.0, "release":0.5, "delay":0.6, "vol":0.5 }
        };

        const pSel = controls.uiRefs.presetSelector;
        Object.keys(PRESETS).forEach(k => {
            const o = document.createElement('option'); o.value = k; o.innerText = k; pSel.appendChild(o);
        });

        pSel.addEventListener('change', (e) => {
            const p = PRESETS[e.target.value];
            if(!p) return;
            for(const [id, val] of Object.entries(p)) {
                controls.setValue(id, val);
                const el = document.getElementById(id);
                if(el) window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
            }
        });

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'BVST_READY') {
                pSel.value = 'Init';
                pSel.dispatchEvent(new Event('change'));
            }
        });
    </script>
</body>
</html>
