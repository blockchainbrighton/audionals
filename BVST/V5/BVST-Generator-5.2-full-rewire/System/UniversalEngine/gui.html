<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Tester</title>
    <style>
        body { background: #222; display: flex; justify-content: center; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { Controls } from '../../System/shared/controls.js';
        import { Keyboard } from '../../System/shared/keyboard.js';
        import { MidiManager } from '../../System/shared/midi.js';

        const CONFIG = {
            name: "UNIVERSAL CORE",
            modules: [
                {
                    name: "Oscillator 1",
                    controls: [
                        { type: 'select', id: 'o1w', param: 0, options: ['Sin','Saw','Sqr','Pls','Tri','Nse'], val: 1 },
                        { type: 'knob', id: 'o1s', label: 'Semi', param: 1, min: -24, max: 24, step: 1, val: 0 },
                        { type: 'knob', id: 'o1d', label: 'Fine', param: 2, min: -1, max: 1, val: 0 },
                        { type: 'knob', id: 'o1p', label: 'PW', param: 3, min: 0.1, max: 0.9, val: 0.5 }
                    ]
                },
                {
                    name: "Oscillator 2",
                    controls: [
                        { type: 'select', id: 'o2w', param: 10, options: ['Sin','Saw','Sqr','Pls','Tri','Nse'], val: 2 },
                        { type: 'knob', id: 'o2s', label: 'Semi', param: 11, min: -24, max: 24, step: 1, val: 0 },
                        { type: 'knob', id: 'o2d', label: 'Fine', param: 12, min: -1, max: 1, val: 0 },
                        { type: 'knob', id: 'o2p', label: 'PW', param: 13, min: 0.1, max: 0.9, val: 0.5 }
                    ]
                },
                {
                    name: "Mixer",
                    controls: [
                        { type: 'knob', id: 'm1', label: 'Osc1', param: 20, min: 0, max: 1, val: 1 },
                        { type: 'knob', id: 'm2', label: 'Osc2', param: 21, min: 0, max: 1, val: 0 },
                        { type: 'knob', id: 'mn', label: 'Noise', param: 22, min: 0, max: 1, val: 0 }
                    ]
                },
                {
                    name: "Filter",
                    controls: [
                        { type: 'knob', id: 'cut', label: 'Cut', param: 30, min: 50, max: 20000, curve: 'log', val: 20000 },
                        { type: 'knob', id: 'res', label: 'Res', param: 31, min: 0, max: 8, val: 0.5 },
                        { type: 'knob', id: 'env2cut', label: 'EnvMod', param: 32, min: 0, max: 1, val: 0 },
                        { type: 'knob', id: 'lfo2cut', label: 'LFOMod', param: 33, min: 0, max: 1, val: 0 }
                    ]
                },
                {
                    name: "Amp Env",
                    controls: [
                        { type: 'slider', id: 'aa', label: 'A', param: 40, min: 0.01, max: 2, val: 0.01 },
                        { type: 'slider', id: 'ad', label: 'D', param: 41, min: 0.01, max: 2, val: 0.1 },
                        { type: 'slider', id: 'as', label: 'S', param: 42, min: 0, max: 1, val: 1 },
                        { type: 'slider', id: 'ar', label: 'R', param: 43, min: 0.01, max: 4, val: 0.1 }
                    ]
                },
                {
                    name: "Effects",
                    controls: [
                        { type: 'knob', id: 'drv', label: 'Drive', param: 70, min: 0, max: 1, val: 0 },
                        { type: 'knob', id: 'dly', label: 'DlyMix', param: 72, min: 0, max: 0.8, val: 0 },
                        { type: 'knob', id: 'vol', label: 'Vol', param: 73, min: 0, max: 1, val: 0.5 }
                    ]
                }
            ]
        };

        const controls = new Controls({
             onChange: (id, val) => {
                 const el = document.getElementById(id);
                 if(el && el.dataset.param) window.parent.postMessage({ type: 'BVST_PARAM', id: parseInt(el.dataset.param), value: val }, '*');
             }
        });
        controls.buildUI('app-container', CONFIG);
        
        const kb = new Keyboard('piano', {
            startNote: 36, numKeys: 49, responsive: true,
            onNoteOn: (m) => window.parent.postMessage({ type: 'BVST_PARAM', id: 128, value: m }, '*'),
            onNoteOff: (m) => window.parent.postMessage({ type: 'BVST_PARAM', id: 129, value: m }, '*')
        });
        
        new MidiManager({
            deviceSelectorId: 'midi-in', statusElementId: 'midi-led',
            onNoteOn: (n) => kb._handleNoteOn(n), onNoteOff: (n) => kb._handleNoteOff(n)
        });
        
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'BVST_READY') {
                // Send init
                window.parent.postMessage({ type: 'BVST_PARAM', id: 73, value: 0.5 }, '*');
            }
        });
    </script>
</body>
</html>
