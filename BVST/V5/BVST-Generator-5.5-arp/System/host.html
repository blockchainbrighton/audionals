<!DOCTYPE html>
<html>
<head>
    <title>BVST Studio</title>
    <style>
        /* Combined Styles */
        body { background: #1a1a1a; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        
        /* Launcher Styles */
        .launcher-container { text-align: center; padding: 40px; background: #2a2a2a; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-top: 10vh; transition: opacity 0.5s; }
        .launcher-container.hidden { display: none; opacity: 0; }
        
        /* Host/Rack Styles */
        .host-container { width: 100%; max-width: 1024px; text-align: center; display: none; opacity: 0; transition: opacity 0.5s; }
        .host-container.visible { display: block; opacity: 1; }
        
        h1 { margin-top: 0; color: #0f0; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 20px; }
        
        /* Inputs & Buttons */
        select { padding: 10px; font-size: 16px; width: 200px; border: none; border-radius: 4px; background: #333; color: white; outline: none; cursor: pointer; }
        select:focus { background: #444; }
        
        button { padding: 10px 20px; font-size: 16px; background: #0f0; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s, transform 0.1s; margin-left: 10px; }
        button:hover { background: #4f4; transform: scale(1.05); }
        button:active { transform: scale(0.95); }

        /* Rack Area */
        #rack { margin-top: 20px; }
        #rack iframe { border: none; width: 100%; height: 500px; background: #222; border-radius: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        #status { font-family: monospace; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- LAUNCHER SECTION -->
    <div class="launcher-container" id="launcher">
        <h1>BVST Studio</h1>
        <p>Select a synth to load:</p>
        <select id="synthName">
            <option value="">Loading...</option>
        </select>
        <br><br>
        <label style="color: #aaa; font-size: 14px;">
            <input type="checkbox" id="useMic"> Enable Audio Input (Microphone/FX Mode)
        </label>
        <br><br>
        <button onclick="launch()">Launch</button>
        <p id="launcherError" style="color: #f44; display: none; margin-top: 10px;"></p>
    </div>

    <!-- HOST SECTION -->
    <div class="host-container" id="host">
        <h1 id="hostTitle">Synth Name</h1>
        <div id="rack"></div>
        <div id="status">Initializing...</div>
        <button onclick="reset()" style="margin-top: 20px; background: #444; color: #ccc;">Back to Menu</button>
    </div>

    <script>
        let audioCtx;
        let workletNode;
        let paramListener = null;
        let guiFrame = null;
        let engineReady = false;

        function notifyGuiReady() {
            if (guiFrame && guiFrame.contentWindow && engineReady) {
                guiFrame.contentWindow.postMessage({ type: 'BVST_READY' }, '*');
            }
        }

        // Allow Enter key
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !document.getElementById('launcher').classList.contains('hidden')) {
                launch();
            }
        });

        // Populate Dropdown
        async function populateSynths() {
            const select = document.getElementById('synthName');
            try {
                const res = await fetch('/api/synths');
                if (!res.ok) throw new Error('Failed to fetch synths');
                const synths = await res.json();
                
                select.innerHTML = ''; // Clear "Loading..."
                if (synths.length === 0) {
                    const opt = document.createElement('option');
                    opt.text = "No Synths Found";
                    select.add(opt);
                    select.disabled = true;
                } else {
                    synths.forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.text = name;
                        select.add(opt);
                    });
                    
                    // Check for URL param to auto-select
                    const urlParams = new URLSearchParams(window.location.search);
                    const urlSynth = urlParams.get('synth');
                    if (urlSynth && synths.includes(urlSynth)) {
                        select.value = urlSynth;
                        // Update button to show context
                        document.querySelector('#launcher button').innerText = `Launch ${urlSynth}`;
                    }
                }
            } catch (e) {
                console.error(e);
                select.innerHTML = '<option>Error loading synths</option>';
            }
        }

        // Init Dropdown
        populateSynths();

        // Update button text on change
        document.getElementById('synthName').addEventListener('change', function() {
            const name = this.value;
            if (name) {
                document.querySelector('#launcher button').innerText = `Launch ${name}`;
            }
        });

        async function launch() {
            const name = document.getElementById('synthName').value;
            if (!name) return;
            engineReady = false;

            // Disconnect any previous node to avoid layered audio
            if (workletNode) {
                try { workletNode.disconnect(); } catch (_) {}
                workletNode = null;
            }

            // 1. UI Transition
            document.getElementById('launcher').classList.add('hidden');
            document.getElementById('host').classList.add('visible');
            document.getElementById('hostTitle').innerText = name;
            document.getElementById('status').innerText = "Initializing Audio Engine...";
            document.getElementById('launcherError').style.display = 'none';

            // Correct path logic: We are in System/, so Synths are in ../Synths/
            const synthPath = `../Synths/${name}`;

            try {
                // 2. Initialize Audio Context (Must be done here to capture user gesture)
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } else if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                // 3. Fetch Manifest
                const manifestUrl = `${synthPath}/manifest.json`;
                const manifestReq = await fetch(manifestUrl);
                if (!manifestReq.ok) throw new Error(`Manifest not found for '${name}'`);
                const manifest = await manifestReq.json();

                // 4. Load Processor (Generated Artifact)
                const glueUrl = `${synthPath}/processor.js?t=` + Date.now();
                
                try {
                    await audioCtx.audioWorklet.addModule(glueUrl);
                } catch (e) {
                    throw new Error(`Failed to load processor.js: ${e.message}`);
                }

                // 5. Create Worklet Node
                try {
                    workletNode = new AudioWorkletNode(audioCtx, 'bvst-processor', {
                        numberOfInputs: 1,
                        numberOfOutputs: 1,
                        outputChannelCount: [2] // Stereo output
                    });
                } catch (e) {
                    throw new Error(`Failed to create AudioWorkletNode: ${e.message}`);
                }

                // 6. Handle Audio Input (If requested)
                const useMic = document.getElementById('useMic').checked;
                if (useMic) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const source = audioCtx.createMediaStreamSource(stream);
                        source.connect(workletNode);
                        console.log("Microphone connected to plugin.");
                    } catch (err) {
                        console.warn("Microphone access denied or failed:", err);
                        alert("Microphone access failed. Plugin will run without input.");
                    }
                }

                // 7. Fetch WASM
                const wasmUrl = `${synthPath}/${manifest.components.audio_engine}`;
                const wasmReq = await fetch(wasmUrl);
                if (!wasmReq.ok) throw new Error(`WASM file not found: ${wasmUrl}`);
                const wasmBytes = await wasmReq.arrayBuffer();

                // 7. Init WASM
                workletNode.port.postMessage({ type: 'INIT_WASM', wasmBytes: wasmBytes });

                // 8. Connect to Output
                workletNode.connect(audioCtx.destination);

                // 9. Load GUI
                guiFrame = document.createElement('iframe');
                guiFrame.onload = () => notifyGuiReady();
                guiFrame.src = `${synthPath}/${manifest.components.ui_html}`;
                document.getElementById('rack').innerHTML = '';
                document.getElementById('rack').appendChild(guiFrame);

                // 10. Setup Communication
                // From UI to Audio
                if (paramListener) {
                    window.removeEventListener('message', paramListener);
                }
                paramListener = (event) => {
                    if (event.data.type === 'BVST_PARAM' && workletNode) {
                        workletNode.port.postMessage({ type: 'PARAM', id: event.data.id, value: event.data.value });
                    }
                };
                window.addEventListener('message', paramListener);

                // From Audio to Host (Status/Errors)
                workletNode.port.onmessage = (e) => {
                    if (e.data.type === 'READY') {
                        engineReady = true;
                        document.getElementById('status').innerText = `Running: ${name}`;
                        document.getElementById('status').style.color = '#0f0';
                        notifyGuiReady();
                    } else if (e.data.type === 'ERROR') {
                        document.getElementById('status').innerText = "Error: " + e.data.error;
                        document.getElementById('status').style.color = '#f44';
                    }
                };
                
                // Update URL without reloading
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('synth', name);
                window.history.pushState({}, '', newUrl);

            } catch (e) {
                console.error(e);
                // Show error in rack area or go back
                document.getElementById('status').innerText = "Launch Failed: " + e.message;
                document.getElementById('status').style.color = '#f44';
            }
        }

        function reset() {
            // Simple reset: reload page to clear audio context and state cleanly
            // Remove query param to go back to clean state
            const newUrl = new URL(window.location);
            newUrl.searchParams.delete('synth');
            window.location.href = newUrl.toString();
        }
    </script>
</body>
</html>
