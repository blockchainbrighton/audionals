<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.A.M. - Blockchain Audional Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&display=swap');

        :root {
            --neon: #39ff14;
            --dark-glow: #054d05;
            --bg: #000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier Prime', monospace;
        }

        /* Letterbox Container */
        .letterbox {
            width: 100%;
            max-width: 1200px;
            height: 300px;
            background-color: var(--bg);
            position: relative;
            overflow: hidden;
            border-top: 2px solid #1a1a1a;
            border-bottom: 2px solid #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Scanline CRT Effect */
        .crt {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* Batman Style Explosion Star */
        .explosion-graphic {
            position: absolute;
            width: 450px;
            height: 450px;
            background: var(--neon);
            clip-path: polygon(50% 0%, 61% 35%, 98% 30%, 75% 50%, 91% 91%, 50% 75%, 9% 91%, 25% 50%, 2% 30%, 39% 35%);
            opacity: 0;
            transform: scale(0);
            z-index: 1;
            filter: blur(2px);
        }

        /* Text Layout Logic */
        .bam-container {
            display: flex;
            justify-content: center;
            align-items: baseline;
            z-index: 5;
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon), 0 0 20px var(--dark-glow);
            font-size: 4.5rem;
            transition: all 0.5s ease;
        }

        .word {
            display: flex;
            align-items: baseline;
        }

        /* The Dots in B.A.M. */
        .dot {
            display: inline-block;
            opacity: 1;
            width: auto;
            transition: all 0.2s ease;
        }

        .suffix {
            display: inline-block;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            white-space: nowrap;
            font-size: 2.2rem;
            text-transform: uppercase;
            transition: max-width 0.8s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.3s ease;
        }

        /* Animation Classes Triggered by JS */
        
        /* 1. Hide the dots */
        .is-exploded .dot {
            opacity: 0;
            width: 0;
            margin: 0;
            transform: scale(0);
        }

        /* 2. Show the suffixes */
        .is-exploded .suffix {
            opacity: 1;
            margin-right: 25px; /* Spacing between full words */
        }
        
        .is-exploded #s-b { max-width: 350px; }
        .is-exploded #s-a { max-width: 300px; }
        .is-exploded #s-m { max-width: 250px; }

        /* Flash & Shake */
        .flash {
            position: absolute;
            width: 100%; height: 100%;
            background: #fff; opacity: 0; z-index: 20; pointer-events: none;
        }

        @keyframes shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(-8px, 4px); }
            50% { transform: translate(8px, -4px); }
            75% { transform: translate(-4px, -8px); }
            100% { transform: translate(0,0); }
        }
        .shake-effect { animation: shake 0.15s ease-in-out 3; }

    </style>
</head>
<body>

    <div class="letterbox" id="viewport">
        <div class="crt"></div>
        <div class="flash" id="flash"></div>
        <div class="explosion-graphic" id="boom"></div>

        <div class="bam-container" id="bam-main">
            <div class="word">
                <span>B</span><span class="dot">.</span><span class="suffix" id="s-b">lockchain</span>
            </div>
            <div class="word">
                <span>A</span><span class="dot">.</span><span class="suffix" id="s-a">udional</span>
            </div>
            <div class="word">
                <span>M</span><span class="dot">.</span><span class="suffix" id="s-m">atrix</span>
            </div>
        </div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const boom = document.getElementById('boom');
        const flash = document.getElementById('flash');

        function runAnimation() {
            // Step 1: Initial Wait
            setTimeout(() => {
                
                // Trigger Visual Explosion
                boom.style.transition = 'none';
                boom.style.transform = 'scale(0) rotate(0deg)';
                boom.style.opacity = '1';
                
                void boom.offsetWidth; // Force Reflow

                // Animate Explosion Star
                boom.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-out';
                boom.style.transform = 'scale(1.8) rotate(15deg)';
                
                // Screen Effects
                flash.style.opacity = '0.7';
                viewport.classList.add('shake-effect');

                // Step 2: Swap BAM. for Full Words
                setTimeout(() => {
                    viewport.classList.add('is-exploded');
                    flash.style.opacity = '0';
                    boom.style.opacity = '0';
                    boom.style.transform = 'scale(2.5) rotate(-10deg)';
                }, 100);

                // Clean up shake
                setTimeout(() => {
                    viewport.classList.remove('shake-effect');
                }, 500);

            }, 1200);
        }

        window.onload = runAnimation;

        // Replay on click
        document.body.onclick = () => {
            viewport.classList.remove('is-exploded');
            boom.style.opacity = '0';
            boom.style.transform = 'scale(0)';
            runAnimation();
        };
    </script>
</body>
</html>
