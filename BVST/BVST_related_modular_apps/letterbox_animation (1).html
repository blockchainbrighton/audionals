<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockchain Audional Matrix Animation</title>
<style>
  /* Basic reset and background */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Scene: letterbox container */
  #scene {
    position: relative;
    width: 100vw;
    height: 40vh; /* letterbox aspect */
    overflow: hidden;
  }

  /* Explosion graphic using repeating conic gradient to create a starburst */
  #explosion {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40vh;
    height: 40vh;
    margin-left: -20vh;
    margin-top: -20vh;
    background-image: repeating-conic-gradient(
      from 0deg,
      rgba(0, 255, 0, 0.8) 0deg 10deg,
      rgba(0, 60, 0, 0.8) 10deg 20deg
    );
    border-radius: 50%;
    opacity: 0;
    transform: scale(0);
    animation: explode 1.4s ease-out forwards;
    pointer-events: none;
  }

  /* Keyframes for the explosion: scale up and fade out */
  @keyframes explode {
    0% { transform: scale(0); opacity: 1; }
    40% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  /* Retro scanline overlay */
  #scanlines {
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 255, 0, 0.1) 0px,
      rgba(0, 255, 0, 0.1) 2px,
      rgba(0, 0, 0, 0.15) 2px,
      rgba(0, 0, 0, 0.15) 4px
    );
    opacity: 0.5;
  }

  /* BAM text container */
  #bam {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    font-family: "Courier New", Courier, monospace;
    color: #00ff00;
    text-shadow: 0 0 10px #00ff00;
    opacity: 0;
    transition: opacity 0.5s ease-out;
  }

  /* Each letter block */
  #bam .letter {
    display: inline-block;
    position: relative;
    padding: 0 1vw;
    /* Reduce the size of the main letters so the final words fit within
       the letterbox. A smaller font-size (8vw) keeps the letters
       legible while leaving room for the rest of each word. */
    font-size: 8vw;
    transition: transform 1s cubic-bezier(0.5, 1.2, 0.2, 1);
  }

  /* Smaller font for the remainder of each word */
  #bam .letter .full {
    display: inline-block;
    opacity: 0;
    margin-left: 0.3vw;
    /* Make the remainder of each word smaller. A 3vw font-size allows
       "Blockchain", "Audional" and "Matrix" to appear within the
       letterbox without overflowing. */
    font-size: 3vw;
    vertical-align: baseline;
    transition: opacity 1s ease-in;
  }

  /* When split class is added, move the letters apart */
  #bam.split .letter:nth-child(1) { /* B */
    /* Move the first letter slightly to the left. A small shift (‑6vw)
       keeps all three words within the letterbox. */
    transform: translateX(-6vw);
  }
  #bam.split .letter:nth-child(2) { /* A stays roughly center */
    transform: translateX(0);
  }
  #bam.split .letter:nth-child(3) { /* M */
    /* Move the last letter slightly to the right by the same amount */
    transform: translateX(6vw);
  }

  /* Reveal the full words when split class is present */
  #bam.split .letter .full {
    opacity: 1;
  }
</style>
</head>
<body>
  <div id="scene">
    <div id="explosion"></div>
    <div id="bam">
      <span class="letter"><span class="char">B</span><span class="full">lockchain</span></span>
      <span class="letter"><span class="char">A</span><span class="full">udional</span></span>
      <span class="letter"><span class="char">M</span><span class="full">atrix</span></span>
    </div>
    <div id="scanlines"></div>
  </div>

<script>
  // Orchestrate the timing of the animation
  document.addEventListener('DOMContentLoaded', function () {
    const bam = document.getElementById('bam');

    // Fade in the text slightly after the explosion begins
    setTimeout(function () {
      bam.style.opacity = 1;
    }, 300);

    // Add the split class after the explosion has played
    setTimeout(function () {
      bam.classList.add('split');
    }, 1500);
  });
</script>
</body>
</html>
