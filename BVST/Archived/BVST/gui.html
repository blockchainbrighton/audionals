<style>
  body { margin: 0; overflow: hidden; }
  .bvst-face {
    background: #222; border: 2px solid #555; padding: 20px;
    width: 100%; height: 100%; box-sizing: border-box;
    color: #fff; font-family: monospace;
  }
  .knob-group { margin-bottom: 15px; }
  label { display: block; font-size: 12px; color: #aaa; }
  input[type=range] { width: 100%; }
</style>
<div class="bvst-face">
  <h3 style="margin-top:0">SATOSHI SAW</h3>
  <div class="knob-group">
    <label>FREQUENCY</label>
    <input type="range" id="freq" min="50" max="1000" value="440">
  </div>
  <div class="knob-group">
    <label>GAIN</label>
    <input type="range" id="gain" min="0" max="1" step="0.01" value="0.5">
  </div>
</div>
<script>
  const freq = document.getElementById('freq');
  const gain = document.getElementById('gain');
  freq.addEventListener('input', (e) => window.parent.postMessage({ type: 'BVST_PARAM', id: 0, value: parseFloat(e.target.value) }, '*'));
  gain.addEventListener('input', (e) => window.parent.postMessage({ type: 'BVST_PARAM', id: 1, value: parseFloat(e.target.value) }, '*'));
</script>
