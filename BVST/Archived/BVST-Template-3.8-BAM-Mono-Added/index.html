<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVST Engine</title>
    <style>
        /* Global Reset & Base */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00ff88;
            --text-color: #e0e0e0;
            --canvas-border: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Prevent body scroll, canvas handles its own */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- Launcher View --- */
        #launcher-view {
            background: var(--surface-color);
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        #launcher-view.hidden {
            display: none;
        }

        h1 {
            margin-bottom: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--primary-color);
        }

        .control-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        label {
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        button.primary-btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: var(--primary-color);
            color: #000;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button.primary-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button.primary-btn:active {
            transform: translateY(1px);
        }

        /* --- Host View --- */
        #host-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #host-view.visible {
            display: flex;
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.2);
            z-index: 20;
        }

        .back-btn {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .back-btn:hover { background: #333; color: white; }

        .status-text {
            font-family: monospace;
            font-size: 0.9rem;
            color: #888;
        }
        .status-text.active { color: var(--primary-color); }
        .status-text.error { color: #ff5555; }

        /* The Canvas Container */
        #synth-canvas {
            width: 80vw;
            height: 80vh;
            background: #000;
            border: 1px solid var(--canvas-border);
            border-radius: 4px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden; /* Clip any overflow */
        }

        /* The Iframe */
        #synth-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Overlay */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: var(--primary-color);
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <!-- LAUNCHER -->
    <div id="launcher-view">
        <h1>BVST Engine</h1>
        <div class="control-group">
            <label for="synth-select">Select Synth</label>
            <select id="synth-select">
                <option value="" disabled selected>Loading synths...</option>
            </select>
        </div>
        <button id="launch-btn" class="primary-btn" disabled>Launch</button>
        <p id="launcher-msg" style="color: #ff5555; font-size: 0.9rem; margin-top: 10px;"></p>
    </div>

    <!-- HOST -->
    <div id="host-view">
        <div class="top-bar">
            <button class="back-btn" onclick="location.reload()">← Back to Menu</button>
            <span id="status-display" class="status-text">Ready</span>
        </div>
        
        <div id="synth-canvas">
            <div id="loader">Loading...</div>
            <iframe id="synth-frame"></iframe>
        </div>
    </div>

    <script type="module">
        // State
        let audioCtx = null;
        let workletNode = null;
        const synthSelect = document.getElementById('synth-select');
        const launchBtn = document.getElementById('launch-btn');
        const launcherMsg = document.getElementById('launcher-msg');
        const statusDisplay = document.getElementById('status-display');
        const loader = document.getElementById('loader');

        // 1. Initialize Launcher
        async function initLauncher() {
            try {
                const res = await fetch('/api/synths');
                if (!res.ok) throw new Error('Failed to fetch synth list');
                const synths = await res.json();
                
                synthSelect.innerHTML = '<option value="" disabled selected>Choose a synth...</option>';
                
                if (synths.length === 0) {
                    const opt = document.createElement('option');
                    opt.text = "No synths found";
                    synthSelect.add(opt);
                } else {
                    synths.forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.text = name;
                        synthSelect.add(opt);
                    });
                    launchBtn.disabled = false;
                }

                // Auto-select from URL
                const params = new URLSearchParams(window.location.search);
                const urlSynth = params.get('synth');
                if (urlSynth && synths.includes(urlSynth)) {
                    synthSelect.value = urlSynth;
                    // Optional: Auto-launch? Maybe safer to wait for user click for AudioContext
                    // launchBtn.click(); // Browser might block AudioContext
                }

            } catch (e) {
                console.error(e);
                synthSelect.innerHTML = '<option>Error connecting to server</option>';
                launcherMsg.innerText = "Ensure server.py is running";
            }
        }

        initLauncher();

        // 2. Launch Handler
        launchBtn.addEventListener('click', async () => {
            const name = synthSelect.value;
            if (!name) return;

            // Switch UI
            document.getElementById('launcher-view').classList.add('hidden');
            document.getElementById('host-view').classList.add('visible');
            loader.style.display = 'block';
            statusDisplay.innerText = `Initializing ${name}...`;

            // Update URL
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('synth', name);
            window.history.pushState({}, '', newUrl);

            try {
                await loadSynth(name);
                loader.style.display = 'none';
            } catch (e) {
                console.error(e);
                statusDisplay.innerText = "Error: " + e.message;
                statusDisplay.classList.add('error');
                loader.innerText = "Failed";
            }
        });

        // 3. Core Load Logic
        async function loadSynth(name) {
            const synthPath = `Synths/${name}`; // Relative to root where index.html is

            // A. Init Audio Context (User Gesture is active here)
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            // B. Fetch Manifest
            const manifestUrl = `${synthPath}/manifest.json`;
            const manifestReq = await fetch(manifestUrl);
            if (!manifestReq.ok) throw new Error(`Manifest missing for ${name}`);
            const manifest = await manifestReq.json();

            // C. Load Processor Glue
            // We use a timestamp to prevent caching during dev
            const glueUrl = `${synthPath}/processor.js?t=${Date.now()}`;
            await audioCtx.audioWorklet.addModule(glueUrl);

            // D. Create Node
            workletNode = new AudioWorkletNode(audioCtx, 'bvst-processor');
            
            // E. Load WASM
            const wasmUrl = `${synthPath}/${manifest.components.audio_engine}`;
            const wasmReq = await fetch(wasmUrl);
            if (!wasmReq.ok) throw new Error(`WASM missing: ${wasmUrl}`);
            const wasmBytes = await wasmReq.arrayBuffer();

            // F. Init WASM in Worklet
            workletNode.port.postMessage({ type: 'INIT_WASM', wasmBytes: wasmBytes });
            
            // G. Connect
            workletNode.connect(audioCtx.destination);

            // H. Load UI into Iframe
            const iframe = document.getElementById('synth-frame');
            iframe.src = `${synthPath}/${manifest.components.ui_html}`;

            // I. Setup Messaging
            // Listen for params from GUI
            window.addEventListener('message', (event) => {
                // Security check could be added here (origin)
                if (event.data.type === 'BVST_PARAM' && workletNode) {
                    workletNode.port.postMessage({ type: 'PARAM', id: event.data.id, value: event.data.value });
                }
            });

            // Listen for status from Engine
            workletNode.port.onmessage = (e) => {
                if (e.data.type === 'READY') {
                    statusDisplay.innerText = `Running: ${name}`;
                    statusDisplay.classList.add('active');
                } else if (e.data.type === 'ERROR') {
                    statusDisplay.innerText = `Engine Error: ${e.data.error}`;
                    statusDisplay.classList.add('error');
                }
            };
        }

    </script>
</body>
</html>
