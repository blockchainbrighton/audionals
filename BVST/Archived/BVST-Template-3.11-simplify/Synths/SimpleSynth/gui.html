<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #222;
      color: #eee;
      font-family: sans-serif;
      padding: 10px;
      user-select: none;
    }
    h2 { margin: 0 0 10px; font-size: 16px; }
    
    .controls {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 10px;
      background: #333;
      border-radius: 8px;
    }
    
    .group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }
    
    label { font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <h2>Simple Synth</h2>

  <!-- MIDI Manager UI -->
  <div class="midi-container">
    <div class="midi-label">MIDI In</div>
    <select id="midi-in"></select>
    <div id="midi-led" title="MIDI Activity"></div>
  </div>
  
  <div class="controls">
    <!-- Wave Shape Knob -->
    <div class="group">
      <label>Wave</label>
      <div class="knob-container">
        <div class="knob-outer">
            <div class="knob-track">
                <div id="wave" class="knob" data-min="0" data-max="2" data-step="1" data-value="0"></div>
            </div>
        </div>
        <div class="knob-value">0</div>
      </div>
    </div>

    <!-- Keyboard Switch -->
    <div class="group">
      <label>88 Keys</label>
      <div class="switch-container">
       <div id="kb-switch" class="switch-track switch" data-value="0">
           <div class="switch-handle"></div>
       </div>
      </div>
    </div>
  </div>

  <div id="piano"></div>

  <script type="module">
    import { Keyboard } from '../../System/shared/keyboard.js';
    import { Controls } from '../../System/shared/controls.js';
    import { MidiManager } from '../../System/shared/midi.js';

    // Simple Message Bridge
    function sendParam(id, value) {
      window.parent.postMessage({
        type: 'BVST_PARAM',
        id: id,
        value: value
      }, '*');
    }

    let currentKeyboard = null;

    function setupKeyboard(isFull) {
        const options = {
            onNoteOn: (midi, freq) => {
                sendParam(0, freq); // Set Freq
                sendParam(1, 1.0);  // Gate Open
            },
            onNoteOff: (midi) => {
                sendParam(1, 0.0); // Gate Close
            }
        };

        if (isFull) {
            options.startNote = 21; // A0
            options.numKeys = 88;
            options.responsive = false; // Force 88 keys into width
            options.width = '100%';
        } else {
            options.startOctave = 3;
            options.octaves = 2;
            options.responsive = true; // Auto-adjust key count
        }

        currentKeyboard = new Keyboard('piano', options);
    }

    // --- Initialize Shared Controls ---
    const controls = new Controls({
        knobSelector: '.knob',
        switchSelector: '.switch',
        onChange: (id, value) => {
            // Wave Knob
            if (id === 'wave') {
                sendParam(2, value);
            }
            // Keyboard Switch
            if (id === 'kb-switch') {
                setupKeyboard(value === 1);
            }
        }
    });

    // Initialize default keyboard
    setupKeyboard(false);

    // --- Initialize Shared MIDI ---
    // Helper for freq conversion
    function mtof(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
    }

    const midi = new MidiManager({
        onNoteOn: (note, velocity) => {
            // Trigger Sound
            const freq = mtof(note);
            sendParam(0, freq);
            sendParam(1, 1.0);
            
            // Update Virtual Keyboard Visuals
            if (currentKeyboard) currentKeyboard.triggerVisual(note, true);
        },
        onNoteOff: (note) => {
            // Stop Sound
            sendParam(1, 0.0);
            
            // Update Virtual Keyboard Visuals
            if (currentKeyboard) currentKeyboard.triggerVisual(note, false);
        }
    });
  </script>
</body>
</html>
