<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30RD3 | BVST</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #252525;
            --text-color: #e0e0e0;
            --accent-color: #ff3333;
            --highlight: #4a90e2;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; user-select: none;
        }

        /* MAIN PANEL */
        .synth-panel {
            background: var(--panel-color);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%; max-width: 900px;
            display: flex; flex-direction: column; gap: 15px;
        }

        /* HEADER */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #444; padding-bottom: 10px;
        }
        .logo { font-weight: bold; font-size: 1.5rem; }
        .logo span { color: var(--accent-color); }
        
        .top-controls { display: flex; gap: 15px; align-items: center; }
        
        /* VISUALIZER */
        #oscilloscope {
            width: 120px; height: 40px;
            background: #000; border: 1px solid #555; border-radius: 4px;
        }

        /* KNOBS GRID */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .control-group {
            border: 1px solid #444; padding: 10px;
            border-radius: 4px; background: #2a2a2a;
            display: flex; flex-direction: column; align-items: center;
        }

        .group-title {
            font-size: 0.7rem; color: #888; margin-bottom: 10px;
            text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 2px; width: 100%; text-align: center;
        }

        .knob-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        /* KNOB LABELS */
        .knob-label { font-size: 0.6rem; margin-top: 5px; color: #aaa; text-align: center; }

        /* SEQUENCER */
        .sequencer-section {
            background: #222; padding: 10px; border-radius: 4px; border: 1px solid #444;
        }
        
        .transport-controls {
            display: flex; gap: 10px; margin-bottom: 10px; align-items: center;
        }
        
        .btn {
            background: #444; color: #fff; border: none; padding: 5px 15px;
            border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 0.8rem;
        }
        .btn:hover { background: #555; }
        .btn.active { background: #0f0; color: #000; }

        select { background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; font-size: 0.8rem; }

        /* KEYBOARD */
        #keyboard-container { background: #111; border-top: 2px solid #444; margin-top: 5px; }
    </style>
</head>
<body>

<div class="synth-panel" id="app">
    <!-- Header -->
    <div class="header">
        <div class="logo"><span>30RD3</span></div>
        <div class="top-controls">
            <canvas id="oscilloscope"></canvas>
            <select id="preset-select"><option>Init</option></select>
            <div class="knob-container">
                <div class="knob-outer">
                    <div class="knob-track">
                        <div class="knob" id="knob-volume" data-param="15" data-min="0" data-max="1" data-val="0.5"></div>
                    </div>
                </div>
                <div class="knob-label">VOL</div>
            </div>
        </div>
    </div>

    <!-- Parameters -->
    <div class="controls-grid">
        <!-- OSC -->
        <div class="control-group">
            <div class="group-title">OSC</div>
            <div class="knob-row">
                <div class="knob-container">
                    <div class="knob-outer"><div class="knob-track">
                        <div class="knob" id="knob-wave" data-param="1" data-min="0" data-max="1" data-step="1" data-val="0"></div>
                    </div></div>
                    <div class="knob-label">WAVE</div>
                </div>
                <div class="knob-container">
                    <div class="knob-outer"><div class="knob-track">
                        <div class="knob" id="knob-sub" data-param="2" data-min="0" data-max="1" data-val="0"></div>
                    </div></div>
                    <div class="knob-label">SUB</div>
                </div>
            </div>
        </div>

        <!-- FILTER -->
        <div class="control-group" style="grid-column: span 2;">
            <div class="group-title">FILTER</div>
            <div class="knob-row">
                <div class="knob-container">
                    <div class="knob-outer"><div class="knob-track">
                        <div class="knob" id="knob-cutoff" data-param="3" data-min="0" data-max="1" data-val="0.5"></div>
                    </div></div>
                    <div class="knob-label">CUTOFF</div>
                </div>
                <div class="knob-container">
                    <div class="knob-outer"><div class="knob-track">
                        <div class="knob" id="knob-res" data-param="4" data-min="0" data-max="1" data-val="0.2"></div>
                    </div></div>
                    <div class="knob-label">RES</div>
                </div>
                <div class="knob-container">
                    <div class="knob-outer"><div class="knob-track">
                        <div class="knob" id="knob-envmod" data-param="5" data-min="0" data-max="1" data-val="0.5"></div>
                    </div></div>
                    <div class="knob-label">ENV AMT</div>
                </div>
                <div class="knob-container">
                    <div class="knob-outer"><div class="knob-track">
                        <div class="knob" id="knob-decay" data-param="6" data-min="0.1" data-max="2" data-val="0.4"></div>
                    </div></div>
                    <div class="knob-label">DECAY</div>
                </div>
                <div class="knob-container">
                    <div class="knob-outer"><div class="knob-track">
                        <div class="knob" id="knob-accent" data-param="7" data-min="0" data-max="1" data-val="0.5"></div>
                    </div></div>
                    <div class="knob-label">ACCENT</div>
                </div>
            </div>
        </div>

        <!-- FX -->
        <div class="control-group">
            <div class="group-title">FX</div>
            <div class="knob-row">
                <div class="knob-container">
                    <div class="knob-outer"><div class="knob-track">
                        <div class="knob" id="knob-drive" data-param="8" data-min="0" data-max="1" data-val="0"></div>
                    </div></div>
                    <div class="knob-label">DRIVE</div>
                </div>
                <div class="knob-container">
                    <div class="knob-outer"><div class="knob-track">
                        <div class="knob" id="knob-glide" data-param="9" data-min="0" data-max="0.5" data-val="0.1"></div>
                    </div></div>
                    <div class="knob-label">GLIDE</div>
                </div>
            </div>
        </div>
    </div>

    <!-- SEQUENCER -->
    <div class="sequencer-section">
        <div class="group-title">SEQUENCER</div>
        <div class="transport-controls">
            <button class="btn" id="btn-play">PLAY</button>
            <button class="btn" id="btn-stop">STOP</button>
            <div style="width: 20px;"></div>
            <div class="knob-container">
                <div class="knob-outer"><div class="knob-track">
                    <div class="knob" id="knob-bpm" data-min="60" data-max="200" data-val="120"></div>
                </div></div>
                <div class="knob-label">BPM</div>
            </div>
            <div style="font-size: 0.8rem; color: #888; margin-left: 5px;" id="bpm-disp">120</div>
        </div>
        <div id="seq-container"></div>
    </div>

    <!-- KEYBOARD -->
    <div id="keyboard-container"></div>
</div>

<script type="module">
    import { Controls } from '../../System/shared/controls.js';
    import { StepSequencer } from '../../System/shared/sequencer.js';
    import { Keyboard } from '../../System/shared/keyboard.js';
    import { MidiManager } from '../../System/shared/midi.js';

    // --- ENGINE COMMS ---
    let engineReady = false;
    const paramCache = new Map();

    function sendParam(id, val) {
        const pid = parseInt(id);
        const v = parseFloat(val);
        paramCache.set(pid, v);
        if (!engineReady) return;
        window.parent.postMessage({ type: 'BVST_PARAM', id: pid, value: v }, '*');
    }

    function flushParams() {
        if (!engineReady) return;
        for (const [pid, v] of paramCache.entries()) {
            window.parent.postMessage({ type: 'BVST_PARAM', id: pid, value: v }, '*');
        }
    }

    // --- UI CONTROLS ---
    const controls = new Controls({
        knobSelector: '.knob',
        onChange: (id, val) => {
            const el = document.getElementById(id);
            if (el.dataset.param) sendParam(el.dataset.param, val);
            if (id === 'knob-bpm') {
                bpm = val;
                document.getElementById('bpm-disp').innerText = Math.round(val);
                if (isPlaying) restartClock();
            }
        }
    });

    // --- SEQUENCER LOGIC ---
    const seqUI = new StepSequencer('seq-container', {
        numSteps: 16,
        onStepChange: (idx, data) => {
            // State is held in seqUI.steps
        }
    });

    let isPlaying = false;
    let currentStep = 0;
    let bpm = 120;
    let timerId = null;
    let nextNoteTime = 0;
    
    function schedule() {
        const secondsPerBeat = 60.0 / bpm;
        const stepTime = secondsPerBeat / 4; // 16th notes
        const now = performance.now() / 1000;
        
        while (nextNoteTime < now + 0.1) { // Lookahead 100ms
            runStep(currentStep, nextNoteTime);
            currentStep = (currentStep + 1) % 16;
            nextNoteTime += stepTime;
        }
        if (isPlaying) timerId = requestAnimationFrame(schedule);
    }

    function restartClock() {
        if (timerId) cancelAnimationFrame(timerId);
        timerId = requestAnimationFrame(schedule);
    }

    // Freq Helper
    function mtof(noteStr) {
        const notes = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const note = noteStr.slice(0, -1);
        const oct = parseInt(noteStr.slice(-1));
        const semi = notes.indexOf(note);
        const midi = 12 + (oct * 12) + semi;
        return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function runStep(idx, time) {
        seqUI.highlightStep(idx);
        const step = seqUI.getStep(idx);
        if (step.active) {
            const freq = mtof(step.note);
            const accent = step.accent ? 1.0 : 0.0;
            const slide = step.slide ? 1.0 : 0.0;
            
            sendParam(21, accent);
            sendParam(22, slide);
            sendParam(20, freq); // Sets pitch
            sendParam(23, 1.0);  // Gate On
            
            // Simple Gate Off logic
            setTimeout(() => {
                if (!step.slide && isPlaying) sendParam(23, 0.0); 
            }, (60/bpm/4 * 1000) * 0.5);
        } else {
             sendParam(23, 0.0);
        }
    }

    document.getElementById('btn-play').onclick = () => {
        if (isPlaying) return;
        isPlaying = true;
        currentStep = 0;
        nextNoteTime = performance.now() / 1000;
        document.getElementById('btn-play').classList.add('active');
        schedule();
    };

    document.getElementById('btn-stop').onclick = () => {
        isPlaying = false;
        if (timerId) cancelAnimationFrame(timerId);
        document.getElementById('btn-play').classList.remove('active');
        sendParam(23, 0.0); // All notes off
        const current = document.querySelector('.led.current');
        if(current) current.classList.remove('current');
    };

    // --- KEYBOARD ---
    const kb = new Keyboard('keyboard-container', {
        startNote: 36, numKeys: 25,
        onNoteOn: (n) => {
            const freq = 440 * Math.pow(2, (n-69)/12);
            sendParam(20, freq);
            sendParam(23, 1.0);
        },
        onNoteOff: (n) => {
            sendParam(23, 0.0);
        }
    });

    // --- MIDI ---
    const midi = new MidiManager({
        onNoteOn: (n, v) => {
            const freq = 440 * Math.pow(2, (n-69)/12);
            sendParam(20, freq);
            sendParam(23, 1.0);
        },
        onNoteOff: (n) => sendParam(23, 0.0)
    });

    // --- PRESETS ---
    const presets = {
        'Init': { 1:0, 2:0, 3:1.0, 4:0.2, 5:0.5, 6:0.4, 7:0.5, 8:0, 9:0.1, 15:0.7 },
        'Acid': { 1:0, 2:0, 3:0.18, 4:0.85, 5:0.85, 6:0.32, 7:0.9, 8:0.55, 9:0.18, 15:0.65 },
        'Squelch': { 1:0, 2:0.1, 3:0.12, 4:0.95, 5:0.9, 6:0.35, 7:0.95, 8:0.6, 9:0.12, 15:0.6 },
        'Pluck': { 1:0, 2:0.1, 3:0.65, 4:0.3, 5:0.2, 6:0.22, 7:0.2, 8:0.1, 9:0.0, 15:0.7 },
        'DeepSub': { 1:1, 2:0.9, 3:0.25, 4:0.15, 5:0.25, 6:0.6, 7:0.4, 8:0.2, 9:0.05, 15:0.75 },
        'SlideLead': { 1:0, 2:0.2, 3:0.55, 4:0.6, 5:0.6, 6:0.45, 7:0.65, 8:0.5, 9:0.3, 15:0.65 }
    };
    const pSel = document.getElementById('preset-select');
    pSel.innerHTML = '';
    Object.keys(presets).forEach(k => {
        const o = document.createElement('option'); o.text = k; pSel.add(o);
    });
    function applyPreset(name) {
        const p = presets[name];
        if (!p) return;
        Object.keys(p).forEach(k => {
            const el = document.querySelector(`.knob[data-param="${k}"]`);
            if(el) {
                controls.setValue(el.id, p[k]);
                sendParam(k, p[k]);
            }
        });
    }
    pSel.onchange = () => applyPreset(pSel.value);
    
    // Auto-load first (Init)
    setTimeout(() => { pSel.value = 'Init'; applyPreset('Init'); }, 200);

    // --- READY HANDSHAKE ---
    function syncAllParams() {
        document.querySelectorAll('.knob').forEach(el => {
            const pid = el.dataset.param;
            if (pid) sendParam(pid, el.dataset.val || el.dataset.value || el.dataset.min || 0);
        });
    }

    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'BVST_READY') {
            engineReady = true;
            flushParams();
            syncAllParams();
            applyPreset(pSel.value || 'Init');
        }
    });

    // Auto Scale
    function autoScale() {
         const el = document.getElementById('app');
         const sc = Math.min(window.innerWidth/950, window.innerHeight/800, 1);
         el.style.transform = `scale(${sc})`;
         if(sc < 1) el.style.marginTop = `${(window.innerHeight - (800*sc))/2}px`;
    }
    window.onresize = autoScale; setTimeout(autoScale, 100);

    // Visualizer
    const ctx = document.getElementById('oscilloscope').getContext('2d');
    function drawVis() {
        requestAnimationFrame(drawVis);
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,120,40);
        ctx.strokeStyle = '#0f0'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 20);
        for(let i=0; i<120; i++) {
            ctx.lineTo(i, 20 + Math.sin(i*0.2 + Date.now()*0.01)*10 * (isPlaying?1:0));
        }
        ctx.stroke();
    }
    drawVis();

</script>
</body>
</html>
