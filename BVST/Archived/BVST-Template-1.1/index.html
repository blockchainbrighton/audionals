<!DOCTYPE html>
<html>
<head>
    <title>BVST Launcher</title>
    <style>
        body { background: #1a1a1a; color: #eee; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; padding: 40px; background: #2a2a2a; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; color: #0f0; }
        p { color: #aaa; margin-bottom: 20px; }
        input { padding: 10px; font-size: 16px; width: 200px; border: none; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; background: #0f0; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #4f4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BVST Studio</h1>
        <p>Enter the name of the synth you want to load:</p>
        <input type="text" id="synthName" value="SimpleSynth" placeholder="e.g., SimpleSynth">
        <button onclick="launch()">Launch</button>
    </div>
    <script>
        function launch() {
            const name = document.getElementById('synthName').value.trim();
            if (name) {
                window.location.href = `System/host.html?synth=${name}`;
            }
        }
        // Allow Enter key
        document.getElementById('synthName').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') launch();
        });
    </script>
</body>
</html>
