<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #222;
      color: #eee;
      font-family: sans-serif;
      padding: 10px;
      user-select: none;
    }
    h2 { margin: 0 0 10px; font-size: 16px; }
    
    .controls {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 10px;
      background: #333;
      border-radius: 8px;
    }
    
    .group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    label { font-size: 12px; color: #aaa; }
    
    /* Piano */
    .piano {
      display: flex;
      position: relative;
      height: 120px;
    }
    
    .key {
      position: relative;
      width: 40px;
      height: 100%;
      background: white;
      border: 1px solid #000;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      z-index: 1;
    }
    
    .key.black {
      background: black;
      width: 24px;
      height: 60%;
      margin-left: -12px;
      margin-right: -12px;
      z-index: 2;
      border-bottom: 2px solid #333;
    }
    
    .key:active, .key.active {
      background: #ddd;
    }
    .key.black:active, .key.black.active {
      background: #444;
    }
  </style>
</head>
<body>
  <h2>Simple Synth</h2>
  
  <div class="controls">
    <div class="group">
      <label>Wave Shape</label>
      <select id="wave">
        <option value="0">Sine</option>
        <option value="1">Saw</option>
        <option value="2">Square</option>
      </select>
    </div>
    
    <div class="group">
      <label>Cutoff</label>
      <input type="range" id="cutoff" min="100" max="8000" step="10" value="2000">
    </div>
    
    <div class="group">
      <label>Resonance</label>
      <input type="range" id="res" min="0" max="1.0" step="0.01" value="0.2">
    </div>
  </div>

  <div class="piano" id="piano">
    <!-- Keys generated by JS -->
  </div>

  <script>
    // Simple Message Bridge
    function sendParam(id, value) {
      window.parent.postMessage({
        type: 'BVST_PARAM',
        id: id,
        value: value
      }, '*');
    }

    // --- Controls ---
    document.getElementById('wave').addEventListener('change', (e) => {
      sendParam(2, parseFloat(e.target.value));
    });
    
    document.getElementById('cutoff').addEventListener('input', (e) => {
      sendParam(3, parseFloat(e.target.value));
    });

    document.getElementById('res').addEventListener('input', (e) => {
      sendParam(4, parseFloat(e.target.value));
    });

    // --- Piano Generation ---
    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const startOctave = 3;
    const octaves = 2;
    const pianoDiv = document.getElementById('piano');

    function mtof(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    let currentNote = null;

    function noteOn(midi) {
      if (currentNote !== null) return; // Monophonic
      currentNote = midi;
      const freq = mtof(midi);
      sendParam(0, freq); // Set Freq
      sendParam(1, 1.0);  // Gate Open
      
      // Visual
      const key = document.querySelector(`[data-midi="${midi}"]`);
      if (key) key.classList.add('active');
    }

    function noteOff(midi) {
      if (currentNote === midi) {
        sendParam(1, 0.0); // Gate Close
        currentNote = null;
        
        // Visual
        const key = document.querySelector(`[data-midi="${midi}"]`);
        if (key) key.classList.remove('active');
      }
    }

    for (let o = 0; o < octaves; o++) {
      notes.forEach((note, i) => {
        const octave = startOctave + o;
        const isBlack = note.includes('#');
        const key = document.createElement('div');
        const midi = (octave + 1) * 12 + i;
        
        key.className = `key ${isBlack ? 'black' : 'white'}`;
        key.dataset.midi = midi;
        
        // Mouse Events
        key.addEventListener('mousedown', () => noteOn(midi));
        key.addEventListener('mouseup', () => noteOff(midi));
        key.addEventListener('mouseleave', () => noteOff(midi));
        
        pianoDiv.appendChild(key);
      });
    }
  </script>
</body>
</html>
