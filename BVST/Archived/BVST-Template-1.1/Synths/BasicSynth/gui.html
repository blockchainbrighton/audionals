<!DOCTYPE html>
<html>
<head>
<style>
  /* --- ALIEN THEME CSS --- */
  body { 
    margin: 0; 
    overflow: hidden; 
    background: #050505; 
    color: #0f0; /* Neon Green */
    font-family: 'Courier New', Courier, monospace; 
    user-select: none;
  }
  
  .container { 
    padding: 20px; 
    border: 2px solid #0f0; 
    height: 100vh; 
    box-sizing: border-box; 
    background: radial-gradient(circle, #1a221a 0%, #000000 100%);
    box-shadow: inset 0 0 20px #0f02;
  }

  h3 { 
    margin-top: 0; 
    border-bottom: 1px solid #0f0; 
    padding-bottom: 10px;
    letter-spacing: 4px;
    text-shadow: 0 0 5px #0f0;
  }

  .control_group {
    margin-bottom: 20px;
    background: rgba(0, 20, 0, 0.5);
    padding: 10px;
    border: 1px solid #0a0;
  }

  label { 
    display: block; 
    font-size: 0.7em; 
    color: #8f8; 
    margin-bottom: 5px; 
    text-transform: uppercase;
  }

  /* Custom Slider Styling */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
  }
  
  input[type=range]:focus { outline: none; }

  /* The Track */
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
    cursor: pointer;
    background: #030;
    border: 1px solid #060;
  }
  
  /* The Knob */
  input[type=range]::-webkit-slider-thumb {
    height: 16px;
    width: 10px;
    background: #0f0;
    cursor: pointer;
    -webkit-appearance: none;
    margin-top: -7px;
    box-shadow: 0 0 10px #0f0;
  }

  .val-display { float: right; color: #fff; }
</style>
</head>
<body>

<div class="container">
  <h3>// Basic Synth //</h3>
  
  <!-- Global Controls -->
  <div class="control_group">
    <label>Pitch <span id="val0" class="val-display">110</span></label>
    <input type="range" id="p0" min="30" max="200" step="1" value="110">
    
    <label style="margin-top:10px;">Output Gain</label>
    <input type="range" id="p1" min="0" max="1" step="0.01" value="0.5">
  </div>

  <!-- FM Synthesis Controls -->
  <div class="control_group">
    <label>Basic FM (FM Depth)</label>
    <input type="range" id="p2" min="0" max="1000" step="10" value="500">

    <label style="margin-top:10px;">Metal Character (Ratio)</label>
    <input type="range" id="p3" min="0.5" max="8.0" step="0.5" value="2.0">
  </div>

  <!-- LFO Controls -->
  <div class="control_group">
    <label>Pulse Speed (LFO)</label>
    <input type="range" id="p4" min="0.1" max="10.0" step="0.1" value="0.5">
  </div>

</div>

<script>
  function sendParam(id, value) {
    // Update visual display for frequency if needed
    if(id === 0) document.getElementById('val0').innerText = value + 'Hz';
    
    // Send to Rust/Host
    window.parent.postMessage({ type: 'BVST_PARAM', id: id, value: value }, '*');
  }

  // Attach Listeners
  document.getElementById('p0').addEventListener('input', e => sendParam(0, parseFloat(e.target.value)));
  document.getElementById('p1').addEventListener('input', e => sendParam(1, parseFloat(e.target.value)));
  document.getElementById('p2').addEventListener('input', e => sendParam(2, parseFloat(e.target.value)));
  document.getElementById('p3').addEventListener('input', e => sendParam(3, parseFloat(e.target.value)));
  document.getElementById('p4').addEventListener('input', e => sendParam(4, parseFloat(e.target.value)));
</script>
</body>
</html>
