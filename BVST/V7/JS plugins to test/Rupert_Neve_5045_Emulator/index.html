<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rupert Neve 5045 Emulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="rack-unit">
        <div class="header">
            <h1>Rupert Neve Designs</h1>
            <h2>5045 Primary Source Enhancer</h2>
        </div>

        <div class="controls-container">
            <!-- Threshold Control -->
            <div class="control-group">
                <div class="knob-wrapper">
                    <div class="knob-label">THRESHOLD</div>
                    <input type="range" id="threshold" min="-20" max="10" step="0.1" value="-20">
                    <div class="value-display" id="threshold-val">-20 dBu</div>
                </div>
            </div>

            <!-- Time Constant Control -->
            <div class="control-group">
                <div class="knob-label">TIME CONSTANT</div>
                <div class="radio-group">
                    <label><input type="radio" name="timeConst" value="0" checked> A</label>
                    <label><input type="radio" name="timeConst" value="1"> B</label>
                    <label><input type="radio" name="timeConst" value="2"> C</label>
                    <label><input type="radio" name="timeConst" value="3"> D</label>
                    <label><input type="radio" name="timeConst" value="4"> E</label>
                    <label><input type="radio" name="timeConst" value="5"> F</label>
                </div>
            </div>

            <!-- Depth Control -->
            <div class="control-group">
                <div class="knob-wrapper">
                    <div class="knob-label">DEPTH</div>
                    <input type="range" id="depth" min="-80" max="0" step="0.1" value="-10">
                    <div class="value-display" id="depth-val">-10 dB</div>
                </div>
            </div>
            
             <!-- Mode Switches -->
             <div class="control-group switches">
                <div class="switch-wrapper">
                    <label class="switch-label">RMS / PEAK</label>
                    <button id="mode-btn" class="toggle-btn">RMS</button>
                </div>
                <div class="switch-wrapper">
                    <label class="switch-label">PROCESS</label>
                    <button id="engage-btn" class="toggle-btn active">ENGAGE</button>
                </div>
            </div>

            <!-- Indicators -->
            <div class="control-group indicators">
                <div class="led-wrapper">
                    <div id="process-led" class="led-off"></div>
                    <div class="led-label">SIGNAL</div>
                </div>
            </div>
        </div>

        <div class="io-section">
            <button id="start-btn">Power On / Start Audio</button>
            <div class="status" id="status-msg">System Off</div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
