<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Mod</title>
    <style>
        body { margin: 0; padding: 20px; background: #111; color: #eee; display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 600px; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';

        BVST.init({
            name: "Universal Mod",
            containerId: "app-container",
            visualizer: "scope",
            keyboard: false,
            sequencer: false,
            modules: [
                {
                    name: "Chorus / Flanger",
                    cols: 1,
                    controls: [
                        { id: "rate", param: 0, type: "knob", min: 0.1, max: 10, val: 0.5, label: "Rate" },
                        { id: "depth", param: 1, type: "knob", min: 0, max: 0.02, val: 0.005, label: "Depth" },
                        { id: "feed", param: 2, type: "knob", min: 0, max: 0.95, val: 0.3, label: "Fdbk" },
                        { id: "spread", param: 4, type: "knob", min: 0, max: 3.14, val: 3.14, label: "Stereo" },
                        { id: "mix", param: 3, type: "knob", min: 0, max: 1, val: 0.5, label: "Mix" }
                    ]
                },
                {
                    name: "Tremolo",
                    cols: 1,
                    controls: [
                        { id: "trem_rate", param: 5, type: "knob", min: 0.1, max: 20, val: 4.0, label: "Rate" },
                        { id: "trem_depth", param: 6, type: "knob", min: 0, max: 1, val: 0.0, label: "Depth" }
                    ]
                }
            ]
        });
    </script>
</body>
</html>
