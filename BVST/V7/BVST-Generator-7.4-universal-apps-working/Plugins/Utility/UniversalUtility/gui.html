<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Utility</title>
    <style>
        body { margin: 0; padding: 20px; background: #111; color: #eee; display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 600px; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';

        BVST.init({
            name: "Universal Utility",
            containerId: "app-container",
            visualizer: "spectrum",
            keyboard: false,
            sequencer: false,
            modules: [
                {
                    name: "Test Tone",
                    cols: 1,
                    controls: [
                        { id: "tone_type", param: 0, type: "select", options: ["Off", "Sine", "Noise", "Saw"], val: 0, label: "Type" },
                        { id: "tone_freq", param: 1, type: "knob", min: 20, max: 20000, val: 440, curve: "log", label: "Freq" },
                        { id: "tone_gain", param: 2, type: "knob", min: 0, max: 1, val: 0.5, label: "Level" }
                    ]
                },
                {
                    name: "Input & Stereo",
                    cols: 1,
                    controls: [
                        { id: "in_gain", param: 3, type: "knob", min: 0, max: 2, val: 1.0, label: "In Gain" },
                        { id: "pan", param: 4, type: "knob", min: -1, max: 1, val: 0, label: "Pan" },
                        { id: "width", param: 5, type: "knob", min: 0, max: 2, val: 1.0, label: "Width" }
                    ]
                },
                {
                    name: "Phase",
                    cols: 1,
                    controls: [
                        { id: "ph_l", param: 6, type: "switch", val: 0, label: "Inv L" },
                        { id: "ph_r", param: 7, type: "switch", val: 0, label: "Inv R" }
                    ]
                }
            ]
        });
    </script>
</body>
</html>
