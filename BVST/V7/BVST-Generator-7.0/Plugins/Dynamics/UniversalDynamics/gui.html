<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Dynamics</title>
    <style>
        body { margin: 0; padding: 20px; background: #111; color: #eee; display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 600px; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';

        BVST.init({
            name: "Universal Dynamics",
            containerId: "app-container",
            visualizer: "scope",
            keyboard: false,
            sequencer: false,
            modules: [
                {
                    name: "Compressor",
                    cols: 1,
                    controls: [
                        { id: "thresh", param: 0, type: "slider", min: -60, max: 0, val: -12, label: "Thresh" },
                        { id: "ratio", param: 1, type: "knob", min: 1, max: 20, val: 4, label: "Ratio" },
                        { id: "knee", param: 4, type: "knob", min: 0, max: 12, val: 0, label: "Knee" }
                    ]
                },
                {
                    name: "Envelope",
                    cols: 1,
                    controls: [
                        { id: "attack", param: 2, type: "knob", min: 0.1, max: 100, val: 10, label: "Attack" },
                        { id: "release", param: 3, type: "knob", min: 10, max: 1000, val: 100, label: "Release" }
                    ]
                },
                {
                    name: "Output",
                    cols: 1,
                    controls: [
                        { id: "makeup", param: 5, type: "knob", min: 0, max: 24, val: 0, label: "Makeup" },
                        { id: "mix", param: 6, type: "slider", min: 0, max: 1, val: 1.0, label: "Mix" }
                    ]
                }
            ]
        });
    </script>
</body>
</html>
