<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primary Source Enhancer</title>
    <style>
        body { margin: 0; padding: 20px; background: #111; color: #eee; display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 600px; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';

        BVST.init({
            name: "Primary Source Enhancer",
            containerId: "app-container",
            visualizer: "scope",
            keyboard: false,
            sequencer: false,
            modules: [
                {
                    name: "Sensitivity",
                    cols: 1,
                    controls: [
                        { id: "thresh", param: 0, type: "slider", min: -60, max: 0, val: -30, label: "Threshold" },
                        { id: "range", param: 1, type: "knob", min: -60, max: 0, val: -12, label: "Range" }
                    ]
                },
                {
                    name: "Ballistics",
                    cols: 1,
                    controls: [
                        { id: "attack", param: 2, type: "knob", min: 0.1, max: 100, val: 5, label: "Attack" },
                        { id: "release", param: 3, type: "knob", min: 10, max: 1000, val: 200, label: "Release" },
                        { id: "hold", param: 4, type: "knob", min: 0, max: 500, val: 50, label: "Hold" }
                    ]
                },
                {
                    name: "Detector Filter",
                    cols: 1,
                    controls: [
                        { id: "hpf", param: 5, type: "knob", min: 20, max: 1000, val: 100, curve: "log", label: "HPF" },
                        { id: "lpf", param: 6, type: "knob", min: 1000, max: 20000, val: 10000, curve: "log", label: "LPF" }
                    ]
                }
            ]
        });
    </script>
</body>
</html>
