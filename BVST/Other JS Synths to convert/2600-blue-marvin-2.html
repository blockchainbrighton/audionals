<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARP 2600 "Blue Marvin" Emulator</title>
    <style>
        :root {
            --bg-color: #3A5F85; /* Blue Marvin distinctive color */
            --panel-border: #8FAAC2;
            --text-color: #E0E0E0;
            --slider-track: #111;
            --slider-thumb: #FFF;
            --led-on: #FF3333;
            --font-main: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden; /* Prevent scroll on slider drag */
        }

        /* --- Enclosure --- */
        #synth-container {
            background-color: var(--bg-color);
            width: 96vw;
            max-width: 1250px;
            border: 12px solid #2a445e;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 0 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-weight: 800;
            font-style: italic;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        .status-led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #440000;
            border: 1px solid #000;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
            transition: background-color 0.05s;
        }
        .status-led.active { 
            background-color: var(--led-on); 
            box-shadow: 0 0 10px var(--led-on), inset 1px 1px 2px rgba(255,255,255,0.5); 
        }

        /* --- Grid Layout --- */
        #panel-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6 Main Columns */
            gap: 10px;
            height: auto;
        }

        .module {
            border: 2px solid var(--panel-border);
            border-radius: 4px;
            padding: 10px 5px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.1) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .module::before {
            /* Screw head visuals */
            content: '';
            position: absolute;
            top: 5px; left: 5px;
            width: 6px; height: 6px;
            background: #888;
            border-radius: 50%;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .module::after {
            content: '';
            position: absolute;
            bottom: 5px; right: 5px;
            width: 6px; height: 6px;
            background: #888;
            border-radius: 50%;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .module-title {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            width: 90%;
            text-align: center;
            padding-bottom: 5px;
            text-shadow: 0 1px 2px black;
        }

        /* --- Vertical Sliders via Transform --- */
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
            width: 100%;
            flex-grow: 1; /* Distribute space */
        }

        .slider-wrapper {
            position: relative;
            width: 40px;
            height: 150px; /* Physical height on screen */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The actual input is rotated -90deg */
        input[type=range] {
            -webkit-appearance: none;
            width: 150px; /* This becomes the height when rotated */
            height: 30px; /* Hit area thickness */
            background: transparent;
            transform: rotate(-90deg);
            cursor: pointer;
            margin: 0;
        }

        /* Webkit Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #000;
            border: 1px solid #555;
            border-radius: 2px;
        }

        /* Webkit Thumb */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 12px;
            background: #EEE;
            border: 1px solid #000;
            border-radius: 2px;
            margin-top: -11px; /* Center thumb on track */
            box-shadow: 1px -1px 3px rgba(0,0,0,0.6); /* Shadow correct for rotation */
        }

        /* Firefox Track */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            background: #000;
            border: 1px solid #555;
        }

        /* Firefox Thumb */
        input[type=range]::-moz-range-thumb {
            height: 24px;
            width: 12px;
            background: #EEE;
            border: 1px solid #000;
            border-radius: 2px;
            cursor: pointer;
        }

        label {
            font-size: 0.65rem;
            text-transform: uppercase;
            margin-top: 5px;
            text-align: center;
            color: #ccc;
        }

        select {
            background: #222;
            color: white;
            border: 1px solid #8FAAC2;
            padding: 4px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            width: 90%;
            outline: none;
            cursor: pointer;
        }

        .instructions {
            grid-column: 1 / -1;
            margin-top: 10px;
            font-size: 0.8rem;
            text-align: center;
            color: #8FAAC2;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 4px;
        }

        /* Envelope Grouping */
        .env-row {
            display: flex;
            width: 100%;
            justify-content: space-around;
        }

    </style>
</head>
<body>

    <div id="synth-container">
        <div id="header">
            <h1>ARP 2600 <span style="font-size:0.7em; font-weight:normal; opacity:0.8;">BLUE MARVIN</span></h1>
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:0.8rem; font-weight:bold;">GATE</span>
                <div id="gate-led" class="status-led"></div>
            </div>
        </div>

        <div id="panel-grid">
            <!-- VCO 1 -->
            <div class="module">
                <div class="module-title">VCO 1</div>
                <select id="vco1-wave">
                    <option value="sawtooth">Sawtooth</option>
                    <option value="square">Square</option>
                    <option value="triangle">Triangle</option>
                    <option value="sine">Sine</option>
                </select>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="vco1-coarse" min="-2400" max="2400" value="0">
                    </div>
                    <label>Freq</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="vco1-fine" min="-100" max="100" value="0">
                    </div>
                    <label>Fine</label>
                </div>
            </div>

            <!-- VCO 2 -->
            <div class="module">
                <div class="module-title">VCO 2</div>
                <select id="vco2-wave">
                    <option value="sawtooth">Sawtooth</option>
                    <option value="square" selected>Square</option>
                    <option value="triangle">Triangle</option>
                    <option value="sine">Sine</option>
                </select>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="vco2-coarse" min="-2400" max="2400" value="0">
                    </div>
                    <label>Freq</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="vco2-detune" min="-100" max="100" value="5">
                    </div>
                    <label>Fine</label>
                </div>
            </div>

            <!-- VCO 3 -->
            <div class="module">
                <div class="module-title">VCO 3</div>
                <select id="vco3-wave">
                    <option value="sawtooth">Sawtooth</option>
                    <option value="square">Square</option>
                    <option value="triangle">Triangle</option>
                    <option value="sine">Sine</option>
                </select>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="vco3-coarse" min="-3600" max="1200" value="-1200">
                    </div>
                    <label>Freq</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="vco3-detune" min="-100" max="100" value="0">
                    </div>
                    <label>Fine</label>
                </div>
            </div>

            <!-- MIXER -->
            <div class="module">
                <div class="module-title">MIXER</div>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="mix-vco1" min="0" max="1" step="0.01" value="0.7">
                    </div>
                    <label>VCO 1</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="mix-vco2" min="0" max="1" step="0.01" value="0.7">
                    </div>
                    <label>VCO 2</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="mix-vco3" min="0" max="1" step="0.01" value="0">
                    </div>
                    <label>VCO 3</label>
                </div>
            </div>

            <!-- VCF -->
            <div class="module">
                <div class="module-title">VCF (24dB)</div>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <!-- Logarithmic scale approximated linearly 20Hz-15kHz -->
                        <input type="range" id="vcf-cutoff" min="1" max="1000" step="1" value="500">
                    </div>
                    <label>Freq</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="vcf-res" min="0" max="25" step="0.1" value="0">
                    </div>
                    <label>Res</label>
                </div>
                <div class="control-group">
                    <div class="slider-wrapper">
                        <input type="range" id="vcf-env-amt" min="0" max="5000" step="10" value="1500">
                    </div>
                    <label>ADSR Amt</label>
                </div>
            </div>

            <!-- ENVELOPES & VCA -->
            <div class="module" style="grid-column: span 1;">
                <div class="module-title">ADSR (VCF)</div>
                <div class="env-row">
                    <div class="control-group">
                        <div class="slider-wrapper">
                            <input type="range" id="adsr-a" min="0.01" max="2" step="0.01" value="0.01">
                        </div>
                        <label>A</label>
                    </div>
                    <div class="control-group">
                        <div class="slider-wrapper">
                            <input type="range" id="adsr-d" min="0.01" max="2" step="0.01" value="0.4">
                        </div>
                        <label>D</label>
                    </div>
                    <div class="control-group">
                        <div class="slider-wrapper">
                            <input type="range" id="adsr-s" min="0" max="1" step="0.01" value="0.2">
                        </div>
                        <label>S</label>
                    </div>
                    <div class="control-group">
                        <div class="slider-wrapper">
                            <input type="range" id="adsr-r" min="0.01" max="5" step="0.01" value="0.8">
                        </div>
                        <label>R</label>
                    </div>
                </div>

                <div style="width:90%; height:1px; background:rgba(255,255,255,0.3); margin:10px 0;"></div>

                <div class="module-title">AR (VCA)</div>
                <div class="env-row">
                    <div class="control-group">
                        <div class="slider-wrapper">
                            <input type="range" id="ar-a" min="0.005" max="2" step="0.01" value="0.01">
                        </div>
                        <label>A</label>
                    </div>
                    <div class="control-group">
                        <div class="slider-wrapper">
                            <input type="range" id="ar-r" min="0.01" max="5" step="0.01" value="0.5">
                        </div>
                        <label>R</label>
                    </div>
                    <div class="control-group">
                        <div class="slider-wrapper">
                            <input type="range" id="vca-gain" min="0" max="1" step="0.01" value="0.8">
                        </div>
                        <label>Vol</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="instructions">
            <strong>KEYBOARD CONTROLS:</strong> Play with [ Z, S, X, D, C, V, G, B, H, N, J, M ] <br>
            Click anywhere to Initialize Audio Engine
        </div>
    </div>

<script>
/**
 * ARP 2600 "Blue Marvin" Emulator Engine
 * Fixed vertical sliders using CSS Transform (-90deg).
 */

const AudioContext = window.AudioContext || window.webkitAudioContext;
let ctx;
let isAudioStarted = false;

// Audio Nodes
let masterGain, vcaNode, filterNode1, filterNode2, mixerNode;
let vco1_gain, vco2_gain, vco3_gain;
let currentOscillators = []; 
let activeNotes = [];

// UI References
const ui = {
    vco1: { wave: 'vco1-wave', coarse: 'vco1-coarse', fine: 'vco1-fine' },
    vco2: { wave: 'vco2-wave', coarse: 'vco2-coarse', fine: 'vco2-detune' },
    vco3: { wave: 'vco3-wave', coarse: 'vco3-coarse', fine: 'vco3-detune' },
    mix: { vco1: 'mix-vco1', vco2: 'mix-vco2', vco3: 'mix-vco3' },
    vcf: { cutoff: 'vcf-cutoff', res: 'vcf-res', envAmt: 'vcf-env-amt' },
    adsr: { a: 'adsr-a', d: 'adsr-d', s: 'adsr-s', r: 'adsr-r' },
    ar: { a: 'ar-a', r: 'ar-r' },
    vca: { vol: 'vca-gain' },
    led: document.getElementById('gate-led')
};

// Utilities
const val = (id) => parseFloat(document.getElementById(id).value);
const strVal = (id) => document.getElementById(id).value;

// Keyboard mapping
const keyMap = {
    'z': 0, 's': 1, 'x': 2, 'd': 3, 'c': 4, 'v': 5, 
    'g': 6, 'b': 7, 'h': 8, 'n': 9, 'j': 10, 'm': 11, 
    ',': 12, 'l': 13, '.': 14
};
const ROOT_NOTE = 48; // C3

function initAudio() {
    if(isAudioStarted) return;
    ctx = new AudioContext();

    // Master
    masterGain = ctx.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(ctx.destination);

    // VCA (AR Env)
    vcaNode = ctx.createGain();
    vcaNode.gain.value = 0;
    vcaNode.connect(masterGain);

    // VCF (24dB Ladder Sim: 2x Biquad Lowpass)
    filterNode1 = ctx.createBiquadFilter();
    filterNode1.type = 'lowpass';
    filterNode2 = ctx.createBiquadFilter();
    filterNode2.type = 'lowpass';
    
    // Chain: Mix -> Filter1 -> Filter2 -> VCA
    filterNode2.connect(vcaNode);
    filterNode1.connect(filterNode2);

    // Mixer
    mixerNode = ctx.createGain();
    mixerNode.gain.value = 1.0; 
    mixerNode.connect(filterNode1);

    // Channel Gains
    vco1_gain = ctx.createGain();
    vco2_gain = ctx.createGain();
    vco3_gain = ctx.createGain();

    vco1_gain.connect(mixerNode);
    vco2_gain.connect(mixerNode);
    vco3_gain.connect(mixerNode);

    isAudioStarted = true;
    updateStaticParams();
}

// Convert Logarithmic Slider (1-1000) to Frequency (20-15000Hz)
function getFilterFreq() {
    const slide = val(ui.vcf.cutoff);
    const minF = Math.log(20);
    const maxF = Math.log(12000);
    // map slider 1..1000 to log scale
    const scale = (maxF - minF) / 1000;
    return Math.exp(minF + scale * slide);
}

function updateStaticParams() {
    if(!isAudioStarted) return;

    // Mix
    vco1_gain.gain.setTargetAtTime(val(ui.mix.vco1), ctx.currentTime, 0.05);
    vco2_gain.gain.setTargetAtTime(val(ui.mix.vco2), ctx.currentTime, 0.05);
    vco3_gain.gain.setTargetAtTime(val(ui.mix.vco3), ctx.currentTime, 0.05);

    // Filter
    const fFreq = getFilterFreq();
    const res = val(ui.vcf.res);
    
    // When envelope is not active, filter sits here
    // Note: If envelope is active, these are base values
    // We update them slightly in future time to not glitch active envelopes too much
    // Realtime tweaking while note held:
    filterNode1.Q.value = res;
    filterNode2.Q.value = res;
    
    // Note: Changing cutoff while Envelope is running is complex in WebAudio without custom nodes.
    // For this simple emulation, static updates apply mostly on next note or settle state.
}

// Add listeners to all inputs
document.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('input', updateStaticParams);
});

function midiToFreq(note) {
    return 440 * Math.pow(2, (note - 69) / 12);
}

function triggerNoteOn(midiNote) {
    if(!isAudioStarted) initAudio();
    const now = ctx.currentTime;

    // 1. Oscillators
    // Clean up old
    currentOscillators.forEach(o => { try{ o.stop(); o.disconnect(); } catch(e){} });
    currentOscillators = [];

    const baseFreq = midiToFreq(midiNote);

    // VCO Creation Helper
    const createVCO = (waveId, coarseId, fineId, destNode) => {
        const osc = ctx.createOscillator();
        osc.type = strVal(waveId);
        
        // Pitch Logic: Base Note + Coarse Slider (cents) + Fine Slider (cents)
        // 100 cents = 1 semitone. 
        const coarse = val(coarseId); 
        const fine = val(fineId);
        
        osc.frequency.value = baseFreq; 
        osc.detune.value = coarse + fine;
        
        osc.connect(destNode);
        osc.start(now);
        currentOscillators.push(osc);
    };

    createVCO(ui.vco1.wave, ui.vco1.coarse, ui.vco1.fine, vco1_gain);
    createVCO(ui.vco2.wave, ui.vco2.coarse, ui.vco2.fine, vco2_gain);
    createVCO(ui.vco3.wave, ui.vco3.coarse, ui.vco3.fine, vco3_gain);

    // 2. VCA Envelope (AR)
    const vol = val(ui.vca.vol);
    const arA = val(ui.ar.a);
    
    vcaNode.gain.cancelScheduledValues(now);
    vcaNode.gain.setValueAtTime(0, now);
    vcaNode.gain.linearRampToValueAtTime(vol, now + arA);

    // 3. VCF Envelope (ADSR)
    const baseCutoff = getFilterFreq();
    const envAmt = val(ui.vcf.envAmt);
    const adsrA = val(ui.adsr.a);
    const adsrD = val(ui.adsr.d);
    const adsrS = val(ui.adsr.s);

    const peak = Math.min(22000, baseCutoff + envAmt);
    const sustain = Math.min(22000, baseCutoff + (envAmt * adsrS));

    [filterNode1.frequency, filterNode2.frequency].forEach(p => {
        p.cancelScheduledValues(now);
        p.setValueAtTime(baseCutoff, now);
        p.linearRampToValueAtTime(peak, now + adsrA);
        p.exponentialRampToValueAtTime(Math.max(10, sustain), now + adsrA + adsrD);
    });

    ui.led.classList.add('active');
}

function triggerNoteOff() {
    if(!isAudioStarted) return;
    const now = ctx.currentTime;

    // AR Release (VCA)
    const arR = val(ui.ar.r);
    vcaNode.gain.cancelScheduledValues(now);
    vcaNode.gain.setValueAtTime(vcaNode.gain.value, now);
    vcaNode.gain.exponentialRampToValueAtTime(0.001, now + arR);

    // ADSR Release (Filter)
    const adsrR = val(ui.adsr.r);
    const baseCutoff = getFilterFreq();

    [filterNode1.frequency, filterNode2.frequency].forEach(p => {
        p.cancelScheduledValues(now);
        p.setValueAtTime(p.value, now);
        p.exponentialRampToValueAtTime(Math.max(10, baseCutoff), now + adsrR);
    });

    ui.led.classList.remove('active');
}

// Keyboard Handling
document.addEventListener('keydown', (e) => {
    if(e.repeat) return;
    const k = e.key.toLowerCase();
    if(keyMap.hasOwnProperty(k)) {
        activeNotes.push(k);
        triggerNoteOn(ROOT_NOTE + keyMap[k]);
    }
});

document.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if(keyMap.hasOwnProperty(k)) {
        activeNotes = activeNotes.filter(n => n !== k);
        if(activeNotes.length > 0) {
            // Last note priority
            const last = activeNotes[activeNotes.length - 1];
            triggerNoteOn(ROOT_NOTE + keyMap[last]);
        } else {
            triggerNoteOff();
        }
    }
});

document.addEventListener('mousedown', () => {
    if(!isAudioStarted) initAudio();
});

</script>
</body>
</html>
