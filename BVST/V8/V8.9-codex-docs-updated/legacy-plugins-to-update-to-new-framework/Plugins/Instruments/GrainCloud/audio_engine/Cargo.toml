[package]
name = "graincloud_engine"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
bvst_lib = { path = "../../../../System/bvst_lib" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

rand = { version = "0.8", features = ["small_rng"] } 
# Wait, I probably can't pull rand easily without checking if it's available or using a simple LCG.
# bvst_lib usually doesn't depend on rand. I'll implement a simple LCG for randomness to avoid dependency issues.
