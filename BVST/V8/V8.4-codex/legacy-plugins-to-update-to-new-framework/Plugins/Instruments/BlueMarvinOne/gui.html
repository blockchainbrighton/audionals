<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BlueMarvinOne</title>
    <style>
        body { margin: 0; padding: 0; background: #111; color: #fff; overflow: hidden; }
        #app-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <script type="module">
        import { BVST } from '../../../System/shared/plugin_core.js';

        const CONFIG = {
            name: "Blue Marvin One",
            midiMap: { note: 128, gate: 129 }, // Legacy Mapping
            keyboard: { startNote: 60, numKeys: 25 },
            modules: [
                {
                    name: "VCO 1 (Saw)",
                    controls: [
                        { type: 'knob', id: 'vco1_freq', label: 'Freq', param: 1, min: -24, max: 24, val: 0, step: 1 },
                        { type: 'knob', id: 'vco1_mix', label: 'Lvl', param: 2, min: 0, max: 1, val: 0.8, step: 0.01 }
                    ]
                },
                {
                    name: "VCO 2 (Pulse)",
                    controls: [
                        { type: 'knob', id: 'vco2_detune', label: 'Fine', param: 3, min: -50, max: 50, val: 5, step: 1 },
                        { type: 'knob', id: 'vco2_width', label: 'Width', param: 4, min: 0, max: 0.9, val: 0.5, step: 0.01 },
                        { type: 'knob', id: 'vco2_mix', label: 'Lvl', param: 5, min: 0, max: 1, val: 0.6, step: 0.01 }
                    ]
                },
                {
                    name: "VCF (Filter)",
                    controls: [
                        { type: 'knob', id: 'vcf_cutoff', label: 'Freq', param: 6, min: 100, max: 10000, val: 2000, step: 10 },
                        { type: 'knob', id: 'vcf_res', label: 'Res', param: 7, min: 0, max: 10, val: 5, step: 0.1 }
                    ]
                },
                {
                    name: "ADSR Env",
                    controls: [
                        { type: 'knob', id: 'env_a', label: 'A', param: 8, min: 0.001, max: 2, val: 0.05, step: 0.01 },
                        { type: 'knob', id: 'env_d', label: 'D', param: 9, min: 0.01, max: 2, val: 0.3, step: 0.01 },
                        { type: 'knob', id: 'env_s', label: 'S', param: 10, min: 0, max: 1, val: 0.5, step: 0.01 },
                        { type: 'knob', id: 'env_r', label: 'R', param: 11, min: 0.01, max: 4, val: 0.8, step: 0.01 }
                    ]
                },
                {
                    name: "Output",
                    controls: [
                        { type: 'knob', id: 'master_vol', label: 'Vol', param: 12, min: 0, max: 1, val: 0.7, step: 0.01 }
                    ]
                }
            ]
        };

        BVST.init(CONFIG);
    </script>
</body>
</html>
