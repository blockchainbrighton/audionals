<!DOCTYPE html>
<html>
<head>
    <title>BVST Studio</title>
    <style>
        /* Combined Styles */
        body { background: #1a1a1a; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        
        /* Launcher Styles */
        .launcher-container { text-align: center; padding: 40px; background: #2a2a2a; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-top: 10vh; transition: opacity 0.5s; }
        .launcher-container.hidden { display: none; opacity: 0; }
        .launcher-container.daw-mode { margin-top: 10px; padding: 14px; width: 100%; max-width: 1024px; border-radius: 10px; }
        .launcher-container.daw-mode h1 { font-size: 20px; margin-bottom: 8px; }
        .launcher-container.daw-mode p { margin: 6px 0; }
        
        /* Host/Rack Styles */
        .host-container { width: 100%; max-width: 1024px; text-align: center; display: none; opacity: 0; transition: opacity 0.5s; }
        .host-container.visible { display: block; opacity: 1; }
        
        h1 { margin-top: 0; color: #0f0; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 20px; }
        
        /* Inputs & Buttons */
        select { padding: 10px; font-size: 16px; width: 200px; border: none; border-radius: 4px; background: #333; color: white; outline: none; cursor: pointer; }
        select:focus { background: #444; }
        
        button { padding: 10px 20px; font-size: 16px; background: #0f0; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s, transform 0.1s; margin-left: 10px; }
        button:hover { background: #4f4; transform: scale(1.05); }
        button:active { transform: scale(0.95); }

        /* Rack Area */
        #rack { margin-top: 20px; }
        #rack iframe { border: none; width: 100%; height: 500px; background: #222; border-radius: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        #status { font-family: monospace; color: #888; margin-top: 10px; }

        /* Drag Overlay */
        #dropOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 255, 0, 0.2);
            border: 5px dashed #0f0;
            display: none; justify-content: center; align-items: center;
            font-size: 3rem; color: #0f0; pointer-events: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="dropOverlay">Drop Audio/MIDI Here</div>

    <!-- LAUNCHER SECTION -->
    <div class="launcher-container" id="launcher">
        <h1>BVST Studio</h1>
        <p style="margin-bottom: 8px;">Plugin group:</p>
        <select id="pluginGroup">
            <option value="">Loading...</option>
        </select>
        <p style="margin-top: 16px; margin-bottom: 8px;">Plugin:</p>
        <select id="pluginName" disabled>
            <option value="">Select a group...</option>
        </select>
        <br><br>
        <label style="color: #aaa; font-size: 14px;">
            <input type="checkbox" id="useMic"> Enable Audio Input (Microphone/FX Mode)
        </label>
        <br><br>
        <button id="btnAddToRack" onclick="launch()">Add To Rack</button>
        <button id="btnClearRack" onclick="clearRack()" style="background: #444; color: #ccc;">Clear Rack</button>
        <p id="launcherError" style="color: #f44; display: none; margin-top: 10px;"></p>
    </div>

    <!-- HOST SECTION -->
    <div class="host-container" id="host">
        <h1 id="hostTitle">BVST Rack</h1>

        <!-- TRANSPORT + TRACKS -->
        <div id="dawBar" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; margin: 10px auto; background: #222; padding: 10px; border-radius: 8px; border: 1px solid #333;">
            <div style="display:flex; gap:8px; align-items:center;">
                <button id="btnPlay" style="background:#444; color:#fff; padding:6px 14px; margin:0;">Play</button>
                <button id="btnStop" style="background:#444; color:#fff; padding:6px 14px; margin:0;">Stop</button>
                <button id="btnRec" style="background:#600; color:#fff; padding:6px 14px; margin:0;">Rec</button>
                <label style="color:#aaa; font-size: 13px; display:flex; align-items:center; gap:6px; margin-left:6px;">
                    <input type="checkbox" id="loopEnabled" checked> Loop (1 bar)
                </label>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <label style="color:#aaa; font-size: 13px; display:flex; align-items:center; gap:6px;">
                    BPM <input id="bpm" type="number" min="20" max="300" value="120" style="width:80px; padding:6px; border-radius:4px; border:none; background:#333; color:#fff;">
                </label>
                <label style="color:#aaa; font-size: 13px; display:flex; align-items:center; gap:6px;">
                    Bars <input id="clipBars" type="number" min="1" max="16" value="1" style="width:60px; padding:6px; border-radius:4px; border:none; background:#333; color:#fff;">
                </label>
                <label style="color:#aaa; font-size: 13px; display:flex; align-items:center; gap:6px;">
                    MIDI In
                    <select id="hostMidiIn" class="bvst-select" style="width:180px; padding:6px; background:#333; color:#fff; border:none; border-radius:4px;"></select>
                </label>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button id="btnAddTrack" style="background:#444; color:#fff; padding:6px 14px; margin:0;">+ Track</button>
                <button id="btnRemoveTrack" style="background:#444; color:#fff; padding:6px 14px; margin:0;">- Track</button>
                <button id="btnSaveProject" style="background:#444; color:#fff; padding:6px 14px; margin:0;">Save</button>
                <button id="btnLoadProject" style="background:#444; color:#fff; padding:6px 14px; margin:0;">Load</button>
                <div id="trackList" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;"></div>
            </div>
        </div>
        
        <!-- MIDI PLAYER SECTION -->
        <div id="midiPlayer" style="display: none; margin: 10px auto; background: #2a2a2a; padding: 10px; border-radius: 4px; width: fit-content; border: 1px solid #444;">
            <span style="font-weight: bold; margin-right: 10px; color: #aaa;">MIDI File Loaded</span>
            <button onclick="playMidi()" style="background: #444; color: #fff; padding: 5px 15px;">Play</button>
            <button onclick="stopMidi()" style="background: #444; color: #fff; padding: 5px 15px;">Stop</button>
        </div>

        <div id="rack"></div>

        <!-- PIANO ROLL -->
        <div id="pianoRollWrap" style="margin-top: 14px; background:#222; border:1px solid #333; border-radius:8px; padding:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                <div id="pianoRollTitle" style="color:#aaa; font-size:13px;">Piano Roll — click to toggle notes</div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <label style="color:#aaa; font-size: 13px; display:flex; align-items:center; gap:6px;">
                        Quantize
                        <select id="quantize" style="padding:6px; background:#333; color:#fff; border:none; border-radius:4px;">
                            <option value="16" selected>1/16</option>
                            <option value="8">1/8</option>
                            <option value="4">1/4</option>
                        </select>
                    </label>
                    <button id="btnClearClip" style="background:#444; color:#fff; padding:6px 14px; margin:0;">Clear Clip</button>
                </div>
            </div>
            <canvas id="pianoRoll" width="980" height="260" style="width:100%; height:260px; display:block; margin-top:10px; background:#111; border-radius:6px;"></canvas>
        </div>

        <!-- AUTOMATION LANE -->
        <div id="automationWrap" style="margin-top: 12px; background:#222; border:1px solid #333; border-radius:8px; padding:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                <div style="color:#aaa; font-size:13px;">Automation — select a plugin + parameter, then click/drag to draw</div>
                <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                    <label style="color:#aaa; font-size: 13px; display:flex; align-items:center; gap:6px;">
                        Plugin
                        <select id="autoPlugin" style="padding:6px; background:#333; color:#fff; border:none; border-radius:4px; width:220px;"></select>
                    </label>
                    <label style="color:#aaa; font-size: 13px; display:flex; align-items:center; gap:6px;">
                        Param
                        <select id="autoParam" style="padding:6px; background:#333; color:#fff; border:none; border-radius:4px; width:240px;"></select>
                    </label>
                    <button id="btnClearAutomation" style="background:#444; color:#fff; padding:6px 14px; margin:0;">Clear Lane</button>
                </div>
            </div>
            <canvas id="automationLane" width="980" height="140" style="width:100%; height:140px; display:block; margin-top:10px; background:#111; border-radius:6px;"></canvas>
        </div>

        <input id="projectFileInput" type="file" accept="application/json" style="display:none;" />

        <div id="status">Initializing...</div>
        <button onclick="reset()" style="margin-top: 20px; background: #444; color: #ccc;">Reset Page</button>
    </div>

    <script type="module">
        import { MidiParser } from './shared/midi_parser.js';

	        let audioCtx = null;
	        let workletModulesLoaded = false;

	        // --- DAW / Project State ---
	        const slotsByInstanceId = new Map(); // instanceId -> slot (across all tracks)

	        const project = {
	            bpm: 120,
	            beatsPerBar: 4,
	            stepsPerBar: 16, // 1 bar @ 1/16 grid
	            clipBars: 1,
	            loopEnabled: true,
	            tracks: []
	        };
	        let activeTrackId = null;
	        let activeInstanceId = null; // active (focused) plugin instance in the rack UI

	        const transport = {
	            playing: false,
	            recording: false,
	            startAudioTime: 0,
	            playStartStep: 0,
	            stepDurSec: 0,
	            nextScheduleStep: 0,
	            nextScheduleTime: 0,
	            scheduledTimeouts: [],
	            rafId: null,
	            activeNotes: new Set() // key `${trackId}:${note}`
	        };
	        let playheadStep = 0; // 0..stepsPerBar-1

	        const recordState = {
	            // key = `${trackId}:${note}` -> { step, audioTime }
	            activeNotes: new Map(),
	            lastAutomation: new Map() // key `${trackId}:${instanceId}:${paramId}:${step}` -> value
	        };

	        const pianoRoll = {
	            canvas: null,
	            ctx: null,
	            pitchMin: 36,
	            pitchMax: 84,
	            isPointerDown: false,
	            paintMode: null, // 'add' | 'erase'
	            lastPaintKey: null
	        };

	        const automationUI = {
	            canvas: null,
	            ctx: null,
	            isPointerDown: false,
	            activeInstanceId: null,
	            activeParamId: null,
	            lastPaintKey: null
	        };

	        const pluginsByPath = new Map(); // pluginPath -> { name, path, type, category, subgroup, groupLabel }
	        const pluginsCatalog = {
	            instruments: [], // { name, path, groupLabel }
	            inserts: [] // { name, path, groupLabel }
	        };

        const wasmCache = new Map(); // wasmUrl -> ArrayBuffer

	        let micStream = null;
	        let micSource = null;
	        let masterGain = null;

	        let rafVisId = null;

	        // MIDI State
	        let midiEvents = [];
	        let midiPPQ = 96;
	        let midiPlaying = false;
	        let midiTimeouts = [];

	        // Host MIDI (WebMIDI) state
	        let hostMidiAccess = null;
	        let hostMidiInput = null;

        function setStatus(msg, color = '#888') {
            const el = document.getElementById('status');
            if (!el) return;
            el.innerText = msg;
            el.style.color = color;
        }

        // Allow Enter key
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !document.getElementById('launcher').classList.contains('hidden')) {
                launch();
            }
        });

        // Initialize Dropdowns (Group -> Plugin)
	        async function populateSynths() {
            const groupSelect = document.getElementById('pluginGroup');
            const pluginSelect = document.getElementById('pluginName');
            try {
                const res = await fetch('/api/synths');
                if (!res.ok) throw new Error('Failed to fetch plugins');
                const synths = await res.json();

                const entries = Array.isArray(synths) ? synths : [];
                const groups = new Map();
                pluginsByPath.clear();
                pluginsCatalog.instruments = [];
                pluginsCatalog.inserts = [];

                for (const entry of entries) {
                    const name = typeof entry === 'string' ? entry : entry.name;
                    const path = typeof entry === 'string' ? `Synths/${entry}` : entry.path;
                    const type = typeof entry === 'string' ? 'Synth' : (entry.type || 'Plugin');
                    const category = typeof entry === 'string'
                        ? 'Legacy'
                        : (entry.category || (typeof path === 'string' && path.startsWith('Plugins/') ? path.split('/')[1] : 'Legacy'));
                    const subgroup = typeof entry === 'string' ? 'Synths' : (entry.subgroup || '');

                    const groupLabel =
                        category === 'Instruments'
                            ? (subgroup || 'Synths')
                            : category;

                    if (!name || !path) continue;
                    if (!groups.has(groupLabel)) groups.set(groupLabel, []);
                    const meta = { name, path, type, category, subgroup, groupLabel };
                    groups.get(groupLabel).push(meta);
                    pluginsByPath.set(path, meta);

                    const catLower = String(category || '').toLowerCase();
                    const typeLower = String(type || '').toLowerCase();
                    const isInstrument =
                        String(path || '').startsWith('Plugins/Instruments/') ||
                        String(path || '').startsWith('Synths/') ||
                        catLower === 'instruments' ||
                        typeLower === 'instrument' ||
                        typeLower === 'synth' ||
                        subgroup === 'Synths' ||
                        subgroup === 'Samplers' ||
                        subgroup === 'Sequencers';
                    if (isInstrument) pluginsCatalog.instruments.push(meta);
                    else pluginsCatalog.inserts.push(meta);
                }

                pluginsCatalog.instruments.sort((a, b) => String(a.groupLabel).localeCompare(String(b.groupLabel)) || a.name.localeCompare(b.name));
                pluginsCatalog.inserts.sort((a, b) => String(a.groupLabel).localeCompare(String(b.groupLabel)) || a.name.localeCompare(b.name));

                const groupOrder = ['Synths', 'Samplers', 'Sequencers', 'Effects', 'Dynamics', 'Modulation', 'Utility', 'Legacy'];

                groupSelect.innerHTML = '';
                pluginSelect.innerHTML = '<option value="">Select a group...</option>';
                pluginSelect.disabled = true;

                const sortedGroupNames = Array.from(groups.keys()).sort((a, b) => {
                    const ia = groupOrder.indexOf(a);
                    const ib = groupOrder.indexOf(b);
                    if (ia !== -1 || ib !== -1) return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
                    return a.localeCompare(b);
                });

                if (sortedGroupNames.length === 0) {
                    groupSelect.innerHTML = '<option value="">No Plugins Found</option>';
                    groupSelect.disabled = true;
                    pluginSelect.innerHTML = '<option value="">No Plugins Found</option>';
                    pluginSelect.disabled = true;
                    return;
                }

                for (const g of sortedGroupNames) {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.text = `${g} (${groups.get(g).length})`;
                    groupSelect.add(opt);
                }
                groupSelect.disabled = false;

                const populatePluginsForGroup = (groupName, preferredPlugin = null) => {
                    const list = (groups.get(groupName) || []).slice().sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
                    pluginSelect.innerHTML = '';
                    pluginSelect.disabled = list.length === 0;

                    if (list.length === 0) {
                        pluginSelect.innerHTML = '<option value="">No Plugins Found</option>';
                        return;
                    }

                    list.forEach(it => {
                        const opt = document.createElement('option');
                        opt.value = it.path;
                        opt.dataset.name = it.name;
                        opt.dataset.type = it.type;
                        opt.text = `${it.name} (${it.type})`;
                        pluginSelect.add(opt);
                    });

                    if (preferredPlugin) {
                        const match = Array.from(pluginSelect.querySelectorAll('option')).find(o => o.dataset.name === preferredPlugin || o.value === preferredPlugin);
                        if (match) pluginSelect.value = match.value;
                    }

                    const selOpt = pluginSelect.options[pluginSelect.selectedIndex];
                    if (selOpt) {
                        const btn = document.getElementById('btnAddToRack');
                        if (btn) btn.innerText = `Add ${selOpt.dataset.name || selOpt.text}`;
                    }
                };

                groupSelect.onchange = () => populatePluginsForGroup(groupSelect.value);

                const urlParams = new URLSearchParams(window.location.search);
                const urlSynth = urlParams.get('synth');
                if (urlSynth) {
                    let found = null;
                    for (const [g, list] of groups.entries()) {
                        const match = list.find(it => it.name === urlSynth || it.path === urlSynth);
                        if (match) { found = { group: g, plugin: match.path }; break; }
                    }
                    if (found) {
                        groupSelect.value = found.group;
                        populatePluginsForGroup(found.group, found.plugin);
                        if (getAllSlots().length === 0) {
                            // Auto-add when opening deep link like ?synth=BamMono
                            setTimeout(() => window.launch(), 0);
                        }
                        return;
                    }
                }

                const defaultGroup = groups.has('Synths') ? 'Synths' : sortedGroupNames[0];
                groupSelect.value = defaultGroup;
                populatePluginsForGroup(defaultGroup);
            } catch (e) {
                console.error(e);
                groupSelect.innerHTML = '<option value="">Error loading plugins</option>';
                groupSelect.disabled = true;
                pluginSelect.innerHTML = '<option value="">Error loading plugins</option>';
                pluginSelect.disabled = true;
            }
	        }
        populateSynths();

	        // Initialize DAW model/UI (even before any plugin is added).
	        ensureProjectDefaults();
	        const bpmEl = document.getElementById('bpm');
	        if (bpmEl) bpmEl.value = String(project.bpm);
	        const barsEl = document.getElementById('clipBars');
	        if (barsEl) barsEl.value = String(project.clipBars);
	        const loopEl = document.getElementById('loopEnabled');
	        if (loopEl) loopEl.checked = !!project.loopEnabled;
	        renderTrackList();
	        initPianoRoll();
	        drawPianoRoll();
	        initAutomationUI();
	        populateAutomationSelectors();
	        drawAutomationLane();
	        initHostMidi();

        document.getElementById('useMic')?.addEventListener('change', async (e) => {
            const checked = !!(e && e.target && e.target.checked);
            if (checked) {
                try {
                    await ensureMicSource();
                } catch (err) {
                    console.warn('Microphone access denied or failed:', err);
                    alert('Microphone access failed. Rack will run without input.');
                    e.target.checked = false;
                }
            }
            rebuildAudioGraph();
        });

	        document.getElementById('pluginName').addEventListener('change', function() {
	            const opt = this.options[this.selectedIndex];
	            const label = opt ? (opt.dataset.name || opt.text) : '';
	            const btn = document.getElementById('btnAddToRack');
	            if (label && btn) btn.innerText = `Add ${label}`;
	        });

		        document.getElementById('btnAddTrack')?.addEventListener('click', () => {
	            ensureProjectDefaults();
	            const n = project.tracks.length + 1;
	            const id = makeTrackId();
	            project.tracks.push({
	                id,
	                name: `Track ${n}`,
	                armed: false,
	                muted: false,
	                solo: false,
	                gain: 1.0,
	                slots: [],
	                clip: { notes: [], automation: [] }
	            });
		            activeTrackId = id;
		            activeInstanceId = null;
		            const title = document.getElementById('hostTitle');
		            if (title) title.innerText = `BVST Rack — Track ${n}`;
		            renderTrackList();
		            renderRack();
		            drawPianoRoll();
		            populateAutomationSelectors();
		            drawAutomationLane();
		            rebuildAudioGraph();
		        });

		        document.getElementById('btnRemoveTrack')?.addEventListener('click', () => {
		            ensureProjectDefaults();
		            if (project.tracks.length <= 1) return;
		            if (transport.playing) stopTransport();
		            const idx = project.tracks.findIndex((t) => t.id === activeTrackId);
		            const track = idx >= 0 ? project.tracks[idx] : null;
		            if (!track) return;

	            // Remove and clean up slot instances.
	            for (const slot of track.slots || []) {
	                slotsByInstanceId.delete(slot.instanceId);
	                try { slot.node.disconnect(); } catch (_) {}
	                try { slot.analyser.disconnect(); } catch (_) {}
	                try { slot.iframe.remove(); } catch (_) {}
	            }

		            project.tracks.splice(idx, 1);
		            activeTrackId = project.tracks[Math.max(0, idx - 1)].id;
		            activeInstanceId = null;
		            const newTrack = getActiveTrack();
		            const title = document.getElementById('hostTitle');
		            if (title) title.innerText = newTrack ? `BVST Rack — ${newTrack.name}` : 'BVST Rack';
		            renderTrackList();
		            renderRack();
		            drawPianoRoll();
		            populateAutomationSelectors();
		            drawAutomationLane();
		            rebuildAudioGraph();
		        });

		        document.getElementById('btnSaveProject')?.addEventListener('click', () => {
		            try {
		                const doc = serializeProject();
		                const name = `bvst_project_${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
		                downloadJson(name, doc);
		                setStatus(`Saved ${name}`, '#0f0');
		            } catch (e) {
		                console.error(e);
		                setStatus(`Save failed: ${e && e.message ? e.message : String(e)}`, '#f44');
		            }
		        });

		        document.getElementById('btnLoadProject')?.addEventListener('click', () => {
		            const input = document.getElementById('projectFileInput');
		            if (!input) return;
		            input.value = '';
		            input.click();
		        });

		        document.getElementById('projectFileInput')?.addEventListener('change', async (e) => {
		            const file = e && e.target && e.target.files ? e.target.files[0] : null;
		            if (!file) return;
		            try {
		                const text = await file.text();
		                const doc = JSON.parse(text);
		                await loadProjectDocument(doc);
		            } catch (err) {
		                console.error(err);
		                setStatus(`Load failed: ${err && err.message ? err.message : String(err)}`, '#f44');
		                alert(`Load failed: ${err && err.message ? err.message : String(err)}`);
		            }
		        });

	        document.getElementById('bpm')?.addEventListener('change', (e) => {
	            const v = Number(e.target.value);
	            if (!Number.isFinite(v) || v <= 0) return;
	            project.bpm = v;
	            if (transport.playing) stopTransport();
	            setStatus(`BPM: ${v}`, '#888');
	        });

	        document.getElementById('clipBars')?.addEventListener('change', (e) => {
	            const v = Math.max(1, Math.min(16, Math.trunc(Number(e.target.value) || 1)));
	            project.clipBars = v;
	            e.target.value = String(v);
	            if (transport.playing) stopTransport();

	            // Clamp existing events to new length.
	            const maxStep = getClipSteps() - 1;
	            for (const track of project.tracks) {
	                if (!track || !track.clip) continue;
	                track.clip.notes = (track.clip.notes || []).filter((n) => n && Number(n.step) >= 0 && Number(n.step) <= maxStep);
	                track.clip.automation = (track.clip.automation || []).filter((a) => a && Number(a.step) >= 0 && Number(a.step) <= maxStep);
	                rebuildTrackIndexes(track);
	            }

	            playheadStep = Math.min(playheadStep, maxStep);
	            drawPianoRoll();
	            populateAutomationSelectors();
	            drawAutomationLane();
	            setStatus(`Clip length: ${v} bar${v === 1 ? '' : 's'}`, '#888');
	        });

	        document.getElementById('loopEnabled')?.addEventListener('change', (e) => {
	            project.loopEnabled = !!(e && e.target && e.target.checked);
	        });

	        document.getElementById('btnPlay')?.addEventListener('click', async () => {
	            if (transport.playing) return;
	            try {
	                await startTransport();
	            } catch (e) {
	                console.error(e);
	                setStatus(`Play failed: ${e && e.message ? e.message : String(e)}`, '#f44');
	            }
	        });

	        document.getElementById('btnStop')?.addEventListener('click', () => {
	            stopTransport();
	        });

	        document.getElementById('btnRec')?.addEventListener('click', () => {
	            toggleRecording();
	        });

	        document.getElementById('quantize')?.addEventListener('change', () => {
	            drawPianoRoll();
	        });

		        document.getElementById('btnClearClip')?.addEventListener('click', () => {
		            const clip = getActiveClip();
		            if (!clip) return;
		            clip.notes = [];
		            clip.automation = [];
		            const track = getActiveTrack();
		            if (track) rebuildTrackIndexes(track);
		            drawPianoRoll();
		            drawAutomationLane();
		            setStatus('Clip cleared', '#888');
		        });

		        document.getElementById('btnClearAutomation')?.addEventListener('click', () => {
		            const target = getSelectedAutomationTarget();
		            const track = getActiveTrack();
		            if (!target || !track || !track.clip) return;
		            track.clip.automation = (track.clip.automation || []).filter((a) => !(a && a.instanceId === target.instanceId && a.paramId === target.paramId));
		            rebuildTrackIndexes(track);
		            drawAutomationLane();
		            setStatus('Automation lane cleared (shift-click also clears step)', '#888');
		        });

	        function makeInstanceId() {
	            const a = Math.random().toString(36).slice(2, 8);
	            const b = Date.now().toString(36);
	            return `bvst_${b}_${a}`;
	        }

	        function makeTrackId() {
	            const a = Math.random().toString(36).slice(2, 7);
	            const b = Date.now().toString(36);
	            return `trk_${b}_${a}`;
	        }

	        function getTrack(trackId) {
	            return project.tracks.find((t) => t.id === trackId) || null;
	        }

	        function getActiveTrack() {
	            if (!activeTrackId && project.tracks.length > 0) activeTrackId = project.tracks[0].id;
	            return getTrack(activeTrackId);
	        }

	        function getActiveSlots() {
	            const t = getActiveTrack();
	            return t ? t.slots : [];
	        }

	        function getAllSlots() {
	            const out = [];
	            for (const t of project.tracks) {
	                if (t && Array.isArray(t.slots)) out.push(...t.slots);
	            }
	            return out;
	        }

	        function isInstrumentSlot(slot) {
	            if (slot && slot.isInstrument === true) return true;
	            const t = String(slot?.type || '').toLowerCase();
	            if (t === 'instrument' || t === 'synth') return true;
	            const p = String(slot?.pluginPath || '');
	            if (p.startsWith('Plugins/Instruments/') || p.startsWith('Synths/')) return true;
	            const sg = String(slot?.subgroup || '');
	            return sg === 'Synths' || sg === 'Samplers' || sg === 'Sequencers';
	        }

	        function isSamplerSlot(slot) {
	            const sg = String(slot?.subgroup || '');
	            return sg === 'Samplers';
	        }

	        function getSwapChoicesForSlot(slot, forcedRole = null) {
	            // Main idea: instruments swap with instruments; inserts swap with non-instruments.
	            const isInstr = forcedRole === 'instrument' ? true : forcedRole === 'insert' ? false : isInstrumentSlot(slot);
	            const items = isInstr ? pluginsCatalog.instruments : pluginsCatalog.inserts;
	            // Group by groupLabel for optgroups.
	            const byGroup = new Map();
	            for (const it of items) {
	                const g = it.groupLabel || (isInstr ? 'Synths' : 'Effects');
	                if (!byGroup.has(g)) byGroup.set(g, []);
	                byGroup.get(g).push(it);
	            }
	            // Sort group names in a stable, friendly order.
	            const groupOrder = isInstr
	                ? ['Synths', 'Samplers', 'Sequencers', 'Legacy']
	                : ['Effects', 'Dynamics', 'Modulation', 'Utility', 'Legacy', 'Instruments'];
	            const groupNames = Array.from(byGroup.keys()).sort((a, b) => {
	                const ia = groupOrder.indexOf(a);
	                const ib = groupOrder.indexOf(b);
	                if (ia !== -1 || ib !== -1) return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
	                return String(a).localeCompare(String(b));
	            });
	            return { groupNames, byGroup };
	        }

	        function getInstrumentSlotForTrack(track) {
	            if (!track) return null;
	            return (track.slots || []).find(isInstrumentSlot) || null;
	        }

	        function getStepDurSec() {
	            // 1/16 note @ 4/4: step = quarter/4
	            const bpm = Number(project.bpm) || 120;
	            return (60.0 / bpm) / 4.0;
	        }

	        function getClipSteps() {
	            const bars = Math.max(1, Math.trunc(Number(project.clipBars) || 1));
	            return bars * project.stepsPerBar;
	        }

	        function ensureProjectDefaults() {
	            if (project.tracks.length > 0) return;
	            project.clipBars = Math.max(1, Math.trunc(Number(project.clipBars) || 1));
	            const id = makeTrackId();
	            project.tracks.push({
	                id,
	                name: 'Track 1',
	                armed: true,
	                muted: false,
	                solo: false,
	                gain: 1.0,
	                slots: [],
	                clip: {
	                    // steps are 0..stepsPerBar-1, repeats with loop
	                    notes: [],
	                    automation: [] // { step, instanceId, paramId, value }
	                }
	            });
	            activeTrackId = id;
	        }

	        function rebuildTrackIndexes(track) {
	            if (!track || !track.clip) return;
	            const steps = getClipSteps();
	            const notesByStep = Array.from({ length: steps }, () => []);
	            const automationByStep = Array.from({ length: steps }, () => []);

	            for (const n of track.clip.notes || []) {
	                if (!n) continue;
	                const s = Number(n.step);
	                if (!Number.isFinite(s) || s < 0 || s >= steps) continue;
	                notesByStep[s].push(n);
	            }
	            for (const a of track.clip.automation || []) {
	                if (!a) continue;
	                const s = Number(a.step);
	                if (!Number.isFinite(s) || s < 0 || s >= steps) continue;
	                automationByStep[s].push(a);
	            }

	            track._notesByStep = notesByStep;
	            track._automationByStep = automationByStep;
	        }

	        function rebuildAllTrackIndexes() {
	            for (const t of project.tracks) rebuildTrackIndexes(t);
	        }

	        function serializeProject() {
	            const doc = {
	                schema: 'bvst.project/v1',
	                savedAt: new Date().toISOString(),
	                bpm: project.bpm,
	                clipBars: project.clipBars,
	                loopEnabled: !!project.loopEnabled,
	                activeTrackId,
	                playheadStep,
	                tracks: project.tracks.map((t) => ({
	                    id: t.id,
	                    name: t.name,
	                    armed: !!t.armed,
	                    muted: !!t.muted,
	                    solo: !!t.solo,
	                    gain: Number.isFinite(Number(t.gain)) ? Number(t.gain) : 1.0,
	                    clip: {
	                        notes: Array.isArray(t.clip?.notes) ? t.clip.notes : [],
	                        automation: Array.isArray(t.clip?.automation) ? t.clip.automation : []
	                    },
	                    slots: (t.slots || []).map((s) => ({
	                        instanceId: s.instanceId,
	                        pluginPath: s.pluginPath,
	                        displayName: s.displayName,
	                        bypass: !!s.bypass,
	                        expanded: !!s.expanded
	                    }))
	                }))
	            };
	            return doc;
	        }

	        function downloadJson(filename, obj) {
	            const json = JSON.stringify(obj, null, 2);
	            const blob = new Blob([json], { type: 'application/json' });
	            const url = URL.createObjectURL(blob);
	            const a = document.createElement('a');
	            a.href = url;
	            a.download = filename;
	            document.body.appendChild(a);
	            a.click();
	            a.remove();
	            setTimeout(() => URL.revokeObjectURL(url), 500);
	        }

	        function destroyAllSlots() {
	            for (const slot of getAllSlots()) {
	                slotsByInstanceId.delete(slot.instanceId);
	                try { slot.node.disconnect(); } catch (_) {}
	                try { slot.analyser.disconnect(); } catch (_) {}
	                try { slot.iframe.remove(); } catch (_) {}
	            }
	        }

	        async function replaceSlotPlugin(instanceId, newPluginPath) {
	            const slot = slotsByInstanceId.get(instanceId);
	            if (!slot) return;
	            if (!newPluginPath || newPluginPath === slot.pluginPath) return;

	            const track = slot.trackId ? getTrack(slot.trackId) : null;
	            const meta = pluginsByPath.get(newPluginPath);
	            if (!meta) throw new Error(`Unknown plugin: ${newPluginPath}`);

	            setStatus(`Replacing ${slot.displayName} → ${meta.name}...`, '#888');
	            slot.isReplacing = true;
	            renderRack();

	            // Clear automation targeting this slot instance (param IDs may not match the new plugin).
	            if (track && track.clip && Array.isArray(track.clip.automation)) {
	                track.clip.automation = track.clip.automation.filter((a) => !(a && a.instanceId === slot.instanceId));
	                rebuildTrackIndexes(track);
	            }
	            for (const k of Array.from(recordState.lastAutomation.keys())) {
	                if (k.includes(`:${slot.instanceId}:`)) recordState.lastAutomation.delete(k);
	            }

	            // Tear down old resources.
	            try { slot.node.disconnect(); } catch (_) {}
	            try { slot.analyser.disconnect(); } catch (_) {}
	            try { slot.iframe?.remove(); } catch (_) {}

	            await ensureWorkletModules();
	            const ctx = await ensureAudioContext();

	            const synthPath = `../${newPluginPath}`;
	            const manifestUrl = appendQuery(`${synthPath}/manifest.json`, { t: Date.now() });
	            const manifestReq = await fetch(manifestUrl);
	            if (!manifestReq.ok) throw new Error(`Manifest not found for '${meta.name}'`);
	            const manifest = await manifestReq.json();

	            const node = new AudioWorkletNode(ctx, 'bvst-processor', {
	                numberOfInputs: 1,
	                numberOfOutputs: 1,
	                outputChannelCount: [2]
	            });

	            const wasmUrl = `${synthPath}/${manifest.components.audio_engine}`;
	            const wasmBytes = await getWasmBytes(wasmUrl);
	            node.port.postMessage({
	                type: 'INIT_WASM',
	                wasmBytes: wasmBytes.slice(0),
	                pluginId: meta.name,
	                manifestName: manifest.name
	            });

	            // Load patch.json for automation param discovery.
	            let patchConfig = null;
	            try {
	                const patchReq = await fetch(appendQuery(`${synthPath}/patch.json`, { t: Date.now() }), { cache: 'no-store' });
	                if (patchReq.ok) {
	                    const patchDoc = await patchReq.json();
	                    patchConfig = (patchDoc && patchDoc.config) ? patchDoc.config : patchDoc;
	                }
	            } catch (e) {
	                console.warn('Patch load failed (automation params may be unavailable):', e);
	            }
	            const paramMeta = new Map();
	            try {
	                const modules = patchConfig && Array.isArray(patchConfig.modules) ? patchConfig.modules : [];
	                for (const mod of modules) {
	                    const controls = mod && Array.isArray(mod.controls) ? mod.controls : [];
	                    for (const c of controls) {
	                        const pid = Number(c && c.param);
	                        if (!Number.isFinite(pid) || pid < 0) continue;
	                        if (paramMeta.has(pid)) continue;
	                        paramMeta.set(pid, {
	                            paramId: pid,
	                            controlId: c.id,
	                            label: c.label,
	                            type: c.type,
	                            options: c.options,
	                            min: c.min,
	                            max: c.max,
	                            curve: c.curve || 'linear'
	                        });
	                    }
	                }
	            } catch (_) {}

	            const iframe = document.createElement('iframe');
	            iframe.src = appendQuery(`${synthPath}/${manifest.components.ui_html}`, { t: Date.now(), instanceId: slot.instanceId, hostMidi: 1 });

	            // Mutate the existing slot object to keep instanceId stable.
	            slot.pluginPath = newPluginPath;
	            slot.displayName = meta.name;
	            slot.manifest = manifest;
	            slot.type = meta.type || manifest.type;
	            slot.category = meta.category;
	            slot.subgroup = meta.subgroup;
	            slot.isInstrument =
	                (String(meta.category || '').toLowerCase() === 'instruments' ||
	                 String(meta.subgroup || '') === 'Synths' ||
	                 String(meta.subgroup || '') === 'Samplers' ||
	                 String(meta.subgroup || '') === 'Sequencers' ||
	                 String(newPluginPath || '').startsWith('Plugins/Instruments/') ||
	                 String(newPluginPath || '').startsWith('Synths/') ||
	                 String(manifest?.type || '').toLowerCase() === 'instrument');
	            slot.node = node;
	            slot.iframe = iframe;
	            slot.analyser = ctx.createAnalyser();
	            slot.analyser.fftSize = 2048;
	            slot.paramMeta = paramMeta;
	            slot.ready = false;
	            slot.guiLoaded = false;
	            slot.visMode = 'off';
	            slot._visFloat = null;
	            slot._visByte = null;
	            // Keep expanded if it was expanded; otherwise default based on role.
	            if (slot.expanded === undefined) slot.expanded = isInstrumentSlot(slot);
	            if (isInstrumentSlot(slot)) slot.expanded = true;

	            iframe.onload = () => {
	                slot.guiLoaded = true;
	                if (slot.ready && iframe.contentWindow) {
	                    iframe.contentWindow.postMessage({ type: 'BVST_READY', instanceId: slot.instanceId }, '*');
	                }
	            };

	            node.port.onmessage = (e) => {
	                const data = e && e.data ? e.data : {};
	                if (data.type === 'READY') {
	                    slot.ready = true;
	                    setStatus(`Running: ${slot.displayName}`, '#0f0');
	                    if (slot.guiLoaded && slot.iframe.contentWindow) {
	                        slot.iframe.contentWindow.postMessage({ type: 'BVST_READY', instanceId: slot.instanceId }, '*');
	                    }
	                    renderRack();
	                    populateAutomationSelectors();
	                    drawAutomationLane();
	                } else if (data.type === 'ERROR') {
	                    setStatus(`Error (${slot.displayName}): ${data.error}`, '#f44');
	                }
	            };

	            slot.isReplacing = false;
	            rebuildAudioGraph();
	            renderRack();
	            populateAutomationSelectors();
	            drawAutomationLane();
	            setStatus(`Replaced slot → ${slot.displayName}`, '#0f0');
	        }

	        async function loadProjectDocument(doc) {
	            stopTransport();
	            stopMidi();

	            destroyAllSlots();
	            slotsByInstanceId.clear();
	            project.tracks = [];

	            project.bpm = Number.isFinite(Number(doc?.bpm)) ? Number(doc.bpm) : 120;
	            project.clipBars = Math.max(1, Math.min(16, Math.trunc(Number(doc?.clipBars) || 1)));
	            project.loopEnabled = !!doc?.loopEnabled;

	            const bpmEl = document.getElementById('bpm');
	            if (bpmEl) bpmEl.value = String(project.bpm);
	            const barsEl = document.getElementById('clipBars');
	            if (barsEl) barsEl.value = String(project.clipBars);
	            const loopEl = document.getElementById('loopEnabled');
	            if (loopEl) loopEl.checked = !!project.loopEnabled;

	            const trackDocs = Array.isArray(doc?.tracks) ? doc.tracks : [];
	            if (trackDocs.length === 0) {
	                ensureProjectDefaults();
	            } else {
	                for (const td of trackDocs) {
	                    const id = (td && typeof td.id === 'string' && td.id) ? td.id : makeTrackId();
	                    project.tracks.push({
	                        id,
	                        name: (td && typeof td.name === 'string' && td.name) ? td.name : 'Track',
	                        armed: !!td?.armed,
	                        muted: !!td?.muted,
	                        solo: !!td?.solo,
	                        gain: Number.isFinite(Number(td?.gain)) ? Number(td.gain) : 1.0,
	                        gainNode: null,
	                        slots: [],
	                        clip: {
	                            notes: Array.isArray(td?.clip?.notes) ? td.clip.notes : [],
	                            automation: Array.isArray(td?.clip?.automation) ? td.clip.automation : []
	                        }
	                    });
	                }
	            }

	            activeTrackId =
	                (doc && typeof doc.activeTrackId === 'string' && getTrack(doc.activeTrackId))
	                    ? doc.activeTrackId
	                    : (project.tracks[0] ? project.tracks[0].id : null);

	            playheadStep = Math.max(0, Math.trunc(Number(doc?.playheadStep) || 0));
	            playheadStep = Math.min(playheadStep, Math.max(0, getClipSteps() - 1));

	            rebuildAllTrackIndexes();
	            renderTrackList();

	            // Switch into DAW view.
	            document.getElementById('launcher')?.classList.add('hidden');
	            document.getElementById('host')?.classList.add('visible');

	            // Load plugin chains (sequentially for stability).
	            for (const td of trackDocs) {
	                const trackId = (td && typeof td.id === 'string' && td.id) ? td.id : null;
	                const track = trackId ? getTrack(trackId) : null;
	                if (!track) continue;
	                const slots = Array.isArray(td?.slots) ? td.slots : [];
	                for (const sd of slots) {
	                    if (!sd || !sd.pluginPath) continue;
	                    const displayName = sd.displayName || sd.pluginPath;
	                    const instanceId = (sd.instanceId && typeof sd.instanceId === 'string') ? sd.instanceId : undefined;
	                    await addPluginToRack(sd.pluginPath, displayName, {
	                        trackId: track.id,
	                        instanceId,
	                        bypass: !!sd.bypass,
	                        expanded: !!sd.expanded,
	                        suppressUrlUpdate: true
	                    });
	                }
	            }

	            const t = getActiveTrack();
	            const title = document.getElementById('hostTitle');
	            if (title) title.innerText = t ? `BVST Rack — ${t.name}` : 'BVST Rack';

	            renderRack();
	            populateAutomationSelectors();
	            drawPianoRoll();
	            drawAutomationLane();
	            rebuildAudioGraph();
	            setStatus('Project loaded', '#0f0');
	        }

	        function renderTrackList() {
	            const el = document.getElementById('trackList');
	            if (!el) return;
	            ensureProjectDefaults();
	            el.replaceChildren();

	            for (const track of project.tracks) {
	                const pill = document.createElement('button');
	                pill.style.padding = '6px 10px';
	                pill.style.fontSize = '12px';
	                pill.style.borderRadius = '999px';
	                pill.style.border = track.id === activeTrackId ? '1px solid #0f0' : '1px solid #444';
	                pill.style.background = track.id === activeTrackId ? '#1f2a1f' : '#333';
	                pill.style.color = '#fff';
	                pill.style.display = 'flex';
	                pill.style.alignItems = 'center';
	                pill.style.gap = '8px';
	                pill.style.cursor = 'pointer';

	                const name = document.createElement('span');
	                name.innerText = track.name;
	                pill.appendChild(name);

	                const arm = document.createElement('span');
	                arm.innerText = track.armed ? 'ARM' : 'arm';
	                arm.style.fontSize = '11px';
	                arm.style.padding = '2px 6px';
	                arm.style.borderRadius = '6px';
	                arm.style.background = track.armed ? '#0a0' : '#444';
	                arm.style.color = '#000';
	                arm.onclick = (e) => {
	                    e.stopPropagation();
	                    track.armed = !track.armed;
	                    renderTrackList();
	                };
	                pill.appendChild(arm);

	                const solo = document.createElement('span');
	                solo.innerText = track.solo ? 'S' : 's';
	                solo.style.fontSize = '11px';
	                solo.style.padding = '2px 6px';
	                solo.style.borderRadius = '6px';
	                solo.style.background = track.solo ? '#ff0' : '#444';
	                solo.style.color = '#000';
	                solo.onclick = (e) => {
	                    e.stopPropagation();
	                    track.solo = !track.solo;
	                    rebuildAudioGraph();
	                    renderTrackList();
	                };
	                pill.appendChild(solo);

	                const mute = document.createElement('span');
	                mute.innerText = track.muted ? 'M' : 'm';
	                mute.style.fontSize = '11px';
	                mute.style.padding = '2px 6px';
	                mute.style.borderRadius = '6px';
	                mute.style.background = track.muted ? '#f44' : '#444';
	                mute.style.color = '#000';
	                mute.onclick = (e) => {
	                    e.stopPropagation();
	                    track.muted = !track.muted;
	                    rebuildAudioGraph();
	                    renderTrackList();
	                };
	                pill.appendChild(mute);

	            pill.onclick = () => {
	                activeTrackId = track.id;
	                activeInstanceId = null;
	                const title = document.getElementById('hostTitle');
	                if (title) title.innerText = `BVST Rack — ${track.name}`;
	                renderTrackList();
	                renderRack();
	                drawPianoRoll();
	                populateAutomationSelectors();
	                drawAutomationLane();
	                rebuildAudioGraph();
	            };

	                el.appendChild(pill);
	            }
	        }

        function appendQuery(url, params) {
            try {
                const u = new URL(url, window.location.href);
                for (const [k, v] of Object.entries(params || {})) {
                    if (v === undefined || v === null) continue;
                    u.searchParams.set(k, String(v));
                }
                return u.toString();
            } catch (_) {
                const q = new URLSearchParams(params || {}).toString();
                if (!q) return url;
                return url.includes('?') ? `${url}&${q}` : `${url}?${q}`;
            }
        }

	        async function ensureAudioContext() {
	            if (!audioCtx) {
	                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
	            }
	            if (audioCtx.state === 'suspended') {
	                await audioCtx.resume();
	            }
	            if (!masterGain) {
	                masterGain = audioCtx.createGain();
	                masterGain.gain.value = 1.0;
	                masterGain.connect(audioCtx.destination);
	            }
	            return audioCtx;
	        }

        async function ensureWorkletModules() {
            const ctx = await ensureAudioContext();
            if (workletModulesLoaded) return;

            const shimUrl = `scripts/worklet_shim.js?t=${Date.now()}`;
            const processorUrl = `shared/processor_unified.js?t=${Date.now()}`;

            try {
                await ctx.audioWorklet.addModule(shimUrl);
                await ctx.audioWorklet.addModule(processorUrl);
                workletModulesLoaded = true;
            } catch (e) {
                const msg = (e && e.message) ? e.message : String(e);
                if (!msg.includes('already') && !msg.includes('exists')) {
                    throw new Error(`Failed to load shared processor: ${msg}`);
                }
                workletModulesLoaded = true;
            }
        }

        async function getWasmBytes(wasmUrl) {
            const key = String(wasmUrl);
            const cached = wasmCache.get(key);
            if (cached) return cached;
            const wasmReq = await fetch(appendQuery(key, { t: Date.now() }));
            if (!wasmReq.ok) throw new Error(`WASM file not found: ${key}`);
            const bytes = await wasmReq.arrayBuffer();
            wasmCache.set(key, bytes);
            return bytes;
        }

        async function ensureMicSource() {
            const ctx = await ensureAudioContext();
            if (micStream && micSource) return { stream: micStream, source: micSource };

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            micStream = stream;
            micSource = ctx.createMediaStreamSource(stream);
            return { stream: micStream, source: micSource };
        }

	        function findSlotByContentWindow(win) {
	            for (const slot of getAllSlots()) {
	                if (slot.iframe && slot.iframe.contentWindow === win) return slot;
	            }
	            return null;
	        }

        function getSlotForMessage(event) {
            const data = event && event.data ? event.data : {};
            const instanceId = (data && typeof data.instanceId === 'string') ? data.instanceId : null;
            if (instanceId && slotsByInstanceId.has(instanceId)) return slotsByInstanceId.get(instanceId);
            return findSlotByContentWindow(event.source);
        }

        let hostMessageListenerInstalled = false;
        function ensureHostMessageListener() {
            if (hostMessageListenerInstalled) return;
            hostMessageListenerInstalled = true;

            window.addEventListener('message', (event) => {
                const data = event && event.data ? event.data : null;
                if (!data || typeof data.type !== 'string') return;

                if (data.type === 'BVST_POWER') {
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume().catch(() => {});
                    }
                    return;
                }

                const slot = getSlotForMessage(event);
	                if (!slot) return;

	                if (data.type === 'BVST_PARAM') {
	                    slot.node?.port?.postMessage({ type: 'PARAM', id: data.id, value: data.value });
	                    const t = audioCtx ? audioCtx.currentTime : 0;
	                    recordAutomationParam(slot, Number(data.id), Number(data.value), t);
	                } else if (data.type === 'NOTE_ON') {
	                    slot.node?.port?.postMessage({ type: 'NOTE_ON', note: data.note, velocity: data.velocity });
	                    const track = slot.trackId ? getTrack(slot.trackId) : null;
	                    const t = audioCtx ? audioCtx.currentTime : 0;
	                    if (track) recordNoteOn(track, Number(data.note), Number(data.velocity) || 1.0, t);
	                } else if (data.type === 'NOTE_OFF') {
	                    slot.node?.port?.postMessage({ type: 'NOTE_OFF', note: data.note });
	                    const track = slot.trackId ? getTrack(slot.trackId) : null;
	                    const t = audioCtx ? audioCtx.currentTime : 0;
	                    if (track) recordNoteOff(track, Number(data.note), t);
	                } else if (data.type === 'MIDI_CC') {
	                    slot.node?.port?.postMessage({ type: 'MIDI_CC', cc: data.cc, value: data.value });
	                } else if (data.type === 'BVST_LOAD_SAMPLE_FROM_GUI') {
	                    slot.node?.port?.postMessage({ type: 'LOAD_SAMPLE', samples: data.samples });
                    setStatus(`Sample loaded into ${slot.displayName}`, '#0f0');
                } else if (data.type === 'BVST_VISUALIZER_MODE') {
                    slot.visMode = data.mode || 'off';
                    updateVisualizerLoop();
                }
            });
        }

	        function updateVisualizerLoop() {
	            const anyActive = getAllSlots().some((s) => (s.visMode && s.visMode !== 'off'));
	            if (anyActive && !rafVisId) {
	                rafVisId = requestAnimationFrame(visualizerLoop);
	            } else if (!anyActive && rafVisId) {
	                cancelAnimationFrame(rafVisId);
	                rafVisId = null;
	            }
	        }

	        function visualizerLoop() {
	            for (const slot of getAllSlots()) {
	                const mode = slot.visMode || 'off';
	                if (mode === 'off') continue;
	                if (!slot.analyser || !slot.iframe || !slot.iframe.contentWindow) continue;
	                if (slot.bypass) continue;

                const analyser = slot.analyser;
                if (mode === 'scope') {
                    if (!slot._visFloat || slot._visFloat.length !== analyser.fftSize) {
                        slot._visFloat = new Float32Array(analyser.fftSize);
                    }
                    analyser.getFloatTimeDomainData(slot._visFloat);
                    slot.iframe.contentWindow.postMessage({ type: 'BVST_VIS_DATA', instanceId: slot.instanceId, mode: 'scope', data: slot._visFloat }, '*');
                } else if (mode === 'spectrum') {
                    const n = analyser.frequencyBinCount;
                    if (!slot._visByte || slot._visByte.length !== n) {
                        slot._visByte = new Uint8Array(n);
                    }
                    analyser.getByteFrequencyData(slot._visByte);
                    slot.iframe.contentWindow.postMessage({ type: 'BVST_VIS_DATA', instanceId: slot.instanceId, mode: 'spectrum', data: slot._visByte }, '*');
                }
            }
            rafVisId = requestAnimationFrame(visualizerLoop);
        }

	        function rebuildAudioGraph() {
	            if (!audioCtx) return;

	            const useMic = document.getElementById('useMic')?.checked;
	            const allSlots = getAllSlots();

	            // Disconnect everything first.
	            for (const slot of allSlots) {
	                try { slot.node.disconnect(); } catch (_) {}
	                try { slot.analyser.disconnect(); } catch (_) {}
	            }
	            for (const t of project.tracks) {
	                if (t && t.gainNode) {
	                    try { t.gainNode.disconnect(); } catch (_) {}
	                }
	            }
	            if (micSource) {
	                try { micSource.disconnect(); } catch (_) {}
	            }

	            // Ensure master exists.
	            if (!masterGain) {
	                masterGain = audioCtx.createGain();
	                masterGain.gain.value = 1.0;
	                masterGain.connect(audioCtx.destination);
	            }

	            const anySolo = project.tracks.some((t) => t && t.solo);
	            const audibleTrack = (t) => t && !t.muted && (!anySolo || t.solo);

	            // Reconnect per-track chains into the master bus.
	            for (const track of project.tracks) {
	                if (!track) continue;

	                if (!track.gainNode) track.gainNode = audioCtx.createGain();
	                track.gainNode.gain.value = audibleTrack(track) ? (Number(track.gain) || 1.0) : 0.0;
	                try { track.gainNode.connect(masterGain); } catch (_) {}

	                const chainSlots = (track.slots || []).filter((s) => s && !s.bypass);
	                if (chainSlots.length === 0) continue;

	                let chainInput = null;
	                if (useMic && micSource && track.id === activeTrackId) {
	                    chainInput = micSource;
	                }

	                for (let i = 0; i < chainSlots.length; i++) {
	                    const slot = chainSlots[i];

	                    if (!slot.analyser) {
	                        slot.analyser = audioCtx.createAnalyser();
	                        slot.analyser.fftSize = 2048;
	                    }

	                    if (chainInput) {
	                        try { chainInput.connect(slot.node); } catch (_) {}
	                    }

	                    try { slot.node.connect(slot.analyser); } catch (_) {}

	                    const nextSlot = chainSlots[i + 1];
	                    if (nextSlot) {
	                        chainInput = slot.analyser;
	                    } else {
	                        try { slot.analyser.connect(track.gainNode); } catch (_) {}
	                    }
	                }
	            }

	            if (getAllSlots().length === 0) {
	                setStatus('Project is empty. Add a plugin to start.', '#888');
	                return;
	            }
	        }

	        function clearScheduledTimeouts() {
	            for (const id of transport.scheduledTimeouts) {
	                try { clearTimeout(id); } catch (_) {}
	            }
	            transport.scheduledTimeouts = [];
	        }

	        function postToSlot(slot, msg) {
	            if (!slot || !slot.node || !slot.node.port) return;
	            try { slot.node.port.postMessage(msg); } catch (_) {}
	        }

	        function sendNoteOnToTrack(track, note, velocity = 1.0) {
	            const slot = getInstrumentSlotForTrack(track);
	            if (!slot) return false;
	            postToSlot(slot, { type: 'NOTE_ON', note, velocity });
	            return true;
	        }

	        function sendNoteOffToTrack(track, note) {
	            const slot = getInstrumentSlotForTrack(track);
	            if (!slot) return false;
	            postToSlot(slot, { type: 'NOTE_OFF', note });
	            return true;
	        }

	        function sendParamToInstance(instanceId, paramId, value) {
	            const slot = slotsByInstanceId.get(instanceId);
	            if (!slot) return false;
	            postToSlot(slot, { type: 'PARAM', id: paramId, value });
	            return true;
	        }

	        function scheduleStep(stepIndex, stepTimeAudio) {
	            if (!audioCtx) return;
	            const stepDurSec = transport.stepDurSec || getStepDurSec();
	            const delayMs = Math.max(0, (stepTimeAudio - audioCtx.currentTime) * 1000);

	            const anySolo = project.tracks.some((t) => t && t.solo);
	            const audibleTrack = (t) => t && !t.muted && (!anySolo || t.solo);

	            for (const track of project.tracks) {
	                if (!audibleTrack(track)) continue;
	                const clip = track.clip;
	                if (!clip) continue;
	                if (!track._notesByStep || !track._automationByStep) rebuildTrackIndexes(track);

	                // Automation at this step (best-effort, step-quantized).
	                const autoList = (track._automationByStep && track._automationByStep[stepIndex]) ? track._automationByStep[stepIndex] : [];
	                for (const evt of autoList) {
	                    if (!evt) continue;
	                    const tid = setTimeout(() => {
	                        sendParamToInstance(evt.instanceId, evt.paramId, evt.value);
	                    }, delayMs);
	                    transport.scheduledTimeouts.push(tid);
	                }

	                // Notes at this step.
	                const noteList = (track._notesByStep && track._notesByStep[stepIndex]) ? track._notesByStep[stepIndex] : [];
	                for (const n of noteList) {
	                    if (!n) continue;
	                    const note = Number(n.note);
	                    if (!Number.isFinite(note)) continue;
	                    const velocity = Number.isFinite(Number(n.velocity)) ? Number(n.velocity) : 1.0;
	                    const lenSteps = Math.max(1, Math.trunc(Number(n.lenSteps) || 1));

	                    const onId = setTimeout(() => {
	                        if (!transport.playing) return;
	                        if (sendNoteOnToTrack(track, note, velocity)) {
	                            transport.activeNotes.add(`${track.id}:${note}`);
	                        }
	                    }, delayMs);
	                    transport.scheduledTimeouts.push(onId);

	                    const offDelayMs = delayMs + (lenSteps * stepDurSec * 1000);
	                    const offId = setTimeout(() => {
	                        if (!transport.playing) return;
	                        if (sendNoteOffToTrack(track, note)) {
	                            transport.activeNotes.delete(`${track.id}:${note}`);
	                        }
	                    }, offDelayMs);
	                    transport.scheduledTimeouts.push(offId);
	                }
	            }
	        }

	        async function startTransport() {
	            await ensureAudioContext();
	            transport.stepDurSec = getStepDurSec();
	            clearScheduledTimeouts();
	            transport.activeNotes.clear();

	            transport.playing = true;
	            transport.startAudioTime = audioCtx.currentTime + 0.05;
	            transport.playStartStep = playheadStep;
	            transport.nextScheduleStep = playheadStep;
	            transport.nextScheduleTime = transport.startAudioTime;

	            setStatus(transport.recording ? 'Recording…' : 'Playing…', '#0f0');
	            updateTransportButtons();
	            transportTick();
	        }

	        function stopTransport() {
	            transport.playing = false;
	            clearScheduledTimeouts();

	            // Best-effort: turn off any notes we believe we turned on.
	            for (const key of Array.from(transport.activeNotes)) {
	                const [trackId, noteStr] = key.split(':');
	                const track = getTrack(trackId);
	                const note = Number(noteStr);
	                if (track && Number.isFinite(note)) sendNoteOffToTrack(track, note);
	            }
	            transport.activeNotes.clear();
	            recordState.activeNotes.clear();

	            if (transport.rafId) cancelAnimationFrame(transport.rafId);
	            transport.rafId = null;
	            setStatus('Stopped', '#888');
	            updateTransportButtons();
	            drawPianoRoll();
	        }

	        function transportTick() {
	            if (!transport.playing || !audioCtx) return;

	            const lookaheadSec = 0.15;
	            const stepDurSec = transport.stepDurSec || getStepDurSec();
	            const now = audioCtx.currentTime;
	            const loopSteps = getClipSteps();

	            while (transport.nextScheduleTime < now + lookaheadSec) {
	                scheduleStep(transport.nextScheduleStep, transport.nextScheduleTime);

	                transport.nextScheduleStep += 1;
	                if (project.loopEnabled && transport.nextScheduleStep >= loopSteps) {
	                    transport.nextScheduleStep = 0;
	                }
	                transport.nextScheduleTime += stepDurSec;
	            }

	            // Update playhead (visual only) based on audio time.
	            const elapsed = Math.max(0, now - transport.startAudioTime);
	            const stepsElapsed = Math.floor(elapsed / stepDurSec);
	            let newStep = transport.playStartStep + stepsElapsed;
	            if (project.loopEnabled) newStep = ((newStep % loopSteps) + loopSteps) % loopSteps;
	            else newStep = Math.min(loopSteps - 1, newStep);
	            playheadStep = newStep;

	            drawPianoRoll();
	            transport.rafId = requestAnimationFrame(transportTick);
	        }

	        function toggleRecording() {
	            transport.recording = !transport.recording;
	            if (transport.recording) {
	                recordState.activeNotes.clear();
	                recordState.lastAutomation.clear();
	            }
	            updateTransportButtons();
	            setStatus(transport.recording ? 'Record armed' : 'Record off', transport.recording ? '#f44' : '#888');
	        }

	        function updateTransportButtons() {
	            const play = document.getElementById('btnPlay');
	            const stop = document.getElementById('btnStop');
	            const rec = document.getElementById('btnRec');
	            if (play) play.style.background = transport.playing ? '#0a0' : '#444';
	            if (stop) stop.style.background = transport.playing ? '#444' : '#222';
	            if (rec) rec.style.background = transport.recording ? '#f44' : '#600';
	        }

	        function initPianoRoll() {
	            const canvas = document.getElementById('pianoRoll');
	            if (!canvas) return;
	            pianoRoll.canvas = canvas;
	            pianoRoll.ctx = canvas.getContext('2d');

	            const resize = () => resizePianoRollCanvas();
	            window.addEventListener('resize', resize);
	            resize();

	            canvas.addEventListener('mousedown', (e) => {
	                pianoRoll.isPointerDown = true;
	                handlePianoRollPointer(e, true);
	            });
	            window.addEventListener('mouseup', () => {
	                pianoRoll.isPointerDown = false;
	                pianoRoll.paintMode = null;
	                pianoRoll.lastPaintKey = null;
	            });
	            canvas.addEventListener('mousemove', (e) => {
	                if (!pianoRoll.isPointerDown) return;
	                handlePianoRollPointer(e, false);
	            });
	        }

	        function initAutomationUI() {
	            const canvas = document.getElementById('automationLane');
	            if (!canvas) return;
	            automationUI.canvas = canvas;
	            automationUI.ctx = canvas.getContext('2d');

	            const resize = () => resizeAutomationCanvas();
	            window.addEventListener('resize', resize);
	            resize();

	            canvas.addEventListener('mousedown', (e) => {
	                automationUI.isPointerDown = true;
	                handleAutomationPointer(e, true);
	            });
	            window.addEventListener('mouseup', () => {
	                automationUI.isPointerDown = false;
	                automationUI.lastPaintKey = null;
	            });
	            canvas.addEventListener('mousemove', (e) => {
	                if (!automationUI.isPointerDown) return;
	                handleAutomationPointer(e, false);
	            });
	        }

	        function resizeAutomationCanvas() {
	            if (!automationUI.canvas || !automationUI.ctx) return;
	            const rect = automationUI.canvas.getBoundingClientRect();
	            const dpr = window.devicePixelRatio || 1;
	            const w = Math.max(300, Math.floor(rect.width * dpr));
	            const h = Math.max(90, Math.floor(rect.height * dpr));
	            if (automationUI.canvas.width !== w) automationUI.canvas.width = w;
	            if (automationUI.canvas.height !== h) automationUI.canvas.height = h;
	            drawAutomationLane();
	        }

	        function getSelectedAutomationTarget() {
	            const pluginSel = document.getElementById('autoPlugin');
	            const paramSel = document.getElementById('autoParam');
	            const instanceId = pluginSel && pluginSel.value ? pluginSel.value : null;
	            const paramId = paramSel && paramSel.value ? Number(paramSel.value) : null;
	            if (!instanceId || !Number.isFinite(paramId)) return null;
	            return { instanceId, paramId };
	        }

	        function getParamMeta(instanceId, paramId) {
	            const slot = slotsByInstanceId.get(instanceId);
	            if (!slot || !slot.paramMeta) return null;
	            return slot.paramMeta.get(paramId) || null;
	        }

	        function valueFromNorm(norm, meta) {
	            const t = Math.max(0, Math.min(1, norm));
	            if (!meta) return t;
	            const min = Number.isFinite(Number(meta.min)) ? Number(meta.min) : 0;
	            const max = Number.isFinite(Number(meta.max)) ? Number(meta.max) : 1;
	            if (meta.curve === 'log' && min > 0 && max > 0) {
	                return min * Math.pow(max / min, t);
	            }
	            return min + (max - min) * t;
	        }

	        function normFromValue(value, meta) {
	            if (!meta) return 0.5;
	            const min = Number.isFinite(Number(meta.min)) ? Number(meta.min) : 0;
	            const max = Number.isFinite(Number(meta.max)) ? Number(meta.max) : 1;
	            if (meta.curve === 'log' && min > 0 && max > 0 && value > 0) {
	                const ratio = max / min;
	                if (ratio <= 0) return 0;
	                return Math.max(0, Math.min(1, Math.log(value / min) / Math.log(ratio)));
	            }
	            if (max === min) return 0;
	            return Math.max(0, Math.min(1, (value - min) / (max - min)));
	        }

	        function handleAutomationPointer(e, isDown) {
	            if (!automationUI.canvas) return;
	            const target = getSelectedAutomationTarget();
	            const track = getActiveTrack();
	            if (!target || !track || !track.clip) return;

	            const rect = automationUI.canvas.getBoundingClientRect();
	            const dpr = window.devicePixelRatio || 1;
	            const x = (e.clientX - rect.left) * dpr;
	            const y = (e.clientY - rect.top) * dpr;

	            const steps = getClipSteps();
	            const cellW = automationUI.canvas.width / steps;
	            let step = Math.floor(x / cellW);
	            step = Math.max(0, Math.min(steps - 1, step));
	            const stepSize = getQuantizeStepSize();
	            step = Math.floor(step / stepSize) * stepSize;

	            // Normalized y (top=1, bottom=0)
	            const norm = 1 - Math.max(0, Math.min(1, y / automationUI.canvas.height));
	            const meta = getParamMeta(target.instanceId, target.paramId);
	            const value = valueFromNorm(norm, meta);

	            const key = `${step}`;
	            if (!isDown && automationUI.lastPaintKey === key) return;
	            automationUI.lastPaintKey = key;

	            if (e.shiftKey) {
	                // Clear at step
	                track.clip.automation = (track.clip.automation || []).filter((a) => !(a && a.step === step && a.instanceId === target.instanceId && a.paramId === target.paramId));
	                drawAutomationLane();
	                return;
	            }

	            // Replace existing point at this step, else insert.
	            const list = track.clip.automation || (track.clip.automation = []);
	            const idx = list.findIndex((a) => a && a.step === step && a.instanceId === target.instanceId && a.paramId === target.paramId);
	            if (idx >= 0) list[idx].value = value;
	            else list.push({ step, instanceId: target.instanceId, paramId: target.paramId, value });

	            // If playing, apply immediately for audible feedback.
	            if (transport.playing) {
	                sendParamToInstance(target.instanceId, target.paramId, value);
	            }

	            rebuildTrackIndexes(track);
	            drawAutomationLane();
	        }

	        function populateAutomationSelectors() {
	            const track = getActiveTrack();
	            const pluginSel = document.getElementById('autoPlugin');
	            const paramSel = document.getElementById('autoParam');
	            if (!pluginSel || !paramSel) return;

	            pluginSel.replaceChildren();
	            paramSel.replaceChildren();

	            if (!track) {
	                const o = document.createElement('option');
	                o.value = '';
	                o.innerText = 'No track';
	                pluginSel.appendChild(o);
	                pluginSel.disabled = true;
	                paramSel.disabled = true;
	                drawAutomationLane();
	                return;
	            }

	            const slots = track.slots || [];
	            if (slots.length === 0) {
	                const o = document.createElement('option');
	                o.value = '';
	                o.innerText = 'No plugins';
	                pluginSel.appendChild(o);
	                pluginSel.disabled = true;
	                paramSel.disabled = true;
	                drawAutomationLane();
	                return;
	            }

	            for (const slot of slots) {
	                const o = document.createElement('option');
	                o.value = slot.instanceId;
	                o.innerText = slot.displayName;
	                pluginSel.appendChild(o);
	            }
	            pluginSel.disabled = false;

	            const choosePlugin = (instanceId) => {
	                const slot = slotsByInstanceId.get(instanceId);
	                paramSel.replaceChildren();
	                if (!slot || !slot.paramMeta || slot.paramMeta.size === 0) {
	                    const o = document.createElement('option');
	                    o.value = '';
	                    o.innerText = 'No params';
	                    paramSel.appendChild(o);
	                    paramSel.disabled = true;
	                    drawAutomationLane();
	                    return;
	                }
	                const params = Array.from(slot.paramMeta.values()).slice().sort((a, b) => (a.paramId ?? 0) - (b.paramId ?? 0));
	                for (const p of params) {
	                    const o = document.createElement('option');
	                    o.value = String(p.paramId);
	                    o.innerText = `${p.label || p.controlId || 'Param'} (#${p.paramId})`;
	                    paramSel.appendChild(o);
	                }
	                paramSel.disabled = false;
	                if (!automationUI.activeInstanceId) automationUI.activeInstanceId = instanceId;
	                automationUI.activeParamId = Number(paramSel.value);
	                drawAutomationLane();
	            };

	            pluginSel.onchange = () => {
	                automationUI.activeInstanceId = pluginSel.value;
	                automationUI.activeParamId = null;
	                choosePlugin(pluginSel.value);
	            };
	            paramSel.onchange = () => {
	                automationUI.activeParamId = Number(paramSel.value);
	                drawAutomationLane();
	            };

	            // Keep previous selection if possible.
	            const prevInst = automationUI.activeInstanceId;
	            const prevParam = automationUI.activeParamId;
