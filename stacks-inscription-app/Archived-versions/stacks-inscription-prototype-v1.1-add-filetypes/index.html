<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stacks Inscription Proto</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 0 auto; padding: 20px; background: #f0f0f0; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border: 1px solid #ccc; }
        button { cursor: pointer; padding: 10px; background: #000; color: #fff; border: none; }
        .hidden { display: none; }
        input { width: 100%; margin: 10px 0; padding: 5px; }
    </style>
</head>
<body>
    <h1>Phase-1 Inscription Proto</h1>
    
    <!-- Config Section -->
    <div class="card" style="background: #eef; border-color: #aaf;">
        <h3>Configuration</h3>
        <label>Contract Address:</label>
        <input type="text" id="contract-address-input" value="ST10W2EEM757922QTVDZZ5CSEW55JEFNN33V2E7YA.inscription-core">
        <small>Format: ADDRESS.CONTRACT_NAME</small>
    </div>

    <div id="wallet-section" class="card">
        <button id="connect-wallet">Connect Wallet</button>
        <button id="disconnect-wallet" class="hidden" style="background: #d00;">Disconnect</button>
        <span id="address-display"></span>
    </div>
    <div class="card">
        <button onclick="showPage('deploy')">Deploy Contract</button>
        <button onclick="showPage('mint')">Mint Mode</button>
        <button onclick="showPage('play')">Recursive Player</button>
    </div>

    <!-- PAGE: DEPLOY -->
    <div id="page-deploy" class="card hidden">
        <h2>Deploy Smart Contract</h2>
        <p>Deploy the Inscription core contract to the blockchain.</p>
        <button id="btn-deploy-contract">Deploy 'inscription-core'</button>
    </div>

    <div id="page-mint" class="card hidden">
        <h2>Mint Inscription</h2>
        <input type="file" id="file-input">
        <div id="mint-steps"></div>
        <button id="btn-start-mint" class="hidden">Start Inscription</button>
    </div>
    <div id="page-play" class="card hidden">
        <h2>Universal Viewer</h2>
        <p>Enter Inscription ID (Manifest or Single):</p>
        <input type="number" id="manifest-id-input" placeholder="e.g. 1">
        <button id="btn-play-single">View / Play Single</button>
        <button id="btn-load-manifest">Load & Play Audio Manifest</button>
        <div id="media-container" style="margin-top: 20px; border: 1px dashed #ccc; min-height: 50px; padding: 10px;"></div>
        <div id="player-log"></div>
    </div>

    <!-- JOURNEY LOG -->
    <div class="card" style="background: #222; color: #0f0; font-size: 12px; height: 200px; overflow-y: auto;">
        <h3>Journey Log (Debug)</h3>
        <div id="journey-log"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
