<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro-City GTA - Iteration 1.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #0f0; 
            text-shadow: 2px 2px #000; pointer-events: none; font-size: 18px;
            display: flex; flex-direction: column; gap: 4px; z-index: 10;
        }
        #stars { color: #f1c40f; font-size: 24px; letter-spacing: 5px; height: 28px; }
        .bar-container { width: 160px; height: 10px; background: #333; border: 1.5px solid #fff; margin-top: 2px; position: relative; }
        .bar-fill { height: 100%; transition: width 0.2s; }
        #hp-bar { background: #f00; }
        #armor-bar { background: #aaa; }
        #car-hp-bar { background: #3498db; }
        
        #mission-hud {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); border: 1px solid #0f0; padding: 10px 20px;
            color: #0f0; font-weight: bold; text-align: center; display: none; z-index: 10;
        }

        #radar-container {
            position: absolute; bottom: 20px; right: 20px; width: 140px; height: 140px;
            background: rgba(0,0,0,0.7); border: 2px solid #555; border-radius: 8px;
            overflow: hidden; pointer-events: none;
        }

        .controls-overlay {
            position: absolute; bottom: 20px; left: 20px; right: 180px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .joy-btn {
            width: 55px; height: 55px; background: rgba(255,255,255,0.2);
            border: 2px solid #fff; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; pointer-events: auto;
            user-select: none; color: white; font-weight: bold; font-size: 12px;
        }
        .joy-btn:active { background: rgba(255,255,255,0.5); }
        #dev-log {
            position: absolute; top: 180px; left: 20px; width: 240px;
            background: rgba(0,0,0,0.8); color: #0f0; padding: 10px;
            font-size: 10px; border: 1px solid #444; max-height: 150px; overflow-y: auto; z-index: 5;
        }
        #overlay-screen {
            position: absolute; inset: 0; background: rgba(255,0,0,0.7);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 50px; font-weight: bold; text-shadow: 4px 4px #000; z-index: 100;
        }
        .flash { animation: flash-red 0.15s; }
        @keyframes flash-red { 0% { background: rgba(255,0,0,0.3); } 100% { background: transparent; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="mission-hud"></div>

    <div id="ui">
        <div id="cash-display">CASH: $0001000</div>
        <div id="stars"></div>
        <div class="flex flex-col">
            <span class="text-[10px]">HEALTH</span>
            <div class="bar-container"><div id="hp-bar" class="bar-fill" style="width: 100%"></div></div>
            <span class="text-[10px] mt-1">ARMOR</span>
            <div class="bar-container"><div id="armor-bar" class="bar-fill" style="width: 0%"></div></div>
        </div>
        <div id="car-ui" class="flex flex-col hidden">
            <span class="text-[10px] mt-1">VEHICLE</span>
            <div class="bar-container"><div id="car-hp-bar" class="bar-fill" style="width: 100%"></div></div>
        </div>
        <div id="weapon-status" class="mt-2 text-xs">PISTOL</div>
    </div>

    <div id="radar-container">
        <canvas id="radarCanvas" width="140" height="140"></canvas>
    </div>

    <div id="dev-log">
        <strong>DEV LOG v1.4 - CONTRACTS</strong><br>
        - Mission System: Yellow tiles = Contracts<br>
        - Audio: Procedural sound effects<br>
        - New Weapon: Machine Gun (Pickup)<br>
        - Target Tracking on Radar<br>
        - Armor System Added<br>
        <hr class="my-1 border-green-900">
        <em>Assassinate the marked target!</em>
    </div>

    <div id="overlay-screen">WASTED</div>

    <div class="controls-overlay">
        <div class="flex gap-4">
            <div id="btn-left" class="joy-btn">L</div>
            <div id="btn-right" class="joy-btn">R</div>
        </div>
        <div class="flex gap-4">
            <div id="btn-up" class="joy-btn">↑</div>
            <div id="btn-shoot" class="joy-btn" style="background: rgba(231, 76, 60, 0.4);">FIRE</div>
            <div id="btn-enter" class="joy-btn">E</div>
        </div>
    </div>
</div>

<script>
/**
 * PROJECT RETRO-CITY: ITERATION 1.4
 * Focus: Mission Logic, Weapon Variations, Audio Synthesis, Armor.
 */

// --- AUDIO SYSTEM ---
const AudioEngine = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(freq, type, decay, vol = 0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + decay);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + decay);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + decay);
    },
    shoot() { this.play(400, 'square', 0.1); },
    mgShoot() { this.play(300, 'square', 0.05, 0.05); },
    explode() { this.play(100, 'sawtooth', 0.5, 0.3); },
    pickup() { this.play(800, 'sine', 0.2); }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const radarCanvas = document.getElementById('radarCanvas');
const rCtx = radarCanvas.getContext('2d');

const statusDisplay = document.getElementById('weapon-status');
const starsDisplay = document.getElementById('stars');
const cashDisplay = document.getElementById('cash-display');
const missionHud = document.getElementById('mission-hud');
const hpBar = document.getElementById('hp-bar');
const armorBar = document.getElementById('armor-bar');
const carHpBar = document.getElementById('car-hp-bar');
const carUi = document.getElementById('car-ui');
const overlayScreen = document.getElementById('overlay-screen');
const container = document.getElementById('game-container');

// --- CONFIGURATION ---
const TILE_SIZE = 128;
const MAP_SIZE = 50;
const FRICTION = 0.95;
const ROT_SPEED = 0.06;
const ACCEL = 0.25;

// Tile Types
const ROAD = 0, BUILDING = 1, SIDEWALK = 2, SPRAY = 3, MISSION = 4;

// --- GAME STATE ---
let width, height;
const keys = {};
const map = [];
let cash = 1000;
let wantedLevel = 0;
let shakeTime = 0;
let isGameOver = false;

const player = {
    x: 1500, y: 1500, angle: 0, speed: 0, radius: 12,
    hp: 100, armor: 0, weapon: 'pistol', inVehicle: null, color: '#f0f', lastShot: 0
};

let currentMission = null;
const bullets = [];
const pedestrians = [];
const vehicles = [];
const particles = [];
const pickups = [];

// --- CLASSES ---

class Particle {
    constructor(x, y, color, life) {
        this.x = x; this.y = y; this.color = color;
        this.life = life; this.maxLife = life;
        this.vx = (Math.random()-0.5) * 5;
        this.vy = (Math.random()-0.5) * 5;
    }
    update() { this.x += this.vx; this.y += this.vy; this.life--; }
    draw() {
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 4, 4);
        ctx.globalAlpha = 1;
    }
}

class Pickup {
    constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type; // 'mg' or 'armor'
        this.radius = 15;
    }
    draw() {
        ctx.fillStyle = this.type === 'mg' ? '#ff0' : '#aaa';
        ctx.fillRect(this.x - 10, this.y - 10, 20, 20);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(this.x - 12, this.y - 12, 24, 24);
    }
}

class Bullet {
    constructor(x, y, angle, owner) {
        this.x = x; this.y = y; this.angle = angle;
        this.speed = 18; this.life = 50; this.owner = owner;
    }
    update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.life--;
        const gx = Math.floor(this.x / TILE_SIZE), gy = Math.floor(this.y / TILE_SIZE);
        if (map[gy] && map[gy][gx] === BUILDING) this.life = 0;

        if (this.owner !== 'player' && !player.inVehicle) {
            if (Math.hypot(this.x - player.x, this.y - player.y) < player.radius) {
                damagePlayer(10); this.life = 0;
            }
        } else if (this.owner === 'player') {
            pedestrians.forEach(p => {
                if (!p.dead && Math.hypot(this.x - p.x, this.y - p.y) < p.radius + 5) {
                    p.die(); this.life = 0;
                }
            });
            vehicles.forEach(v => {
                if (!v.dead && Math.hypot(this.x - v.x, this.y - v.y) < 25) {
                    v.damage(8); this.life = 0;
                }
            });
        }
    }
    draw() {
        ctx.fillStyle = this.owner === 'player' ? '#fff' : '#f44';
        ctx.beginPath(); ctx.arc(this.x, this.y, 2.5, 0, Math.PI*2); ctx.fill();
    }
}

class Pedestrian {
    constructor(x, y, type = 'civilian') {
        this.x = x; this.y = y; this.angle = Math.random() * Math.PI * 2;
        this.speed = 1.2; this.radius = 10;
        this.color = type === 'civilian' ? `hsl(${Math.random() * 360}, 50%, 60%)` : (type === 'police' ? '#00f' : '#f00');
        this.type = type; // civilian, police, target
        this.dead = false; this.lastShot = 0; this.timer = Math.random() * 100;
        this.isMissionTarget = (type === 'target');
    }
    update() {
        if (this.dead) return;
        if (this.type === 'police' && wantedLevel >= 1) this.aiCombat();
        else if (this.isMissionTarget) this.aiFlee();
        else this.aiWander();

        let nx = this.x + Math.cos(this.angle) * this.speed;
        let ny = this.y + Math.sin(this.angle) * this.speed;
        const gx = Math.floor(nx / TILE_SIZE), gy = Math.floor(ny / TILE_SIZE);
        if (map[gy] && map[gy][gx] !== BUILDING) { this.x = nx; this.y = ny; } else { this.angle += Math.PI; }
    }
    aiWander() {
        this.timer--;
        if (this.timer <= 0) { this.angle += (Math.random()-0.5); this.timer = 150; }
    }
    aiFlee() {
        let dx = player.x - this.x, dy = player.y - this.y;
        if (Math.hypot(dx, dy) < 300) {
            this.angle = Math.atan2(dy, dx) + Math.PI;
            this.speed = 3;
        } else { this.speed = 1.5; this.aiWander(); }
    }
    aiCombat() {
        let dx = player.x - this.x, dy = player.y - this.y;
        let d = Math.hypot(dx, dy);
        this.angle = Math.atan2(dy, dx);
        this.speed = d > 250 ? 2.5 : 0;
        if (d < 450 && Date.now() - this.lastShot > 1600) {
            bullets.push(new Bullet(this.x, this.y, this.angle, 'police'));
            this.lastShot = Date.now(); AudioEngine.shoot();
        }
    }
    die() {
        if (this.dead) return;
        this.dead = true;
        if (this.isMissionTarget) completeMission();
        addCash(this.type === 'police' ? 100 : 25);
        increaseWanted(this.type === 'police' ? 0.8 : 0.2);
        triggerShake(10);
    }
    draw() {
        ctx.save(); ctx.translate(this.x, this.y);
        if (this.dead) {
            ctx.fillStyle = '#600'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 10, this.angle, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.rotate(this.angle);
            ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
            if (this.isMissionTarget) { ctx.strokeStyle = '#0f0'; ctx.lineWidth = 3; ctx.stroke(); }
            ctx.fillStyle = '#000'; ctx.fillRect(4, -3, 6, 6);
        }
        ctx.restore();
    }
}

class Vehicle {
    constructor(x, y, color, isPolice = false) {
        this.x = x; this.y = y; this.angle = 0; this.speed = 0;
        this.w = 58; this.h = 32; this.color = color;
        this.isPolice = isPolice; this.hp = 100; this.dead = false;
        this.accel = isPolice ? 0.28 : 0.22; this.maxSpeed = isPolice ? 12 : 10;
        this.friction = 0.97; this.steer = 0.05;
    }
    update() {
        if (this.dead) { this.speed *= 0.9; return; }
        if (player.inVehicle === this && !isGameOver) { this.playerControl(); this.checkTriggers(); }
        else if (this.isPolice && wantedLevel >= 1) this.aiChase();
        
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.handleCollisions();
        if (this.hp < 40) spawnSmoke(this.x, this.y);
    }
    playerControl() {
        if (keys['w'] || keys['ArrowUp']) this.speed += this.accel;
        if (keys['s'] || keys['ArrowDown']) this.speed -= this.accel;
        if (Math.abs(this.speed) > 0.1) {
            const steerDir = this.speed > 0 ? 1 : -1;
            if (keys['a'] || keys['ArrowLeft']) this.angle -= this.steer * steerDir;
            if (keys['d'] || keys['ArrowRight']) this.angle += this.steer * steerDir;
        }
    }
    aiChase() {
        let targetAngle = Math.atan2(player.y - this.y, player.x - this.x);
        let diff = targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += diff * 0.05;
        this.speed += this.accel * 0.9;
    }
    handleCollisions() {
        const gx = Math.floor(this.x / TILE_SIZE), gy = Math.floor(this.y / TILE_SIZE);
        if (map[gy] && map[gy][gx] === BUILDING) {
            this.damage(Math.abs(this.speed) * 5);
            this.speed *= -0.4; this.x -= Math.cos(this.angle) * 10; this.y -= Math.sin(this.angle) * 10;
        }
    }
    damage(amt) {
        this.hp -= amt;
        if (player.inVehicle === this) updateCarUI();
        if (this.hp <= 0 && !this.dead) this.explode();
    }
    explode() {
        this.dead = true; AudioEngine.explode();
        for(let i=0; i<20; i++) particles.push(new Particle(this.x, this.y, '#f60', 50));
        triggerShake(25);
        if (player.inVehicle === this) toggleVehicle();
    }
    checkTriggers() {
        const gx = Math.floor(this.x/TILE_SIZE), gy = Math.floor(this.y/TILE_SIZE);
        if (map[gy] && map[gy][gx] === SPRAY && wantedLevel > 0 && cash >= 500) {
            addCash(-500); wantedLevel = 0; updateStars(); this.hp = 100; updateCarUI();
            AudioEngine.pickup();
        }
    }
    draw() {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
        ctx.fillStyle = this.dead ? '#111' : this.color; ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
        if (this.isPolice && !this.dead) {
            ctx.fillStyle = (Math.floor(Date.now()/150) % 2 === 0) ? '#f00' : '#00f';
            ctx.fillRect(-4, -this.h/2, 8, this.h);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(-this.w/4, -this.h/2+2, this.w/2, this.h-4);
        ctx.restore();
    }
}

// --- MISSION LOGIC ---

function startMission() {
    if (currentMission) return;
    const gx = Math.floor(player.x/TILE_SIZE), gy = Math.floor(player.y/TILE_SIZE);
    if (map[gy] && map[gy][gx] === MISSION) {
        currentMission = {
            type: 'assassinate',
            target: new Pedestrian(player.x + (Math.random()-0.5)*3000, player.y + (Math.random()-0.5)*3000, 'target'),
            reward: 2500
        };
        pedestrians.push(currentMission.target);
        missionHud.style.display = 'block';
        missionHud.innerText = "MISSION: ELIMINATE THE SNITCH";
        AudioEngine.pickup();
    }
}

function completeMission() {
    if (!currentMission) return;
    addCash(currentMission.reward);
    missionHud.innerText = `MISSION PASSED: +$${currentMission.reward}`;
    setTimeout(() => { missionHud.style.display = 'none'; currentMission = null; }, 3000);
    AudioEngine.pickup();
}

// --- CORE UTILS ---

function spawnSmoke(x, y) { particles.push(new Particle(x, y, '#555', 25)); }
function damagePlayer(amt) {
    if (isGameOver) return;
    if (player.armor > 0) { player.armor -= amt; } else { player.hp -= amt; }
    hpBar.style.width = `${Math.max(0, player.hp)}%`;
    armorBar.style.width = `${Math.max(0, player.armor)}%`;
    triggerShake(amt * 2);
    if (player.hp <= 0) die();
}
function die() { isGameOver = true; overlayScreen.style.display = 'flex'; }
function triggerShake(amt) { shakeTime = amt; container.classList.add('flash'); setTimeout(() => container.classList.remove('flash'), 100); }
function addCash(amt) { cash += amt; cashDisplay.innerText = `CASH: $${cash.toString().padStart(7, '0')}`; }
function updateStars() { let s = ""; for(let i=0; i<Math.floor(wantedLevel); i++) s += "★"; starsDisplay.innerText = s; }
function increaseWanted(amt) { wantedLevel = Math.min(5, wantedLevel + amt); updateStars(); }
function updateCarUI() {
    if (player.inVehicle) { carUi.classList.remove('hidden'); carHpBar.style.width = `${player.inVehicle.hp}%`; }
    else carUi.classList.add('hidden');
}

function initWorld() {
    AudioEngine.init();
    for (let y = 0; y < MAP_SIZE; y++) {
        map[y] = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            if (x === 0 || y === 0 || x === MAP_SIZE-1 || y === MAP_SIZE-1) map[y][x] = BUILDING;
            else if (x % 10 === 0 || y % 10 === 0) map[y][x] = ROAD;
            else if (x % 10 === 1 || x % 10 === 9 || y % 10 === 1 || y % 10 === 9) map[y][x] = SIDEWALK;
            else map[y][x] = BUILDING;
        }
    }
    // Spots
    map[5][5] = SPRAY; map[20][20] = MISSION; map[40][40] = MISSION;
    
    for (let i = 0; i < 80; i++) {
        let rx, ry; do { rx = Math.random()*MAP_SIZE*TILE_SIZE; ry = Math.random()*MAP_SIZE*TILE_SIZE; }
        while (map[Math.floor(ry/TILE_SIZE)][Math.floor(rx/TILE_SIZE)] === BUILDING);
        pedestrians.push(new Pedestrian(rx, ry));
    }
    // Some pickups
    pickups.push(new Pickup(1800, 1500, 'mg'), new Pickup(1400, 1800, 'armor'));
}

function shoot() {
    if (isGameOver) return;
    let delay = player.weapon === 'mg' ? 100 : 350;
    if (Date.now() - player.lastShot < delay) return;
    
    bullets.push(new Bullet(player.x, player.y, player.angle, 'player'));
    player.lastShot = Date.now();
    if (player.weapon === 'mg') AudioEngine.mgShoot(); else AudioEngine.shoot();
    triggerShake(2);
}

function toggleVehicle() {
    if (isGameOver) return;
    if (player.inVehicle) {
        player.x += Math.cos(player.angle + Math.PI/2) * 65;
        player.y += Math.sin(player.angle + Math.PI/2) * 65;
        player.inVehicle = null;
    } else {
        vehicles.forEach(v => {
            if (!v.dead && Math.hypot(v.x-player.x, v.y-player.y) < 80) {
                player.inVehicle = v;
                if (v.isPolice) wantedLevel = Math.max(wantedLevel, 4);
            }
        });
    }
    updateCarUI();
}

function update() {
    if (shakeTime > 0) shakeTime -= 0.5;
    
    // Spawning Logic
    if (wantedLevel >= 1 && vehicles.filter(v=>v.isPolice && !v.dead).length < wantedLevel) {
        vehicles.push(new Vehicle(player.x + (Math.random()-0.5)*1500, player.y + (Math.random()-0.5)*1500, '#000', true));
    }

    if (!isGameOver) {
        if (!player.inVehicle) {
            if (keys['w'] || keys['ArrowUp']) player.speed += ACCEL;
            if (keys['s'] || keys['ArrowDown']) player.speed -= ACCEL;
            if (keys['a'] || keys['ArrowLeft']) player.angle -= ROT_SPEED;
            if (keys['d'] || keys['ArrowRight']) player.angle += ROT_SPEED;
            if (keys[' ']) shoot();
            player.speed *= FRICTION;
            player.x += Math.cos(player.angle) * player.speed;
            player.y += Math.sin(player.angle) * player.speed;
            
            const gx = Math.floor(player.x/TILE_SIZE), gy = Math.floor(player.y/TILE_SIZE);
            if (map[gy] && map[gy][gx] === BUILDING) {
                player.x -= Math.cos(player.angle) * player.speed;
                player.y -= Math.sin(player.angle) * player.speed;
                player.speed = 0;
            }
            if (map[gy] && map[gy][gx] === MISSION) startMission();

            pickups.forEach((p, i) => {
                if (Math.hypot(p.x - player.x, p.y - player.y) < 30) {
                    if (p.type === 'mg') { player.weapon = 'mg'; statusDisplay.innerText = "MACHINE GUN"; }
                    if (p.type === 'armor') { player.armor = 100; armorBar.style.width = '100%'; }
                    AudioEngine.pickup();
                    pickups.splice(i, 1);
                }
            });
        } else {
            player.x = player.inVehicle.x; player.y = player.inVehicle.y; player.angle = player.inVehicle.angle;
            if (keys[' ']) toggleVehicle();
        }
    } else if (keys['Enter']) location.reload();

    bullets.forEach((b, i) => { b.update(); if(b.life <= 0) bullets.splice(i, 1); });
    pedestrians.forEach(p => p.update());
    vehicles.forEach(v => v.update());
    particles.forEach((p, i) => { p.update(); if(p.life <= 0) particles.splice(i, 1); });
}

function draw() {
    ctx.fillStyle = '#222'; ctx.fillRect(0, 0, width, height);
    ctx.save();
    let sx = (Math.random()-0.5) * shakeTime, sy = (Math.random()-0.5) * shakeTime;
    ctx.translate(width/2 - player.x + sx, height/2 - player.y + sy);

    const sX = Math.max(0, Math.floor((player.x - width/2)/TILE_SIZE)), eX = Math.min(MAP_SIZE, Math.ceil((player.x + width/2)/TILE_SIZE));
    const sY = Math.max(0, Math.floor((player.y - height/2)/TILE_SIZE)), eY = Math.min(MAP_SIZE, Math.ceil((player.y + height/2)/TILE_SIZE));

    for (let y = sY; y < eY; y++) {
        for (let x = sX; x < eX; x++) {
            const tx = x * TILE_SIZE, ty = y * TILE_SIZE;
            if (map[y][x] === ROAD) { ctx.fillStyle = '#333'; ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE); }
            else if (map[y][x] === SIDEWALK) { ctx.fillStyle = '#444'; ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE); }
            else if (map[y][x] === SPRAY) { ctx.fillStyle = '#606'; ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE); ctx.fillStyle = '#f0f'; ctx.fillRect(tx+15, ty+15, TILE_SIZE-30, TILE_SIZE-30); }
            else if (map[y][x] === MISSION) { ctx.fillStyle = '#660'; ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE); ctx.fillStyle = '#ff0'; ctx.fillRect(tx+30, ty+30, TILE_SIZE-60, TILE_SIZE-60); }
            else { ctx.fillStyle = '#111'; ctx.fillRect(tx+4, ty+4, TILE_SIZE-8, TILE_SIZE-8); ctx.fillStyle = '#1a1a1a'; ctx.fillRect(tx+25, ty+25, TILE_SIZE-50, TILE_SIZE-50); }
        }
    }

    pickups.forEach(p => p.draw());
    pedestrians.forEach(p => p.draw());
    vehicles.forEach(v => v.draw());
    bullets.forEach(b => b.draw());
    particles.forEach(p => p.draw());

    if (!player.inVehicle && !isGameOver) {
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
        ctx.fillStyle = player.color; ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.fillRect(5, -5, 12, 10); ctx.restore();
    }
    ctx.restore();
    
    // Radar
    rCtx.fillStyle = '#1a1a1a'; rCtx.fillRect(0, 0, 140, 140);
    rCtx.save(); rCtx.translate(70, 70); rCtx.rotate(-player.angle - Math.PI/2);
    let scale = 0.12;
    for (let y = sY; y < eY; y++) {
        for (let x = sX; x < eX; x++) {
            let dx = (x*TILE_SIZE-player.x)*scale, dy = (y*TILE_SIZE-player.y)*scale;
            if (Math.hypot(dx,dy)<90) {
                if (map[y][x] === ROAD) rCtx.fillStyle = '#333';
                else if (map[y][x] === SPRAY) rCtx.fillStyle = '#f0f';
                else if (map[y][x] === MISSION) rCtx.fillStyle = '#ff0';
                else rCtx.fillStyle = '#111';
                rCtx.fillRect(dx, dy, TILE_SIZE*scale, TILE_SIZE*scale);
            }
        }
    }
    rCtx.restore();
    rCtx.fillStyle = '#fff'; rCtx.beginPath(); rCtx.arc(70, 70, 3.5, 0, Math.PI*2); rCtx.fill();
    if (currentMission && !currentMission.target.dead) {
        let dx = (currentMission.target.x - player.x)*scale, dy = (currentMission.target.y - player.y)*scale;
        rCtx.fillStyle = '#0f0'; rCtx.fillRect(70+dx-3, 70+dy-3, 6, 6);
    }
}

function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
window.addEventListener('keydown', e => { keys[e.key] = true; AudioEngine.init(); if(e.key === 'e') toggleVehicle(); });
window.addEventListener('keyup', e => keys[e.key] = false);

const bind = (id, k) => { 
    const el = document.getElementById(id); 
    el.addEventListener('touchstart', (e) => { e.preventDefault(); AudioEngine.init(); keys[k] = true; }); 
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; }); 
};
bind('btn-up', 'w'); bind('btn-left', 'a'); bind('btn-right', 'd'); bind('btn-shoot', ' ');
document.getElementById('btn-enter').addEventListener('touchstart', (e) => { e.preventDefault(); toggleVehicle(); });

window.onload = () => { resize(); initWorld(); (function loop() { update(); draw(); requestAnimationFrame(loop); })(); };
</script>
</body>
