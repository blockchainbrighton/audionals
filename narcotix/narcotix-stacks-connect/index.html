<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Narcotix Access</title>
    
    <style>
      body { 
        font-family: 'Courier New', Courier, monospace; 
        background: #000; 
        color: #0f0; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        margin: 0; 
      }
      .container { 
        text-align: center; 
        background: #050505; 
        padding: 2rem; 
        border: 1px solid #0f0; 
        border-radius: 4px; 
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); 
        max-width: 450px; 
        width: 100%; 
      }
      h1 {
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 1px solid #0f0;
        padding-bottom: 10px;
        margin-bottom: 30px;
        text-shadow: 0 0 5px #0f0;
      }
      button { 
        background: #000; 
        color: #0f0; 
        border: 1px solid #0f0; 
        padding: 12px 24px; 
        font-family: inherit;
        font-size: 16px; 
        cursor: pointer; 
        transition: 0.2s; 
        text-transform: uppercase;
        font-weight: bold;
      }
      button:hover { 
        background: #0f0; 
        color: #000; 
        box-shadow: 0 0 10px #0f0;
      }
      .hidden { display: none; }
      #nft-list { margin-top: 20px; text-align: left; }
      .status { margin-top: 15px; font-size: 0.9rem; color: #0a0; margin-bottom: 20px; }
      .success { color: #0f0; font-weight: bold; }
      .fail { color: #f00; font-weight: bold; border: 1px solid #f00; padding: 10px; }
      
      /* New Grid Styles */
      .token-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 10px;
        max-height: 300px;
        overflow-y: auto;
        padding-right: 5px;
      }
      
      /* Scrollbar styling for the grid */
      .token-grid::-webkit-scrollbar { width: 5px; }
      .token-grid::-webkit-scrollbar-track { background: #000; }
      .token-grid::-webkit-scrollbar-thumb { background: #0f0; }

      .token-item {
        background: #001100;
        border: 1px solid #005500;
        color: #0f0;
        padding: 8px;
        text-align: center;
        font-weight: bold;
        border-radius: 2px;
        transition: transform 0.1s;
      }
      .token-item:hover {
        transform: scale(1.05);
        border-color: #0f0;
        box-shadow: 0 0 5px #0f0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Narcotix Access</h1>
      
      <div id="logged-out-view">
        <p style="margin-bottom: 30px;">[ SYSTEM LOCKED ]<br>Connect Wallet to Scan Identity</p>
        <button id="connect-wallet-btn">Connect Wallet</button>
      </div>

      <div id="logged-in-view" class="hidden">
        <p>USER: <span id="user-address-display" style="color:#fff">...</span></p>
        <div id="loading-msg" class="status">SCANNING BLOCKCHAIN...</div>
        <div id="game-access-msg" class="status"></div>
        <div id="nft-list"></div>
        <button id="sign-out-btn" style="border-color: #555; color: #555; margin-top: 30px; font-size: 0.8em;">Disconnect</button>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
