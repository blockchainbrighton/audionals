<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>NarcotiX Explorer (3333)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    :root {
      --accent:#00ffaa;
      --bg:#111;
      --text:#eee;
      --card:#222;
    }
    body{margin:0;font-family:system-ui, sans-serif;background:var(--bg);color:var(--text);padding:1rem;display:flex;flex-direction:column;align-items:center}
    h1{margin:.5rem 0}
    button{background:var(--accent);border:none;padding:.5rem .9rem;border-radius:4px;cursor:pointer}
    input[type=number]{width:70px;padding:.4rem;border-radius:4px;border:none;text-align:center}
    #status{width:100%;max-width:750px;margin:.5rem 0;font-family:monospace;font-size:.8rem;background:#000;padding:.5rem;border-radius:4px;max-height:150px;overflow-y:auto}
    #viewer{display:flex;flex-direction:column;align-items:center;max-width:750px;width:100%}

    /* main image area */
    #images{width:100%;display:flex;flex-direction:column;align-items:center;gap:.5rem;margin:.5rem 0}
    #images img{max-width:100%;max-height:60vh;border-radius:6px;display:block}

    /* traits */
    #traits{
      width:100%;
      background:var(--card);
      border-radius:8px;
      padding:.75rem;
      box-sizing:border-box;
      margin:.5rem 0 0;
    }
    #traits h3{margin:0 0 .5rem 0;font-size:1rem}
    #traitsList{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
      gap:.35rem .6rem;
      margin:0;
      padding:0;
      list-style:none;
      font-size:.9rem;
    }
    #traitsList li{
      background:#1a1a1a;
      border-radius:6px;
      padding:.35rem .5rem;
      display:flex;
      justify-content:space-between;
      gap:.75rem;
      white-space:nowrap;
      overflow:hidden;
    }
    #traitsList .k{opacity:.85;overflow:hidden;text-overflow:ellipsis}
    #traitsList .v{font-weight:600;overflow:hidden;text-overflow:ellipsis}

    #strip{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:.5rem}
    #strip img{width:50px;height:50px;border-radius:4px;cursor:pointer;border:2px solid transparent}
    #strip img.active{border-color:var(--accent)}

    #controls{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      gap:.4rem;
      margin-bottom:1rem;
    }
    button{margin:0}
  </style>
</head>
<body>
  <h1>NarcotiX Explorer (1-3333)</h1>

  <div id="controls">
    <button id="testMeta">Test Metadata</button>
    <button id="testHistoryBad">History&nbsp;(bad)</button>
    <button id="testHistoryGood">History&nbsp;(good)</button>
    <button id="testMints">Fetch Mints</button>

    <input id="tokenInput" type="number" min="1" max="3333" value="1"/>
    <button id="loadBtn">Load</button>
    <button id="prevBtn">←</button>
    <button id="nextBtn">→</button>
  </div>

  <!-- Main display -->
  <div id="viewer">
    <!-- NEW: all images render here -->
    <div id="images"></div>

    <h2 id="title"></h2>
    <p id="desc"></p>

    <!-- NEW: traits panel -->
    <div id="traits" hidden>
      <h3>Traits</h3>
      <ul id="traitsList"></ul>
    </div>
  </div>

  <!-- Thumbnail strip -->
  <div id="strip"></div>

  <!-- Debug console -->
  <div id="status"></div>

  <script>
    /* ---------- CONSTANTS ---------- */
    const CONTRACT = 'SP8HMQP4Q63V3E6SXXPXZ4WJXA263HBD95QY2AM3.narcotix';
    const MAX_SUPPLY = 3333;
    const CACHE_URL = id => `https://assets.hiro.so/api/mainnet/token-metadata-api/${CONTRACT}/${id}.png`;
    const META_URL  = id => `https://api.hiro.so/metadata/v1/nft/${CONTRACT}/${id}`;

    /* ---------- DOM ---------- */
    const statusEl  = document.getElementById('status');
    const titleEl   = document.getElementById('title');
    const descEl    = document.getElementById('desc');
    const input     = document.getElementById('tokenInput');
    const strip     = document.getElementById('strip');

    const imagesEl  = document.getElementById('images');
    const traitsBox = document.getElementById('traits');
    const traitsUl  = document.getElementById('traitsList');

    let currentId   = 1;

    /* ---------- HELPERS ---------- */
    function log(msg) {
      console.log(msg);
      statusEl.textContent += msg + '\n';
      statusEl.scrollTop = statusEl.scrollHeight;
    }

    async function fetchJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.json();
    }

    function uniq(arr){
      const out = [];
      const seen = new Set();
      for (const x of arr) {
        if (!x) continue;
        const s = String(x).trim();
        if (!s) continue;
        const key = s;
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(s);
      }
      return out;
    }

    // best-effort: collect any image-like URLs from common metadata fields
    function collectImageUrls(meta, id){
      const md = meta?.metadata || {};
      const urls = [];

      // always include cached png
      urls.push(CACHE_URL(id));

      // common single-image fields
      urls.push(md.image, md.image_url, md.imageUrl, md.animation_url, md.animationUrl);

      // common arrays / nested
      const imgs = md.images || md.image_urls || md.imageUrls || md.gallery || md.media;
      if (Array.isArray(imgs)) urls.push(...imgs);

      // sometimes "media" is [{url:...}, ...]
      if (Array.isArray(md.media)) {
        for (const m of md.media) {
          if (typeof m === 'string') urls.push(m);
          else if (m && typeof m === 'object') urls.push(m.url, m.uri, m.src, m.href);
        }
      }

      // sometimes "files" is [{uri:...}, ...]
      if (Array.isArray(md.files)) {
        for (const f of md.files) {
          if (typeof f === 'string') urls.push(f);
          else if (f && typeof f === 'object') urls.push(f.uri, f.url, f.href);
        }
      }

      return uniq(urls);
    }

    function renderImages(urls, id){
      imagesEl.innerHTML = '';
      urls.forEach((url, i) => {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.src = url;
        img.alt = `NarcotiX #${id}${i ? ` (image ${i+1})` : ''}`;
        imagesEl.appendChild(img);
      });
    }

    // normalize trait formats to array of {k,v}
    function extractTraits(meta){
      const md = meta?.metadata || {};

      // 1) standard OpenSea-style: attributes: [{trait_type, value}, ...]
      if (Array.isArray(md.attributes)) {
        return md.attributes
          .map(a => ({
            k: a?.trait_type ?? a?.type ?? a?.key ?? a?.name,
            v: a?.value ?? a?.val
          }))
          .filter(t => t.k != null && t.v != null);
      }

      // 2) sometimes "traits": [{trait_type,value}, ...] or {Key:Value}
      if (Array.isArray(md.traits)) {
        return md.traits
          .map(a => ({
            k: a?.trait_type ?? a?.type ?? a?.key ?? a?.name,
            v: a?.value ?? a?.val
          }))
          .filter(t => t.k != null && t.v != null);
      }
      if (md.traits && typeof md.traits === 'object') {
        return Object.entries(md.traits).map(([k,v]) => ({ k, v }));
      }

      // 3) sometimes "properties": {Key:Value} or [{key,value}]
      if (Array.isArray(md.properties)) {
        return md.properties
          .map(p => ({ k: p?.key ?? p?.name, v: p?.value }))
          .filter(t => t.k != null && t.v != null);
      }
      if (md.properties && typeof md.properties === 'object') {
        // some collections tuck traits inside properties.attributes
        if (md.properties.attributes && typeof md.properties.attributes === 'object') {
          return Object.entries(md.properties.attributes).map(([k,v]) => ({ k, v }));
        }
        return Object.entries(md.properties).map(([k,v]) => ({ k, v }));
      }

      return [];
    }

    function renderTraits(traits){
      traitsUl.innerHTML = '';
      if (!traits.length) {
        traitsBox.hidden = true;
        return;
      }
      traitsBox.hidden = false;

      traits.forEach(t => {
        const li = document.createElement('li');
        const k = document.createElement('span');
        const v = document.createElement('span');
        k.className = 'k';
        v.className = 'v';
        k.textContent = String(t.k);
        v.textContent = String(t.v);
        li.appendChild(k);
        li.appendChild(v);
        traitsUl.appendChild(li);
      });
    }

    /* ---------- IMAGE LOADER ---------- */
    const history = new Set();

    async function loadNFT(id) {
      id = Math.max(1, Math.min(MAX_SUPPLY, id));
      currentId = id;
      input.value = id;

      // reset UI immediately
      titleEl.textContent = `NarcotiX #${id}`;
      descEl.textContent  = '';
      renderImages([CACHE_URL(id)], id);
      renderTraits([]);

      // metadata
      try {
        const meta = await fetchJSON(META_URL(id));
        titleEl.textContent = meta.metadata?.name || `NarcotiX #${id}`;
        descEl.textContent  = meta.metadata?.description || '';

        // NEW: images + traits
        renderImages(collectImageUrls(meta, id), id);
        renderTraits(extractTraits(meta));

      } catch(e) {
        log('Metadata error: ' + e.message);
      }

      // thumbnail strip
      history.add(id);
      renderStrip();
    }

    function renderStrip() {
      strip.innerHTML = '';
      [...history].slice(-12).forEach(id => {
        const img = document.createElement('img');
        img.src = CACHE_URL(id);
        img.alt = id;
        img.className = id === currentId ? 'active' : '';
        img.onclick = () => loadNFT(id);
        strip.appendChild(img);
      });
    }

    /* ---------- NAV ---------- */
    document.getElementById('loadBtn').onclick  = () => loadNFT(+input.value);
    document.getElementById('prevBtn').onclick  = () => loadNFT(currentId - 1);
    document.getElementById('nextBtn').onclick  = () => loadNFT(currentId + 1);
    input.addEventListener('keydown', e => e.key === 'Enter' && loadNFT(+input.value));

    /* ---------- CORS TEST BUTTONS (unchanged) ---------- */
    async function testFetch(label, url) {
      log(`Testing ${label}: ${url}`);
      try {
        const r = await fetch(url);
        const txt = await r.text();
        log(`Status: ${r.status}\n${txt.slice(0, 300)}`);
      } catch(err) {
        log('Error: ' + err.message);
      }
      log('---');
    }

    document.getElementById('testMeta').onclick = () => {
      const id = +input.value || 1;
      testFetch('Metadata', META_URL(id));
    };

    document.getElementById('testHistoryBad').onclick = () => {
      const id = +input.value || 1;
      testFetch('HistoryBad', `https://stacks-node-api.mainnet.stacks.co/extended/v1/tokens/nft/history?asset_identifier=${encodeURIComponent(CONTRACT)}::${id}&page_size=1`);
    };

    document.getElementById('testHistoryGood').onclick = () => {
      const id = +input.value || 1;
      const hex = '0x' + id.toString(16).padStart(2, '0');
      testFetch('HistoryGood', `https://stacks-node-api.mainnet.stacks.co/extended/v1/tokens/nft/history?asset_identifier=${encodeURIComponent(CONTRACT)}::${id}&value=${hex}&page_size=1`);
    };

    document.getElementById('testMints').onclick = () =>
      testFetch('Mints', `https://stacks-node-api.mainnet.stacks.co/extended/v1/tokens/nft/mints?asset_identifier=${encodeURIComponent(CONTRACT)}`);

    /* ---------- FIRST LOAD ---------- */
    loadNFT(1);
  </script>
</body>
</html>
