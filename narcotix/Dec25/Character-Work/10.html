<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oscilloscope v10 // Particles</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        canvas { display: block; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 10; transition: opacity 0.5s; }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        button { background: transparent; border: 1px solid #ffaa00; color: #ffaa00; padding: 20px 40px; font-size: 18px; cursor: pointer; text-transform: uppercase; letter-spacing: 4px; }
        button:hover { background: #ffaa00; color: #000; box-shadow: 0 0 30px #ffaa00; }
    </style>
</head>
<body>
    <div id="overlay"><button id="btn">Initialize v10 (Particles)</button></div>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w, h;
        const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
        window.addEventListener('resize', resize);
        resize();

        // --- PARTICLES ---
        class Particle {
            constructor(x, y, speed, angle, color) {
                this.x = x; this.y = y;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = 0.01 + Math.random() * 0.02;
                this.color = color;
                this.size = 2 + Math.random() * 3;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
            }
        }

        const particles = [];

        // --- AUDIO ---
        let audioCtx, analyser, dataArray;
        async function start() {
            audioCtx = new AudioContext();
            const osc = audioCtx.createOscillator();
            osc.frequency.setValueAtTime(55, audioCtx.currentTime); // Bass
            
            // Modulate it to create beats
            const mod = audioCtx.createOscillator();
            mod.frequency.value = 2; // 2Hz Beat
            const modGain = audioCtx.createGain();
            modGain.gain.value = 1000;
            
            mod.connect(modGain);
            modGain.connect(osc.frequency);
            
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            osc.connect(analyser);
            analyser.connect(audioCtx.destination);
            osc.start();
            mod.start();
            loop();
        }

        document.getElementById('btn').onclick = () => {
            document.getElementById('overlay').classList.add('hidden');
            start();
        };

        function loop() {
            requestAnimationFrame(loop);
            analyser.getByteTimeDomainData(dataArray);

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(0,0,w,h);
            
            // Calculate Bass Hit
            let maxVal = 0;
            for(let i=0; i<dataArray.length; i++) {
                const v = Math.abs(dataArray[i]-128);
                if (v > maxVal) maxVal = v;
            }

            // Spawn particles on hit
            if (maxVal > 80) { // Threshold
                const cx = w/2, cy = h/2;
                for(let i=0; i<5; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 5;
                    particles.push(new Particle(cx, cy, speed, angle, '#ffaa00'));
                }
            }

            // Update/Draw Particles
            ctx.globalCompositeOperation = 'lighter';
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.update();
                if(p.life <= 0) particles.splice(i, 1);
                else p.draw(ctx);
            }

            // Draw Main Scope
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const sliceWidth = w / dataArray.length;
            let x = 0;
            for(let i=0; i<dataArray.length; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * h/2;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                x += sliceWidth;
            }
            ctx.stroke();
        }
    </script>
</body>
</html>
