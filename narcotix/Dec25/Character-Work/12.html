<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oscilloscope X-12 // Kaleidoscope</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
        canvas { display: block; filter: contrast(1.3) brightness(1.2); }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; transition: opacity 0.5s; backdrop-filter: blur(5px); }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        .btn { background: transparent; border: 1px solid #f0f; color: #f0f; padding: 20px 50px; font-size: 20px; cursor: pointer; text-transform: uppercase; letter-spacing: 4px; transition: 0.3s; }
        .btn:hover { background: #f0f; color: #000; box-shadow: 0 0 30px #f0f; }
        #hud { position: absolute; bottom: 30px; left: 30px; pointer-events: none; z-index: 5; text-shadow: 0 2px 2px #000; }
        .hud-row { margin-bottom: 5px; font-size: 14px; letter-spacing: 1px; }
        .hud-val { font-weight: bold; color: #f0f; }
    </style>
</head>
<body>
    <div id="overlay"><button class="btn" id="startBtn">Enter Kaleidoscope</button></div>
    <div id="hud"><div class="hud-row">MODE: <span class="hud-val" id="h-vis">--</span></div></div>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w, h, cx, cy;
        const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; cx=w/2; cy=h/2; };
        window.addEventListener('resize', resize); resize();

        // New Property: symmetry (1, 2, 4, 6, 8, 12)
        const MODES = [
            { name: "Mirror Twin", shape: 'line', symmetry: 2, color: '#0ff' },
            { name: "Quad Core", shape: 'spiral', symmetry: 4, color: '#f0f' },
            { name: "Hex Grid", shape: 'noise', symmetry: 6, color: '#0f0' },
            { name: "Mandala 8", shape: 'flower', symmetry: 8, color: '#ff0' },
            { name: "Mandala 12", shape: 'star', symmetry: 12, color: '#f00' },
            { name: "Kaleidoscope", shape: 'complex', symmetry: 16, color: '#fff' }
        ];
        
        let mIndex = 0;
        let audioCtx, analyser, dataArray;
        let isRunning = false;

        async function start() {
            audioCtx = new AudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 1024;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            // Simple drone
            osc.frequency.value = 100;
            osc.connect(gain);
            gain.connect(analyser);
            analyser.connect(audioCtx.destination);
            osc.start();
            
            loop();
        }

        document.getElementById('startBtn').onclick = () => {
            document.getElementById('overlay').classList.add('hidden');
            isRunning = true;
            start();
            updateHud();
        };

        document.addEventListener('keydown', e => {
            if(!isRunning) return;
            if(e.key === 'ArrowRight') mIndex = (mIndex+1)%MODES.length;
            if(e.key === 'ArrowLeft') mIndex = (mIndex-1+MODES.length)%MODES.length;
            updateHud();
        });

        function updateHud() {
            document.getElementById('h-vis').innerText = MODES[mIndex].name;
            document.getElementById('h-vis').style.color = MODES[mIndex].color;
        }

        function loop() {
            requestAnimationFrame(loop);
            analyser.getByteTimeDomainData(dataArray);
            
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0,0,w,h);
            
            const m = MODES[mIndex];
            const segs = 100;
            const t = performance.now() * 0.001;

            ctx.lineWidth = 2;
            ctx.strokeStyle = m.color;
            ctx.shadowColor = m.color;
            ctx.shadowBlur = 10;
            ctx.globalCompositeOperation = 'lighter';

            // Draw ONE segment, then rotate and draw again
            for(let s=0; s<m.symmetry; s++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((Math.PI * 2 / m.symmetry) * s);
                
                ctx.beginPath();
                for(let i=0; i<=segs; i++) {
                    const pct = i/segs;
                    const raw = (dataArray[Math.floor(pct * dataArray.length)] / 128.0) - 1;
                    
                    let x, y;
                    const rBase = Math.min(w,h) * 0.25;
                    
                    if(m.shape === 'line') {
                        x = (pct - 0.5) * rBase * 2;
                        y = raw * 100;
                    } else if (m.shape === 'spiral') {
                        const ang = pct * Math.PI * 4 + t;
                        const r = pct * rBase * (1 + raw);
                        x = Math.cos(ang)*r; y = Math.sin(ang)*r;
                    } else if (m.shape === 'flower') {
                        const ang = pct * Math.PI * 2;
                        const r = rBase * (1 + Math.sin(ang*3)) * (1 + raw*0.5);
                        x = Math.cos(ang)*r; y = Math.sin(ang)*r;
                    } else {
                        // Complex/Noise
                        const ang = pct * Math.PI * 2;
                        const r = rBase * (1 + raw);
                        x = Math.cos(ang + t)*r; y = Math.sin(ang - t)*r;
                    }
                    
                    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.stroke();
                ctx.restore();
            }
        }
    </script>
</body>
</html>
