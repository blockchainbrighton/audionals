<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oscilloscope v9 // RGB Shift</title>
    <style>
        body { margin: 0; background: #050505; overflow: hidden; font-family: monospace; }
        canvas { display: block; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 10; transition: opacity 0.5s; }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        button { background: transparent; border: 1px solid #f0f; color: #f0f; padding: 20px 40px; font-size: 18px; cursor: pointer; text-transform: uppercase; letter-spacing: 4px; box-shadow: 0 0 10px #f0f; }
        button:hover { background: #f0f; color: #000; box-shadow: 0 0 30px #f0f; }
    </style>
</head>
<body>
    <div id="overlay"><button id="btn">Initialize v9 (RGB)</button></div>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w, h;
        
        const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
        window.addEventListener('resize', resize);
        resize();

        let audioCtx, osc, analyser, dataArray;
        
        async function start() {
            audioCtx = new AudioContext();
            osc = audioCtx.createOscillator();
            osc.frequency.value = 60;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.5;
            
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            osc.connect(gain);
            gain.connect(analyser);
            analyser.connect(audioCtx.destination);
            osc.start();
            loop();
        }

        document.getElementById('btn').onclick = () => {
            document.getElementById('overlay').classList.add('hidden');
            start();
        };

        function drawChannel(color, offsetX, offsetY) {
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            const cx = w/2, cy = h/2;
            const buffer = dataArray.length;
            
            for(let i=0; i<buffer; i+=2) {
                const v = (dataArray[i] / 128.0) - 1.0;
                const t = (i / buffer) * Math.PI * 2;
                
                // Spiral shape
                const r = (i/buffer) * (Math.min(w,h)*0.4);
                const x = cx + Math.cos(t * 5) * r * (1 + v);
                const y = cy + Math.sin(t * 5) * r * (1 + v);
                
                if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function loop() {
            requestAnimationFrame(loop);
            analyser.getByteTimeDomainData(dataArray);

            // Fade
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(0,0,w,h);

            // RGB Split Effect
            // We use 'screen' blend mode to add colors: Red + Blue + Green -> White
            ctx.globalCompositeOperation = 'screen';
            
            // Calculate Audio Intensity for Shake
            let sum = 0;
            for(let i=0; i<dataArray.length; i++) sum += Math.abs(dataArray[i]-128);
            const intensity = sum / dataArray.length;
            
            const shake = intensity * 0.5;

            drawChannel('#ff0000', -5 - shake, 0); // Red Left
            drawChannel('#00ff00', 0, 0);          // Green Center
            drawChannel('#0000ff', 5 + shake, 0);  // Blue Right
            
            // Scanlines
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<h; i+=4) {
                ctx.fillRect(0, i, w, 2);
            }
        }
    </script>
</body>
</html>
