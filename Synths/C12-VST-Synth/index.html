      getSyncedBuffer(freqs, syncHz, waveforms = []) {
        const shapes = freqs.map((_, index) => this.normalizeWaveform(waveforms[index] || 'sawtooth'));
        const key = this.syncedBufferKey(freqs, syncHz, shapes);
        const cached = this.syncBufferCache.get(key);
        if (cached) return cached;

        const sampleRate = this.audioContext.sampleRate;
        const period = 1 / syncHz;
        const idealSamples = sampleRate * period;
        const frameCount = Math.max(64, Math.min(8192, Math.round(idealSamples)));
        const buffer = this.audioContext.createBuffer(1, frameCount, sampleRate);
        const channel = buffer.getChannelData(0);
        const dryScale = 1 / Math.sqrt(Math.max(1, freqs.length));

        for (let i = 0; i < frameCount; i += 1) {
          const t = (i / frameCount) * period;
          let drySum = 0;
          for (let fi = 0; fi < freqs.length; fi += 1) {
            const phase = (t * freqs[fi]) % 1;
            drySum += this.waveformSample(phase, shapes[fi]);
          }
          channel[i] = Math.max(-1, Math.min(1, drySum * dryScale * 0.92));
        }

        const playbackRate = (frameCount * syncHz) / sampleRate;
        const out = { buffer, playbackRate };
        this.syncBufferCache.set(key, out);
        return out;
      }

      makeSyncedSource(freqs, syncHz, when, peak) {
        const { buffer, playbackRate } = this.getSyncedBuffer(freqs, syncHz);
        const filter = this.audioContext.createBiquadFilter();
        const gain = this.audioContext.createGain();
        const dry = this.audioContext.createGain();
        const source = this.audioContext.createBufferSource();
        const now = this.audioContext.currentTime;

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, when);
        filter.Q.setValueAtTime(1.8, when);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.setValueAtTime(0.0001, when);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), when + 0.22);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * 0.76), when + 0.42);

        source.buffer = buffer;
        source.loop = true;
        source.playbackRate.setValueAtTime(playbackRate, when);
        source.onended = () => {
          try {
            source.disconnect();
          } catch (_err) {
            // Ignore disconnect races on ended sources.
          }
        };

        source.connect(filter);
        filter.connect(gain);
        gain.connect(dry);
        dry.connect(this.voiceBus);
        source.start(when);

        return { source, filter, gain, dry };
      }

      createSyncedSourceForVoice(voice, syncHz, when) {
        const { buffer, playbackRate } = this.getSyncedBuffer([voice.freq], syncHz, [voice.waveform]);
        const source = this.audioContext.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        source.playbackRate.setValueAtTime(playbackRate, when);
        source.onended = () => {
          try {
            source.disconnect();
          } catch (_err) {
            // Ignore disconnect races on ended sources.
          }
        };

        source.connect(voice.filter);
        source.start(when);
        return source;
      }

      updateSyncedLevel(group, t0, peak) {
        if (!group.syncGain) return;
        const target = Math.max(0.0002, peak * 0.76);
        const g = group.syncGain.gain;
        if (typeof g.cancelAndHoldAtTime === 'function') {
          g.cancelAndHoldAtTime(t0);
        } else {
          g.cancelScheduledValues(t0);
          g.setValueAtTime(Math.max(0.0001, g.value || 0.0001), t0);
        }
        g.setTargetAtTime(target, t0, 0.05);
      }

      releaseSyncedGroup(group, t0, release) {
        if (!group.syncSource && !group.syncFilter && !group.syncGain && !group.syncDry) {
          this.releaseDelayTaps(group, t0);
          group.syncMode = 'none';
          group.syncHz = 0;
          group.syncFreqKey = '';
          return;
        }

        if (group.syncGain) {
          const g = group.syncGain.gain;
          if (typeof g.cancelAndHoldAtTime === 'function') {
            g.cancelAndHoldAtTime(t0);
          } else {
            g.cancelScheduledValues(t0);
            g.setValueAtTime(Math.max(0.0001, g.value || 0.0001), t0);
          }
          g.setTargetAtTime(0.0001, t0, Math.max(0.04, release / 2.6));
        }

        if (group.syncSource) {
          group.syncSource.stop(t0 + release + 0.2);
        }

        const filter = group.syncFilter;
        const gain = group.syncGain;
        const dry = group.syncDry;
        this.releaseDelayTaps(group, t0, true);
        const cleanupMs = Math.max(0, (release + 0.25) * 1000);
        setTimeout(() => {
          if (filter) {
            try {
              filter.disconnect();
            } catch (_err) {
              // Ignore disconnect races when a synced group is already cleaned up.
            }
          }
          if (gain) {
            try {
              gain.disconnect();
            } catch (_err) {
              // Ignore disconnect races when a synced group is already cleaned up.
            }
          }
          if (dry) {
            try {
              dry.disconnect();
            } catch (_err) {
              // Ignore disconnect races when a synced group is already cleaned up.
            }
          }
        }, cleanupMs);

        group.syncSource = null;
        group.syncFilter = null;
        group.syncGain = null;
        group.syncDry = null;
        group.syncMode = 'none';
        group.syncHz = 0;
        group.syncFreqKey = '';
      }

      useSyncedGroup(group, freqs, rawFreqs, syncMode, syncHz, t0, peak, wetRatio, feedbackRatio) {
        if (!(syncHz > 0)) {
          this.releaseSyncedGroup(group, t0, 0.28);
          return;
        }

        for (const voice of group.voices.values()) {
          this.releaseVoice(voice, t0, 0.28);
        }
        group.voices.clear();

        const freqKey = freqs.map((f) => f.toPrecision(15)).join(',');
        const sameShape = group.syncSource
          && group.syncMode === syncMode
          && Math.abs(group.syncHz - syncHz) < 1e-9
          && group.syncFreqKey === freqKey;

        if (sameShape) {
          this.updateSyncedLevel(group, t0, peak);
          if (group.syncDry) {
            group.syncDry.gain.cancelScheduledValues(t0);
            group.syncDry.gain.setTargetAtTime(this.delayDryGain(wetRatio), t0, 0.04);
          }
          this.configureDelayTaps(group.syncGain, group, rawFreqs, wetRatio, feedbackRatio, t0);
          return;
        }

        this.releaseSyncedGroup(group, t0, 0.28);

        const startWhen = this.syncAlignedTime(1 / syncHz, t0);
        const synced = this.makeSyncedSource(freqs, syncHz, startWhen, peak);
        group.syncSource = synced.source;
        group.syncFilter = synced.filter;
        group.syncGain = synced.gain;
        group.syncDry = synced.dry;
        group.syncDry.gain.setValueAtTime(this.delayDryGain(wetRatio), t0);
        group.syncMode = syncMode;
        group.syncHz = syncHz;
        group.syncFreqKey = freqKey;
        this.configureDelayTaps(group.syncGain, group, rawFreqs, wetRatio, feedbackRatio, t0);
      }

      createOscillatorForVoice(voice, when) {
        const osc = this.audioContext.createOscillator();
        osc.type = this.normalizeWaveform(voice.waveform);
        osc.frequency.setValueAtTime(voice.freq, when);
        osc.onended = () => {
          try {
            osc.disconnect();
          } catch (_err) {
            // Ignore disconnect races on ended oscillators.
          }
        };

        osc.connect(voice.filter);
        osc.start(when);
        return osc;
      }

      makeSyncedVoice(freq, rawFreqs, waveform, syncHz, startWhen, t0, peak, wetRatio, feedbackRatio) {
        const filter = this.audioContext.createBiquadFilter();
        const filter2 = this.audioContext.createBiquadFilter();
        const gain = this.audioContext.createGain();
        const dry = this.audioContext.createGain();

        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.setValueAtTime(0.0001, startWhen);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), startWhen + 0.22);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * 0.76), startWhen + 0.42);

        filter.connect(filter2);
        filter2.connect(gain);
        gain.connect(dry);
        dry.connect(this.voiceBus);

        dry.gain.setValueAtTime(this.delayDryGain(wetRatio), t0);

        const voice = {
          freq,
          rawFreqs: Array.isArray(rawFreqs) ? rawFreqs.slice() : [],
          waveform: this.normalizeWaveform(waveform),
          filter,
          filter2,
          gain,
          dry,
          osc: null,
          syncSource: null,
          syncHz,
          filterLfo: null,
          filterLfoGain1: null,
          filterLfoGain2: null,
          delayTaps: [],
          delayRawKey: '',
        };
        this.createFilterLfoForVoice(voice, t0);
        this.applyFilterSettingsToVoice(voice, t0);
        voice.syncSource = this.createSyncedSourceForVoice(voice, syncHz, startWhen);
        this.configureDelayTaps(voice.gain, voice, voice.rawFreqs, wetRatio, feedbackRatio, t0);
        return voice;
      }

      makeVoice(freq, rawFreqs, waveform, t0, peak, wetRatio, feedbackRatio) {
        const filter = this.audioContext.createBiquadFilter();
        const filter2 = this.audioContext.createBiquadFilter();
        const gain = this.audioContext.createGain();
        const dry = this.audioContext.createGain();

        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + 0.22);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * 0.76), t0 + 0.42);

        filter.connect(filter2);
        filter2.connect(gain);
        gain.connect(dry);
        dry.connect(this.voiceBus);

        dry.gain.setValueAtTime(this.delayDryGain(wetRatio), t0);

        const voice = {
          freq,
          rawFreqs: Array.isArray(rawFreqs) ? rawFreqs.slice() : [],
          waveform: this.normalizeWaveform(waveform),
          filter,
          filter2,
          gain,
          dry,
          osc: null,
          syncSource: null,
          syncHz: 0,
          filterLfo: null,
          filterLfoGain1: null,
          filterLfoGain2: null,
          delayTaps: [],
          delayRawKey: '',
        };
        this.createFilterLfoForVoice(voice, t0);
        this.applyFilterSettingsToVoice(voice, t0);
        voice.osc = this.createOscillatorForVoice(voice, t0);
        this.configureDelayTaps(voice.gain, voice, voice.rawFreqs, wetRatio, feedbackRatio, t0);
        return voice;
      }

      updateVoiceLevel(voice, t0, peak) {
        const target = Math.max(0.0002, peak * 0.76);
        const g = voice.gain.gain;
        if (typeof g.cancelAndHoldAtTime === 'function') {
          g.cancelAndHoldAtTime(t0);
        } else {
          g.cancelScheduledValues(t0);
          g.setValueAtTime(Math.max(0.0001, g.value || 0.0001), t0);
        }
        g.setTargetAtTime(target, t0, 0.05);
      }

      releaseVoice(voice, t0, release) {
        const g = voice.gain.gain;
        if (typeof g.cancelAndHoldAtTime === 'function') {
          g.cancelAndHoldAtTime(t0);
        } else {
          g.cancelScheduledValues(t0);
          g.setValueAtTime(Math.max(0.0001, g.value || 0.0001), t0);
        }
        g.setTargetAtTime(0.0001, t0, Math.max(0.04, release / 2.6));
        if (voice.osc) {
          voice.osc.stop(t0 + release + 0.2);
          voice.osc = null;
        }
        if (voice.syncSource) {
          voice.syncSource.stop(t0 + release + 0.2);
          voice.syncSource = null;
        }
        if (voice.filterLfo) {
          voice.filterLfo.stop(t0 + release + 0.2);
          voice.filterLfo = null;
        }
        this.releaseDelayTaps(voice, t0, true);
        const cleanupMs = Math.max(0, (release + 0.25) * 1000);
        setTimeout(() => {
          try {
            voice.filter.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a voice is already cleaned up.
          }
          try {
            voice.gain.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a voice is already cleaned up.
          }
          try {
            voice.filter2.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a voice is already cleaned up.
          }
          try {
            voice.dry.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a voice is already cleaned up.
          }
          try {
            voice.filterLfoGain1.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a voice is already cleaned up.
          }
          try {
            voice.filterLfoGain2.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a voice is already cleaned up.
          }
        }, cleanupMs);
      }

      stopGroup(group, t0, release) {
        this.releaseSyncedGroup(group, t0, release);
        for (const voice of group.voices.values()) {
          this.releaseVoice(voice, t0, release);
        }
        group.voices.clear();
      }

      stopActive(release = 0.48) {
        if (!this.audioContext || this.activeGroups.size === 0) {
          this.activeSignature = '';
          return;
        }
        const t0 = this.audioContext.currentTime;
        for (const group of this.activeGroups.values()) {
          this.stopGroup(group, t0, release);
        }
        this.activeGroups.clear();
        this.activeSignature = '';
      }
    }

    function clampLabel(mode) {
      if (mode === 'none') return 'none';
      return mode;
    }

    function phaseLockLabel(mode) {
      if (mode === 'fundamental') return 'Fundamental';
      if (mode === 'cluster-high') return 'Cluster High';
      if (mode === 'cluster-low') return 'Cluster Low';
      return 'None';
    }

    function waveformLabel(mode) {
      if (mode === 'sine') return 'Sine';
      if (mode === 'triangle') return 'Triangle';
      if (mode === 'square') return 'Square';
      if (mode === 'random') return 'Random';
      return 'Saw';
    }

    function distPointToSegment(px, py, x1, y1, x2, y2) {
      const vx = x2 - x1;
      const vy = y2 - y1;
      const wx = px - x1;
      const wy = py - y1;
      const len2 = vx * vx + vy * vy;
      if (len2 === 0) return Math.hypot(px - x1, py - y1);
      let t = (wx * vx + wy * vy) / len2;
      t = Math.max(0, Math.min(1, t));
      const projX = x1 + t * vx;
      const projY = y1 + t * vy;
      return Math.hypot(px - projX, py - projY);
    }

    function pointerToSource(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((event.clientX - rect.left) / rect.width) * sourceWidth,
        y: ((event.clientY - rect.top) / rect.height) * sourceHeight,
      };
    }

    function getVisibleEdges() {
      if (combineAll) {
        const graph = getCombinedGraph();
        if (!graph) return [];
        return graph.edges.map((edge, edgeIndex) => ({
          ...edge,
          edgeIndex,
          mode: 'combined',
          componentId: edge.component,
        }));
      }

      const out = [];
      for (const ref of allEdges) {
        if (!categories[ref.ci].enabled) continue;
        out.push({
          ...ref,
          mode: 'category',
          componentId: categories[ref.ci].edges[ref.ei].component,
          color: categories[ref.ci].rgb,
        });
      }
      return out;
    }

    function targetFromEdgeRef(edgeRef) {
      if (!edgeRef) return null;
      if (edgeRef.mode === 'combined') {
        return { mode: 'combined', componentId: edgeRef.componentId };
      }
      return { mode: 'category', ci: edgeRef.ci, componentId: edgeRef.componentId };
    }

    function hoverTargetKey(target) {
      if (!target) return '';
      return target.mode === 'combined'
        ? `combined:${target.componentId}`
        : `category:${target.ci}:${target.componentId}`;
    }

    function normalizeHoverTargets(targets) {
      if (!Array.isArray(targets) || targets.length === 0) return [];
      const deduped = new Map();
      for (const target of targets) {
        if (!target) continue;
        deduped.set(hoverTargetKey(target), target);
      }
      return Array.from(deduped.values()).sort((a, b) => (
        hoverTargetKey(a).localeCompare(hoverTargetKey(b))
      ));
    }

    function hitTestEdges(x, y, extraPadding = 0) {
      const hits = new Map();
      for (const ref of getVisibleEdges()) {
        const d = distPointToSegment(x, y, ref.x1, ref.y1, ref.x2, ref.y2);
        const threshold = Math.max(9, edgeWidthFor(ref) + 6) + Math.max(0, extraPadding);
        if (d <= threshold) {
          const target = targetFromEdgeRef(ref);
          const key = hoverTargetKey(target);
          const prior = hits.get(key);
          if (!prior || d < prior.distance) {
            hits.set(key, { target, distance: d });
          }
        }
      }
      return Array.from(hits.values())
        .sort((a, b) => a.distance - b.distance)
        .map((entry) => entry.target);
    }

    function nearestClusterTarget(x, y) {
      let bestTarget = null;
      let bestDistance = Infinity;
      const bestByTarget = new Map();
      for (const ref of getVisibleEdges()) {
        const target = targetFromEdgeRef(ref);
        const key = hoverTargetKey(target);
        const d = distPointToSegment(x, y, ref.x1, ref.y1, ref.x2, ref.y2);
        const prior = bestByTarget.get(key);
        if (!prior || d < prior.distance) {
          bestByTarget.set(key, { target, distance: d });
        }
      }
      for (const entry of bestByTarget.values()) {
        if (entry.distance < bestDistance) {
          bestDistance = entry.distance;
          bestTarget = entry.target;
        }
      }
      return bestTarget ? [bestTarget] : [];
    }

    const synth = new HoverSynth(statusEl);
    let hovered = []; // [{ mode, componentId, ci? }]
    const activeTouchTargets = new Map();
    let rafId = 0;

    function syncCombineButtons() {
      for (const btn of combineBtns) {
        const mode = btn.dataset.combine === 'enable';
        setPressedState(btn, mode === combineAll);
      }
    }

    function syncPhaseLockButtons() {
      for (const btn of phaseLockBtns) {
        setPressedState(btn, btn.dataset.phaseLock === phaseLockMode);
      }
    }

    function syncWaveformButtons() {
      for (const btn of waveformBtns) {
        setPressedState(btn, btn.dataset.waveform === waveformMode);
      }
    }

    function syncClampButtons() {
      for (const btn of clampBtns) {
        setPressedState(btn, btn.dataset.clamp === clampMode);
      }
    }

    function sameHoverTargets(a, b) {
      const aa = normalizeHoverTargets(a);
      const bb = normalizeHoverTargets(b);
      if (aa.length !== bb.length) return false;
      for (let i = 0; i < aa.length; i += 1) {
        if (hoverTargetKey(aa[i]) !== hoverTargetKey(bb[i])) return false;
      }
      return true;
    }

    function getTargetDetails(target) {
      if (!target) return null;

      if (target.mode === 'combined') {
        const graph = getCombinedGraph();
        if (!graph) return null;
        const comp = graph.components[target.componentId];
        if (!comp) return null;
        return {
          label: 'Combined',
          color: comp.color,
          numbers: comp.numbers,
          edges: comp.edgeIndices.map((ei) => graph.edges[ei]),
          nodes: comp.nodeIndices.map((ni) => graph.nodes[ni]),
          key: `combined:${target.componentId}`,
        };
      }

      if (!categories[target.ci] || !categories[target.ci].enabled) return null;
      const cat = categories[target.ci];
      const comp = cat.components[target.componentId];
      if (!comp) return null;
      return {
        label: cat.label,
        color: cat.rgb,
        numbers: comp.numbers,
        edges: comp.edgeIndices.map((ei) => cat.edges[ei]),
        nodes: comp.nodeIndices.map((ni) => cat.nodes[ni]),
        key: `category:${target.ci}:${target.componentId}`,
      };
    }

    function getHoveredDetailsList(targets = hovered) {
      return normalizeHoverTargets(targets)
        .map((target) => getTargetDetails(target))
        .filter(Boolean);
    }

    function playHovered() {
      const detailsList = getHoveredDetailsList();
      if (detailsList.length === 0) {
        synth.stopActive(0.48);
        return;
      }
      const groups = detailsList.map((details) => {
        const voiceMap = new Map();
        const rawFreqs = [];
        for (const n of details.numbers) {
          const rawFreq = baseHz * n;
          const freq = clampFrequency(rawFreq, clampMode);
          rawFreqs.push(rawFreq);
          const prior = voiceMap.get(freq);
          if (prior) {
            prior.push(rawFreq);
          } else {
            voiceMap.set(freq, [rawFreq]);
          }
        }
        const voices = Array.from(voiceMap.entries())
          .map(([freq, groupedRawFreqs]) => ({
            freq,
            rawFreqs: groupedRawFreqs.slice(),
          }))
          .sort((a, b) => a.freq - b.freq);
        return {
          key: details.key,
          voices,
          freqs: voices.map((voice) => voice.freq),
          rawFreqs,
        };
      });
      const signature = [
        waveformMode,
        phaseLockMode,
        clampMode,
        baseHz,
        delayWetPct,
        delayFeedbackPct,
        ...groups.map((group) => `${group.key}:${group.freqs.join(',')}`),
      ].join('|');
      synth.playGroups(signature, groups, phaseLockMode, baseHz, waveformMode);
    }

    function updateInfo() {
      const detailsList = getHoveredDetailsList();
      if (detailsList.length === 0) {
        renderInfoPanel('No Cluster Selected', [
          { label: '', value: 'hover a colored link to inspect the active cluster.' },
        ]);
        return;
      }

      const titleColor = mixColors(detailsList.map((details) => details.color));
      const allNumbers = Array.from(new Set(
        detailsList.flatMap((details) => details.numbers),
      )).sort((a, b) => a - b);
      const freqs = componentFrequencies({ numbers: allNumbers });
      const clusterLabels = detailsList.map((details) => details.label);
      renderInfoPanel(
        detailsList.length === 1 ? detailsList[0].label : 'Multiple Clusters',
        [
          { label: 'Clusters', value: clusterLabels.join(', ') },
          { label: 'Numbers', value: allNumbers.join(', ') },
          { label: 'Frequencies', value: freqs.length ? freqs.map(formatHz).join(', ') : 'Out of range' },
        ],
        titleColor,
      );
    }

    function setClampMode(nextMode) {
      if (nextMode === clampMode) return;
      clampMode = nextMode;
      syncClampButtons();
      updateStatus();
      if (hovered.length) playHovered();
      updateInfo();
    }

    function setBaseHz(nextHz) {
      if (!Number.isFinite(nextHz) || nextHz <= 0 || nextHz === baseHz) return;
      baseHz = nextHz;
      updateFundamentalDisplay();
      updateStatus();
      if (hovered.length) playHovered();
      updateInfo();
    }

    function nudgeBaseHz(multiplier) {
      setBaseHz(baseHz * multiplier);
    }

    function setPhaseLockMode(nextMode) {
      if (nextMode === phaseLockMode) return;
      phaseLockMode = nextMode;
      syncPhaseLockButtons();
      updateStatus();
      if (hovered.length) playHovered();
      updateInfo();
    }

    function setWaveformMode(nextMode) {
      if (!['sine', 'triangle', 'saw', 'square', 'random'].includes(nextMode) || nextMode === waveformMode) {
        return;
      }
      waveformMode = nextMode;
      syncWaveformButtons();
      updateStatus();
      if (hovered.length) playHovered();
      updateInfo();
    }

    function setDelayWetPct(nextValue) {
      const value = Math.max(0, Math.min(100, Math.round(nextValue)));
      if (value === delayWetPct) return;
      delayWetPct = value;
      updateDelayDisplay();
      synth.updateDelaySettingsForActive(delayWetRatio(), delayFeedbackRatio());
      updateInfo();
    }

    function setDelayFeedbackPct(nextValue) {
      const value = Math.max(0, Math.min(90, Math.round(nextValue)));
      if (value === delayFeedbackPct) return;
      delayFeedbackPct = value;
      updateDelayDisplay();
      synth.updateDelaySettingsForActive(delayWetRatio(), delayFeedbackRatio());
      updateInfo();
    }

    function setReverbWetPct(nextValue) {
      const value = Math.max(0, Math.min(100, Math.round(nextValue)));
      if (value === reverbWetPct) return;
      reverbWetPct = value;
      updateReverbDisplay();
      synth.updateReverbMix(reverbWetRatio());
      updateInfo();
    }

    function applyFilterControlChange() {
      syncFilterTypeButtons();
      syncFilterDbButtons();
      updateFilterDisplay();
      synth.updateFilterSettingsForActive();
      updateInfo();
    }

    function setFilterType(nextType) {
      if (!['lowpass', 'highpass', 'bandpass', 'notch'].includes(nextType) || nextType === filterType) return;
      filterType = nextType;
      applyFilterControlChange();
    }

    function setFilterDb(nextDb) {
      if (!['12', '24'].includes(nextDb) || nextDb === filterDb) return;
      filterDb = nextDb;
      applyFilterControlChange();
    }

    function setFilterFrequencyPos(nextPos) {
      const value = Math.max(0, Math.min(1000, Math.round(nextPos)));
      if (value === filterFreqPos) return;
      filterFreqPos = value;
      applyFilterControlChange();
    }

    function setFilterResonancePct(nextPct) {
      const value = Math.max(0, Math.min(100, Math.round(nextPct)));
      if (value === filterResonancePct) return;
      filterResonancePct = value;
      applyFilterControlChange();
    }

    function setFilterModAmountPct(nextPct) {
      const value = Math.max(0, Math.min(100, Math.round(nextPct)));
      if (value === filterModAmountPct) return;
      filterModAmountPct = value;
      applyFilterControlChange();
    }

    function setCombineAll(nextValue) {
      const value = Boolean(nextValue);
      if (combineAll === value) return;
      combineAll = value;
      syncCombineButtons();
      invalidateCombinedGraph();
      clearHover();
      updateStatus();
      updateInfo();
    }

    function clearHover() {
      hovered = [];
      synth.stopActive(0.48);
      requestDraw();
      updateInfo();
    }

    function toggleCategory(ci) {
      categories[ci].enabled = !categories[ci].enabled;
      syncLegend();
      invalidateCombinedGraph();
      if (combineAll) {
        clearHover();
        updateStatus();
        return;
      }
      hovered = normalizeHoverTargets(
        hovered.filter((target) => Boolean(getTargetDetails(target))),
      );
      if (hovered.length) {
        playHovered();
      } else {
        synth.stopActive(0.48);
      }
      requestDraw();
      updateStatus();
      updateInfo();
    }

    function setHoveredByEdgeRefs(edgeRefs) {
      const next = normalizeHoverTargets(edgeRefs);
      if (sameHoverTargets(hovered, next)) return;

      hovered = next;
      if (hovered.length === 0) {
        synth.stopActive(0.48);
      } else {
        playHovered();
      }
      requestDraw();
      updateInfo();
    }

    function visibleNodeEntries() {
      const out = enabledNodeEntries();
      out.sort((a, b) => b.radius - a.radius);
      return out;
    }

    function drawAllLines() {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (const ref of getVisibleEdges()) {
        ctx.strokeStyle = rgbToCss(ref.color, 0.92);
        ctx.lineWidth = edgeWidthFor(ref);
        ctx.beginPath();
        ctx.moveTo(ref.x1, ref.y1);
        ctx.lineTo(ref.x2, ref.y2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawAllDots() {
      ctx.save();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 1;
      for (const node of visibleNodeEntries()) {
        ctx.fillStyle = rgbToCss(node.color, 1);
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function getHighlightedPolygons(targets = hovered) {
      const detailsList = getHoveredDetailsList(targets);
      if (detailsList.length === 0 || graphPolygons.length === 0) return [];
      const numbers = new Set();
      for (const details of detailsList) {
        for (const n of details.numbers) {
          numbers.add(n);
        }
      }
      return graphPolygons.filter((polygon) => {
        for (const n of numbers) {
          if (n >= polygon.start && n <= polygon.end) return true;
        }
        return false;
      });
    }

    function drawActivePolygonHighlights(nowMs) {
      const polygons = getHighlightedPolygons();
      if (polygons.length === 0) return;
      const radialOffset = graphMode === 'classical' ? 2.25 : 1.6;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(255,255,255,1)';
      ctx.shadowBlur = 3.0;
      ctx.strokeStyle = 'rgba(255,255,255,0.42)';
      ctx.lineWidth = 1.45;
      for (const polygon of polygons) {
        for (const segment of polygon.segments) {
          const dx1 = segment.x1 - center.x;
          const dy1 = segment.y1 - center.y;
          const len1 = Math.max(1e-6, Math.hypot(dx1, dy1));
          const x1 = segment.x1 + (dx1 / len1) * radialOffset;
          const y1 = segment.y1 + (dy1 / len1) * radialOffset;

          const dx2 = segment.x2 - center.x;
          const dy2 = segment.y2 - center.y;
          const len2 = Math.max(1e-6, Math.hypot(dx2, dy2));
          const x2 = segment.x2 + (dx2 / len2) * radialOffset;
          const y2 = segment.y2 + (dy2 / len2) * radialOffset;

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawActiveHighlight(active, nowMs) {
      const details = getTargetDetails(active);
      if (!details) return;
      const pulse = 0.5 + 0.5 * Math.sin((nowMs / 1000) * Math.PI * 3);
      const glowRgb = lighten(details.color, 0.46);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = rgbToCss(glowRgb, 1);
      ctx.shadowBlur = 16 + 14 * pulse;
      for (const e of details.edges) {
        const baseW = edgeWidthFor(e);
        ctx.strokeStyle = rgbToCss(glowRgb, 0.42);
        ctx.lineWidth = baseW + 8.6 + 3.2 * pulse;
        ctx.beginPath();
        ctx.moveTo(e.x1, e.y1);
        ctx.lineTo(e.x2, e.y2);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      for (const e of details.edges) {
        const baseW = edgeWidthFor(e);
        ctx.strokeStyle = rgbToCss(glowRgb, 1);
        ctx.lineWidth = baseW + 2.1 + 1.2 * pulse;
        ctx.beginPath();
        ctx.moveTo(e.x1, e.y1);
        ctx.lineTo(e.x2, e.y2);
        ctx.stroke();
      }
      for (const n of details.nodes) {
        const outerR = nodeRadiusFor(n.x, n.y) + 3.0 + 1.5 * pulse;
        const innerR = nodeRadiusFor(n.x, n.y) + 1.0 + 0.6 * pulse;
        ctx.fillStyle = rgbToCss(glowRgb, 0.42);
        ctx.beginPath();
        ctx.arc(n.x, n.y, outerR, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = rgbToCss(glowRgb, 1);
        ctx.beginPath();
        ctx.arc(n.x, n.y, innerR, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawFrame(nowMs) {
      rafId = 0;
      ctx.clearRect(0, 0, sourceWidth, sourceHeight);
      drawAllLines();
      drawAllDots();
      if (hovered.length) {
        for (const active of hovered) {
          drawActiveHighlight(active, nowMs);
        }
        requestDraw();
      }
    }

    function requestDraw() {
      if (rafId !== 0) return;
      rafId = requestAnimationFrame(drawFrame);
    }

    async function ensureAudio() {
      await synth.ensureReady();
      updateStatus();
      if (synth.audioContext && synth.audioContext.state === 'running' && hovered.length) {
        playHovered();
      }
    }

    function setTouchTargets(pointerId, targets) {
      activeTouchTargets.set(pointerId, normalizeHoverTargets(targets));
      const merged = [];
      for (const entries of activeTouchTargets.values()) {
        merged.push(...entries);
      }
      setHoveredByEdgeRefs(merged);
    }

    function releaseTouchTargets(pointerId) {
      if (!activeTouchTargets.delete(pointerId)) return;
      const merged = [];
      for (const entries of activeTouchTargets.values()) {
        merged.push(...entries);
      }
      setHoveredByEdgeRefs(merged);
    }

    function onPointerMove(event) {
      if (event.pointerType && event.pointerType !== 'mouse') {
        event.preventDefault();
        const p = pointerToSource(event);
        setTouchTargets(event.pointerId, nearestClusterTarget(p.x, p.y));
        return;
      }
      if (activeTouchTargets.size) return;
      ensureAudio();
      const p = pointerToSource(event);
      setHoveredByEdgeRefs(hitTestEdges(p.x, p.y));
    }

    function onPointerDownCanvas(event) {
      ensureAudio();
      const p = pointerToSource(event);
      const nextTargets = nearestClusterTarget(p.x, p.y);
      if (event.pointerType && event.pointerType !== 'mouse') {
        event.preventDefault();
        try {
          canvas.setPointerCapture(event.pointerId);
        } catch (_err) {
          // Ignore capture failures on unsupported browsers.
        }
        setTouchTargets(event.pointerId, nextTargets);
      } else if (nextTargets.length) {
        hovered = normalizeHoverTargets(nextTargets);
        requestDraw();
        updateInfo();
      }
    }

    function onPointerLeave(event) {
      if (event.pointerType && event.pointerType !== 'mouse') return;
      if (activeTouchTargets.size) return;
      setHoveredByEdgeRefs([]);
    }

    function onPointerUpCanvas(event) {
      if (!event.pointerType || event.pointerType === 'mouse') return;
      event.preventDefault();
      releaseTouchTargets(event.pointerId);
      try {
        canvas.releasePointerCapture(event.pointerId);
      } catch (_err) {
        // Ignore capture release failures on unsupported browsers.
      }
    }

    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerdown', onPointerDownCanvas);
    canvas.addEventListener('pointerup', onPointerUpCanvas);
    canvas.addEventListener('pointercancel', onPointerUpCanvas);
    canvas.addEventListener('pointerleave', onPointerLeave);
    canvas.addEventListener('touchstart', ensureAudio, { passive: true });
    window.addEventListener('touchstart', ensureAudio, { passive: true });
    window.addEventListener('pointerdown', ensureAudio, { passive: true });
    window.addEventListener('keydown', ensureAudio, { passive: true });

    for (const btn of clampBtns) {
      btn.addEventListener('click', () => setClampMode(btn.dataset.clamp));
    }
    for (const btn of graphModeBtns) {
      btn.addEventListener('click', () => applyGraphMode(btn.dataset.graphMode));
    }
    for (const btn of combineBtns) {
      btn.addEventListener('click', () => setCombineAll(btn.dataset.combine === 'enable'));
    }
    for (const btn of waveformBtns) {
      btn.addEventListener('click', () => setWaveformMode(btn.dataset.waveform));
    }
    for (const btn of phaseLockBtns) {
      btn.addEventListener('click', () => setPhaseLockMode(btn.dataset.phaseLock));
    }
    delayWetEl.addEventListener('input', () => setDelayWetPct(Number(delayWetEl.value)));
    delayFeedbackEl.addEventListener('input', () => setDelayFeedbackPct(Number(delayFeedbackEl.value)));
    reverbWetEl.addEventListener('input', () => setReverbWetPct(Number(reverbWetEl.value)));
    for (const btn of filterTypeBtns) {
      btn.addEventListener('click', () => setFilterType(btn.dataset.filterType));
    }
    for (const btn of filterDbBtns) {
      btn.addEventListener('click', () => setFilterDb(btn.dataset.filterDb));
    }
    filterFreqEl.addEventListener('input', () => setFilterFrequencyPos(Number(filterFreqEl.value)));
    filterResonanceEl.addEventListener('input', () => setFilterResonancePct(Number(filterResonanceEl.value)));
    filterModAmountEl.addEventListener('input', () => setFilterModAmountPct(Number(filterModAmountEl.value)));
    fundDownEl.addEventListener('click', () => nudgeBaseHz(0.5));
    fundUpEl.addEventListener('click', () => nudgeBaseHz(2));

    syncCombineButtons();
    syncWaveformButtons();
    syncPhaseLockButtons();
    syncClampButtons();
    syncFilterTypeButtons();
    syncFilterDbButtons();
    applyGraphSelection('classical', true);
    updateFundamentalDisplay();
    updateDelayDisplay();
    updateReverbDisplay();
    updateFilterDisplay();
    updateStatus();
    ensureAudio();
    updateInfo();
    requestDraw();
  </script>
</body>
</html>
