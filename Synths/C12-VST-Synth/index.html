
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>seeker.synth</title>
  <link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml" />
  <link rel="alternate icon" href="favicon.png" sizes="32x32" type="image/png" />
  <link rel="shortcut icon" href="favicon.png" type="image/png" />
  <style>
    @font-face {
      font-family: "PTMonoUI";
      src: local("PT Mono"), local("PTMono-Regular"), local("PT Mono Regular");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "PTMonoUI";
      src: local("PT Mono Bold"), local("PTMono-Bold"), local("PT Mono");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #17171a;
      --panel: #000000;
      --ink: #f0f0f0;
      --muted: #717179;
      --border: #505057;
      --top-gap: 0.7rem;
      --bottom-gap: 1rem;
      --viewport-gap: calc(var(--top-gap) + var(--bottom-gap));
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      color: var(--ink);
      font-family: "PTMonoUI", "PT Mono", monospace;
      overflow: hidden;
    }
    .page {
      height: 100vh;
      width: min(1680px, 100%);
      margin: 0 auto;
      padding: var(--top-gap) 1rem var(--bottom-gap);
      display: grid;
      grid-template-columns: minmax(260px, 292px) minmax(0, 1fr) minmax(260px, 292px);
      grid-template-areas: "left viz right";
      gap: 1.1rem;
      align-items: start;
      overflow: hidden;
    }
    .panel {
      background: var(--panel);
      border: none;
      border-radius: 28px;
      padding: 1rem;
      align-self: start;
      position: relative;
      box-shadow: 0 24px 44px rgba(0, 0, 0, 0.34);
    }
    .panel h2 {
      margin: 0 0 0.55rem;
      font-size: 1.14rem;
      letter-spacing: 0.01em;
      font-weight: 700;
    }
    .panel-left {
      grid-area: left;
      padding: 0.8rem;
      max-height: calc(100vh - var(--viewport-gap));
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .viz { grid-area: viz; }
    .panel-right {
      grid-area: right;
      padding: 0.8rem;
      max-height: calc(100vh - var(--viewport-gap));
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .panel h1 { margin: 0 0 0.55rem; font-size: 1.26rem; }
    .panel h1,
    .panel h2 {
      font-family: "PTMonoUI", "PT Mono", monospace;
      font-weight: 700;
      color: #ffffff;
    }
    .panel h1::before,
    .panel h2::before {
      content: ". ";
      color: #ffffff;
    }
    .panel p { margin: 0 0 0.9rem; color: var(--muted); font-size: 0.95rem; }
    .status {
      margin-bottom: 0.95rem;
      font-size: 0.88rem;
      color: var(--muted);
      text-transform: lowercase;
    }
    .status-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    .legend {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.42rem;
      margin-bottom: 0;
    }
    .legend-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.22rem;
      width: 100%;
      border: 1px solid var(--border);
      background: #000;
      color: #f3f3f3;
      border-radius: 10px;
      padding: 0.2rem 0.3rem;
      text-align: center;
      font-size: 0.72rem;
      line-height: 1.15;
      cursor: pointer;
      font-family: inherit;
      font-weight: 400;
      text-transform: lowercase;
      transition: background 100ms ease, border-color 100ms ease, color 100ms ease, opacity 100ms ease;
    }
    .legend-btn span:last-child {
      white-space: nowrap;
      font-size: 0.68rem;
      line-height: 1.05;
      letter-spacing: 0.01em;
    }
    .legend-btn:hover { border-color: #888891; }
    .legend-btn:not(.off) {
      border-color: #dcdcdc;
      background: #f1f1f1;
      color: #000;
    }
    .legend-btn.off {
      opacity: 1;
      color: var(--muted);
      border-color: #3b3b42;
      background: #000;
    }
    .swatch {
      width: 0.46rem;
      height: 0.46rem;
      border-radius: 999px;
      flex: 0 0 auto;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .clamp-wrap {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.6rem;
      background: #000;
    }
    .clamp-wrap + .clamp-wrap {
      margin-top: 0.9rem;
    }
    .fund-wrap {
      margin-top: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.6rem;
      background: #000;
    }
    .delay-wrap {
      margin-top: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.6rem;
      background: #000;
    }
    .slider-block + .slider-block {
      margin-top: 0.7rem;
    }
    .slider-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.32rem;
      font-size: 0.8rem;
      color: #f0f0f0;
      text-transform: lowercase;
    }
    .slider-value {
      color: #f5f5f5;
      font-variant-numeric: tabular-nums;
      text-transform: lowercase;
    }
    .slider {
      width: 100%;
      margin: 0;
      accent-color: #ffffff;
      cursor: pointer;
    }
    .fund-row {
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      gap: 0.42rem;
      align-items: center;
    }
    .fund-btn {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 0.38rem 0.45rem;
      font-size: 0.83rem;
      text-align: center;
      background: #000;
      color: #f0f0f0;
      cursor: pointer;
      user-select: none;
      text-transform: lowercase;
    }
    .fund-btn:hover { border-color: #888891; }
    .fund-value {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.38rem 0.45rem;
      text-align: center;
      background: #000;
      color: #f8f8f8;
      font-size: 0.84rem;
      font-variant-numeric: tabular-nums;
      text-transform: lowercase;
    }
    .info {
      margin-top: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.7rem;
      background: #000;
      font-size: 0.84rem;
      line-height: 1.45;
      color: #dcdcdc;
      min-height: 6.1rem;
      text-transform: lowercase;
    }
    .info-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.45rem;
      color: #ffffff;
    }
    .info-row + .info-row { margin-top: 0.28rem; }
    .info-row strong {
      color: #ffffff;
      font-weight: 600;
    }
    .clamp-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.42rem;
    }
    .clamp-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.42rem;
    }
    .clamp-btn {
      appearance: none;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 0.24rem 0.4rem;
      font-size: 0.82rem;
      font: inherit;
      line-height: 1.15;
      text-align: center;
      background: #000;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      text-transform: lowercase;
      transition: background 100ms ease, border-color 100ms ease, color 100ms ease;
    }
    .clamp-btn.active {
      border-color: #dcdcdc;
      background: #f1f1f1;
      color: #000;
      box-shadow: none;
    }
    #octaveClampWrap .clamp-buttons {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    #octaveClampWrap .clamp-btn {
      padding: 0.16rem 0.24rem;
      font-size: 0.72rem;
    }
    .panel-right .status {
      margin-bottom: 0.9rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #2b2b31;
    }
    .panel-left h1 {
      margin-bottom: 0.45rem;
      font-size: 1.08rem;
    }
    .panel-left .clamp-wrap {
      padding: 0.45rem 0.5rem;
    }
    .panel-left .clamp-wrap + .clamp-wrap {
      margin-top: 0.55rem;
    }
    .panel-left .fund-wrap {
      margin-top: 0.55rem;
      padding: 0.45rem 0.5rem;
    }
    .panel-left .clamp-title {
      margin-bottom: 0.35rem;
      font-size: 0.8rem;
    }
    .panel-left .clamp-buttons {
      gap: 0.34rem;
    }
    .panel-left .clamp-btn {
      padding: 0.2rem 0.28rem;
      font-size: 0.76rem;
    }
    .panel-left .info {
      margin-top: 0.55rem;
      padding: 0.55rem 0.6rem;
      min-height: 5.7rem;
      font-size: 0.8rem;
      line-height: 1.38;
    }
    .panel-left .fund-row {
      gap: 0.34rem;
    }
    .panel-left .fund-btn,
    .panel-left .fund-value {
      padding: 0.3rem 0.38rem;
      font-size: 0.78rem;
    }
    .panel-left .info-title {
      margin-bottom: 0.32rem;
      font-size: 0.78rem;
    }
    .panel-left .info-row + .info-row {
      margin-top: 0.22rem;
    }
    .panel-right h2 {
      margin-bottom: 0.45rem;
      font-size: 0.96rem;
    }
    .panel-right .clamp-wrap,
    .panel-right .delay-wrap,
    .panel-right .fund-wrap {
      padding: 0.45rem 0.5rem;
    }
    .panel-right .clamp-wrap + .clamp-wrap,
    .panel-right .delay-wrap,
    .panel-right .fund-wrap {
      margin-top: 0.55rem;
    }
    .panel-right .clamp-title {
      margin-bottom: 0.35rem;
      font-size: 0.8rem;
    }
    .panel-right .control-subtitle {
      margin: 0.36rem 0 0.24rem;
      font-size: 0.7rem;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .panel-right .control-subtitle:first-of-type {
      margin-top: 0;
    }
    .panel-right .slider-block + .slider-block {
      margin-top: 0.45rem;
    }
    .panel-right .effects-group + .effects-group {
      margin-top: 0.5rem;
      padding-top: 0.48rem;
      border-top: 1px solid #26262c;
    }
    .panel-right .slider-label {
      margin-bottom: 0.22rem;
      font-size: 0.76rem;
    }
    .panel-right .clamp-buttons {
      gap: 0.34rem;
    }
    .panel-right .waveform-buttons {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .panel-right .clamp-btn {
      padding: 0.2rem 0.28rem;
      font-size: 0.76rem;
    }
    .panel-right .fund-row {
      gap: 0.34rem;
    }
    .panel-right .fund-btn,
    .panel-right .fund-value {
      padding: 0.3rem 0.38rem;
      font-size: 0.78rem;
    }
    .viz {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      align-self: start;
    }
    .canvas-wrap {
      position: relative;
      width: min(100%, 950px, calc(100vh - var(--viewport-gap)));
      max-width: 100%;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 28px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.42);
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #graphImage, #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #graphImage { pointer-events: none; }
    #overlay {
      cursor: crosshair;
      touch-action: none;
    }
    @media (max-aspect-ratio: 5/4), (max-width: 960px) {
      html, body {
        height: auto;
        overflow: auto;
      }
      .page {
        height: auto;
        width: min(1120px, 100%);
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "viz"
          "left"
          "right";
        overflow: visible;
        gap: 0.9rem;
      }
      .panel-left,
      .panel-right {
        max-height: none;
        overflow: visible;
      }
      .viz {
        position: static;
        top: auto;
        max-height: none;
      }
      .canvas-wrap {
        width: min(100%, 920px);
      }
    }
    @media (max-width: 720px) {
      html, body {
        height: auto;
        overflow: auto;
      }
      .page {
        width: 100%;
        grid-template-columns: 1fr;
        grid-template-areas:
          "viz"
          "left"
          "right";
        padding: 0.55rem;
        gap: 0.75rem;
      }
      .panel { position: static; }
      .panel-left {
        max-height: none;
        overflow: visible;
      }
      .panel-right {
        max-height: none;
        overflow: visible;
      }
      .viz {
        position: static;
        top: auto;
        max-height: none;
      }
      .canvas-wrap {
        width: 100%;
        border-radius: 22px;
      }
      .panel-left .legend {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      #octaveClampWrap .clamp-buttons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .panel-right .waveform-buttons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .fund-row {
        grid-template-columns: 56px 1fr 56px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel panel-left">
      <h1>scale settings</h1>
      <div class="clamp-wrap">
        <div class="clamp-title">Number Types</div>
        <div id="legend" class="legend"></div>
      </div>
      <div class="clamp-wrap">
        <div class="clamp-title">Cross-Connections</div>
        <div id="crossConnectionsControls" class="clamp-buttons">
          <button type="button" class="clamp-btn" data-combine="enable">Enable</button>
          <button type="button" class="clamp-btn" data-combine="disable">Disable</button>
        </div>
      </div>
      <div class="clamp-wrap">
        <div class="clamp-title">Graph Type</div>
        <div id="graphTypeControls" class="clamp-buttons">
          <button type="button" class="clamp-btn" data-graph-mode="nested">Maximized</button>
          <button type="button" class="clamp-btn" data-graph-mode="classical">Circumscribed</button>
        </div>
      </div>
      <div id="octaveClampWrap" class="clamp-wrap">
        <div class="clamp-title">Octave Clamp</div>
        <div class="clamp-buttons">
          <button type="button" class="clamp-btn" data-clamp="1">1</button>
          <button type="button" class="clamp-btn active" data-clamp="2">2</button>
          <button type="button" class="clamp-btn" data-clamp="3">3</button>
          <button type="button" class="clamp-btn" data-clamp="4">4</button>
          <button type="button" class="clamp-btn" data-clamp="5">5</button>
          <button type="button" class="clamp-btn" data-clamp="6">6</button>
          <button type="button" class="clamp-btn" data-clamp="7">7</button>
          <button type="button" class="clamp-btn" data-clamp="8">8</button>
          <button type="button" class="clamp-btn" data-clamp="none">none</button>
        </div>
      </div>
      <div class="fund-wrap">
        <div class="clamp-title">Fundamental</div>
        <div class="fund-row">
          <button id="fundDown" type="button" class="fund-btn">/2</button>
          <div id="fundValue" class="fund-value">192 hz</div>
          <button id="fundUp" type="button" class="fund-btn">x2</button>
        </div>
      </div>
      <div id="playInfo" class="info"></div>
    </section>
    <section class="panel panel-right">
      <h2>synth settings</h2>
      <div id="statusText" class="status status-hidden" role="status" aria-live="polite">Audio: starting...</div>
      <div class="clamp-wrap">
        <div class="control-subtitle">Waveform</div>
        <div id="waveformControls" class="clamp-buttons waveform-buttons">
          <button type="button" class="clamp-btn" data-waveform="sine">Sine</button>
          <button type="button" class="clamp-btn" data-waveform="triangle">Triangle</button>
          <button type="button" class="clamp-btn active" data-waveform="saw">Saw</button>
          <button type="button" class="clamp-btn" data-waveform="square">Square</button>
          <button type="button" class="clamp-btn" data-waveform="random">Random</button>
        </div>
        <div class="control-subtitle">Sync</div>
        <div id="phaseLockControls" class="clamp-buttons">
          <button type="button" class="clamp-btn" data-phase-lock="fundamental">Fundamental</button>
          <button type="button" class="clamp-btn" data-phase-lock="cluster-high">Cluster High</button>
          <button type="button" class="clamp-btn" data-phase-lock="cluster-low">Cluster Low</button>
          <button type="button" class="clamp-btn active" data-phase-lock="none">None</button>
        </div>
      </div>
      <div class="delay-wrap">
        <div class="effects-group">
          <div class="control-subtitle">Filter</div>
          <div class="slider-block">
            <div class="slider-label">
              <span>Type</span>
            </div>
            <div id="filterTypeControls" class="clamp-buttons">
              <button type="button" class="clamp-btn active" data-filter-type="lowpass">Lowpass</button>
              <button type="button" class="clamp-btn" data-filter-type="highpass">Highpass</button>
              <button type="button" class="clamp-btn" data-filter-type="bandpass">Bandpass</button>
              <button type="button" class="clamp-btn" data-filter-type="notch">Notch</button>
            </div>
          </div>
          <div class="slider-block">
            <div class="slider-label">
              <span>Slope</span>
            </div>
            <div id="filterDbControls" class="clamp-buttons">
              <button type="button" class="clamp-btn active" data-filter-db="12">12 dB</button>
              <button type="button" class="clamp-btn" data-filter-db="24">24 dB</button>
            </div>
          </div>
          <div class="slider-block">
            <label class="slider-label" for="filterFreq">
              <span>Frequency</span>
              <span id="filterFreqValue" class="slider-value">300 Hz</span>
            </label>
            <input id="filterFreq" class="slider" type="range" min="0" max="1000" step="1" value="353" />
          </div>
          <div class="slider-block">
            <label class="slider-label" for="filterResonance">
              <span>Resonance</span>
              <span id="filterResonanceValue" class="slider-value">1.8 Q</span>
            </label>
            <input id="filterResonance" class="slider" type="range" min="0" max="100" step="1" value="8" />
          </div>
          <div class="slider-block">
            <label class="slider-label" for="filterModAmount">
              <span>Mod Amount</span>
              <span id="filterModAmountValue" class="slider-value">0%</span>
            </label>
            <input id="filterModAmount" class="slider" type="range" min="0" max="100" step="1" value="0" />
          </div>
        </div>
        <div class="effects-group">
          <div class="control-subtitle">Delay</div>
          <div class="slider-block">
            <label class="slider-label" for="delayWet">
              <span>Dry/Wet</span>
              <span id="delayWetValue" class="slider-value">58%</span>
            </label>
            <input id="delayWet" class="slider" type="range" min="0" max="100" step="1" value="58" />
          </div>
          <div class="slider-block">
            <label class="slider-label" for="delayFeedback">
              <span>Feedback</span>
              <span id="delayFeedbackValue" class="slider-value">69%</span>
            </label>
            <input id="delayFeedback" class="slider" type="range" min="0" max="90" step="1" value="69" />
          </div>
        </div>
        <div class="effects-group">
          <div class="control-subtitle">Reverb</div>
          <div class="slider-block">
            <label class="slider-label" for="reverbWet">
              <span>Dry/Wet</span>
              <span id="reverbWetValue" class="slider-value">30%</span>
            </label>
            <input id="reverbWet" class="slider" type="range" min="0" max="100" step="1" value="30" />
          </div>
        </div>
      </div>
    </section>

      return JSON.parse(JSON.stringify(catList));
    }

    function regularPolygonVertices(cx, cy, circumradius, sides, rotation) {
      const step = (Math.PI * 2) / sides;
      const out = [];
      for (let i = 0; i < sides; i += 1) {
        const angle = rotation + i * step;
        out.push({
          x: cx + circumradius * Math.cos(angle),
          y: cy + circumradius * Math.sin(angle),
        });
      }
      return out;
    }

    function polygonSegmentsFromVertices(vertices) {
      const segments = [];
      for (let i = 0; i < vertices.length; i += 1) {
        const a = vertices[i];
        const b = vertices[(i + 1) % vertices.length];
        segments.push({
          x1: a.x,
          y1: a.y,
          x2: b.x,
          y2: b.y,
        });
      }
      return segments;
    }

    function maximalOuterPolygon(innerSides, innerCircumradius, innerRotation, outerSides) {
      const lcmSides = lcm(innerSides, outerSides);
      const minVertexNormalAngle = Math.PI / lcmSides;
      const outerApothem = innerCircumradius * Math.cos(minVertexNormalAngle);
      const outerCircumradius = outerApothem / Math.cos(Math.PI / outerSides);
      const outerNormalAngle = innerRotation - minVertexNormalAngle;
      const outerRotation = outerNormalAngle - (Math.PI / outerSides);
      return { circumradius: outerCircumradius, rotation: outerRotation };
    }

    function gcd(a, b) {
      let x = Math.abs(a);
      let y = Math.abs(b);
      while (y !== 0) {
        const t = x % y;
        x = y;
        y = t;
      }
      return x || 1;
    }

    function lcm(a, b) {
      return Math.abs(a * b) / gcd(a, b);
    }

    function maxNumberInCategories(catList) {
      let max = 0;
      for (const cat of catList) {
        for (const node of cat.nodes) {
          if (node.n > max) max = node.n;
        }
      }
      return max;
    }

    function roundCoord(value) {
      return Math.round(value * 10000) / 10000;
    }

    function graphConfig(mode) {
      const base = GRAPH_DATA[mode];
      if (!base) return null;
      return {
        width: base.width,
        height: base.height,
        baseHz: base.baseHz,
        center: { x: base.center.x, y: base.center.y },
        maxNumber: maxNumberInCategories(base.categories),
        baseRadius: mode === 'nested' ? 56 : 54,
        rotationOffset: mode === 'nested' ? -(Math.PI * 2) / 3 : 0,
      };
    }

    function fixedIndexingForMode(mode = graphMode) {
      return mode === 'nested' ? 'local' : 'global';
    }

    function isPrime(n) {
      if (n < 2) return false;
      if (n === 2) return true;
      if (n % 2 === 0) return false;
      for (let d = 3; d * d <= n; d += 2) {
        if (n % d === 0) return false;
      }
      return true;
    }

    function isPrimePower(n) {
      if (n < 4) return false;
      let remaining = n;
      let distinct = 0;
      let exponent = 0;
      for (let d = 2; d * d <= remaining; d += d === 2 ? 1 : 2) {
        if (remaining % d !== 0) continue;
        distinct += 1;
        while (remaining % d === 0) {
          remaining /= d;
          exponent += 1;
        }
        if (distinct > 1) return false;
      }
      if (remaining > 1) {
        distinct += 1;
        exponent += 1;
      }
      return distinct === 1 && exponent >= 2;
    }

    function isSmoothNumber(n, maxPrime) {
      let remaining = n;
      const allowed = [2, 3, 5, 7].filter((prime) => prime <= maxPrime);
      for (const prime of allowed) {
        while (remaining % prime === 0) {
          remaining /= prime;
        }
      }
      return remaining === 1;
    }

    function isPowerOfThree(n) {
      if (n < 1) return false;
      let remaining = n;
      while (remaining % 3 === 0) {
        remaining /= 3;
      }
      return remaining === 1;
    }

    function highlyCompositeSet(limit) {
      const divisorCounts = new Array(limit + 1).fill(0);
      for (let d = 1; d <= limit; d += 1) {
        for (let n = d; n <= limit; n += d) {
          divisorCounts[n] += 1;
        }
      }
      const out = new Set();
      let best = 0;
      for (let n = 1; n <= limit; n += 1) {
        if (divisorCounts[n] > best) {
          best = divisorCounts[n];
          out.add(n);
        }
      }
      return out;
    }

    function buildCategoryNumberSets(limit) {
      const highlyComposite = highlyCompositeSet(limit);
      const sets = {
        primes: [],
        primePowers: [],
        highlyComposite: [],
        threeSmooth: [],
        powersOfThree: [],
      };
      for (let n = 1; n <= limit; n += 1) {
        if (isPrime(n)) {
          sets.primes.push(n);
        } else if (isPrimePower(n)) {
          sets.primePowers.push(n);
        }
        if (highlyComposite.has(n)) {
          sets.highlyComposite.push(n);
        }
        if (isSmoothNumber(n, 3)) {
          sets.threeSmooth.push(n);
        }
        if (isPowerOfThree(n)) {
          sets.powersOfThree.push(n);
        }
      }
      return sets;
    }

    function buildPolygonSequenceFor(mode, limit) {
      const config = graphConfig(mode);
      if (!config || limit < 1) return [];

      const baseRotation = -Math.PI / 2;
      const polygons = [];
      let cursor = 1;

      if (mode === 'classical') {
        let circleRadius = config.baseRadius;
        for (let sides = 3; cursor <= limit; sides += 1) {
          const circumradius = circleRadius / Math.cos(Math.PI / sides);
          const rotation = baseRotation + config.rotationOffset;
          polygons.push({
            sides,
            circumradius,
            rotation,
            vertices: regularPolygonVertices(
              config.center.x,
              config.center.y,
              circumradius,
              sides,
              rotation,
            ),
          });
          cursor += sides;
          circleRadius = circumradius;
        }
        return polygons;
      }

      let sides = 3;
      let circumradius = config.baseRadius / Math.cos(Math.PI / sides);
      let rotation = baseRotation + config.rotationOffset;
      while (cursor <= limit) {
        polygons.push({
          sides,
          circumradius,
          rotation,
          vertices: regularPolygonVertices(
            config.center.x,
            config.center.y,
            circumradius,
            sides,
            rotation,
          ),
        });
        cursor += sides;
        sides += 1;
        const next = maximalOuterPolygon(sides - 1, circumradius, rotation, sides);
        circumradius = next.circumradius;
        rotation = next.rotation;
      }

      return polygons;
    }

    function topVertexIndex(vertices) {
      let best = 0;
      for (let i = 1; i < vertices.length; i += 1) {
        const candidate = vertices[i];
        const current = vertices[best];
        if (
          candidate.y < current.y - 1e-7 ||
          (Math.abs(candidate.y - current.y) <= 1e-7 && candidate.x < current.x)
        ) {
          best = i;
        }
      }
      return best;
    }

    function leftVertexIndex(vertices) {
      let best = 0;
      for (let i = 1; i < vertices.length; i += 1) {
        const candidate = vertices[i];
        const current = vertices[best];
        if (
          candidate.x < current.x - 1e-7 ||
          (Math.abs(candidate.x - current.x) <= 1e-7 && candidate.y < current.y)
        ) {
          best = i;
        }
      }
      return best;
    }

    function clockwiseAngularDelta(fromAngle, toAngle) {
      const tau = Math.PI * 2;
      let delta = (toAngle - fromAngle) % tau;
      if (delta < 0) delta += tau;
      if (delta >= tau - 1e-7) return 0;
      return delta;
    }

    function nextClockwiseVertexIndex(vertices, point, origin) {
      const fromAngle = Math.atan2(point.y - origin.y, point.x - origin.x);
      let best = 0;
      let bestDelta = Infinity;
      let bestDist2 = Infinity;
      for (let i = 0; i < vertices.length; i += 1) {
        const candidate = vertices[i];
        const toAngle = Math.atan2(candidate.y - origin.y, candidate.x - origin.x);
        const delta = clockwiseAngularDelta(fromAngle, toAngle);
        const dx = candidate.x - point.x;
        const dy = candidate.y - point.y;
        const d2 = dx * dx + dy * dy;
        if (
          delta < bestDelta - 1e-7 ||
          (Math.abs(delta - bestDelta) <= 1e-7 && d2 < bestDist2)
        ) {
          bestDelta = delta;
          bestDist2 = d2;
          best = i;
        }
      }
      return best;
    }

    function buildIndexedPositions(mode, scheme, limit) {
      const config = graphConfig(mode);
      if (!config) return new Map();
      const polygons = buildPolygonSequenceFor(mode, limit);
      const positions = new Map();
      let nextNumber = 1;
      let previousVertex = null;

      for (const polygon of polygons) {
        let startIndex = 0;
        if (scheme === 'local') {
          startIndex = previousVertex
            ? nextClockwiseVertexIndex(polygon.vertices, previousVertex, config.center)
            : leftVertexIndex(polygon.vertices);
        } else {
          startIndex = topVertexIndex(polygon.vertices);
        }

        for (let step = 0; step < polygon.sides && nextNumber <= limit; step += 1) {
          const vertex = polygon.vertices[(startIndex + step) % polygon.sides];
          positions.set(nextNumber, {
            x: roundCoord(vertex.x),
            y: roundCoord(vertex.y),
          });
          previousVertex = vertex;
          nextNumber += 1;
        }

        if (nextNumber > limit) break;
      }

      return positions;
    }

    function buildNearestNeighborGraph(nodes) {
      const edgeMap = new Map();
      const nodeIndexByNumber = new Map();

      for (let i = 0; i < nodes.length; i += 1) {
        nodeIndexByNumber.set(nodes[i].n, i);
      }

      for (let i = 0; i < nodes.length; i += 1) {
        const a = nodes[i];
        let bestIndex = -1;
        let bestDist2 = Infinity;
        for (let j = 0; j < nodes.length; j += 1) {
          if (i === j) continue;
          const b = nodes[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestDist2) {
            bestDist2 = d2;
            bestIndex = j;
          }
        }
        if (bestIndex < 0) continue;
        const b = nodes[bestIndex];
        const key = a.n < b.n ? `${a.n}:${b.n}` : `${b.n}:${a.n}`;
        if (!edgeMap.has(key)) {
          edgeMap.set(key, {
            a: Math.min(a.n, b.n),
            b: Math.max(a.n, b.n),
            x1: a.x,
            y1: a.y,
            x2: b.x,
            y2: b.y,
          });
        }
      }

      const edges = Array.from(edgeMap.values());
      const adjacency = new Map();
      for (let i = 0; i < nodes.length; i += 1) {
        adjacency.set(i, []);
      }

      for (let ei = 0; ei < edges.length; ei += 1) {
        const edge = edges[ei];
        const nodeA = nodeIndexByNumber.get(edge.a);
        const nodeB = nodeIndexByNumber.get(edge.b);
        adjacency.get(nodeA).push({ ni: nodeB, ei });
        adjacency.get(nodeB).push({ ni: nodeA, ei });
      }

      const components = [];
      const visited = new Set();
      for (let start = 0; start < nodes.length; start += 1) {
        if (visited.has(start)) continue;
        const queue = [start];
        let queueIndex = 0;
        visited.add(start);
        const nodeIndices = [];
        const edgeIndices = new Set();

        while (queueIndex < queue.length) {
          const ni = queue[queueIndex];
          queueIndex += 1;
          nodeIndices.push(ni);
          for (const next of adjacency.get(ni)) {
            edgeIndices.add(next.ei);
            if (!visited.has(next.ni)) {
              visited.add(next.ni);
              queue.push(next.ni);
            }
          }
        }

        const numbers = nodeIndices.map((ni) => nodes[ni].n).sort((a, b) => a - b);
        const id = components.length;
        const componentEdgeIndices = Array.from(edgeIndices).sort((a, b) => a - b);
        for (const ei of componentEdgeIndices) {
          edges[ei].component = id;
        }
        components.push({
          id,
          numbers,
          edgeIndices: componentEdgeIndices,
          nodeIndices: nodeIndices.slice(),
        });
      }

      return { nodes, edges, components };
    }

    function buildGeneratedGraphData(mode, scheme) {
      const config = graphConfig(mode);
      if (!config) return null;

      const positions = buildIndexedPositions(mode, scheme, config.maxNumber);
      const numberSets = buildCategoryNumberSets(config.maxNumber);
      const categoryMeta = [
        { name: 'primes', label: 'Primes' },
        { name: 'primePowers', label: 'P-Powers' },
        { name: 'highlyComposite', label: 'H-Comp' },
        { name: 'threeSmooth', label: '3-Smooth' },
        { name: 'powersOfThree', label: '3^n' },
      ];

      const categoriesOut = categoryMeta.map((meta) => {
        const nodes = numberSets[meta.name]
          .filter((n) => positions.has(n))
          .map((n) => {
            const point = positions.get(n);
            return { n, x: point.x, y: point.y };
          });
        const graph = buildNearestNeighborGraph(nodes);
        return {
          name: meta.name,
          label: meta.label,
          color: CATEGORY_COLORS[meta.name] || '#ffffff',
          nodes: graph.nodes,
          edges: graph.edges,
          components: graph.components,
        };
      });

      return {
        width: config.width,
        height: config.height,
        baseHz: config.baseHz,
        center: config.center,
        categories: categoriesOut,
      };
    }

    function getGraphData(mode, scheme = fixedIndexingForMode(mode)) {
      const key = `${mode}:${scheme}`;
      if (!generatedGraphDataCache.has(key)) {
        generatedGraphDataCache.set(key, buildGeneratedGraphData(mode, scheme));
      }
      return generatedGraphDataCache.get(key);
    }

    function buildGraphPolygons(mode, maxNumber) {
      const baseRotation = -Math.PI / 2;
      const configs = {
        classical: { baseRadius: 54, rotationOffset: 0 },
        nested: { baseRadius: 56, rotationOffset: -(Math.PI * 2) / 3 },
      };
      const config = configs[mode];
      if (!config || maxNumber < 1) return [];

      const polygons = [];
      let cursor = 1;

      if (mode === 'classical') {
        let circleRadius = config.baseRadius;
        for (let sides = 3; cursor <= maxNumber; sides += 1) {
          const circumradius = circleRadius / Math.cos(Math.PI / sides);
          const vertices = regularPolygonVertices(
            center.x,
            center.y,
            circumradius,
            sides,
            baseRotation + config.rotationOffset,
          );
          polygons.push({
            sides,
            start: cursor,
            end: cursor + sides - 1,
            segments: polygonSegmentsFromVertices(vertices),
          });
          cursor += sides;
          circleRadius = circumradius;
        }
        return polygons;
      }

      if (mode === 'nested') {
        let sides = 3;
        let circumradius = config.baseRadius / Math.cos(Math.PI / sides);
        let rotation = baseRotation + config.rotationOffset;
        while (cursor <= maxNumber) {
          const vertices = regularPolygonVertices(
            center.x,
            center.y,
            circumradius,
            sides,
            rotation,
          );
          polygons.push({
            sides,
            start: cursor,
            end: cursor + sides - 1,
            segments: polygonSegmentsFromVertices(vertices),
          });
          cursor += sides;
          sides += 1;
          const next = maximalOuterPolygon(sides - 1, circumradius, rotation, sides);
          circumradius = next.circumradius;
          rotation = next.rotation;
        }
      }

      return polygons;
    }

    function rebuildActiveGraph() {
      allEdges = [];
      for (let ci = 0; ci < categories.length; ci += 1) {
        const cat = categories[ci];
        for (let ei = 0; ei < cat.edges.length; ei += 1) {
          const e = cat.edges[ei];
          allEdges.push({ ci, ei, x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2 });
        }
      }

      const aggregateNodes = new Map();
      for (let ci = 0; ci < categories.length; ci += 1) {
        const cat = categories[ci];
        for (const node of cat.nodes) {
          let entry = aggregateNodes.get(node.n);
          if (!entry) {
            entry = { n: node.n, x: node.x, y: node.y, memberships: [] };
            aggregateNodes.set(node.n, entry);
          }
          entry.memberships.push(ci);
        }
      }
      allNodes = Array.from(aggregateNodes.values());
      maxNodeDist = Math.max(
        1,
        ...allNodes.map((n) => Math.hypot(n.x - center.x, n.y - center.y)),
      );
      graphPolygons = buildGraphPolygons(graphMode, maxNumberInCategories(categories));
    }

    function syncGraphModeButtons() {
      for (const btn of graphModeBtns) {
        setPressedState(btn, btn.dataset.graphMode === graphMode);
      }
    }

    function applyGraphSelection(nextMode = graphMode, force = false) {
      if (!force && nextMode === graphMode) return;
      const graph = getGraphData(nextMode);
      const imageSrc = GRAPH_IMAGES[nextMode];
      if (!graph || !imageSrc) return;

      const priorEnabled = new Map(categories.map((cat) => [cat.name, cat.enabled]));
      graphMode = nextMode;
      sourceWidth = graph.width;
      sourceHeight = graph.height;
      center = graph.center;
      categories = cloneCategories(graph.categories);
      for (const cat of categories) {
        if (CATEGORY_COLORS[cat.name]) {
          cat.color = CATEGORY_COLORS[cat.name];
        }
        cat.rgb = hexToRgb(cat.color);
        cat.enabled = priorEnabled.has(cat.name)
          ? priorEnabled.get(cat.name)
          : (cat.name === 'highlyComposite' || cat.name === 'threeSmooth');
      }

      graphImageEl.src = imageSrc;
      canvas.width = sourceWidth;
      canvas.height = sourceHeight;
      rebuildActiveGraph();
      invalidateCombinedGraph();
      syncGraphModeButtons();
      createLegend();
      clearHover();
      updateStatus();
      updateInfo();
      requestDraw();
    }

    function applyGraphMode(nextMode, force = false) {
      applyGraphSelection(nextMode, force);
    }

    function hexToRgb(hex) {
      let s = (hex || '').trim();
      if (!s.startsWith('#')) s = `#${s}`;
      if (s.length === 4) s = `#${s[1]}${s[1]}${s[2]}${s[2]}${s[3]}${s[3]}`;
      const n = Number.parseInt(s.slice(1), 16);
      return [
        (n >> 16) & 255,
        (n >> 8) & 255,
        n & 255,
      ];
    }

    function rgbToCss(rgb, alpha = 1) {
      const r = Math.max(0, Math.min(255, Math.round(rgb[0])));
      const g = Math.max(0, Math.min(255, Math.round(rgb[1])));
      const b = Math.max(0, Math.min(255, Math.round(rgb[2])));
      if (alpha >= 0.999) return `rgb(${r}, ${g}, ${b})`;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function mixColors(colors) {
      if (!colors.length) return [255, 255, 255];
      let r = 0;
      let g = 0;
      let b = 0;
      for (const c of colors) {
        r += c[0];
        g += c[1];
        b += c[2];
      }
      return [r / colors.length, g / colors.length, b / colors.length];
    }

    function lighten(rgb, amount) {
      return [
        rgb[0] + (255 - rgb[0]) * amount,
        rgb[1] + (255 - rgb[1]) * amount,
        rgb[2] + (255 - rgb[2]) * amount,
      ];
    }

    function centerDist(x, y) {
      return Math.hypot(x - center.x, y - center.y);
    }

    function nodeRadiusFor(x, y) {
      const t = 1 - Math.min(1, centerDist(x, y) / maxNodeDist);
      return 4.2 + 6.8 * Math.pow(t, 0.82);
    }

    function edgeWidthFor(edge) {
      const mx = (edge.x1 + edge.x2) * 0.5;
      const my = (edge.y1 + edge.y2) * 0.5;
      const t = 1 - Math.min(1, centerDist(mx, my) / maxNodeDist);
      return 2.8 + 4.8 * Math.pow(t, 0.9);
    }

    function formatHz(freq) {
      return `${freq.toFixed(2).replace(/\.0+$|0+$/g, '').replace(/\.$/, '')} Hz`;
    }

    function audioReadyText() {
      return synth.audioContext && synth.audioContext.state === 'running'
        ? 'ready'
        : 'click page once if silent';
    }

    function updateFundamentalDisplay() {
      fundValueEl.textContent = formatHz(baseHz);
    }

    function delayWetRatio() {
      return Math.max(0, Math.min(1, delayWetPct / 100));
    }

    function delayFeedbackRatio() {
      return Math.max(0, Math.min(0.9, delayFeedbackPct / 100));
    }

    function reverbWetRatio() {
      return Math.max(0, Math.min(1, reverbWetPct / 100));
    }

    function updateDelayDisplay() {
      delayWetEl.value = String(delayWetPct);
      delayFeedbackEl.value = String(delayFeedbackPct);
      delayWetValueEl.textContent = `${Math.round(delayWetPct)}%`;
      delayFeedbackValueEl.textContent = `${Math.round(delayFeedbackPct)}%`;
    }

    function updateReverbDisplay() {
      reverbWetEl.value = String(reverbWetPct);
      reverbWetValueEl.textContent = `${Math.round(reverbWetPct)}%`;
    }

    function logCurveValue(norm, min, max) {
      const clamped = Math.max(0, Math.min(1, norm));
      return min * Math.pow(max / min, clamped);
    }

    function inverseLogCurve(value, min, max) {
      const clamped = Math.max(min, Math.min(max, value));
      return Math.log(clamped / min) / Math.log(max / min);
    }

    function currentFilterFrequency() {
      return logCurveValue(filterFreqPos / 1000, FILTER_FREQ_MIN, FILTER_FREQ_MAX);
    }

    function currentFilterResonance() {
      return FILTER_Q_MIN + ((FILTER_Q_MAX - FILTER_Q_MIN) * (filterResonancePct / 100));
    }

    function currentFilterModSweep(baseFreq) {
      const floor = Math.max(FILTER_FREQ_MIN, Math.min(FILTER_FREQ_MAX, baseFreq));
      const amount = Math.max(0, Math.min(1, filterModAmountPct / 100));
      const ceiling = floor * Math.pow(FILTER_FREQ_MAX / floor, amount);
      const depthHz = Math.max(0, (ceiling - floor) * 0.5);
      return {
        floor,
        centerHz: floor + depthHz,
        depthHz,
      };
    }

    function formatPercent(value) {
      return `${Math.round(value)}%`;
    }

    function formatQ(value) {
      const out = value >= 10 ? value.toFixed(1) : value.toFixed(2);
      return `${out.replace(/\.0+$|0+$/g, '').replace(/\.$/, '')} Q`;
    }

    function syncFilterTypeButtons() {
      for (const btn of filterTypeBtns) {
        setPressedState(btn, btn.dataset.filterType === filterType);
      }
    }

    function syncFilterDbButtons() {
      for (const btn of filterDbBtns) {
        setPressedState(btn, btn.dataset.filterDb === filterDb);
      }
    }

    function updateFilterDisplay() {
      filterFreqEl.value = String(filterFreqPos);
      filterResonanceEl.value = String(filterResonancePct);
      filterModAmountEl.value = String(filterModAmountPct);
      filterFreqValueEl.textContent = formatHz(currentFilterFrequency());
      filterResonanceValueEl.textContent = formatQ(currentFilterResonance());
      filterModAmountValueEl.textContent = formatPercent(filterModAmountPct);
    }

    function updateStatus() {
      statusEl.textContent = `Audio: ${audioReadyText()} · Base: ${formatHz(baseHz)} · Clamp: ${clampLabel(clampMode)} · Waveform: ${waveformLabel(waveformMode)} · Sync: ${phaseLockLabel(phaseLockMode)}`;
    }

    function setPressedState(element, isPressed) {
      if (!element) return;
      element.classList.toggle('active', Boolean(isPressed));
      if (typeof element.setAttribute === 'function') {
        element.setAttribute('aria-pressed', isPressed ? 'true' : 'false');
      }
    }

    function appendInfoRow(container, label, value) {
      const row = document.createElement('div');
      row.className = 'info-row';
      if (label) {
        const strong = document.createElement('strong');
        strong.textContent = `${label}:`;
        row.appendChild(strong);
        row.appendChild(document.createTextNode(` ${value}`));
      } else {
        row.textContent = value;
      }
      container.appendChild(row);
    }

    function renderInfoPanel(title, rows, titleColor = null) {
      infoEl.replaceChildren();
      const titleEl = document.createElement('div');
      titleEl.className = 'info-title';
      titleEl.textContent = title;
      if (titleColor) {
        titleEl.style.color = rgbToCss(titleColor, 1);
      }
      infoEl.appendChild(titleEl);
      for (const row of rows) {
        appendInfoRow(infoEl, row.label, row.value);
      }
    }

    function invalidateCombinedGraph() {
      graphRevision += 1;
      combinedGraphCache = null;
      combinedGraphVersion = -1;
    }

    function createLegend() {
      legendEl.replaceChildren();
      for (let ci = 0; ci < categories.length; ci += 1) {
        const cat = categories[ci];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'legend-btn';
        btn.dataset.categoryIndex = String(ci);
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = cat.color;
        const label = document.createElement('span');
        label.textContent = cat.label;
        btn.appendChild(swatch);
        btn.appendChild(label);
        btn.addEventListener('click', () => toggleCategory(ci));
        legendEl.appendChild(btn);
      }
      syncLegend();
    }

    function syncLegend() {
      const buttons = legendEl.querySelectorAll('.legend-btn');
      buttons.forEach((btn) => {
        const ci = Number(btn.dataset.categoryIndex);
        const isEnabled = Boolean(categories[ci]?.enabled);
        btn.classList.toggle('off', !isEnabled);
        btn.setAttribute('aria-pressed', isEnabled ? 'true' : 'false');
      });
    }

    function createReverbImpulse(context, seconds = 4.8, decay = 3.2) {
      const length = Math.floor(context.sampleRate * seconds);
      const impulse = context.createBuffer(2, length, context.sampleRate);
      for (let ch = 0; ch < impulse.numberOfChannels; ch += 1) {
        const data = impulse.getChannelData(ch);
        for (let i = 0; i < length; i += 1) {
          const t = i / (length - 1);
          const env = Math.pow(1 - t, decay);
          data[i] = (Math.random() * 2 - 1) * env;
        }
      }
      return impulse;
    }

    function clampFrequency(freq, mode) {
      if (mode === 'none') return freq;
      const oct = Number(mode);
      const lo = baseHz;
      const hi = lo * Math.pow(2, oct);
      let f = freq;
      while (f >= hi) f /= 2;
      while (f < lo) f *= 2;
      return f;
    }

    function componentFrequencies(comp) {
      const uniq = new Set();
      for (const n of comp.numbers) {
        uniq.add(clampFrequency(baseHz * n, clampMode));
      }
      return Array.from(uniq).sort((a, b) => a - b);
    }

    function enabledNodeEntries() {
      const out = [];
      for (const node of allNodes) {
        const enabledMemberships = node.memberships.filter((ci) => categories[ci].enabled);
        if (!enabledMemberships.length) continue;
        const color = mixColors(enabledMemberships.map((ci) => categories[ci].rgb));
        const radius = nodeRadiusFor(node.x, node.y);
        out.push({ ...node, enabledMemberships, color, radius });
      }
      return out;
    }

    function getCombinedGraph() {
      if (!combineAll) return null;
      if (combinedGraphVersion === graphRevision && combinedGraphCache) {
        return combinedGraphCache;
      }

      const nodes = enabledNodeEntries();
      const edgeMap = new Map();

      for (let i = 0; i < nodes.length; i += 1) {
        const a = nodes[i];
        let bestIndex = -1;
        let bestDist2 = Infinity;
        for (let j = 0; j < nodes.length; j += 1) {
          if (i === j) continue;
          const b = nodes[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestDist2) {
            bestDist2 = d2;
            bestIndex = j;
          }
        }
        if (bestIndex < 0) continue;
        const b = nodes[bestIndex];
        const key = a.n < b.n ? `${a.n}:${b.n}` : `${b.n}:${a.n}`;
        if (!edgeMap.has(key)) {
          edgeMap.set(key, {
            key,
            a: Math.min(a.n, b.n),
            b: Math.max(a.n, b.n),
            x1: a.x,
            y1: a.y,
            x2: b.x,
            y2: b.y,
            color: mixColors([a.color, b.color]),
            nodeA: i,
            nodeB: bestIndex,
          });
        }
      }

      const edges = Array.from(edgeMap.values());
      const adjacency = new Map();
      for (let i = 0; i < nodes.length; i += 1) {
        adjacency.set(i, []);
      }
      for (let ei = 0; ei < edges.length; ei += 1) {
        const edge = edges[ei];
        adjacency.get(edge.nodeA).push({ ni: edge.nodeB, ei });
        adjacency.get(edge.nodeB).push({ ni: edge.nodeA, ei });
      }

      const components = [];
      const visited = new Set();
      for (let start = 0; start < nodes.length; start += 1) {
        if (visited.has(start)) continue;
        const queue = [start];
        let queueIndex = 0;
        visited.add(start);
        const nodeIndices = [];
        const edgeIndices = new Set();

        while (queueIndex < queue.length) {
          const ni = queue[queueIndex];
          queueIndex += 1;
          nodeIndices.push(ni);
          for (const next of adjacency.get(ni)) {
            edgeIndices.add(next.ei);
            if (!visited.has(next.ni)) {
              visited.add(next.ni);
              queue.push(next.ni);
            }
          }
        }

        const numbers = nodeIndices.map((ni) => nodes[ni].n).sort((a, b) => a - b);
        const color = mixColors(nodeIndices.map((ni) => nodes[ni].color));
        const id = components.length;
        components.push({
          id,
          numbers,
          nodeIndices: nodeIndices.slice(),
          edgeIndices: Array.from(edgeIndices).sort((a, b) => a - b),
          color,
        });
      }

      for (const comp of components) {
        for (const ei of comp.edgeIndices) {
          edges[ei].component = comp.id;
        }
      }

      combinedGraphCache = { nodes, edges, components };
      combinedGraphVersion = graphRevision;
      return combinedGraphCache;
    }

    class HoverSynth {
      constructor(statusElement) {
        this.statusElement = statusElement;
        this.audioContext = null;
        this.voiceBus = null;
        this.dryGain = null;
        this.wetGain = null;
        this.convolver = null;
        this.compressor = null;
        this.reverbReady = false;
        this.reverbBuildPromise = null;
        this.activeSignature = '';
        this.activeGroups = new Map();
        this.syncBufferCache = new Map();
        this.setStatus('Audio: starting...');
      }

      normalizeWaveform(mode) {
        if (mode === 'saw') return 'sawtooth';
        if (OSC_WAVEFORMS.includes(mode)) return mode;
        return 'sawtooth';
      }

      randomWaveform() {
        return OSC_WAVEFORMS[Math.floor(Math.random() * OSC_WAVEFORMS.length)];
      }

      waveformSample(phase, waveform) {
        const shape = this.normalizeWaveform(waveform);
        if (shape === 'sine') {
          return Math.sin(phase * Math.PI * 2);
        }
        if (shape === 'triangle') {
          return 1 - (4 * Math.abs(phase - 0.5));
        }
        if (shape === 'square') {
          return phase < 0.5 ? 1 : -1;
        }
        return (phase * 2) - 1;
      }

      setStatus(text) {
        this.statusElement.textContent = text;
      }

      ensureReverbReady() {
        if (!this.audioContext || !this.voiceBus || !this.wetGain) {
          return Promise.resolve(false);
        }
        if (this.reverbReady) {
          return Promise.resolve(true);
        }
        if (this.reverbBuildPromise) {
          return this.reverbBuildPromise;
        }

        this.reverbBuildPromise = new Promise((resolve) => {
          const build = () => {
            try {
              const convolver = this.audioContext.createConvolver();
              convolver.buffer = createReverbImpulse(this.audioContext, 4.8, 3.2);
              this.voiceBus.connect(convolver);
              convolver.connect(this.wetGain);
              this.convolver = convolver;
              this.reverbReady = true;
              this.updateReverbMix(reverbWetRatio(), this.audioContext.currentTime);
              resolve(true);
            } catch (_err) {
              resolve(false);
            } finally {
              this.reverbBuildPromise = null;
            }
          };

          if (typeof window.requestIdleCallback === 'function') {
            window.requestIdleCallback(build, { timeout: 180 });
          } else {
            window.setTimeout(build, 0);
          }
        });

        return this.reverbBuildPromise;
      }

      async ensureReady() {
        if (!this.audioContext) {
          const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextCtor) {
            this.setStatus('Audio: unsupported');
            return;
          }
          this.audioContext = new AudioContextCtor();
          this.voiceBus = this.audioContext.createGain();
          this.dryGain = this.audioContext.createGain();
          this.wetGain = this.audioContext.createGain();
          this.compressor = this.audioContext.createDynamicsCompressor();

          this.voiceBus.gain.value = 1.0;
          this.dryGain.gain.value = 0.62;
          this.wetGain.gain.value = 0;

          this.compressor.threshold.value = -18;
          this.compressor.knee.value = 18;
          this.compressor.ratio.value = 3.1;
          this.compressor.attack.value = 0.004;
          this.compressor.release.value = 0.28;

          // voiceBus is the post-delay mix bus; reverb is applied after the delay stage.
          this.voiceBus.connect(this.dryGain);
          this.dryGain.connect(this.compressor);
          this.wetGain.connect(this.compressor);
          this.compressor.connect(this.audioContext.destination);
          this.updateReverbMix(reverbWetRatio(), this.audioContext.currentTime);
        }
        if (this.audioContext.state !== 'running') {
          try {
            await this.audioContext.resume();
          } catch (_err) {
            // Ignore; browser may require a stronger gesture.
          }
        }
        if (this.audioContext.state === 'running') {
          this.ensureReverbReady();
          this.setStatus('Audio: ready');
        } else {
          this.setStatus('Audio: click page once if silent');
        }
      }

      updateReverbMix(wetRatio, t0 = this.audioContext ? this.audioContext.currentTime : 0) {
        if (!this.audioContext || !this.dryGain || !this.wetGain) return;
        const targetWet = Math.max(0, Math.min(1, wetRatio));
        const wet = this.reverbReady ? targetWet : 0;
        const dry = this.reverbReady ? Math.max(0, 1 - wet) : 1;
        this.dryGain.gain.cancelScheduledValues(t0);
        this.wetGain.gain.cancelScheduledValues(t0);
        this.dryGain.gain.setTargetAtTime(dry, t0, 0.04);
        this.wetGain.gain.setTargetAtTime(wet, t0, 0.04);
      }

      foldDelayHz(rawFreq) {
        if (!Number.isFinite(rawFreq) || rawFreq <= 0) return 0;
        let hz = rawFreq;
        while (hz > 6) hz /= 2;
        while (hz < 1.5) hz *= 2;
        while (hz * 2 <= 6) hz *= 2;
        return Math.max(1.5, Math.min(6, hz));
      }

      delayTimeForRawFreq(rawFreq) {
        const delayHz = this.foldDelayHz(rawFreq);
        return delayHz > 0 ? 1 / delayHz : 0;
      }

      foldFilterLfoHz(rawFreq) {
        if (!Number.isFinite(rawFreq) || rawFreq <= 0) return 0;
        let hz = rawFreq;
        while (hz > 3) hz /= 2;
        while (hz < 0.75) hz *= 2;
        while (hz * 2 <= 3) hz *= 2;
        return Math.max(0.75, Math.min(3, hz));
      }

      delayTapGain(wetRatio, tapCount) {
        if (!(wetRatio > 0) || tapCount <= 0) return 0;
        return Math.min(1.08, (Math.sqrt(wetRatio) * 0.92) / Math.sqrt(tapCount));
      }

      delayDryGain(wetRatio) {
        const wet = Math.max(0, Math.min(1, wetRatio || 0));
        return Math.sqrt(Math.max(0, 1 - wet));
      }

      delayChannelGains(wetLevel, feedbackRatio) {
        const safeWet = Math.max(0, wetLevel || 0);
        const safeFeedback = Math.max(0, Math.min(0.9, feedbackRatio || 0));
        if (!(safeWet > 0)) {
          return { left: 0, right: 0 };
        }
        if (safeFeedback <= 0.001) {
          return { left: safeWet, right: safeWet };
        }
        const norm = Math.sqrt(2 / (1 + (safeFeedback * safeFeedback)));
        const right = Math.min(1.35, safeWet * norm);
        const left = Math.min(1.35, right * safeFeedback);
        return { left, right };
      }

      delayRawKeyFor(rawFreqs) {
        if (!Array.isArray(rawFreqs) || rawFreqs.length === 0) return '';
        return rawFreqs
          .filter((f) => Number.isFinite(f) && f > 0)
          .map((f) => f.toPrecision(15))
          .join(',');
      }

      createDelayTap(sourceNode, rawFreq, wetRatio, feedbackRatio, tapCount, when) {
        const delayTime = this.delayTimeForRawFreq(rawFreq);
        if (!(delayTime > 0)) return null;
        const safeFeedback = Math.max(0, Math.min(0.9, feedbackRatio));
        const wetLevel = this.delayTapGain(wetRatio, tapCount);
        const channelGains = this.delayChannelGains(wetLevel, safeFeedback);

        const tapIn = this.audioContext.createGain();
        const delayLeft = this.audioContext.createDelay(8.0);
        const delayRight = this.audioContext.createDelay(8.0);
        const feedbackLeft = this.audioContext.createGain();
        const feedbackRight = this.audioContext.createGain();
        const wetLeft = this.audioContext.createGain();
        const wetRight = this.audioContext.createGain();
        const merger = this.audioContext.createChannelMerger(2);

        tapIn.gain.setValueAtTime(1, when);
        delayLeft.delayTime.setValueAtTime(delayTime, when);
        delayRight.delayTime.setValueAtTime(delayTime, when);
        feedbackLeft.gain.setValueAtTime(safeFeedback, when);
        feedbackRight.gain.setValueAtTime(safeFeedback, when);
        wetLeft.gain.setValueAtTime(channelGains.left, when);
        wetRight.gain.setValueAtTime(channelGains.right, when);

        sourceNode.connect(tapIn);
        tapIn.connect(delayLeft);

        delayLeft.connect(wetLeft);
        wetLeft.connect(merger, 0, 0);
        delayRight.connect(wetRight);
        wetRight.connect(merger, 0, 1);
        merger.connect(this.voiceBus);

        delayLeft.connect(feedbackLeft);
        feedbackLeft.connect(delayRight);
        delayRight.connect(feedbackRight);
        feedbackRight.connect(delayLeft);

        return {
          tapIn,
          delayLeft,
          delayRight,
          feedbackLeft,
          feedbackRight,
          wetLeft,
          wetRight,
          merger,
          delayTime,
          feedbackValue: safeFeedback,
          wetValue: wetLevel,
          wetLeftValue: channelGains.left,
          wetRightValue: channelGains.right,
        };
      }

      updateDelayTap(tap, wetRatio, feedbackRatio, tapCount, t0) {
        if (!tap) return;
        tap.feedbackValue = Math.max(0, Math.min(0.9, feedbackRatio));
        tap.wetValue = this.delayTapGain(wetRatio, tapCount);
        const channelGains = this.delayChannelGains(tap.wetValue, tap.feedbackValue);
        tap.wetLeftValue = channelGains.left;
        tap.wetRightValue = channelGains.right;
        tap.feedbackLeft.gain.cancelScheduledValues(t0);
        tap.feedbackLeft.gain.setValueAtTime(tap.feedbackValue, t0);
        tap.feedbackRight.gain.cancelScheduledValues(t0);
        tap.feedbackRight.gain.setValueAtTime(tap.feedbackValue, t0);
        tap.wetLeft.gain.cancelScheduledValues(t0);
        tap.wetLeft.gain.setTargetAtTime(tap.wetLeftValue, t0, 0.04);
        tap.wetRight.gain.cancelScheduledValues(t0);
        tap.wetRight.gain.setTargetAtTime(tap.wetRightValue, t0, 0.04);
      }

      releaseDelayTap(tap, t0, allowTail = false) {
        if (!tap) return;
        tap.tapIn.gain.cancelScheduledValues(t0);
        tap.tapIn.gain.setTargetAtTime(0, t0, 0.03);

        let cleanupSec = tap.delayTime + 0.4;
        if (allowTail) {
          const feedbackValue = Math.max(0, Math.min(0.9, tap.feedbackValue || 0));
          const wetLeftValue = Math.max(0, tap.wetLeftValue || 0);
          const wetRightValue = Math.max(0, tap.wetRightValue || 0);
          const repeats = feedbackValue > 0
            ? Math.ceil(Math.log(0.001) / Math.log(Math.max(0.001, feedbackValue)))
            : 1;
          cleanupSec = Math.max(0.45, Math.min(12, (tap.delayTime * repeats) + 0.5));
          const fadeStart = Math.max(t0, t0 + cleanupSec - 0.12);
          tap.feedbackLeft.gain.cancelScheduledValues(t0);
          tap.feedbackLeft.gain.setValueAtTime(feedbackValue, t0);
          tap.feedbackLeft.gain.setValueAtTime(feedbackValue, fadeStart);
          tap.feedbackLeft.gain.linearRampToValueAtTime(0, t0 + cleanupSec);
          tap.feedbackRight.gain.cancelScheduledValues(t0);
          tap.feedbackRight.gain.setValueAtTime(feedbackValue, t0);
          tap.feedbackRight.gain.setValueAtTime(feedbackValue, fadeStart);
          tap.feedbackRight.gain.linearRampToValueAtTime(0, t0 + cleanupSec);
          tap.wetLeft.gain.cancelScheduledValues(t0);
          tap.wetLeft.gain.setValueAtTime(wetLeftValue, t0);
          tap.wetLeft.gain.setValueAtTime(wetLeftValue, fadeStart);
          tap.wetLeft.gain.linearRampToValueAtTime(0, t0 + cleanupSec);
          tap.wetRight.gain.cancelScheduledValues(t0);
          tap.wetRight.gain.setValueAtTime(wetRightValue, t0);
          tap.wetRight.gain.setValueAtTime(wetRightValue, fadeStart);
          tap.wetRight.gain.linearRampToValueAtTime(0, t0 + cleanupSec);
        } else {
          tap.feedbackLeft.gain.cancelScheduledValues(t0);
          tap.feedbackLeft.gain.setTargetAtTime(0, t0, 0.08);
          tap.feedbackRight.gain.cancelScheduledValues(t0);
          tap.feedbackRight.gain.setTargetAtTime(0, t0, 0.08);
          tap.wetLeft.gain.cancelScheduledValues(t0);
          tap.wetLeft.gain.setTargetAtTime(0, t0, 0.08);
          tap.wetRight.gain.cancelScheduledValues(t0);
          tap.wetRight.gain.setTargetAtTime(0, t0, 0.08);
        }

        const cleanupMs = Math.max(0, (cleanupSec + 0.12) * 1000);
        setTimeout(() => {
          try {
            tap.tapIn.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a delay tap is already cleaned up.
          }
          try {
            tap.delayLeft.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a delay tap is already cleaned up.
          }
          try {
            tap.delayRight.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a delay tap is already cleaned up.
          }
          try {
            tap.feedbackLeft.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a delay tap is already cleaned up.
          }
          try {
            tap.feedbackRight.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a delay tap is already cleaned up.
          }
          try {
            tap.wetLeft.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a delay tap is already cleaned up.
          }
          try {
            tap.wetRight.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a delay tap is already cleaned up.
          }
          try {
            tap.merger.disconnect();
          } catch (_err) {
            // Ignore disconnect races when a delay tap is already cleaned up.
          }
        }, cleanupMs);
      }

      releaseDelayTaps(holder, t0, allowTail = false) {
        if (!holder || !Array.isArray(holder.delayTaps) || holder.delayTaps.length === 0) {
          if (holder) holder.delayRawKey = '';
          return;
        }
        for (const tap of holder.delayTaps) {
          this.releaseDelayTap(tap, t0, allowTail);
        }
        holder.delayTaps = [];
        holder.delayRawKey = '';
      }

      configureDelayTaps(sourceNode, holder, rawFreqs, wetRatio, feedbackRatio, t0) {
        if (!holder) return;
        const safeRawFreqs = Array.isArray(rawFreqs)
          ? rawFreqs.filter((f) => Number.isFinite(f) && f > 0)
          : [];
        const rawKey = this.delayRawKeyFor(safeRawFreqs);

        if (!(wetRatio > 0) || safeRawFreqs.length === 0 || !sourceNode) {
          this.releaseDelayTaps(holder, t0);
          return;
        }

        const tapCount = safeRawFreqs.length;
        if (holder.delayRawKey === rawKey && Array.isArray(holder.delayTaps) && holder.delayTaps.length) {
          for (const tap of holder.delayTaps) {
            this.updateDelayTap(tap, wetRatio, feedbackRatio, tapCount, t0);
          }
          return;
        }

        this.releaseDelayTaps(holder, t0);
        holder.delayTaps = [];
        holder.delayRawKey = rawKey;
        for (const rawFreq of safeRawFreqs) {
          const tap = this.createDelayTap(sourceNode, rawFreq, wetRatio, feedbackRatio, tapCount, t0);
          if (tap) holder.delayTaps.push(tap);
        }
      }

      createFilterLfoForVoice(voice, when) {
        const lfoOsc = this.audioContext.createOscillator();
        const lfoGain1 = this.audioContext.createGain();
        const lfoGain2 = this.audioContext.createGain();

        lfoOsc.type = 'sine';
        lfoOsc.frequency.setValueAtTime(0.1, when);
        lfoGain1.gain.setValueAtTime(0, when);
        lfoGain2.gain.setValueAtTime(0, when);

        lfoOsc.onended = () => {
          try {
            lfoOsc.disconnect();
          } catch (_err) {
            // Ignore disconnect races on ended oscillators.
          }
        };

        lfoOsc.connect(lfoGain1);
        lfoGain1.connect(voice.filter.frequency);
        lfoOsc.connect(lfoGain2);
        lfoGain2.connect(voice.filter2.frequency);
        lfoOsc.start(when);

        voice.filterLfo = lfoOsc;
        voice.filterLfoGain1 = lfoGain1;
        voice.filterLfoGain2 = lfoGain2;
      }

      applyFilterSettingsToVoice(voice, t0) {
        if (!voice || !voice.filter || !voice.filter2) return;

        const freqHz = currentFilterFrequency();
        const baseQ = currentFilterResonance();
        const secondStageActive = filterDb === '24';
        const voiceRaw = Array.isArray(voice.rawFreqs) && voice.rawFreqs.length
          ? voice.rawFreqs[0]
          : voice.freq;
        const lfoHz = this.foldFilterLfoHz(voiceRaw);
        const sweep = currentFilterModSweep(freqHz);
        const filterCenterHz = filterModAmountPct > 0 ? sweep.centerHz : freqHz;
        const depthHz = filterModAmountPct > 0 ? sweep.depthHz : 0;

        const primary = voice.filter;
        const secondary = voice.filter2;

        primary.type = filterType;
        primary.frequency.cancelScheduledValues(t0);
        primary.frequency.setValueAtTime(filterCenterHz, t0);
        primary.Q.cancelScheduledValues(t0);
        primary.Q.setValueAtTime(baseQ, t0);

        secondary.type = secondStageActive ? filterType : 'allpass';
        secondary.frequency.cancelScheduledValues(t0);
        secondary.frequency.setValueAtTime(filterCenterHz, t0);
        secondary.Q.cancelScheduledValues(t0);
        secondary.Q.setValueAtTime(secondStageActive ? baseQ : 0.0001, t0);

        if (voice.filterLfo) {
          voice.filterLfo.frequency.cancelScheduledValues(t0);
          voice.filterLfo.frequency.setValueAtTime(lfoHz || 0.1, t0);
        }
        if (voice.filterLfoGain1) {
          voice.filterLfoGain1.gain.cancelScheduledValues(t0);
          voice.filterLfoGain1.gain.setTargetAtTime(depthHz, t0, 0.04);
        }
        if (voice.filterLfoGain2) {
          voice.filterLfoGain2.gain.cancelScheduledValues(t0);
          voice.filterLfoGain2.gain.setTargetAtTime(secondStageActive ? depthHz : 0, t0, 0.04);
        }
      }

      updateDelaySettingsForActive(wetRatio, feedbackRatio) {
        if (!this.audioContext || this.activeGroups.size === 0) return;
        const t0 = this.audioContext.currentTime;
        for (const group of this.activeGroups.values()) {
          if (group.syncGain) {
            if (group.syncDry) {
              group.syncDry.gain.cancelScheduledValues(t0);
              group.syncDry.gain.setTargetAtTime(this.delayDryGain(wetRatio), t0, 0.04);
            }
            this.configureDelayTaps(group.syncGain, group, group.rawFreqs, wetRatio, feedbackRatio, t0);
          }
          for (const voice of group.voices.values()) {
            if (voice.dry) {
              voice.dry.gain.cancelScheduledValues(t0);
              voice.dry.gain.setTargetAtTime(this.delayDryGain(wetRatio), t0, 0.04);
            }
            this.configureDelayTaps(voice.gain, voice, voice.rawFreqs, wetRatio, feedbackRatio, t0);
          }
        }
      }

      updateFilterSettingsForActive() {
        if (!this.audioContext || this.activeGroups.size === 0) return;
        const t0 = this.audioContext.currentTime;
        for (const group of this.activeGroups.values()) {
          for (const voice of group.voices.values()) {
            this.applyFilterSettingsToVoice(voice, t0);
          }
        }
      }

      waveformForVoice(group, freq, requestedMode) {
        if (!group.waveformAssignments) {
          group.waveformAssignments = new Map();
        }
        if (requestedMode === 'random') {
          const existing = group.waveformAssignments.get(freq);
          if (existing) return existing;
          const shape = this.randomWaveform();
          group.waveformAssignments.set(freq, shape);
          return shape;
        }
        const shape = this.normalizeWaveform(requestedMode);
        group.waveformAssignments.set(freq, shape);
        return shape;
      }

      pruneWaveforms(group, validFreqs) {
        if (!group || !group.waveformAssignments) return;
        for (const freq of Array.from(group.waveformAssignments.keys())) {
          if (!validFreqs.has(freq)) {
            group.waveformAssignments.delete(freq);
          }
        }
      }

      playGroups(key, groups, syncMode, fundamentalHz, requestedWaveform) {
        if (!this.audioContext || this.audioContext.state !== 'running') return;
        const nyq = this.audioContext.sampleRate * 0.45;
        const wetRatio = delayWetRatio();
        const feedbackRatio = delayFeedbackRatio();
        const playableGroups = (Array.isArray(groups) ? groups : [])
          .map((group) => {
            const voiceMap = new Map();
            for (const voice of Array.isArray(group.voices) ? group.voices : []) {
              if (!voice || !Number.isFinite(voice.freq) || voice.freq < 20 || voice.freq > nyq) continue;
              const prior = voiceMap.get(voice.freq);
              if (prior) {
                prior.rawFreqs.push(...(Array.isArray(voice.rawFreqs) ? voice.rawFreqs : []));
              } else {
                voiceMap.set(voice.freq, {
                  freq: voice.freq,
                  rawFreqs: Array.isArray(voice.rawFreqs) ? voice.rawFreqs.slice() : [],
                });
              }
            }
            const voices = Array.from(voiceMap.values()).sort((a, b) => a.freq - b.freq);
            const freqs = voices.map((voice) => voice.freq);
            const rawFreqs = Array.isArray(group.rawFreqs)
              ? group.rawFreqs.filter((f) => Number.isFinite(f) && f > 0)
              : voices.flatMap((voice) => voice.rawFreqs);
            return freqs.length ? { key: group.key, voices, freqs, rawFreqs } : null;
          })
          .filter(Boolean);

        if (playableGroups.length === 0) {
          this.stopActive(0.48);
          return;
        }

        const signature = key;
        if (this.activeSignature === signature) return;

        const t0 = this.audioContext.currentTime;
        const totalVoices = playableGroups.reduce((sum, group) => sum + group.freqs.length, 0);
        const n = Math.max(1, totalVoices);
        const perVoicePeak = Math.min(0.10, 0.20 / Math.sqrt(n));
        const nextGroupKeys = new Set(playableGroups.map((group) => group.key));

        for (const groupInput of playableGroups) {
          let group = this.activeGroups.get(groupInput.key);
          if (!group) {
            group = {
              key: groupInput.key,
              voices: new Map(),
              waveformAssignments: new Map(),
              waveformMode: requestedWaveform,
              syncSource: null,
              syncFilter: null,
              syncGain: null,
              syncDry: null,
              syncMode: 'none',
              syncHz: 0,
              syncFreqKey: '',
              delayTaps: [],
              delayRawKey: '',
              rawFreqs: [],
            };
            this.activeGroups.set(group.key, group);
          }

          group.rawFreqs = groupInput.rawFreqs.slice();
          group.waveformMode = requestedWaveform;

          if (syncMode === 'none') {
            this.releaseSyncedGroup(group, t0, 0.28);
            const nextVoiceKeys = new Set(groupInput.voices.map((voice) => voice.freq));
            this.pruneWaveforms(group, nextVoiceKeys);
            for (const voiceInput of groupInput.voices) {
              const desiredWaveform = this.waveformForVoice(group, voiceInput.freq, requestedWaveform);
              const existing = group.voices.get(voiceInput.freq);
              if (existing && existing.waveform === desiredWaveform) {
                existing.freq = voiceInput.freq;
                existing.rawFreqs = voiceInput.rawFreqs.slice();
                this.updateVoiceLevel(existing, t0, perVoicePeak);
                this.applyFilterSettingsToVoice(existing, t0);
                if (existing.dry) {
                  existing.dry.gain.cancelScheduledValues(t0);
                  existing.dry.gain.setTargetAtTime(this.delayDryGain(wetRatio), t0, 0.04);
                }
                this.configureDelayTaps(existing.gain, existing, existing.rawFreqs, wetRatio, feedbackRatio, t0);
                continue;
              }
              if (existing) {
                this.releaseVoice(existing, t0, 0.28);
                group.voices.delete(voiceInput.freq);
              }
              group.voices.set(
                voiceInput.freq,
                this.makeVoice(
                  voiceInput.freq,
                  voiceInput.rawFreqs,
                  desiredWaveform,
                  t0,
                  perVoicePeak,
                  wetRatio,
                  feedbackRatio,
                ),
              );
            }

            for (const [freq, voice] of Array.from(group.voices.entries())) {
              if (nextVoiceKeys.has(freq)) continue;
              this.releaseVoice(voice, t0, 0.48);
              group.voices.delete(freq);
            }
            continue;
          }

          this.releaseSyncedGroup(group, t0, 0.28);

          let syncHz = 0;
          if (syncMode === 'fundamental') {
            syncHz = Math.max(0, fundamentalHz);
          } else if (syncMode === 'cluster-high') {
            syncHz = groupInput.freqs[groupInput.freqs.length - 1] || 0;
          } else if (syncMode === 'cluster-low') {
            syncHz = groupInput.freqs[0] || 0;
          }
          if (!(syncHz > 0)) {
            for (const [freq, voice] of Array.from(group.voices.entries())) {
              this.releaseVoice(voice, t0, 0.28);
              group.voices.delete(freq);
            }
            continue;
          }

          group.syncMode = syncMode;
          group.syncHz = syncHz;

          const nextVoiceKeys = new Set(groupInput.voices.map((voice) => voice.freq));
          this.pruneWaveforms(group, nextVoiceKeys);
          const startWhen = this.syncAlignedTime(1 / syncHz, t0);
          for (const voiceInput of groupInput.voices) {
            const desiredWaveform = this.waveformForVoice(group, voiceInput.freq, requestedWaveform);
            const existing = group.voices.get(voiceInput.freq);
            const reusable = existing
              && existing.syncSource
              && !existing.osc
              && Math.abs((existing.syncHz || 0) - syncHz) < 1e-9
              && existing.waveform === desiredWaveform;

            if (reusable) {
              existing.freq = voiceInput.freq;
              existing.rawFreqs = voiceInput.rawFreqs.slice();
                this.updateVoiceLevel(existing, t0, perVoicePeak);
                this.applyFilterSettingsToVoice(existing, t0);
                if (existing.dry) {
                  existing.dry.gain.cancelScheduledValues(t0);
                  existing.dry.gain.setTargetAtTime(this.delayDryGain(wetRatio), t0, 0.04);
                }
                this.configureDelayTaps(existing.gain, existing, existing.rawFreqs, wetRatio, feedbackRatio, t0);
                continue;
            }

            if (existing) {
              this.releaseVoice(existing, t0, 0.28);
              group.voices.delete(voiceInput.freq);
            }

            group.voices.set(
              voiceInput.freq,
              this.makeSyncedVoice(
                voiceInput.freq,
                voiceInput.rawFreqs,
                desiredWaveform,
                syncHz,
                startWhen,
                t0,
                perVoicePeak,
                wetRatio,
                feedbackRatio,
              ),
            );
          }

          for (const [freq, voice] of Array.from(group.voices.entries())) {
            if (nextVoiceKeys.has(freq)) continue;
            this.releaseVoice(voice, t0, 0.48);
            group.voices.delete(freq);
          }
        }

        for (const [groupKey, group] of Array.from(this.activeGroups.entries())) {
          if (nextGroupKeys.has(groupKey)) continue;
          this.stopGroup(group, t0, 0.48);
          this.activeGroups.delete(groupKey);
        }

        this.activeSignature = signature;
      }

      syncAlignedTime(period, t0) {
        const lead = 0.02;
        const base = Math.max(0, t0 + lead);
        const steps = Math.max(0, Math.ceil(base / period));
        return steps * period;
      }

      syncedBufferKey(freqs, syncHz, waveforms = []) {
        return `${syncHz.toPrecision(15)}|${freqs.map((f) => f.toPrecision(15)).join(',')}|${waveforms.join(',')}`;
      }
