<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rotating Pill (3-Axis Rotation)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            touch-action: none;
        }

        canvas {
            cursor: grab;
            max-width: 100%;
            max-height: 100%;
        }

        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <canvas id="pillCanvas"></canvas>

    <script>
        const canvas = document.getElementById('pillCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let rotationX = 0.5;
        let rotationY = 0.8;
        let rotationZ = 0.2; 
        
        // Initial constant velocities
        let velX = 0.008;
        let velY = 0.012;
        let velZ = 0.005; 
        
        let isDragging = false;
        let lastMousePos = { x: 0, y: 0 };

        // Configuration
        const PILL_RADIUS = 55;
        const PILL_LENGTH = 110; 
        const DETAIL = 40; 
        const COLOR_A = '#3b82f6'; // Blue
        const COLOR_B = '#ef4444'; // Red

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // --- MESH GENERATION ---

        function createPillMesh() {
            const vertices = [];
            const faces = [];

            function addVertex(x, y, z) {
                vertices.push({ x, y, z });
                return vertices.length - 1;
            }

            function generateRing(yHeight) {
                const ring = [];
                for (let i = 0; i < DETAIL; i++) {
                    const theta = (i / DETAIL) * Math.PI * 2;
                    ring.push(addVertex(
                        Math.cos(theta) * PILL_RADIUS,
                        yHeight,
                        Math.sin(theta) * PILL_RADIUS
                    ));
                }
                return ring;
            }

            // 1. CYLINDER SECTION
            const ringTop = generateRing(-PILL_LENGTH / 2);
            const ringMid = generateRing(0);
            const ringBot = generateRing(PILL_LENGTH / 2);

            for (let i = 0; i < DETAIL; i++) {
                const next = (i + 1) % DETAIL;
                faces.push({
                    indices: [ringTop[i], ringTop[next], ringMid[next], ringMid[i]],
                    color: COLOR_A
                });
                faces.push({
                    indices: [ringMid[i], ringMid[next], ringBot[next], ringBot[i]],
                    color: COLOR_B
                });
            }

            // 2. CAP SECTION (Hemispheres)
            function addCap(yOffset, isTop, baseRing) {
                const color = isTop ? COLOR_A : COLOR_B;
                const layers = [baseRing];
                const capSteps = Math.floor(DETAIL / 4);

                for (let lat = 1; lat < capSteps; lat++) {
                    const phi = (lat / capSteps) * (Math.PI / 2);
                    const ring = [];
                    const currentRadius = Math.cos(phi) * PILL_RADIUS;
                    const currentY = (isTop ? -1 : 1) * (Math.sin(phi) * PILL_RADIUS) + yOffset;

                    for (let lon = 0; lon < DETAIL; lon++) {
                        const theta = (lon / DETAIL) * Math.PI * 2;
                        ring.push(addVertex(
                            Math.cos(theta) * currentRadius,
                            currentY,
                            Math.sin(theta) * currentRadius
                        ));
                    }
                    layers.push(ring);
                }

                const poleY = yOffset + (isTop ? -PILL_RADIUS : PILL_RADIUS);
                const poleIdx = addVertex(0, poleY, 0);

                for (let lat = 0; lat < layers.length - 1; lat++) {
                    for (let lon = 0; lon < DETAIL; lon++) {
                        const nextLon = (lon + 1) % DETAIL;
                        if (isTop) {
                            faces.push({
                                indices: [layers[lat][lon], layers[lat+1][lon], layers[lat+1][nextLon], layers[lat][nextLon]],
                                color: color
                            });
                        } else {
                            faces.push({
                                indices: [layers[lat][lon], layers[lat][nextLon], layers[lat+1][nextLon], layers[lat+1][lon]],
                                color: color
                            });
                        }
                    }
                }

                const lastLayer = layers[layers.length - 1];
                for (let lon = 0; lon < DETAIL; lon++) {
                    const nextLon = (lon + 1) % DETAIL;
                    if (isTop) {
                        faces.push({
                            indices: [lastLayer[lon], poleIdx, lastLayer[nextLon]],
                            color: color
                        });
                    } else {
                        faces.push({
                            indices: [lastLayer[lon], lastLayer[nextLon], poleIdx],
                            color: color
                        });
                    }
                }
            }

            addCap(-PILL_LENGTH / 2, true, ringTop);
            addCap(PILL_LENGTH / 2, false, ringBot);

            return { vertices, faces };
        }

        const mesh = createPillMesh();

        // --- MATH & RENDERING ---

        function rotate(v, ax, ay, az) {
            let x1 = v.x * Math.cos(az) - v.y * Math.sin(az);
            let y1 = v.x * Math.sin(az) + v.y * Math.cos(az);
            let z1 = v.z;

            let x2 = x1 * Math.cos(ay) + z1 * Math.sin(ay);
            let z2 = z1 * Math.cos(ay) - x1 * Math.sin(ay);
            let y2 = y1;

            let y3 = y2 * Math.cos(ax) - z2 * Math.sin(ax);
            let z3 = z2 * Math.cos(ax) + y2 * Math.sin(ax);
            let x3 = x2;

            return { x: x3, y: y3, z: z3 };
        }

        function project(v) {
            const scale = 2.5; 
            const perspective = 1000 / (1000 + v.z);
            return {
                x: width / 2 + v.x * scale * perspective,
                y: height / 2 + v.y * scale * perspective,
                z: v.z
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Shadow
            const shadowY = height/2 + 180;
            const grad = ctx.createRadialGradient(width/2, shadowY, 0, width/2, shadowY, 150);
            grad.addColorStop(0, 'rgba(0,0,0,0.3)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(width/2, shadowY, 100, 30, 0, 0, Math.PI * 2);
            ctx.fill();

            const transformed = mesh.vertices.map(v => rotate(v, rotationX, rotationY, rotationZ));
            const projected = transformed.map(v => project(v));

            const facesToDraw = mesh.faces.map(face => {
                const pts = face.indices.map(i => projected[i]);
                const rawPts = face.indices.map(i => transformed[i]);

                const v1 = { x: rawPts[1].x - rawPts[0].x, y: rawPts[1].y - rawPts[0].y, z: rawPts[1].z - rawPts[0].z };
                const v2 = { x: rawPts[2].x - rawPts[0].x, y: rawPts[2].y - rawPts[0].y, z: rawPts[2].z - rawPts[0].z };
                
                const normal = {
                    x: v1.y * v2.z - v1.z * v2.y,
                    y: v1.z * v2.x - v1.x * v2.z,
                    z: v1.x * v2.y - v1.y * v2.x
                };
                
                const mag = Math.sqrt(normal.x**2 + normal.y**2 + normal.z**2);
                const normalizedZ = normal.z / mag;

                const lightDir = { x: 0.6, y: -0.9, z: -0.8 }; 
                const lMag = Math.sqrt(lightDir.x**2 + lightDir.y**2 + lightDir.z**2);
                const dot = (normal.x * lightDir.x + normal.y * lightDir.y + normal.z * lightDir.z) / (mag * lMag);
                const brightness = Math.max(0, dot);

                const avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;

                return { pts, avgZ, color: face.color, brightness, normalizedZ };
            });

            facesToDraw.sort((a, b) => b.avgZ - a.avgZ);

            facesToDraw.forEach(face => {
                if (face.normalizedZ < 0) return;

                ctx.beginPath();
                ctx.moveTo(face.pts[0].x, face.pts[0].y);
                for (let i = 1; i < face.pts.length; i++) {
                    ctx.lineTo(face.pts[i].x, face.pts[i].y);
                }
                ctx.closePath();

                const finalColor = shadeColor(face.color, face.brightness);
                ctx.fillStyle = finalColor;
                ctx.fill();
                
                ctx.strokeStyle = finalColor;
                ctx.lineWidth = 1.0;
                ctx.stroke();
            });

            // Rotation is now applied constantly without friction or resetting
            if (!isDragging) {
                rotationX += velX;
                rotationY += velY;
                rotationZ += velZ;
            }

            requestAnimationFrame(draw);
        }

        function handleStart(e) {
            isDragging = true;
            lastMousePos = getPos(e);
        }

        function handleMove(e) {
            if (!isDragging) return;
            const pos = getPos(e);
            const dx = pos.x - lastMousePos.x;
            const dy = pos.y - lastMousePos.y;

            const centerX = width / 2;
            const centerY = height / 2;
            const distFromCenterX = (pos.x - centerX) / (width / 2);
            const distFromCenterY = (pos.y - centerY) / (height / 2);

            // Update velocities based on movement
            velY = dx * 0.008;
            velX = -dy * 0.008;
            velZ = (dx * distFromCenterY - dy * distFromCenterX) * 0.01;

            // Apply rotation immediately while dragging
            rotationY += velY;
            rotationX += velX;
            rotationZ += velZ;

            lastMousePos = pos;
        }

        function handleEnd() { isDragging = false; }

        function getPos(e) {
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX, y: t.clientY };
        }

        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        function shadeColor(hex, brightness) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);

            const factor = 0.25 + (brightness * 0.85);
            const nr = Math.min(255, Math.floor(r * factor));
            const ng = Math.min(255, Math.floor(g * factor));
            const nb = Math.min(255, Math.floor(b * factor));

            return `rgb(${nr}, ${ng}, ${nb})`;
        }

        requestAnimationFrame(draw);
    </script>
</body>
</html>
