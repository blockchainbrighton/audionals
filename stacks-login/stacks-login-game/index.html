<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Login - Stacks</title>
    <style>
      body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
      .container { text-align: center; background: #2a2a2a; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 400px; width: 100%; }
      button { background: #5546FF; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
      button:hover { background: #4030db; }
      .hidden { display: none; }
      #nft-list { margin-top: 20px; text-align: left; }
      .nft-item { background: #333; padding: 10px; margin-bottom: 8px; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
      .status { margin-top: 15px; font-size: 0.9rem; color: #aaa; }
      .success { color: #4caf50; font-weight: bold; }
      .fail { color: #f44336; font-weight: bold; }
    </style>
    <script>
        window.global = window;
        window.process = { env: {} };
    </script>
  </head>
  <body>
    <div class="container">
      <h1>My Game Login</h1>
      
      <!-- Section: Logged Out -->
      <div id="logged-out-view">
        <p>Connect your wallet to verify assets.</p>
        <button id="connect-wallet-btn">Connect Wallet</button>
      </div>

      <!-- Section: Logged In -->
      <div id="logged-in-view" class="hidden">
        <p>Welcome, <span id="user-address-display" style="color:#5546FF">...</span></p>
        <div id="loading-msg">Checking for NFTs...</div>
        
        <!-- Game Status Message -->
        <div id="game-access-msg" class="status"></div>

        <!-- List of NFTs found -->
        <div id="nft-list"></div>

        <button id="sign-out-btn" style="background: #444; margin-top: 20px;">Sign Out</button>
      </div>
    </div>

    <!-- This links to the javascript logic -->
    <script type="module" src="/main.js"></script>
  </body>
</html>
